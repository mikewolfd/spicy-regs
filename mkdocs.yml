site_name: Spicy Regs Data Dictionary
site_description: Schema reference for the Spicy Regs regulations.gov dataset.
site_url: https://docs.spicy-regs.dev/
repo_url: https://github.com/civictechdc/spicy-regs
repo_name: civictechdc/spicy-regs
edit_uri: edit/main/data_dictionary/descriptions.yaml

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Changelog: changelog.md
  - Querying with Python: querying-python.md
  - Tables:
      - dockets: tables/dockets.md
