name: Rollup — rulemaking_lifecycles

# Decoupled rollup: rebuilds rulemaking_lifecycles.parquet (Proposed→Rule pairs
# + stuck proposals) from documents.parquet.
#
# Not scheduled: decision 4 (docs/research/fork-delivery-decisions-2026-09-22.md)
# keeps this table unpublished until source-linked rulemaking relationships (the
# T17 outputs) qualify; its earliest-proposal/earliest-final pairing collapses
# null-docket groups and drops finals that predate their proposal. The family was
# conditionally withdrawn from the index on 2026-09-23. Run it by hand only to
# build a local candidate (skip_upload).
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean

jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-lifecycles
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
