name: Re-spell comment digests (manual, one-time)

# spicy-docs 0.52.0 spells every published digest `sha256:` (its "Every published
# digest is spelled" entry). comments.pdf_extraction_results_json holds bare
# 64-hex digests written before it: each derived attachment's `sha256` and each
# PDF attempt's `source_sha256`. This prefixes them once, in the catalog (the
# system of record), one agency at a time through the checked upsert, keeping
# every other column. Measured on the public mirror of 2026-09-29: 366,541
# digests in 330,236 rows of 140 agencies, all derived attachments.
#
#   mode=dry-run  counts the rows per agency and writes nothing (the default)
#   mode=apply    writes; each agency's prior values are kept in the run's
#                 `comment-digest-receipts` artifact before its upsert
#   mode=restore  puts back the prior values of the run `restore_run_id` names,
#                 where a row still holds what that run wrote
#
# Then the mirror is republished so the public files carry the re-spelled
# values. A second apply finds nothing to write. WINDOW1-RUNBOOK.md orders it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run, apply or restore'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, apply, restore]
      agency:
        description: 'Only this agency_code (blank: every agency)'
        required: false
        default: ''
        type: string
      restore_run_id:
        description: 'mode=restore: the apply run whose receipts to put back'
        required: false
        default: ''
        type: string
      publish_mirror:
        description: 'Republish the public comments mirror after an apply or restore'
        required: false
        default: true
        type: boolean

concurrency:
  # Shared with the ETL, the mirror publish and the text backfill: one catalog writer at a time.
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max

env:
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

permissions:
  contents: read
  actions: read

jobs:
  respell:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
      R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
      R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
      R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch the receipts to restore
        if: ${{ inputs.mode == 'restore' }}
        uses: actions/download-artifact@v4
        with:
          name: comment-digest-receipts
          path: receipts
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}

      # Inputs reach the script through env:, never interpolated into it.
      - name: Re-spell (or count, or restore)
        env:
          MODE: ${{ inputs.mode }}
          AGENCY: ${{ inputs.agency }}
        run: |
          args=()
          if [ -n "$AGENCY" ]; then args+=(--agency "$AGENCY"); fi
          case "$MODE" in
            dry-run) args+=(--dry-run) ;;
            apply) args+=(--apply --receipt-dir receipts) ;;
            restore) args=(--restore --receipt-dir receipts) ;;
          esac
          uv run --frozen python -m spicy_regs.pipelines.prior_repairs respell-comment-digests "${args[@]}"

      - name: Keep the receipts
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: comment-digest-receipts
          path: receipts
          if-no-files-found: ignore
          retention-days: 90

      - name: Republish the public comments mirror
        if: ${{ inputs.mode != 'dry-run' && inputs.publish_mirror }}
        env:
          R2_ALLOW_SHRINK: '1'
        run: uv run --frozen python scripts/publish_comments_mirror.py
