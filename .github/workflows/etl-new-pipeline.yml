name: ETL (new pipeline)

# Incremental ETL after the historical catch-up. The manifest skips completed
# source keys; manual batch dispatch remains available for bounded repairs.
# After all publishing batches succeed, _regulations-refresh.yml updates the
# public comments mirror and dependent consumers under the same writer lock.
#
# ─────────────────────────────────────────────────────────────────────────────
# Scheduling model (rewritten 2026-07): a single scheduled trigger fans out a
# MATRIX of all batches, instead of the old design that mapped each batch to its
# own hourly cron and derived the batch number from the UTC hour at runtime
# (`batch = hour - 6`).
#
# Why it changed: GitHub Actions routinely drops or delays `schedule` events under
# load, so with 15 separate hourly crons, specific hours were permanently starved.
# Measured over an 8-day window (105 runs): hours 06/07 (batches 0/1) fired 0×,
# hour 13 (batch 7 = HHS) fired only 3×, while other hours fired 6–10×. That left
# whole agency sets stale — batches 0/1 alone cover ACF, AHRQ, AMS, APHIS, ATF
# (982K comments), ATSDR, BIA, BLM (850K), BOEM, BOP, BSEE, CDC (305K), and HHS
# (batch 7) fell ~5 days behind. A delayed cron also recomputed the batch from its
# late runtime hour, colliding with the next batch and skipping its own.
#
# A matrix driven by ONE trigger cannot be partially dropped: once the run starts,
# every batch job runs. `max-parallel: 1` keeps the Iceberg catalog writes
# serialized (concurrent batches would contend on the single `comments` table, the
# reason the old design spread batches across hours); `fail-fast: false` means one
# bad batch never cancels the rest. Two redundant crons (06:25 and 18:25 UTC) mean
# a single dropped trigger still leaves the day covered — the incremental manifest
# makes the second run cheap because it skips everything the first already ingested.
#
# Coverage: each batch passes `--batch-count $BATCH_COUNT`, and the pipeline
# derives the batch size from the agencies it discovers (ceil(n / 15), refused
# above 25), so no agency can fall off the end. A fixed size did, twice: 21 * 15 =
# 315 slots left 12 agencies (USOPC..WHD, including VA) never ingested, and 22 * 15
# = 330 slots left VCNP, VETS, WAPA, WCPO and WHD in no batch once discovery
# returned 335 agencies (measured 2026-09-24; 335 / 15 = 23 per batch).
#
# Manifest: the run refuses to start without a published manifest.parquet. A
# missing manifest used to mean "starting fresh": every fork batch re-downloaded
# its agencies' whole history and was cancelled at 60 minutes with nothing
# persisted. Seed it from the published ids (docs/etl-catalog-seed.md); only a
# dispatch with `allow_fresh_start` bootstraps from nothing.
#
# workflow_dispatch: a one-off run. `batch_number` runs just that batch; otherwise
# (e.g. a single `--agency`) it runs once with no batch slicing. `skip_upload`
# still defaults to true so a manual vetting run can't write to production R2 —
# flip it off deliberately. `timeout_minutes` lifts the 60-minute job limit for a
# one-off catch-up (GitHub-hosted jobs stop at 360).
on:
  schedule:
    - cron: '25 6 * * *'   # primary daily sweep (all batches via the matrix)
    - cron: '25 18 * * *'  # redundant sweep; manifest makes it cheap if the first ran
  workflow_dispatch:
    inputs:
      agency:
        description: 'Process only this agency (leave empty for all)'
        required: false
        default: ''
        type: string
      since_year:
        description: 'Only process dockets from this year onward (e.g. 2025)'
        required: false
        default: ''
        type: string
      batch_number:
        description: 'Batch number (0-indexed), or all for every batch; leave empty to run one job over all agencies'
        required: false
        default: ''
        type: string
      full_refresh:
        description: 'Ignore manifest + existing output (reprocess everything)'
        required: false
        default: false
        type: boolean
      skip_upload:
        description: 'Skip R2 upload (recommended while vetting)'
        required: false
        default: true
        type: boolean
      use_iceberg:
        description: 'Route dockets + comments through R2 Data Catalog (Iceberg). Dispatch runs only; scheduled runs always use Iceberg.'
        required: false
        default: false
        type: boolean
      allow_fresh_start:
        description: 'Start from an empty manifest when none is published (re-downloads every agency''s full history). Scheduled runs never do.'
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: 'Job timeout in minutes for this dispatch (default 60, at most 360)'
        required: false
        default: '60'
        type: string

env:
  # A scheduled sweep splits the discovered agencies into this many batches.
  BATCH_COUNT: 15

concurrency:
  # Serialize every writer to the Iceberg `comments` table. The upsert is a
  # DELETE + INSERT (DuckDB's Iceberg engine has no MERGE INTO), which is not
  # safe under concurrent writers, so two overlapping runs can duplicate rows.
  # `max-parallel: 1` only serializes batches within one run; this group also
  # keeps two ETL runs (the redundant 06:25/18:25 sweeps, or a dispatch over a
  # scheduled run) — and the dedupe/backfill workflows, which share this group —
  # from ever writing the catalog at the same time. cancel-in-progress:false so a
  # queued run waits for the in-flight one instead of cancelling it mid-write.
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max

jobs:
  # Resolve the batch matrix and the upload/iceberg flags once, so the etl job's
  # matrix can be event-dependent (schedule => all batches; dispatch => the one
  # requested batch, or a single no-slice job).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      skip_upload: ${{ steps.gen.outputs.skip_upload }}
      use_iceberg: ${{ steps.gen.outputs.use_iceberg }}
      timeout_minutes: ${{ steps.gen.outputs.timeout_minutes }}
    steps:
      - name: Resolve matrix + flags
        id: gen
        # Untrusted-ish inputs are read via env, never interpolated into the shell
        # body, and batch_number is validated as an integer before it reaches the
        # matrix JSON (guards against workflow-injection via the free-text input).
        env:
          EVENT: ${{ github.event_name }}
          BATCH_NUMBER: ${{ inputs.batch_number }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
          USE_ICEBERG: ${{ inputs.use_iceberg }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          # Scheduled runs have no inputs and keep 60; a dispatch may lift it up
          # to GitHub's 360-minute ceiling for hosted jobs.
          TIMEOUT="${TIMEOUT_MINUTES:-60}"
          if ! printf '%s' "$TIMEOUT" | grep -Eq '^[1-9][0-9]*$' || [ "$TIMEOUT" -gt 360 ]; then
            echo "timeout_minutes must be an integer in 1..360, got: $TIMEOUT" >&2
            exit 1
          fi
          echo "timeout_minutes=$TIMEOUT" >> "$GITHUB_OUTPUT"
          ALL_BATCHES="{\"batch\":[$(seq 0 $((BATCH_COUNT - 1)) | paste -sd, -)]}"
          if [ "$EVENT" = "schedule" ]; then
            # Every batch, one trigger. Scheduled runs publish to R2 and MUST route
            # through Iceberg — the comments read surface the MCP servers query is
            # the catalog now, so a batch that skipped it would drift stale again.
            echo "matrix=$ALL_BATCHES" >> "$GITHUB_OUTPUT"
            echo 'skip_upload=false' >> "$GITHUB_OUTPUT"
            echo 'use_iceberg=true' >> "$GITHUB_OUTPUT"
            echo "Scheduled sweep: all $BATCH_COUNT batches"
          else
            if [ "$BATCH_NUMBER" = "all" ]; then
              # A whole sweep under the dispatch's own timeout (a first catch-up).
              echo "matrix=$ALL_BATCHES" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: all $BATCH_COUNT batches"
            elif [ -n "$BATCH_NUMBER" ]; then
              if ! printf '%s' "$BATCH_NUMBER" | grep -Eq '^[0-9]+$' || [ "$BATCH_NUMBER" -ge "$BATCH_COUNT" ]; then
                echo "batch_number must be an integer in 0..$((BATCH_COUNT - 1)), got: $BATCH_NUMBER" >&2
                exit 1
              fi
              echo "matrix={\"batch\":[$BATCH_NUMBER]}" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: batch $BATCH_NUMBER"
            else
              # No batch number: one job over all agencies (or the single --agency).
              # -1 is the "no --batch-number" sentinel consumed by the etl step.
              echo 'matrix={"batch":[-1]}' >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: single run (no batch slicing)"
            fi
            echo "skip_upload=$SKIP_UPLOAD" >> "$GITHUB_OUTPUT"
            echo "use_iceberg=$USE_ICEBERG" >> "$GITHUB_OUTPUT"
          fi

  etl-new:
    needs: setup
    runs-on: ubuntu-latest
    # Validated in setup: 60 unless a dispatch asked for up to 360.
    timeout-minutes: ${{ fromJSON(needs.setup.outputs.timeout_minutes) }}
    strategy:
      # Serialize batches: they all write the single Iceberg `comments` table, so
      # running them concurrently would contend on catalog commits.
      max-parallel: 1
      # One bad batch must not cancel the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run new pipeline
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Only used when use_iceberg is on; harmless otherwise.
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
          # Free-text inputs via env (never interpolated into the shell body), then
          # validated below before they reach the command line.
          AGENCY: ${{ inputs.agency }}
          SINCE_YEAR: ${{ inputs.since_year }}
          BATCH: ${{ matrix.batch }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          ALLOW_FRESH_START: ${{ inputs.allow_fresh_start }}
          SKIP_UPLOAD: ${{ needs.setup.outputs.skip_upload }}
          USE_ICEBERG: ${{ needs.setup.outputs.use_iceberg }}
        run: |
          set -euo pipefail
          if [ -n "$AGENCY" ] && ! printf '%s' "$AGENCY" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "agency must match [A-Za-z0-9_-], got: $AGENCY" >&2; exit 1
          fi
          if [ -n "$SINCE_YEAR" ] && ! printf '%s' "$SINCE_YEAR" | grep -Eq '^[0-9]{4}$'; then
            echo "since_year must be a 4-digit year, got: $SINCE_YEAR" >&2; exit 1
          fi
          ARGS=()
          if [ -n "$AGENCY" ]; then ARGS+=(--agency "$AGENCY"); fi
          if [ -n "$SINCE_YEAR" ]; then ARGS+=(--since-year "$SINCE_YEAR"); fi
          # BATCH == -1 is the "no batch slicing" sentinel (single dispatch run).
          if [ "$BATCH" != "-1" ]; then ARGS+=(--batch-number "$BATCH" --batch-count "$BATCH_COUNT"); fi
          if [ "$FULL_REFRESH" = "true" ]; then ARGS+=(--full-refresh); fi
          if [ "$ALLOW_FRESH_START" = "true" ]; then ARGS+=(--allow-fresh-start); else ARGS+=(--no-allow-fresh-start); fi
          if [ "$SKIP_UPLOAD" = "true" ]; then ARGS+=(--skip-upload); else ARGS+=(--no-skip-upload); fi
          if [ "$USE_ICEBERG" = "true" ]; then ARGS+=(--use-iceberg); fi
          echo "Running: uv run run-pipeline ${ARGS[*]}"
          uv run run-pipeline "${ARGS[@]}"

      # Successful passes publish raw-read and comment-text retry checkpoints
      # before the manifest, even with zero new rows. Fresh runners restore both.
      - name: Upload artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etl-new-pipeline-output-batch-${{ matrix.batch }}
          path: output/
          retention-days: 7

  refresh-consumers:
    needs: [setup, etl-new]
    if: ${{ needs.setup.outputs.skip_upload == 'false' && needs.setup.outputs.use_iceberg == 'true' }}
    uses: ./.github/workflows/_regulations-refresh.yml
    secrets: inherit
