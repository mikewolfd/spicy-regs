name: Rollup — gao_reports
on:
  schedule:
    # 17:00 UTC — ingest new GAO products into the append-only accumulator.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      govinfo_history:
        description: "Also add GovInfo's closed GAOREPORTS listing (1989-2008 reports and testimony); one run is enough"
        required: false
        default: false
        type: boolean
      govinfo_mods:
        description: "Also read the next 6,500 GovInfo rows' MODS (about 40 minutes); two runs read them all"
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-gao-reports
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      gao_govinfo_history: ${{ github.event_name == 'workflow_dispatch' && inputs.govinfo_history || false }}
      gao_govinfo_mods: ${{ github.event_name == 'workflow_dispatch' && inputs.govinfo_mods || false }}
      timeout_minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.govinfo_mods && 90 || 30 }}
