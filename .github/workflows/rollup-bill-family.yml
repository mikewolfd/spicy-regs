name: Rollup — bill family
on:
  schedule:
    # 02:00 UTC — the long one. Runs well clear of the 17:00-24:00 daily block
    # so a multi-hour catch-up cannot collide with it.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      congresses:
        description: 'Comma-separated Congress numbers (e.g. 118,119); blank uses the current Congress'
        required: false
        default: ''
        type: string
      bill_types:
        description: 'Comma-separated bill types (e.g. hr,s,hres); blank uses all eight'
        required: false
        default: ''
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-bill-family
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      bill_family_congresses: ${{ inputs.congresses || '' }}
      bill_family_bill_types: ${{ inputs.bill_types || '' }}
      # Thirteen tables from one pass: eight bulk archives, up to
      # MAX_VERSION_FETCHES GovInfo packages at three requests each, the diff
      # engine over consecutive printings, and the model calls when a key is
      # set. The per-run caps bound the work; this bounds the job.
      timeout_minutes: 180
