name: Rollup — bill family
on:
  schedule:
    # 02:00 UTC — the long one. Runs well clear of the 17:00-24:00 daily block
    # so a multi-hour catch-up cannot collide with it.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      congresses:
        description: 'Comma-separated Congress numbers (e.g. 118,119); blank uses the current Congress'
        required: false
        default: ''
        type: string
      max_version_fetches:
        description: 'Maximum printing fetches / pre-108 backfill requests (0 disables both; never unlimited)'
        required: false
        default: '600'
        type: string
      bill_types:
        description: 'Comma-separated bill types (e.g. hr,s,hres); blank uses all eight'
        required: false
        default: ''
        type: string
# A dispatch queues behind the 02:00 run and behind other dispatches instead of
# racing them, since two concurrent publications of this family refuse the
# later one as stale after its whole acquisition.
concurrency:
  group: rollup-bill-family
  cancel-in-progress: false
  queue: max
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-bill-family
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      bill_family_congresses: ${{ inputs.congresses || '' }}
      bill_family_bill_types: ${{ inputs.bill_types || '' }}
      bill_family_max_version_fetches: ${{ inputs.max_version_fetches || '600' }}
      # Eighteen family outputs, including cbo_cost_estimates, from one pass: eight bulk archives, up to
      # the selected number of GovInfo packages, the diff
      # engine over consecutive printings, and the model calls when a key is
      # set. The per-run caps bound the work; this bounds the job.
      timeout_minutes: 180
