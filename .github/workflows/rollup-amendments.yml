name: Rollup — amendments
on:
  schedule:
    # 02:40 UTC — a paged list walk per scoped Congress.
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      congresses:
        description: 'Comma-separated Congress numbers or range (e.g. 93-119); scheduled runs use 118-119'
        required: false
        default: '93-119'
        type: string
      max_details:
        description: 'Maximum amendment detail requests per run (default 500)'
        required: false
        default: '500'
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-amendments
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      bill_family_congresses: ${{ inputs.congresses || '118-119' }}
      spicy_regs_congresses: ${{ inputs.congresses || '118-119' }}
      amendments_max_details: ${{ inputs.max_details || '500' }}
      timeout_minutes: 30
