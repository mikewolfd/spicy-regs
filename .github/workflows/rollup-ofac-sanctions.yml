name: Rollup — ofac_sanctions
# Daily at 22:17 UTC. A run that finds nothing new publishes nothing and ends green.
# Built here: the current SDN and consolidated exports; SDN admission takes most of the time.
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  actions: read

jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-ofac-sanctions
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      timeout_minutes: 60
