name: Rollup — fec_committee_history
on:
  schedule:
    # 19:45 UTC — read every cycle's FEC bulk committee master (decision 53);
    # the current cycle's file is republished daily.
    - cron: '45 19 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fec-committee-history
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
