name: Rollup — congress_bills
on:
  schedule:
    # 20:15 UTC — ingest congressional bills ahead of the evening rollup window.
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      since:
        description: 'Backfill bills updated since this date (YYYY-MM-DD); blank uses the stored watermark'
        required: false
        default: ''
        type: string
      until:
        description: 'Backfill end date (YYYY-MM-DD); blank runs one catch-up window forward from since'
        required: false
        default: ''
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-congress-bills
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      congress_since: ${{ inputs.since || '' }}
      congress_until: ${{ inputs.until || '' }}
      # MAX_WINDOW_DAYS caps a run at ~90 days (~14 min a walk at the measured
      # ~3,050 bills/min; the pooled read takes at most four walks, about an
      # hour). A run with no prior table refuses without `since`: the whole
      # ~430k-bill archive is ~140 min a walk, and a second pooled walk would
      # not fit, so a cold start is driven in since/until windows.
      timeout_minutes: 180
