name: Rollup — roll_call_votes
# Manual repair and backfill entry point; routine execution is sequenced by its
# parent workflow, refresh-congress-vote-terms.yml.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      congresses:
        description: 'Comma-separated Congress numbers (e.g. 118,119; 101-107 for the pre-2003 House backfill); blank uses the current Congress'
        required: false
        default: ''
        type: string
      chambers:
        description: 'Comma-separated chambers (house, senate); blank reads both. The pre-2003 backfill is house'
        required: false
        default: ''
        type: string
      max_votes:
        description: 'Roll calls fetched this run, 1 to 4000 (newest unheld first; the next run resumes); blank uses 1500'
        required: false
        default: ''
        type: string
# The scheduled refresh's group: a dispatch queues behind it and behind other
# dispatches instead of racing them, since two concurrent publications of this
# family refuse the later one as stale after its whole acquisition.
concurrency:
  group: congress-vote-terms
  cancel-in-progress: false
  queue: max
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-roll-call-votes
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      bill_family_congresses: ${{ inputs.congresses || '' }}
      roll_call_chambers: ${{ inputs.chambers || '' }}
      roll_call_max_votes: ${{ inputs.max_votes || '' }}
      # MAX_VOTES_PER_RUN (1,500) at ~2 roll calls/second is ~13 minutes, and the
      # 4,000 ceiling ~35; native prior restoration and publication need
      # additional time beyond source acquisition.
      # The 101st-107th House backfill (7,327 Clerk files of 1990-2002) is
      # congresses=101,102,103,104,105,106,107, chambers=house, max_votes=4000,
      # dispatched until a run fetches nothing: two runs at 4,000, five at 1,500.
      timeout_minutes: 180
