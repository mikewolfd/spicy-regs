name: Publish comments mirror
# Manual completion/recovery path; ETL calls the same refresh after publishing.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build and validate the mirror without publishing or refreshing consumers'
        type: boolean
        default: false
concurrency:
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max
env:
  # Read by spicy_regs.sources.iceberg: this run holds comments-catalog-write,
  # so its catalog writes do not log the unlocked-write warning.
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

jobs:
  refresh:
    uses: ./.github/workflows/_regulations-refresh.yml
    secrets: inherit
    with:
      skip_upload: ${{ inputs.skip_upload }}
