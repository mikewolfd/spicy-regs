name: Rollup — fec_candidate_history
on:
  schedule:
    # 20:10 UTC — read every cycle's FEC bulk candidate master (decision 53's
    # shape); the current cycle's file is republished daily.
    - cron: '10 20 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fec-candidate-history
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
