name: Rollup — gao_recommendations
on:
  schedule:
    # 17:10 UTC, beside gao_reports — one Zyte request for GAO's open-recommendations export, folded
    # into the accumulator (a recommendation that leaves the export stays, marked no longer listed).
    - cron: '10 17 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-gao-recommendations
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      timeout_minutes: 15
