name: Publish explorer metadata
on:
  push:
    branches: [main]
    paths:
      - 'src/spicy_regs/table_metadata.json'
      - 'src/spicy_regs/table_joins.json'
      - 'src/spicy_regs/table_joins.py'
      - 'src/spicy_regs/join_audit.json'
      - 'src/spicy_regs/explorer_*'
      - 'src/spicy_regs/data_dictionary.py'
      - 'data_dictionary/descriptions.yaml'
      - 'scripts/publish_explorer_metadata.py'
      - 'tests/test_explorer_metadata.py'
      - 'tests/test_explorer_publications.py'
      - 'tests/test_column_navigation.py'
      - '.github/workflows/publish-explorer-metadata.yml'
  workflow_dispatch:
  # Also catches workstation publications and new publishing workflows. GitHub
  # may delay scheduled runs; consumers expose missing/stale metadata meanwhile.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows:
      - "CI"
      - "Rollup — agency_monthly_volume"
      - "Rollup — agency_stats"
      - "Rollup — amendments"
      - "Rollup — bill family"
      - "Rollup — bill_subjects"
      - "Rollup — cfr_sections"
      - "Rollup — committee_meetings"
      - "Rollup — committee_reports"
      - "Rollup — committee_rosters"
      - "Rollup — court_citations, court_citation_map, court_parentheticals"
      - "Rollup — court_dockets"
      - "Rollup — court_opinion_clusters"
      - "Rollup — crs_reports"
      - "Rollup — discovery_signals"
      - "Rollup — docket_search"
      - "Rollup — fcc_filings"
      - "Rollup — fcc_proceedings"
      - "Rollup — fec_candidate_history"
      - "Rollup — fec_committee_history"
      - "Rollup — fec_committees"
      - "Rollup — fec_source_catalog"
      - "Rollup — federal_register"
      - "Rollup — feed_summary"
      - "Rollup — fr_docket_links"
      - "Rollup — gao_recommendations"
      - "Rollup — gao_reports"
      - "Rollup — house_communications"
      - "Rollup — laws"
      - "Rollup — lobbying_filings"
      - "Rollup — member_vote_terms"
      - "Rollup — members"
      - "Rollup — nominations"
      - "Rollup — org_committee_links"
      - "Rollup — press_releases"
      - "Rollup — print_citations"
      - "Rollup — record_issues"
      - "Rollup — retained FEC observations"
      - "Rollup — roll_call_votes"
      - "Rollup — sam_entities"
      - "Rollup — senate_expenditures"
      - "Rollup — treaties"
      - "Rollup — unified_agenda"
      - "Rollup — usaspending_recipients"
      - "ETL (new pipeline)"
      - "Refresh congressional votes and terms"
      - "Sweep Regulations.gov attributes"
      - "Publish comments mirror"
      - "Materialize — rulemaking join surface"
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: explorer-metadata
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      publish: ${{ steps.ci.outputs.publish }}
    steps:
      - name: Require successful CI for the exact main revision
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('publish', 'false');
            const { owner, repo } = context.repo;
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const sha = ref.object.sha;
            core.setOutput('sha', sha);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', head_sha: sha, per_page: 100
            });
            const runs = data.workflow_runs
              .filter(run => run.head_sha === sha && run.head_branch === 'main' && run.event === 'push')
              .sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
            const latest = runs[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              const state = latest ? `${latest.status}/${latest.conclusion ?? 'pending'}` : 'no push CI run yet';
              core.notice(`Skipping publication for ${sha}: CI is ${state}. A successful CI completion will retry.`);
              return;
            }
            core.setOutput('publish', 'true');
            core.info(`Publishing revision ${sha}, verified by CI run ${latest.id}.`);
  publish:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin the trusted main revision that passed CI in preflight.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --no-group source-readers
      - name: Validate metadata behavior
        env:
          PYTHONPATH: src
        run: uv run --frozen --no-group source-readers pytest --noconftest tests/test_explorer_metadata.py tests/test_explorer_publications.py tests/test_column_navigation.py -q
      - name: Publish only the explorer metadata bundle
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run --frozen --no-group source-readers python scripts/publish_explorer_metadata.py --publish
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-metadata
          path: output/explorer-metadata.v1.json
          retention-days: 7
