name: Rollup — federal_register
on:
  schedule:
    # Refresh docket links only after this publication succeeds.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Re-read start date (YYYY-MM-DD); blank resumes from the prior table, 1994-01-01 refetches every document'
        required: false
        default: ''
        type: string
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-federal-register
      producer_ref: main
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      fr_since: ${{ inputs.since || '' }}
      # Native priors also require complete retained restoration during a daily resume.
      timeout_minutes: ${{ inputs.since && 240 || 180 }}

  docket-links:
    needs: run
    if: ${{ !inputs.skip_upload }}
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fr-docket-links
      producer_ref: main
      timeout_minutes: 180
