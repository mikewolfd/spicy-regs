name: Rollup — federal_register
on:
  schedule:
    # Refresh docket links only after this publication succeeds.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Re-read start date (YYYY-MM-DD); blank resumes from the prior table, 1994-01-01 refetches every document'
        required: false
        default: ''
        type: string
      until:
        description: 'Optional re-read end date (YYYY-MM-DD); blank reads through today'
        required: false
        default: ''
        type: string
      request_interval_seconds:
        description: 'Optional polite delay in seconds between API pages; blank uses 0.25 when since or until is set, 0 otherwise'
        required: false
        default: ''
        type: string
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-federal-register
      producer_ref: main
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      fr_since: ${{ inputs.since || '' }}
      fr_until: ${{ inputs.until || '' }}
      fr_request_interval_seconds: ${{ inputs.request_interval_seconds || ((inputs.since || inputs.until) && '0.25' || '') }}
      # No receipts since ss-vse3 step 3: a night downloads the pinned table (283 MB on 2026-11-10), reads ~9,000
      # documents and merges natively, about 2 of the 45.7 minutes the receipt route took (2026-11-09 timers). 30
      # keeps a wide margin over setup and upload and stops a hang 150 minutes sooner. A re-read (`since`/`until`)
      # maps every document it fetches in Python across the window, so it keeps 240.
      timeout_minutes: ${{ (inputs.since || inputs.until) && 240 || 30 }}

  docket-links:
    needs: run
    if: ${{ !inputs.skip_upload }}
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fr-docket-links
      producer_ref: main
      # Rebuilt whole from the pinned Register table in DuckDB, no receipts (ss-vse3 step 3).
      timeout_minutes: 30
