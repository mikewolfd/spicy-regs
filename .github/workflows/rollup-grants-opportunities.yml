name: Rollup — grants_opportunities
# Daily at 11:47 UTC, about two hours after the 09:41 UTC daily export write time. A run that finds nothing new publishes
# nothing and ends green.
# Built here: the newest daily export; its admission takes most of the time.
on:
  schedule:
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  actions: read

jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-grants-opportunities
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      timeout_minutes: 45
