name: Build or qualify MCP reader image (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build/publish an image, or qualify an existing image and its published FEC receipt without deploying
        required: true
        default: build
        type: choice
        options: [build, qualify]
      expected_source_sha:
        description: Exact source commit to build; must match the dispatched ref
        required: true
        type: string
      image_digest:
        description: Qualification only; exact sha256 digest of the previously built reader image
        type: string
      fec_release_sha256:
        description: Qualification only; published receipt bound to that exact image
        type: string
      data_base_url:
        description: Qualification only; HTTPS public data base hosting the selected receipt and generations
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      IMAGE_OPERATION: ${{ inputs.operation }}
      QUALIFIED_IMAGE_DIGEST: ${{ inputs.image_digest }}
      QUALIFIED_RECEIPT_SHA256: ${{ inputs.fec_release_sha256 }}
      QUALIFIED_DATA_BASE_URL: ${{ inputs.data_base_url }}
      QUALIFICATION_CONTAINER: reader-qualification-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_TAG: spicy-regs-reader:${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_WRITE_LOGS: 'false'
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source
        shell: bash
        env:
          REGISTRY_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_CONTAINER_REGISTRY_TOKEN != '' }}
          REGISTRY_USERNAME_CONFIGURED: ${{ secrets.CLOUDFLARE_CONTAINER_REGISTRY_USERNAME != '' }}
          REGISTRY_PASSWORD_CONFIGURED: ${{ secrets.CLOUDFLARE_CONTAINER_REGISTRY_PASSWORD != '' }}
        run: |
          if [ "$REGISTRY_USERNAME_CONFIGURED" != "$REGISTRY_PASSWORD_CONFIGURED" ]; then
            echo 'Set both temporary registry secrets or remove both.' >&2
            exit 1
          fi
          if [ "$REGISTRY_USERNAME_CONFIGURED" != true ] && [ "$REGISTRY_TOKEN_CONFIGURED" != true ]; then
            echo 'Configure temporary registry credentials or the account-scoped registry token.' >&2
            exit 1
          fi
          printf 'DOCKER_CONFIG=%s/mcp-registry-auth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          SOURCE_STATUS=$(git status --porcelain)
          mkdir image-output
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > image-output/expected-source-commit.txt
          git rev-parse HEAD > image-output/source-commit.txt
          git rev-parse HEAD^{tree} > image-output/source-tree.txt
          test "$EXPECTED_SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$SOURCE_STATUS"
          sha256sum uv.lock deploy/cloudflare/Dockerfile \
            deploy/cloudflare/lock_pins.py deploy/cloudflare/runtime_readers.py \
            deploy/cloudflare/qualify_reader.py deploy/cloudflare/start_reader.py \
            deploy/cloudflare/package-lock.json > image-output/build-inputs.sha256
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          configured = re.findall(r'"account_id"\s*:\s*"([0-9a-f]{32})"',
                                 Path('deploy/cloudflare/wrangler.template.jsonc').read_text())
          if configured != [os.environ['CLOUDFLARE_ACCOUNT_ID']]:
              raise SystemExit('Repository account variable must match the pinned Worker account')
          operation = os.environ['IMAGE_OPERATION']
          if operation not in {'build', 'qualify'}:
              raise SystemExit('Unknown image operation')
          values = [os.environ[name] for name in ('QUALIFIED_IMAGE_DIGEST', 'QUALIFIED_RECEIPT_SHA256', 'QUALIFIED_DATA_BASE_URL')]
          if operation == 'qualify':
              if not all(re.fullmatch(r'sha256:[0-9a-f]{64}', value) for value in values[:2]):
                  raise SystemExit('Qualification requires exact image and receipt digests')
              from urllib.parse import urlsplit
              url = urlsplit(values[2])
              if url.scheme != 'https' or not url.netloc or url.username or url.password or url.query or url.fragment:
                  raise SystemExit('Qualification requires an HTTPS public data base')
          elif any(values):
              raise SystemExit('Qualification pins cannot be supplied to a build operation')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the locked registry CLI
        working-directory: deploy/cloudflare
        run: |
          npm ci
          npm run configure
          node -p 'require("./node_modules/wrangler/package.json").version' > ../../image-output/wrangler-version.txt
      - name: Authenticate the selected registry operation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.CLOUDFLARE_CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CLOUDFLARE_CONTAINER_REGISTRY_PASSWORD }}
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          registry = 'registry.cloudflare.com'
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          username = os.environ.pop('REGISTRY_USERNAME')
          password = os.environ.pop('REGISTRY_PASSWORD')
          if bool(username) != bool(password):
              raise SystemExit('Set both temporary registry secrets or remove both.')
          if not username:
              scope = ['--pull'] if os.environ['IMAGE_OPERATION'] == 'qualify' else ['--push', '--pull']
              command = ['deploy/cloudflare/node_modules/.bin/wrangler', '--cwd', 'deploy/cloudflare',
                         'containers', 'registries', 'credentials', registry,
                         *scope, '--expiration-minutes', '30', '--json']
              result = subprocess.run(command, capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise SystemExit('Registry credential request refused before build; check the account token permissions')
              try:
                  credentials = json.loads(result.stdout)
                  if credentials['account_id'] != account or credentials['registry_host'] != registry:
                      raise ValueError('Registry credentials target another account or host')
                  username, password = credentials['username'], credentials['password']
              except (ValueError, KeyError, TypeError):
                  raise SystemExit('Registry credential response invalid; values withheld') from None
          if not all(isinstance(value, str) and value for value in (username, password)):
              raise SystemExit('Registry credential response invalid; values withheld')
          auth = base64.b64encode(f'{username}:{password}'.encode()).decode()

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('Registry redirect refused')

          request = Request(f'https://{registry}/v2/', headers={'Authorization': f'Basic {auth}'})
          try:
              with build_opener(NoRedirect()).open(request, timeout=20) as response:
                  if response.status != 200:
                      raise ValueError('Registry authentication refused')
          except (OSError, ValueError):
              raise SystemExit('Registry authentication failed before build; verify credential scope and lifetime') from None
          config = Path(os.environ['DOCKER_CONFIG']) / 'config.json'
          with os.fdopen(os.open(config, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as handle:
              json.dump({'auths': {registry: {'auth': auth}}}, handle)
          PY
      - name: Build the existing locked reader image
        if: inputs.operation == 'build'
        shell: bash
        run: |
          set -o pipefail
          docker build --platform linux/amd64 --provenance=false \
            --label "org.opencontainers.image.revision=$EXPECTED_SOURCE_SHA" \
            -f deploy/cloudflare/Dockerfile -t "$IMAGE_TAG" . \
            2>&1 | tee image-output/build.log
      - name: Record installed runtime and image
        if: inputs.operation == 'build'
        shell: bash
        run: |
          set -o pipefail
          docker image inspect "$IMAGE_TAG" > image-output/image-inspect.json
          docker run --rm --entrypoint python "$IMAGE_TAG" \
            /app/lock/lock_pins.py check /app/lock/uv.lock \
            2>&1 | tee image-output/lock-check.log
          docker run --rm --entrypoint python "$IMAGE_TAG" -c \
            'import json; from spicy_regs.fec_release import runtime_consumer; print(json.dumps(runtime_consumer(None), sort_keys=True))' \
            > image-output/installed-consumer.json 2> image-output/runtime-stderr.log
      - name: Publish and verify the same image
        if: inputs.operation == 'build'
        shell: bash
        run: |
          set -o pipefail
          REGISTRY_TAG="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$IMAGE_TAG"
          docker tag "$IMAGE_TAG" "$REGISTRY_TAG"
          docker push "$REGISTRY_TAG" 2>&1 | tee image-output/push.log
          docker image inspect "$REGISTRY_TAG" > image-output/pushed-image-inspect.json
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          output = Path('image-output')
          built = json.loads((output / 'image-inspect.json').read_text())[0]
          pushed = json.loads((output / 'pushed-image-inspect.json').read_text())[0]
          repository = 'registry.cloudflare.com/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/spicy-regs-reader'
          references = [ref for ref in pushed['RepoDigests'] if ref.startswith(repository + '@')]
          assert len(references) == 1, 'Expected one digest for the selected registry repository'
          reference = references[0]
          digest = reference.split('@', 1)[1]
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'Invalid registry digest'
          assert built['Id'] == pushed['Id'] and built['RootFS'] == pushed['RootFS'], \
              'Pushed image differs from the checked image'
          assert (built['Os'], built['Architecture']) == (pushed['Os'], pushed['Architecture']) == ('linux', 'amd64'), \
              'Wrong image platform'
          remote = subprocess.run(['docker', 'manifest', 'inspect', reference],
                                  capture_output=True, text=True, check=True, timeout=60)
          (output / 'registry-manifest.json').write_text(remote.stdout)
          manifest = json.loads(remote.stdout)
          assert manifest['schemaVersion'] == 2, 'Unsupported registry manifest version'
          config_digest = manifest['config']['digest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', config_digest), 'Invalid registry config digest'
          descriptor = built.get('Descriptor')
          assert descriptor == pushed.get('Descriptor'), 'Pushed image descriptor differs from the checked image'
          if descriptor is None:
              # The classic store uses the configuration digest as the image ID.
              assert built['Id'] == config_digest, 'Registry manifest does not bind the checked image config'
          else:
              # A containerd store can use the manifest digest as the image ID.
              assert descriptor['digest'] == digest and descriptor['mediaType'] == manifest['mediaType'], \
                  'Registry manifest differs from the checked image descriptor'
              assert descriptor.get('annotations', {}).get('config.digest') == config_digest, \
                  'Registry manifest does not bind the checked image config'
              assert built['Id'] in (digest, config_digest), 'Unexpected image ID for the checked descriptor'
          consumer = json.loads((output / 'installed-consumer.json').read_text())
          consumer['image_digest'] = digest
          association = {
              'status': 'pass', 'source_commit': (output / 'source-commit.txt').read_text().strip(),
              'source_tree': (output / 'source-tree.txt').read_text().strip(),
              'uv_lock_sha256': hashlib.sha256(Path('uv.lock').read_bytes()).hexdigest(),
              'registry_image': reference, 'registry_manifest_digest': digest,
              'config_digest': config_digest, 'consumer': consumer,
              'scope': 'Checked image config matches the registry manifest; no deployment or serving qualification.',
          }
          (output / 'registry-association.json').write_text(json.dumps(association, indent=2) + '\n')
          print(reference)
          PY
      - name: Qualify the existing image through ordinary loopback MCP
        if: inputs.operation == 'qualify'
        shell: bash
        run: |
          set -o pipefail
          QUALIFIED_IMAGE="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/spicy-regs-reader@$QUALIFIED_IMAGE_DIGEST"
          docker pull "$QUALIFIED_IMAGE" 2>&1 | tee image-output/qualification-pull.log
          docker image inspect "$QUALIFIED_IMAGE" > image-output/qualified-image-inspect.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          image, = json.loads(Path('image-output/qualified-image-inspect.json').read_text())
          reference = 'registry.cloudflare.com/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/spicy-regs-reader@' + os.environ['QUALIFIED_IMAGE_DIGEST']
          assert reference in image['RepoDigests'], 'Pulled image does not match the selected registry digest'
          assert (image['Os'], image['Architecture']) == ('linux', 'amd64'), 'Wrong qualification platform'
          assert image['Config']['Labels']['org.opencontainers.image.revision'] == os.environ['EXPECTED_SOURCE_SHA'], 'Image source does not match this qualification checkout'
          PY
          docker run --detach --name "$QUALIFICATION_CONTAINER" --memory=12g --cpus=4 \
            --mount "type=bind,src=$PWD/image-output,dst=/qualification-output" \
            -e "SPICY_REGS_R2_URL=$QUALIFIED_DATA_BASE_URL" \
            -e "SPICY_REGS_FEC_RELEASE_SHA256=$QUALIFIED_RECEIPT_SHA256" \
            -e "SPICY_REGS_CONSUMER_IMAGE_DIGEST=$QUALIFIED_IMAGE_DIGEST" \
            -e SPICY_REGS_MEMORY_LIMIT=9GB -e SPICY_REGS_TEMP_DIR=/tmp \
            -e SPICY_REGS_STATEMENT_TIMEOUT=18s \
            "$QUALIFIED_IMAGE" > image-output/qualification-container-id.txt
          timeout 240s docker exec "$QUALIFICATION_CONTAINER" python /app/lock/qualify_reader.py \
            --output /qualification-output/qualification \
            2>&1 | tee image-output/qualification-client.log
      - name: Retain and remove only the qualification container
        if: always() && inputs.operation == 'qualify'
        shell: bash
        run: |
          if docker container inspect "$QUALIFICATION_CONTAINER" > image-output/qualification-container-inspect.json 2>/dev/null; then
            docker logs "$QUALIFICATION_CONTAINER" > image-output/qualification-server.log 2>&1
            docker rm --force "$QUALIFICATION_CONTAINER"
          fi
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mcp-registry-auth"
      - name: Retain build and registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-reader-image-${{ github.sha }}
          path: image-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
