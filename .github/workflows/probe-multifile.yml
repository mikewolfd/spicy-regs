name: Probe multi-file tables

# Owner decision 64: the multi-file design's four §5 measurements
# (docs/research/multi-file-tables-2026-09-26.md). Writes a throwaway 1.1 GiB
# object and bill_sections split by congress under probes/multifile-<run>/,
# measures, and deletes everything it wrote. Uploads the JSON receipt.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Measure
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: uv run --frozen python scripts/probe_multifile.py --output multifile-probe.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multifile-probe
          path: multifile-probe.json
