name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run --extra comments-reader ruff check .

      - name: Type check (ty)
        run: uv run --extra comments-reader ty check

  test:
    runs-on: ubuntu-latest
    # Keep the complete partitions: the larger one can exceed 15 minutes on hosted runners.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run --extra comments-reader python scripts/run_ci_tests.py ${{ matrix.partition }} --manifest "$RUNNER_TEMP/ci-partition-${{ matrix.partition }}.json" -ra

      - name: Retain complete test selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-partition-${{ matrix.partition }}
          path: ${{ runner.temp }}/ci-partition-${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 14

  data-dictionary:
    # Guards that the data dictionary stays in sync with the schema: the
    # descriptions cover every column, and the committed table pages match what
    # the generator would produce. A schema change without a docs update fails
    # here. Offline (no network) — the live-data reconciliation runs in the
    # docs deploy workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Check portable source navigation and migration rules
        run: uv run --frozen pytest tests/test_explorer_navigation.py tests/test_navigation_measurements.py tests/test_navigation_measurement_runner.py tests/test_congress_receipts.py tests/test_government_source_shapes.py -q

      - name: Check descriptions vs schema
        run: uv run spicy-regs-dict check

      - name: Verify catalog descriptions fit the MCP reply budget
        run: uv run --extra comments-reader pytest tests/test_chaos_r6_server.py::test_the_catalog_replies_stay_under_the_budget_so_none_is_ever_refused_or_cut -q

      - name: Verify generated table pages are up to date
        run: |
          uv run spicy-regs-dict generate
          git diff --exit-code docs/tables \
            || { echo "::error::docs/tables is stale. Run 'uv run spicy-regs-dict generate' and commit."; exit 1; }

  changed-joins:
    # New/changed declarations get full public key-column reads immediately.
    # Unchanged joins remain covered by the daily complete-registry check.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install checker dependencies
        run: uv sync --frozen --no-default-groups
      - name: Check changed declarations against published data
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ARGS=(--receipt join-check-results.json)
          if [ -n "$CHANGE_BASE" ] && [ "$CHANGE_BASE" != "0000000000000000000000000000000000000000" ]; then
            ARGS+=(--changed-since "$CHANGE_BASE")
          fi
          uv run --frozen --no-default-groups python scripts/check_table_joins.py "${ARGS[@]}"
      - name: Retain join measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-join-measurements
          path: join-check-results.json
          if-no-files-found: warn
          retention-days: 14
