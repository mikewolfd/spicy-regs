name: Publish archive release pins
# The congressional-tech archive prunes every release except live, last_good and
# the ids listed at data.spicygov.ai/pins/archive-releases.json (ss-tik6). Publish
# that list whenever the repo-held record changes on main, so a release spicy-regs
# binds is pinned before any MCP deploy reads it.
on:
  push:
    branches: [main]
    paths:
      - 'src/spicy_regs/archive_release_pins.json'
      - 'src/spicy_regs/archive_release.py'
      - '.github/workflows/publish-archive-release-pins.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-release-pins
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --no-group source-readers
      - name: Validate the pin record
        run: uv run --frozen --no-group source-readers pytest --noconftest tests/test_archive_release.py -q
      - name: Publish pins/archive-releases.json and read it back
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run --frozen --no-group source-readers python -m spicy_regs.archive_release --publish
