name: Rollup (reusable)

# Reusable workflow that runs one decoupled rollup pipeline (`run-rollup-*`).
# Each rollup has its own thin caller workflow (rollup-*.yml) with its own cron;
# they all delegate here so the build/publish steps live in one place.
#
# The `run-rollup-*` console scripts default to --skip-upload (vetting), so this
# passes --no-skip-upload for real runs; callers can flip it back for dry runs.
on:
  workflow_call:
    inputs:
      command:
        description: 'The run-rollup-* console script to run (e.g. run-rollup-feed-summary)'
        required: true
        type: string
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      sam_ingest_mode:
        description: 'SAM source mode: extract or partition'
        required: false
        default: 'extract'
        type: string
      sam_since_year:
        description: 'Optional first SAM registration year; blank uses the rotating year'
        required: false
        default: ''
        type: string
      sam_until_year:
        description: 'Optional last SAM registration year'
        required: false
        default: ''
        type: string
      sam_max_records:
        description: 'Optional explicit SAM record limit; blank or zero is unbounded'
        required: false
        default: ''
        type: string
      fec_inputs_url:
        description: 'Explicit HTTPS URL of a prepared retained-input tar archive; no source acquisition'
        required: false
        default: ''
        type: string
      fec_inputs_sha256:
        description: 'Expected SHA-256 of the exact transferred archive'
        required: false
        default: ''
        type: string
      fec_manifest_sha256:
        description: 'Expected SHA-256 of manifest.json inside the archive'
        required: false
        default: ''
        type: string
      fec_max_archive_bytes:
        description: 'Maximum transferred retained-input archive bytes'
        required: false
        default: '4000000000'
        type: string
      fec_max_extracted_bytes:
        description: 'Maximum extracted retained-input bytes; leave runner space for outputs'
        required: false
        default: '8000000000'
        type: string
      cfr_replace_all:
        description: 'cfr_sections: re-place every listed package, not only changed ones'
        required: false
        default: false
        type: boolean
      lda_since:
        description: 'Optional LDA catch-up start date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      lda_until:
        description: 'Optional LDA catch-up end date (YYYY-MM-DD; still capped to a 30-day run)'
        required: false
        default: ''
        type: string
      congress_since:
        description: 'Optional Congress.gov backfill start date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      congress_until:
        description: 'Optional Congress.gov backfill end date (YYYY-MM-DD; still capped to one catch-up window)'
        required: false
        default: ''
        type: string
      bill_family_congresses:
        description: 'Optional comma-separated Congress numbers to scope the bill-family rollup (e.g. 118,119)'
        required: false
        default: ''
        type: string
      bill_family_max_version_fetches:
        description: 'Bill-family printing / pre-108 backfill acquisition cap; 0 disables those requests'
        required: false
        default: '600'
        type: string
      bill_family_bill_types:
        description: 'Optional comma-separated bill types to scope the bill-family rollup (e.g. hr,s,hres)'
        required: false
        default: ''
        type: string
      committee_reports_since:
        description: 'Optional GovInfo CRPT/CHRG last-modified start (YYYY-MM-DD); blank uses a 30-day window'
        required: false
        default: ''
        type: string
      print_citations_since:
        description: 'Optional GovInfo CRPT/BUDGET issue-date floor (YYYY-MM-DD); blank uses 2023-01-01'
        required: false
        default: ''
        type: string
      senate_expenditures_since:
        description: 'Optional GovInfo CDOC issue-date floor (YYYY-MM-DD); blank uses 2024-01-01'
        required: false
        default: ''
        type: string
      fcc_since:
        description: 'Optional FCC ECFS backfill start date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      fcc_proceedings:
        description: 'Optional comma-separated FCC proceeding names to scope the filings fetch (e.g. 17-108,23-320)'
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: 'Job timeout. Raise it for a rollup whose catch-up window is much larger than its steady state.'
        required: false
        default: 30
        type: number

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Retain invocation scope
        env:
          ROLLUP_INPUTS: ${{ toJSON(inputs) }}
        run: |
          mkdir -p output
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          scope = json.loads(os.environ['ROLLUP_INPUTS'])
          # URLs may carry temporary access tokens; digests identify transferred bytes.
          scope.pop('fec_inputs_url', None)
          receipt = {
              'started_at': datetime.datetime.now(datetime.UTC).isoformat(),
              'code_revision': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'inputs': scope,
          }
          Path('output/invocation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Prepare explicit retained FEC inputs
        if: inputs.command == 'build-fec-observations'
        env:
          FEC_INPUTS_URL: ${{ inputs.fec_inputs_url }}
          FEC_INPUTS_SHA256: ${{ inputs.fec_inputs_sha256 }}
          FEC_MANIFEST_SHA256: ${{ inputs.fec_manifest_sha256 }}
          MAX_ARCHIVE_BYTES: ${{ inputs.fec_max_archive_bytes }}
          MAX_EXTRACTED_BYTES: ${{ inputs.fec_max_extracted_bytes }}
        run: |
          [[ "$FEC_INPUTS_URL" == https://* ]] || { echo 'An explicit HTTPS input archive is required'; exit 1; }
          [[ "${FEC_INPUTS_SHA256#sha256:}" =~ ^[0-9a-f]{64}$ ]] || { echo 'Archive SHA-256 is required'; exit 1; }
          [[ "${FEC_MANIFEST_SHA256#sha256:}" =~ ^[0-9a-f]{64}$ ]] || { echo 'Manifest SHA-256 is required'; exit 1; }
          [[ "$MAX_ARCHIVE_BYTES" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$MAX_EXTRACTED_BYTES" =~ ^[1-9][0-9]*$ ]] || exit 1
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 30 --max-time 900 --max-filesize "$MAX_ARCHIVE_BYTES" \
            --output "$RUNNER_TEMP/fec-retained-inputs.tar" "$FEC_INPUTS_URL"
          uv run --frozen python scripts/prepare_fec_retained_inputs.py \
            --archive "$RUNNER_TEMP/fec-retained-inputs.tar" \
            --archive-sha256 "$FEC_INPUTS_SHA256" --manifest-sha256 "$FEC_MANIFEST_SHA256" \
            --max-archive-bytes "$MAX_ARCHIVE_BYTES" --max-extracted-bytes "$MAX_EXTRACTED_BYTES" \
            --output-dir "$RUNNER_TEMP/fec-retained-inputs" --audit-dir output/fec-inputs
          rm "$RUNNER_TEMP/fec-retained-inputs.tar"

      - name: Run rollup
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          # A hosted runner has tens of GB in total, so the workstation's 100 GiB
          # free-space floor would refuse any download; keep 4 GiB free instead.
          SPICY_REGS_DISK_FLOOR_GIB: '4'
          # Keep FEC evidence outside a hidden directory so successful and
          # interrupted traversals can be inspected after the runner exits.
          FEC_CAPTURE_DIR: output/fec-captures
          # SAM requires source access; missing/failed access must abort publication.
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SAM_INGEST_MODE: ${{ inputs.sam_ingest_mode }}
          SAM_SINCE_YEAR: ${{ inputs.sam_since_year }}
          SAM_UNTIL_YEAR: ${{ inputs.sam_until_year }}
          SAM_MAX_RECORDS: ${{ inputs.sam_max_records }}
          # Optional: raises the Senate LDA API rate limit. The lobbying-filings
          # rollup is fully functional keyless, so an unset secret is fine.
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          CFR_REPLACE_ALL: ${{ inputs.cfr_replace_all }}
          LDA_SINCE: ${{ inputs.lda_since }}
          LDA_UNTIL: ${{ inputs.lda_until }}
          CONGRESS_SINCE: ${{ inputs.congress_since }}
          CONGRESS_UNTIL: ${{ inputs.congress_until }}
          BILL_FAMILY_CONGRESSES: ${{ inputs.bill_family_congresses }}
          BILL_FAMILY_BILL_TYPES: ${{ inputs.bill_family_bill_types }}
          BILL_FAMILY_MAX_VERSION_FETCHES: ${{ inputs.bill_family_max_version_fetches }}
          # Gemini API key for the bill-family rollup's model-backed tables
          # (section_classifications, bill_summaries, diff_summaries —
          # spicy_docs.interpretation's classify_sections/summarize_bill/
          # summarize_diff). A keyless run skips those three rather than
          # failing; the other declared family outputs still build.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMITTEE_REPORTS_SINCE: ${{ inputs.committee_reports_since }}
          PRINT_CITATIONS_SINCE: ${{ inputs.print_citations_since }}
          SENATE_EXPENDITURES_SINCE: ${{ inputs.senate_expenditures_since }}
          FCC_SINCE: ${{ inputs.fcc_since }}
          FCC_PROCEEDINGS: ${{ inputs.fcc_proceedings }}
          # Only the court_dockets rollup gets the CourtListener token: its daily
          # delta is a few search pages, and keyless runs were timing out on 429s
          # (2026-09-21/22). A free token is capped per account (measured
          # 2026-09-22: 10/min, 100/hour, 250/day), below what the cluster
          # rollup's ~660-page keyless search catch-up needs, so every other
          # rollup stays keyless.
          COURTLISTENER_API_TOKEN: ${{ inputs.command == 'run-rollup-courtlistener' && secrets.COURTLISTENER_API_TOKEN || '' }}
          # Passed via env (not interpolated into the command) to keep the run
          # step free of any templated string in an executable position.
          COMMAND: ${{ inputs.command }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          if [ "$SKIP_UPLOAD" = "true" ]; then
            UPLOAD_ARG="--skip-upload"
          else
            UPLOAD_ARG="--no-skip-upload"
          fi
          ARGS=("$UPLOAD_ARG")
          if [ "$COMMAND" = 'build-fec-observations' ]; then
            ARGS+=(--manifest "$RUNNER_TEMP/fec-retained-inputs/manifest.json")
          fi
          uv run --frozen "$COMMAND" "${ARGS[@]}"

      - name: Retain FEC committee source evidence
        if: always() && inputs.command == 'run-rollup-fec-committees'
        uses: actions/upload-artifact@v4
        with:
          name: fec-committee-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/fec-captures/
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain invocation and transferred-input audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollup-audit-${{ inputs.command }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/invocation.json
            output/fec-inputs/
            output/source-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain build-only outputs and failures
        if: failure() || (success() && inputs.skip_upload)
        uses: actions/upload-artifact@v4
        with:
          name: rollup-output-${{ inputs.command }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30
