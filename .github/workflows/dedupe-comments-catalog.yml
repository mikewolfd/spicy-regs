name: Audit comments catalog

# Weekly read-only duplicate audit of the initialized native catalog.
on:
  schedule:
    - cron: '0 9 * * 0'  # read-only audit, Sunday 09:00 UTC
  workflow_dispatch:
    inputs:
      probe_partition:
        description: 'Create and remove a scratch table to check partition support'
        required: false
        default: false
        type: boolean

concurrency:
  # Audit a stable catalog between ETL writes.
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit the native catalog
        env:
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: uv run python scripts/dedupe_comments_catalog.py

  probe-partition:
    # Manual-dispatch only: the one-command verification for the comments
    # catalog PARTITION BY restructure (see docs/fork-generation.md). Creates
    # a scratch table, reads it back through an agency predicate, drops it.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_partition }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Probe partitioned Iceberg table support
        env:
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: uv run python scripts/probe_iceberg_partition.py
