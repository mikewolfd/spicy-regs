name: Dedupe comments catalog

# Weekly read-only duplicate audit. Repairs and the scratch partition probe
# require separate, explicit manual inputs. Keep automatic repair off until
# interrupted replacement has passed an isolated real-catalog recovery check.
on:
  schedule:
    - cron: '0 9 * * 0'  # read-only audit, Sunday 09:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: 'Rebuild the table deduplicated (off = read-only audit)'
        required: false
        default: false
        type: boolean
      probe_partition:
        description: 'Create and remove a scratch table to check partition support'
        required: false
        default: false
        type: boolean

concurrency:
  # Shared with the ETL and the text backfill so no two writers ever touch the
  # catalog `comments` table at once — the dedupe does a whole-table swap, so an
  # overlapping ETL merge could race or lose data. cancel-in-progress:false makes
  # a writer queue behind the in-flight one instead of clobbering it.
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max

jobs:
  dedupe:
    runs-on: ubuntu-latest
    # A full-table rebuild of tens of millions of rows; give it headroom.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit / dedupe the catalog
        env:
          APPLY: ${{ inputs.apply }}
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          ARGS=""
          if [ "$APPLY" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          echo "Running: uv run python scripts/dedupe_comments_catalog.py $ARGS"
          uv run python scripts/dedupe_comments_catalog.py $ARGS

      # Public export is a separate explicit operation after verified recovery.

  probe-partition:
    # Manual-dispatch only: the one-command verification for the comments
    # catalog PARTITION BY restructure (see docs/fork-generation.md). Creates
    # a scratch table, reads it back through an agency predicate, drops it.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_partition }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Probe partitioned Iceberg table support
        env:
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: uv run python scripts/probe_iceberg_partition.py
