name: Rollup — committee_reports
on:
  schedule:
    # 03:40 UTC — two GovInfo collections, three requests per package, capped.
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      since:
        description: 'Packages modified since this date (YYYY-MM-DD); blank uses a 30-day window'
        required: false
        default: ''
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-committee-reports
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      committee_reports_since: ${{ inputs.since || '' }}
      timeout_minutes: 60
