name: Refresh congressional votes and terms
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
concurrency:
  group: congress-vote-terms
  cancel-in-progress: false
  queue: max
jobs:
  votes:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-roll-call-votes
      timeout_minutes: 60
  members:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-members
      timeout_minutes: 15
  terms:
    needs: [votes, members]
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-member-vote-terms
