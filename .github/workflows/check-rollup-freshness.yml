name: Check published table freshness

# Watches the base tables the daily ETL publishes (dockets, documents) alongside
# the external-source rollups. The base tables were added after a swallowed R2
# upload failure froze `dockets` at 2026-07-02 for ~8 weeks with the ETL still
# reporting success — comments had check-comments-freshness.yml, the rollups had
# this check, and the two largest base tables had nothing watching them at all.

on:
  schedule:
    - cron: '50 23 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # The join check reads column pages of the large court tables through a
    # throttled public endpoint, with retry backoff.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Restore row-count history
        uses: actions/cache/restore@v4
        with:
          path: .rollup-freshness-state.json
          key: rollup-freshness-${{ github.run_id }}
          restore-keys: rollup-freshness-

      - name: Check published tables
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          : "${R2_PUBLIC_URL:?Set R2_PUBLIC_URL to the public data URL for this repository}"
          uv run --frozen python scripts/check_rollup_freshness.py

      # Runs even when the freshness check failed: a dead purge credential and a
      # stale table are independent faults, and hiding one behind the other is
      # how the purge token went twelve days unnoticed in the first place.
      - name: Check Cloudflare purge credential
        if: always()
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run --frozen python scripts/check_purge_credential.py --base-url "$R2_PUBLIC_URL"

      # A new orphan or a narrowed parent is its own fault, independent of a
      # stale table. The check reads the publisher the output ledger names.
      - name: Check declared cross-table joins
        if: always()
        run: uv run --frozen python scripts/check_table_joins.py

      # A source a build refused while publishing the rest of its family (Table
      # III inside laws) has no age budget to breach: Table III lags months by
      # design. Its build journals the refusal, and this fails while the
      # family's current generation holds one.
      - name: Check journaled source refusals
        if: always()
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: uv run --frozen python scripts/check_source_refusals.py

      - name: Save row-count history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .rollup-freshness-state.json
          key: rollup-freshness-${{ github.run_id }}
