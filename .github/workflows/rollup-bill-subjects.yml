name: Rollup — bill_subjects
on:
  schedule:
    # 21:15 UTC — well after the bill family (02:00), the one writer of
    # congress_bills, so each enrichment run walks that day's bill table.
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      max_bills:
        description: 'Congress.gov bills (below the 108th Congress) to ask this run; blank uses 2000'
        required: false
        default: ''
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-bill-subjects
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      bill_subjects_max: ${{ inputs.max_bills || '' }}
      # The enrichment starts no read after 20 minutes (DEADLINE_SECONDS) and the old job took 22 to 27 of its
      # 30. The native job also restores congress_bills from receipts (5.5 minutes on 2026-10-16, run
      # 38968700113), restores its own prior, and writes, validates and publishes its receipts.
      timeout_minutes: 60
