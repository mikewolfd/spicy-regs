name: Rollup — nominations
on:
  schedule:
    # 06:20 UTC — nomination lists plus bounded, resumable committee/hearing details.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      congresses:
        description: 'Comma-separated Congress numbers or range (e.g. 93-119); scheduled runs use 118-119'
        required: false
        default: '93-119'
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-nominations
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      bill_family_congresses: ${{ inputs.congresses || '118-119' }}
      spicy_regs_congresses: ${{ inputs.congresses || '118-119' }}
      timeout_minutes: 30
