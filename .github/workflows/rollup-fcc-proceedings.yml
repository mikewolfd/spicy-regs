name: Rollup — fcc_proceedings
on:
  schedule:
    # 18:10 UTC — a whole walk of every FCC ECFS proceeding; no prior table is read or merged.
    - cron: '10 18 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fcc-proceedings
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
