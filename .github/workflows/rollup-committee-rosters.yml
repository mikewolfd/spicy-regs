name: Rollup — committee_rosters
on:
  schedule:
    # 01:40 UTC — the committee list of every Congress (four pages) with the
    # details of new or changed committees, capped, and the two chamber roster files.
    - cron: '40 1 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-committee-rosters
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      timeout_minutes: 30
