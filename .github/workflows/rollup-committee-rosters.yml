name: Rollup — committee_rosters
on:
  schedule:
    # 01:40 UTC — the committee list per scoped Congress with its details,
    # capped, and the two chamber roster files.
    - cron: '40 1 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      congresses:
        description: 'Comma-separated Congress numbers for the committee list (e.g. 118,119); blank uses the current Congress. The roster files always describe the current Congress.'
        required: false
        default: ''
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-committee-rosters
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      bill_family_congresses: ${{ inputs.congresses || '' }}
      timeout_minutes: 30
