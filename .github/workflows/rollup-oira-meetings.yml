name: Rollup — oira_meetings
on:
  schedule:
    # 20:45 UTC Sundays — reginfo.gov updates bulk meeting exports infrequently.
    - cron: '45 20 * * 0'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-oira-meetings
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      timeout_minutes: 15
