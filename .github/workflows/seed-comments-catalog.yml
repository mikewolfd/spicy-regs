name: Seed comments catalog (manual)

# On-demand loader for the R2 Data Catalog cutover. Copies the already-current
# published comments/ partition tree on R2 into the Iceberg `comments` table so
# the MCP servers can serve row-level reads from the catalog instead of the
# frozen monolithic comments.parquet (see PRs #89/#90). The fork has no partition
# tree: set `source_key` to comments.parquet to load each agency from it instead
# (docs/etl-catalog-seed.md).
#
# Manual dispatch only — it WRITES to the production catalog, so it never runs on
# a schedule. It defaults to a single-agency smoke test (OMB, the docket from the
# original bug); flip `full_load` on for the complete load once the smoke test
# looks right. The underlying script refuses a non-empty table unless `append`
# is set, so a re-run can't silently double-load.
#
# Requires the catalog to be provisioned and these repo secrets to be set:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET_NAME  (read source partitions)
#   R2_CATALOG_URI, R2_CATALOG_WAREHOUSE, R2_CATALOG_TOKEN               (write the catalog table)
on:
  workflow_dispatch:
    inputs:
      agency:
        description: 'Seed only this agency_code (smoke test). Ignored when full_load is true.'
        required: false
        default: 'OMB'
        type: string
      full_load:
        description: 'Load ALL agencies (overrides agency)'
        required: false
        default: false
        type: boolean
      append:
        description: 'Allow loading into a non-empty catalog table'
        required: false
        default: false
        type: boolean
      upload_index:
        description: 'Publish the rebuilt comments_index.parquet to R2 after loading'
        required: false
        default: false
        type: boolean
      source_key:
        description: 'Load every agency from this object (e.g. comments.parquet) instead of the comments/ partition tree'
        required: false
        default: ''
        type: string

concurrency:
  # Every catalog writer shares one group with the ETL (DELETE + INSERT is not
  # safe under concurrent writers); a seed queues behind an in-flight run.
  group: comments-catalog-write
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # The full (all-agency) load copies ~37M rows from R2 into the catalog, so
    # give it ample headroom. The load is idempotent per agency, so even if it
    # is interrupted a re-run safely resumes.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Seed catalog from R2 partitions
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
          # Inputs via env, never interpolated into the shell body, and validated.
          FULL_LOAD: ${{ inputs.full_load }}
          AGENCY: ${{ inputs.agency }}
          APPEND: ${{ inputs.append }}
          UPLOAD_INDEX: ${{ inputs.upload_index }}
          SOURCE_KEY: ${{ inputs.source_key }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$FULL_LOAD" = "true" ]; then
            echo "Full load: every agency"
          elif [ -n "$AGENCY" ]; then
            if ! printf '%s' "$AGENCY" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              echo "agency must match [A-Za-z0-9_-], got: $AGENCY" >&2; exit 1
            fi
            ARGS+=(--agency "$AGENCY")
          fi
          if [ -n "$SOURCE_KEY" ]; then
            if ! printf '%s' "$SOURCE_KEY" | grep -Eq '^[A-Za-z0-9_./-]+\.parquet$'; then
              echo "source_key must be a .parquet object key, got: $SOURCE_KEY" >&2; exit 1
            fi
            ARGS+=(--source-key "$SOURCE_KEY")
          fi
          if [ "$APPEND" = "true" ]; then ARGS+=(--append); fi
          if [ "$UPLOAD_INDEX" = "true" ]; then ARGS+=(--upload-index); fi
          echo "Running: uv run python scripts/seed_comments_catalog.py ${ARGS[*]-}"
          uv run python scripts/seed_comments_catalog.py ${ARGS[@]+"${ARGS[@]}"}

      - name: Verify freshness (index vs rows)
        if: ${{ inputs.full_load == true }}
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          : "${R2_PUBLIC_URL:?Set R2_PUBLIC_URL to the public data URL for this repository}"
          uv run --frozen python scripts/check_comments_freshness.py
