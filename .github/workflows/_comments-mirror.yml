name: Comments mirror (reusable)
# The caller must hold comments-catalog-write across ingestion and refresh.
on:
  workflow_call:
    inputs:
      skip_upload:
        type: boolean
        default: false
      comments_only:
        type: boolean
        default: false
      comments_runner:
        type: string
        default: ubuntu-latest
      # The 2026-10-10 v1 promotion's inputs. That route published ETL receipts, which
      # comments no longer do (ss-juz8); the first step refuses any of them. They stay
      # declared only because _regulations-refresh.yml, shared with the ETL, still
      # passes them: remove them here once that file stops.
      promote_v1:
        type: boolean
        default: false
      comments_original_pair:
        type: string
        default: ''
      comments_captured_input:
        type: string
        default: ''
      comments_captured_input_sha256:
        type: string
        default: ''
      comments_local_python:
        type: string
        default: ''
      comments_local_python_sha256:
        type: string
        default: ''

env:
  # Called only by workflows that hold comments-catalog-write.
  # Read by spicy_regs.sources.iceberg: this run holds comments-catalog-write,
  # so its catalog writes do not log the unlocked-write warning.
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

jobs:
  publish:
    runs-on: ${{ inputs.comments_runner }}
    # Unchanged snapshots verify object versions only. A changed snapshot copies
    # the comments table (no receipts since ss-juz8), stages by agency, sorts,
    # assembles, checks every prior ID, seals and uploads. Measured at full size
    # on an M4 Pro (3GB / 1 thread): copy from the live catalog 15.5 (2026-11-10;
    # 2.7 from a local file) + stage 2.8 + sort 3.2 + assemble 2.3 + index 0.1 +
    # prior-ID check 20 = 44 min; estimated: completeness count 0-1.5 (the
    # snapshot summary, or about 78 s of receipt count), partition check 1-3,
    # generation seal and admission 5-10 (it decoded receipts too, ~50).
    # 50-58 local x 1.2-1.6 hosted = 60-93, plus upload and full readback of
    # about 19 GB each way (6.4 monolith + 6.4 agency files + 6.4 generation;
    # the 4 GB receipt member is gone) at 40-100 MB/s = 7-16, plus setup:
    # 70-115 min. 180 is 1.6x that and 2.5x the last hosted mirror without
    # receipts (72.5 min, 2026-10-03).
    # The receipt route needed 360 (138 of its 170 measured minutes were receipts).
    timeout-minutes: 180

    steps:
      - name: Refuse the retired v1 promotion
        if: ${{ inputs.promote_v1 || inputs.comments_original_pair != '' || inputs.comments_captured_input != '' || inputs.comments_captured_input_sha256 != '' || inputs.comments_local_python != '' || inputs.comments_local_python_sha256 != '' }}
        run: |
          echo 'The v1 promotion (promote_v1 and its retained-pair inputs) published ETL receipts, which comments no longer do (ss-juz8).' >&2
          echo 'Comments publish receipts-free from the catalog: run this workflow without those inputs.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --extra operational-runner

      - name: Record actual export placement
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p output
          uv run --no-sync python - <<'PY'
          import json, os, platform, shutil
          from pathlib import Path
          directory = Path('output').resolve()
          temporary = Path(os.environ['TMPDIR']).resolve()
          usage, temp_usage = shutil.disk_usage(directory), shutil.disk_usage(temporary)
          receipt = {'directory': str(directory), 'platform': platform.platform(),
                     'runnerName': os.environ['RUNNER_NAME'],
                     'workflowRef': os.environ['GITHUB_WORKFLOW_REF'],
                     'diskTotalBytes': usage.total, 'diskFreeBytes': usage.free,
                     'temporaryDirectory': str(temporary),
                     'temporaryDiskTotalBytes': temp_usage.total,
                     'temporaryDiskFreeBytes': temp_usage.free}
          Path('output/comments-placement.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY

      - name: Publish comments mirror from the catalog
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # No R2_ALLOW_SHRINK here: the mirror lifts r2's byte-size shrink guard
          # for the fixed agency files alone (re-sorted they can shrink while
          # holding more rows, ACF 19.7 MB -> 6.0 MB; a moved agency's is emptied).
          # The monolith and the generation's members keep the guard (ss-juz8).
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          mkdir -p output
          measure() {
            if [ "$RUNNER_OS" = "macOS" ]; then
              /usr/bin/time -l "$@" 2> >(tee output/comments-resources.txt >&2)
            else
              /usr/bin/time -v -o output/comments-resources.txt "$@"
            fi
          }
          ARGS=""
          if [ "${{ inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          echo "Running admitted comments publication at $GITHUB_SHA"
          measure \
            uv run --no-sync python scripts/publish_comments_mirror_guarded.py \
              --expected-source-sha "$GITHUB_SHA" $ARGS

      - name: Retain publication receipts and resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-publication-${{ github.run_id }}
          include-hidden-files: true
          path: |
            output/comments-build.json
            output/comments-publication.json
            output/comments-resources.txt
            output/comments-placement.json
            output/comments-admission.json
            output/comments-admit-*.json
            output/comments-admit-*.log
            output/comments-publish-*.json
            output/comments-publish-*.log
          retention-days: 30

      - name: Capture published base versions for dependent jobs
        if: ${{ !inputs.skip_upload && !inputs.comments_only }}
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          uv run --no-sync python scripts/check_refresh_inputs.py capture
      - name: Retain refresh input versions
        if: ${{ !inputs.skip_upload && !inputs.comments_only }}
        uses: actions/upload-artifact@v4
        with:
          name: regulations-refresh-inputs-${{ github.run_id }}
          path: output/refresh-inputs.json
          retention-days: 30
