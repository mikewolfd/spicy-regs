name: Comments mirror (reusable)
# The caller must hold comments-catalog-write across ingestion and refresh.
on:
  workflow_call:
    inputs:
      skip_upload:
        type: boolean
        default: false
      promote_v1:
        type: boolean
        default: false

env:
  # Called only by workflows that hold comments-catalog-write.
  # Read by spicy_regs.sources.iceberg: this run holds comments-catalog-write,
  # so its catalog writes do not log the unlocked-write warning.
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Unchanged snapshots verify object versions only. Changed snapshots scan
    # once into agency staging, sort each agency, then stream the monolith.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Publish comments mirror from the catalog
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Bypass r2's byte-size shrink guard: re-exporting from the catalog
          # re-sorts + re-compresses the data, so a partition can be several times
          # smaller on disk while holding *more* rows (verified: ACF 19.7 MB -> 6.0 MB
          # with more rows + fresher dates). The script checks retained IDs,
          # uniqueness, index and partition coverage, plus a row-count floor.
          R2_ALLOW_SHRINK: '1'
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          if [ "${{ inputs.promote_v1 }}" = "true" ]; then
            uv run --frozen python scripts/check_refresh_inputs.py capture \
              --reuse-published-base --base-only --receipt output/comments-base-inputs.json
            git fetch --no-tags --depth=1 origin e9dfd216dc999845ea94e6171afb41e0c9380a10
            git worktree add --detach ../comments-export-v1 e9dfd216dc999845ea94e6171afb41e0c9380a10
            mkdir -p output
            PROMOTED_ARGS=""
            if [ "${{ inputs.skip_upload }}" != "true" ]; then
              PROMOTED_ARGS="--publish"
            fi
            /usr/bin/time -v -o output/comments-resources.txt \
              uv run --frozen python scripts/prepare_comments_selected_export.py \
              --v1-source ../comments-export-v1 --original-pair output/comments-original-v1 \
              --output output/comments-selected --base-receipt output/comments-base-inputs.json $PROMOTED_ARGS
            exit 0
          fi
          ARGS=""
          if [ "${{ inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          echo "Running: uv run python scripts/publish_comments_mirror.py $ARGS"
          mkdir -p output
          /usr/bin/time -v -o output/comments-resources.txt \
            uv run --frozen python scripts/publish_comments_mirror.py $ARGS

      - name: Retain publication receipts and resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-publication-${{ github.run_id }}
          include-hidden-files: true
          path: |
            output/comments-build.json
            output/comments-publication.json
            output/comments-resources.txt
            output/comments-base-inputs.json
            output/comments-selected/comments-build.json
            output/comments-selected/comments-publication.json
            output/comments-selected/comments-exact-encoding.json
            output/comments-selected/comments-prepared-export*.json
            output/comments-selected/.catalog-pairs/comments/generation.json
          retention-days: 30

      - name: Retain completed prepared candidate for publication recovery
        if: ${{ always() && inputs.promote_v1 && hashFiles('output/comments-selected/comments-prepared-export.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-prepared-${{ github.run_id }}
          include-hidden-files: true
          path: output/comments-selected
          retention-days: 30

      - name: Retain exact original selected v1 export
        if: ${{ always() && inputs.promote_v1 }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-original-v1-${{ github.run_id }}
          path: output/comments-original-v1
          retention-days: 30

      - name: Capture published base versions for dependent jobs
        if: ${{ !inputs.skip_upload }}
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          if [ "${{ inputs.promote_v1 }}" = "true" ]; then
            uv run --frozen python scripts/check_refresh_inputs.py capture --reuse-published-base \
              --base-receipt output/comments-base-inputs.json
          else
            uv run --frozen python scripts/check_refresh_inputs.py capture
          fi
      - name: Retain refresh input versions
        if: ${{ !inputs.skip_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: regulations-refresh-inputs-${{ github.run_id }}
          path: output/refresh-inputs.json
          retention-days: 30
