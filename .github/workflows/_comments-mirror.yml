name: Comments mirror (reusable)
# The caller must hold comments-catalog-write across ingestion and refresh.
on:
  workflow_call:
    inputs:
      skip_upload:
        type: boolean
        default: false
      promote_v1:
        type: boolean
        default: false
      comments_only:
        type: boolean
        default: false
      comments_runner:
        type: string
        default: ubuntu-latest
      comments_original_pair:
        type: string
        default: ''
      comments_captured_input:
        type: string
        default: ''
      comments_captured_input_sha256:
        type: string
        default: ''

env:
  # Called only by workflows that hold comments-catalog-write.
  # Read by spicy_regs.sources.iceberg: this run holds comments-catalog-write,
  # so its catalog writes do not log the unlocked-write warning.
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

jobs:
  publish:
    runs-on: ${{ inputs.comments_runner }}
    # Unchanged snapshots verify object versions only. Changed snapshots scan
    # once into agency staging, sort each agency, then stream the monolith.
    timeout-minutes: ${{ inputs.promote_v1 && 360 || 180 }}

    steps:
      - name: Check retained original pair before checkout
        id: retained_original
        if: ${{ inputs.promote_v1 || inputs.comments_captured_input != '' || inputs.comments_captured_input_sha256 != '' }}
        shell: bash
        env:
          COMMENTS_ORIGINAL_PAIR: ${{ inputs.comments_original_pair }}
          COMMENTS_CAPTURED_INPUT: ${{ inputs.comments_captured_input }}
          COMMENTS_CAPTURED_INPUT_SHA256: ${{ inputs.comments_captured_input_sha256 }}
          PROMOTE_V1: ${{ inputs.promote_v1 }}
        run: |
          literal_path() {
            [[ ! "$1" =~ [[:cntrl:]] ]] || { echo 'Retained pair path contains control characters' >&2; exit 1; }
            case "$1" in
              *'*'*|*'?'*|*'['*|*']'*|*'{'*|*'}'*|*'('*|*')'*|*'\'*) echo 'Retained pair path contains glob or escape syntax' >&2; exit 1 ;;
            esac
          }
          if [[ -n "$COMMENTS_CAPTURED_INPUT" || -n "$COMMENTS_CAPTURED_INPUT_SHA256" ]]; then
            [[ "$PROMOTE_V1" = true && -n "$COMMENTS_ORIGINAL_PAIR" && -n "$COMMENTS_CAPTURED_INPUT" ]] || {
              echo 'Captured input requires promotion and an explicit retained pair and descriptor' >&2; exit 1;
            }
            [[ "$COMMENTS_CAPTURED_INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo 'Captured input requires its exact SHA-256 digest' >&2; exit 1;
            }
          fi
          if [[ -z "$COMMENTS_ORIGINAL_PAIR" ]]; then
            exit 0
          fi
          literal_path "$COMMENTS_ORIGINAL_PAIR"
          [[ "$COMMENTS_ORIGINAL_PAIR" = /* ]] || { echo 'Retained pair must use an absolute path' >&2; exit 1; }
          original="$(cd -- "$COMMENTS_ORIGINAL_PAIR" && pwd -P)"
          literal_path "$original"
          workspace="$(cd -- "$GITHUB_WORKSPACE" && pwd -P)"
          case "$original/" in
            "$workspace/"*) echo 'Retained pair must be outside the checkout workspace' >&2; exit 1 ;;
          esac
          if [[ -n "$COMMENTS_CAPTURED_INPUT" ]]; then
            literal_path "$COMMENTS_CAPTURED_INPUT"
            [[ "$COMMENTS_CAPTURED_INPUT" = /* && -f "$COMMENTS_CAPTURED_INPUT" && ! -L "$COMMENTS_CAPTURED_INPUT" ]] || {
              echo 'Captured descriptor must be an absolute regular file' >&2; exit 1;
            }
            captured_parent="$(cd -- "$(dirname "$COMMENTS_CAPTURED_INPUT")" && pwd -P)"
            captured="$captured_parent/${COMMENTS_CAPTURED_INPUT##*/}"
            [[ "$captured" = "$COMMENTS_CAPTURED_INPUT" ]] || {
              echo 'Captured descriptor must use its canonical parent path' >&2; exit 1;
            }
            case "$captured/" in
              "$workspace/"*) echo 'Captured descriptor must be outside checkout' >&2; exit 1 ;;
            esac
            test -f "$original/comments.parquet"
            test -f "$original/etl_receipts.parquet"
            [[ ! -e "$original/export-complete.json" && ! -L "$original/export-complete.json" ]] || {
              echo 'A sealed pair must use the sealed input path' >&2; exit 1;
            }
            printf 'captured_path=%s\n' "$captured" >> "$GITHUB_OUTPUT"
          else
            test -f "$original/generation.json"
            test -f "$original/export-complete.json"
          fi
          printf 'path=%s\n' "$original" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Record actual export placement
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p output
          uv run --frozen python - <<'PY'
          import json, os, platform, shutil
          from pathlib import Path
          directory = Path('output').resolve()
          temporary = Path(os.environ['TMPDIR']).resolve()
          usage, temp_usage = shutil.disk_usage(directory), shutil.disk_usage(temporary)
          receipt = {'directory': str(directory), 'platform': platform.platform(),
                     'runnerName': os.environ['RUNNER_NAME'],
                     'workflowRef': os.environ['GITHUB_WORKFLOW_REF'],
                     'diskTotalBytes': usage.total, 'diskFreeBytes': usage.free,
                     'temporaryDirectory': str(temporary),
                     'temporaryDiskTotalBytes': temp_usage.total,
                     'temporaryDiskFreeBytes': temp_usage.free}
          Path('output/comments-placement.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY

      - name: Publish comments mirror from the catalog
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          COMMENTS_ORIGINAL_PAIR: ${{ steps.retained_original.outputs.path || 'output/comments-original-v1' }}
          COMMENTS_CAPTURED_INPUT: ${{ steps.retained_original.outputs.captured_path }}
          COMMENTS_CAPTURED_INPUT_SHA256: ${{ inputs.comments_captured_input_sha256 }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Bypass r2's byte-size shrink guard: re-exporting from the catalog
          # re-sorts + re-compresses the data, so a partition can be several times
          # smaller on disk while holding *more* rows (verified: ACF 19.7 MB -> 6.0 MB
          # with more rows + fresher dates). The script checks retained IDs,
          # uniqueness, index and partition coverage, plus a row-count floor.
          R2_ALLOW_SHRINK: '1'
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          mkdir -p output
          measure() {
            if [ "$RUNNER_OS" = "macOS" ]; then
              /usr/bin/time -l "$@" 2> >(tee output/comments-resources.txt >&2)
            else
              /usr/bin/time -v -o output/comments-resources.txt "$@"
            fi
          }
          if [ "${{ inputs.promote_v1 }}" = "true" ]; then
            uv run --frozen python scripts/check_refresh_inputs.py capture \
              --reuse-published-base --base-only --receipt output/comments-base-inputs.json
            git fetch --no-tags --depth=1 origin e9dfd216dc999845ea94e6171afb41e0c9380a10
            V1_PARENT="$(mktemp -d "$RUNNER_TEMP/comments-export-v1.XXXXXX")"
            V1_SOURCE="$V1_PARENT/source"
            git worktree add --detach "$V1_SOURCE" e9dfd216dc999845ea94e6171afb41e0c9380a10
            mkdir -p output
            PROMOTED_ARGS=()
            if [ "${{ inputs.skip_upload }}" != "true" ]; then
              PROMOTED_ARGS+=(--publish)
            fi
            if [[ -n "$COMMENTS_CAPTURED_INPUT" ]]; then
              PROMOTED_ARGS+=(--captured-input "$COMMENTS_CAPTURED_INPUT"
                              --captured-input-sha256 "$COMMENTS_CAPTURED_INPUT_SHA256")
            fi
            measure \
              uv run --frozen python scripts/prepare_comments_selected_export.py \
              --v1-source "$V1_SOURCE" --original-pair "$COMMENTS_ORIGINAL_PAIR" \
              --output output/comments-selected --base-receipt output/comments-base-inputs.json "${PROMOTED_ARGS[@]}"
            exit 0
          fi
          ARGS=""
          if [ "${{ inputs.skip_upload }}" = "true" ]; then
            ARGS="$ARGS --skip-upload"
          fi
          echo "Running: uv run python scripts/publish_comments_mirror.py $ARGS"
          mkdir -p output
          measure \
            uv run --frozen python scripts/publish_comments_mirror.py $ARGS

      - name: Retain publication receipts and resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-publication-${{ github.run_id }}
          include-hidden-files: true
          path: |
            output/comments-build.json
            output/comments-publication.json
            output/comments-resources.txt
            output/comments-placement.json
            output/comments-base-inputs.json
            output/comments-selected/comments-build.json
            output/comments-selected/comments-publication.json
            output/comments-selected/comments-exact-encoding.json
            output/comments-selected/comments-prepared-export*.json
            output/comments-selected/.catalog-pairs/comments/generation.json
          retention-days: 30

      - name: Retain completed prepared candidate for publication recovery
        if: ${{ always() && inputs.promote_v1 && hashFiles('output/comments-selected/comments-prepared-export.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-prepared-${{ github.run_id }}
          include-hidden-files: true
          path: output/comments-selected
          retention-days: 30

      - name: Retain exact original selected v1 export
        if: ${{ always() && inputs.promote_v1 && inputs.comments_original_pair == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-original-v1-${{ github.run_id }}
          path: output/comments-original-v1
          retention-days: 30

      - name: Retain declared members and descriptor of the retained original pair
        if: ${{ always() && inputs.promote_v1 && steps.retained_original.outcome == 'success' && steps.retained_original.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: comments-original-v1-${{ github.run_id }}
          path: |
            ${{ steps.retained_original.outputs.path }}/comments.parquet
            ${{ steps.retained_original.outputs.path }}/etl_receipts.parquet
            ${{ steps.retained_original.outputs.path }}/generation.json
            ${{ steps.retained_original.outputs.path }}/export-complete.json
            ${{ steps.retained_original.outputs.captured_path }}
          retention-days: 30

      - name: Capture published base versions for dependent jobs
        if: ${{ !inputs.skip_upload && !inputs.comments_only }}
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          if [ "${{ inputs.promote_v1 }}" = "true" ]; then
            uv run --frozen python scripts/check_refresh_inputs.py capture --reuse-published-base \
              --base-receipt output/comments-base-inputs.json
          else
            uv run --frozen python scripts/check_refresh_inputs.py capture
          fi
      - name: Retain refresh input versions
        if: ${{ !inputs.skip_upload && !inputs.comments_only }}
        uses: actions/upload-artifact@v4
        with:
          name: regulations-refresh-inputs-${{ github.run_id }}
          path: output/refresh-inputs.json
          retention-days: 30
