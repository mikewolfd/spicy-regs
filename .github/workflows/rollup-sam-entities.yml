name: Rollup — sam_entities
on:
  schedule:
    # 19:00 UTC — ingest the SAM.gov entity registry ahead of the evening rollup window.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      sam_ingest_mode:
        description: 'SAM acquisition route'
        required: false
        default: extract
        type: choice
        options:
          - extract
          - partition
      sam_since_year:
        description: 'First registration year (set both years; blank selects rotating year)'
        required: false
        default: ''
        type: string
      sam_until_year:
        description: 'Last registration year, inclusive'
        required: false
        default: ''
        type: string
      sam_max_records:
        description: 'Explicit record selection limit (blank or 0 completes the selected years)'
        required: false
        default: ''
        type: string
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-sam-entities
      sam_ingest_mode: ${{ inputs.sam_ingest_mode || 'extract' }}
      sam_since_year: ${{ inputs.sam_since_year || '' }}
      sam_until_year: ${{ inputs.sam_until_year || '' }}
      sam_max_records: ${{ inputs.sam_max_records || '' }}
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      # The 2026 extract takes 21-46 minutes and some jobs stall; the reader re-triggers a
      # stalled one and waits up to 150 minutes in all (build_sam_entities.EXTRACT_MAX_WAIT),
      # refusing before the job is cancelled.
      timeout_minutes: 165
