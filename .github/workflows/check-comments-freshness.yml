name: Check comments freshness

# Guards against the comments read surface drifting behind the comments_index.
# The counts (comments_index / feed_summary / agency_stats) and the row-level
# `comments` table are produced by different steps, so they can diverge — the
# index advertising comments for a month the row data doesn't actually contain.
# That exact gap (OMB-2026-0034: ~39k June-2026 comments in the index, zero rows
# in `comments`) is what drove the Iceberg cutover; this check makes a recurrence
# visible instead of silent.
#
# Checks raw catalog uniqueness, public monolith and agency partitions, and
# exact agency/docket/month agreement with the index. The shared writer queue
# prevents a scheduled check from reading a catalog during replacement.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      agency:
        description: 'Restrict the check to a single agency_code'
        required: false
        default: ''
        type: string

concurrency:
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check comments freshness
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Verify both the anonymous mirror and physical catalog rows.
          AGENCY: ${{ inputs.agency }}
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          : "${R2_PUBLIC_URL:?Set R2_PUBLIC_URL to the public data URL for this repository}"
          ARGS=(--surface both)
          if [ -n "$AGENCY" ]; then
            ARGS+=(--agency "$AGENCY")
          fi
          uv run --frozen python scripts/check_comments_freshness.py "${ARGS[@]}"
