name: Refresh regulatory consumers (reusable)
# Caller holds comments-catalog-write until publication and checks finish.
on:
  workflow_call:
    inputs:
      skip_upload:
        type: boolean
        default: false
      promote_v1:
        type: boolean
        default: false
      comments_only:
        type: boolean
        default: false
      comments_runner:
        type: string
        default: ubuntu-latest
      comments_original_pair:
        type: string
        default: ''
      comments_captured_input:
        type: string
        default: ''
      comments_captured_input_sha256:
        type: string
        default: ''
      comments_local_python:
        type: string
        default: ''
      comments_local_python_sha256:
        type: string
        default: ''
env:
  # Called only by workflows that hold comments-catalog-write.
  # Read by spicy_regs.sources.iceberg: this run holds comments-catalog-write,
  # so its catalog writes do not log the unlocked-write warning.
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

jobs:
  # Documents and comments can name a docket the Mirrulations mirror never
  # captured (165 on 2026-09-26). Ask the Regulations.gov API for each and merge
  # what it serves into the dockets working copy before the families publish
  # (pipelines/docket_gaps.py). A failure here still lets the families publish
  # the served dockets; the refresh run shows the failure.
  docket-gaps:
    if: ${{ !inputs.skip_upload && !inputs.promote_v1 && !inputs.comments_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: Fill dockets the mirror lacks
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: uv run --frozen fill-docket-gaps --no-skip-upload
  # Publish the ETL's finished dockets/documents as managed families before the
  # mirror captures base versions, so every dependent reads this sweep's snapshot.
  base-families:
    needs: docket-gaps
    if: ${{ !cancelled() && !inputs.promote_v1 && !inputs.comments_only }}
    strategy:
      fail-fast: false
      matrix:
        command:
          - run-rollup-dockets
          - run-rollup-documents
          - run-rollup-docket-attributes
          - run-rollup-document-attributes
          - run-rollup-comment-attributes
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: ${{ matrix.command }}
      skip_upload: ${{ inputs.skip_upload }}
      timeout_minutes: 30
  mirror:
    needs: base-families
    if: ${{ !cancelled() && (needs.base-families.result == 'success' || inputs.promote_v1 || inputs.comments_only) }}
    uses: ./.github/workflows/_comments-mirror.yml
    secrets: inherit
    with:
      skip_upload: ${{ inputs.skip_upload }}
      promote_v1: ${{ inputs.promote_v1 }}
      comments_only: ${{ inputs.comments_only }}
      comments_runner: ${{ inputs.comments_runner }}
      comments_original_pair: ${{ inputs.comments_original_pair }}
      comments_captured_input: ${{ inputs.comments_captured_input }}
      comments_captured_input_sha256: ${{ inputs.comments_captured_input_sha256 }}
      comments_local_python: ${{ inputs.comments_local_python }}
      comments_local_python_sha256: ${{ inputs.comments_local_python_sha256 }}
  derived:
    needs: mirror
    if: ${{ !inputs.skip_upload && !inputs.comments_only }}
    strategy:
      fail-fast: false
      matrix:
        command:
          - run-rollup-feed-summary
          - run-rollup-agency-stats
          - run-rollup-agency-monthly-volume
          - run-rollup-discovery-signals
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: ${{ matrix.command }}
      timeout_minutes: 60
  # docket_search.json.gz feeds the Spicy Regs web app's in-browser MiniSearch,
  # which reads the bucket it is deployed against. Only a repository whose app
  # reads this bucket sets PUBLISH_DOCKET_SEARCH=true; the fork's app deployment
  # reads upstream's copy, so the fork does not build one nobody reads.
  docket-search:
    needs: mirror
    if: ${{ !inputs.skip_upload && !inputs.comments_only && vars.PUBLISH_DOCKET_SEARCH == 'true' }}
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-docket-search
      timeout_minutes: 60
  org-links:
    needs: mirror
    if: ${{ !inputs.skip_upload && !inputs.comments_only }}
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-org-committee-links
      timeout_minutes: 60
  rulemaking:
    needs: derived
    if: ${{ !inputs.skip_upload && !inputs.comments_only }}
    uses: ./.github/workflows/materialize-rulemaking.yml
    secrets: inherit
  verify:
    needs: [mirror, derived, docket-search, org-links, rulemaking]
    if: ${{ always() && !inputs.skip_upload && needs.mirror.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.comments_only }}
        with:
          name: regulations-refresh-inputs-${{ github.run_id }}
          path: output
      - name: Confirm dependent jobs used unchanged base versions
        if: ${{ !inputs.comments_only }}
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          uv run --frozen python scripts/check_refresh_inputs.py verify
      - name: Read back public comments and verify raw catalog integrity
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          : "${R2_PUBLIC_URL:?Set the fork public data URL}"
          if [ "${{ inputs.promote_v1 }}" = "true" ]; then
            uv run --frozen python scripts/check_comments_freshness.py --surface public
            git fetch --no-tags --depth=1 origin e9dfd216dc999845ea94e6171afb41e0c9380a10
            git worktree add --detach ../comments-check-v1 e9dfd216dc999845ea94e6171afb41e0c9380a10
            COMMENTS_V1_CHECKOUT="$(cd ../comments-check-v1 && pwd)"
            PYTHONPATH="$COMMENTS_V1_CHECKOUT/src" uv run --frozen python \
              "$COMMENTS_V1_CHECKOUT/scripts/check_comments_freshness.py" --surface catalog
          else
            uv run --frozen python scripts/check_comments_freshness.py --surface both
          fi
