# Spicy Regs data dictionary — curated descriptions.
#
# This file is the human layer of the data dictionary. Column *names and types*
# are the source of truth in code (RECORD_TYPES in
# src/spicy_regs/schemas/regulations.py for the core tables, and DERIVED_SCHEMAS
# in src/spicy_regs/data_dictionary.py for the rollups). This file supplies the
# prose. The two are reconciled by `spicy-regs-dict check`, which fails if a
# column has no description here or a description references a column that no
# longer exists — so a schema change forces a docs update in the same PR.
#
# To regenerate the browsable site after editing:  uv run spicy-regs-dict generate
#
# `measured_on` means: **the day a run checked this coverage statement against
# the publisher** — not the day someone wrote the sentence, and not the day the
# data was last published. Before 2026-09-19 it held the statement date on every
# entry, because no rollup had ever been run against a real publisher and there
# was nothing else it could hold; gap row D1 of the spicy-docs register
# (receipt `~/Work/corpora/supply-2026-09-02/receipts/d1-measured-run-2026-09-19/`)
# is the run that gave it the stronger meaning for the tables it exercised.
#
# Five entries still carry the weaker meaning, and say so in their own prose
# rather than only here: `bill_family_backfills` and
# `bill_family_backfill_walks` (that run scoped the 119th, which BILLSTATUS bulk
# serves, so the backfill leg was never entered) and the three model-backed
# tables `section_classifications`, `bill_summaries` and `diff_summaries` (a
# keyless run cannot fill them). For those five the date is the statement date,
# as it was before.
#
# A run that only *exercises* a path is not the same as a run that measures
# what the statement claims. Several statements below describe incremental
# behavior — skipping a bill the publisher has not touched, a watermark window,
# an unchanged-zip skip — and D1 was a cold start, so those clauses are marked
# as design rather than measurement where they appear.

tables:
  dockets:
    label: "Rulemaking dockets"
    coverage: >-
      True range. Dockets as mirrored from regulations.gov, with
      modification dates from 2006-09-26 to 2026-09-06. The date records
      when a docket last changed, not when it opened, so it is a freshness
      axis rather than a coverage one.
    measured_on: "2026-09-06"
    summary: >-
      One row per regulations.gov docket. A docket is the top-level folder a
      federal agency opens for a rulemaking or other action; it groups the
      documents the agency posts and the public comments it receives.
    columns:
      docket_id: "Unique docket identifier (e.g. `EPA-HQ-OAR-2021-0317`). Primary key / dedup key."
      agency_code: "Posting agency's short code (e.g. `EPA`, `FDA`, `ACF`)."
      title: "Human-readable docket title."
      docket_type: "Docket category, typically `Rulemaking` or `Nonrulemaking`."
      modify_date: "Timestamp the docket was last modified on regulations.gov (ISO 8601 string)."
      abstract: "Agency-written summary of the docket (regulations.gov `dkAbstract`). Often null."
      rin: "Regulation Identifier Number tying the docket to the Unified Agenda. Often null."

  documents:
    label: "Docket documents"
    coverage: >-
      True range, floored. Posted dates are stated from 1990-01-01 to the
      present rather than from the raw minimum, which is the year 0000. See
      the data-quality note: the raw ends are a publisher defect, not
      coverage.
    measured_on: "2026-09-06"
    data_quality: >-
      52,699 rows (2.6%) carry a `posted_date` before 1990, including eight
      in the year 0000 and one dated in the future. These are publisher
      values carried through faithfully, not parse errors on our side.
      Filter on the date when recency matters.
    summary: >-
      One row per document posted to a docket — proposed rules, final rules,
      notices, supporting analyses, and public-submission stubs. Joins to
      `dockets` on `docket_id`. Two payload fields are not carried: `comment`
      (the inline submission body) and `restrictReasonType` (why a document is
      withheld). Read those from the acquisition source, the raw Mirrulations
      payload or spicy-docs' source-native release, not from this table.
    columns:
      document_id: "Unique document identifier. Primary key / dedup key."
      docket_id: "Parent docket this document belongs to. Foreign key to `dockets.docket_id`."
      agency_code: "Posting agency's short code."
      title: "Document title."
      document_type: "Document category (e.g. `Rule`, `Proposed Rule`, `Notice`, `Supporting & Related Material`)."
      posted_date: "Date the document was posted publicly (ISO 8601 string)."
      modify_date: "Timestamp the document was last modified (ISO 8601 string)."
      comment_start_date: "Start of the public comment period this document opens, if any. Often null."
      comment_end_date: "End (deadline) of the public comment period, if any. Often null."
      file_url: "URL of the document's primary downloadable rendition. Retained for backward compatibility; see `attachments_json` for the full list. Often null."
      attachments_json: "JSON array of every downloadable rendition: `[{url, format, size}]`. Null when the document has no files."
      fr_doc_num: "Federal Register document number, when the document was published in the FR. Often null."
      withdrawn: 'Whether the document was withdrawn, as the string `"true"`/`"false"`. Often null.'
      reason_withdrawn: "Agency-supplied reason for withdrawal, when withdrawn. Often null."
      additional_rins: "JSON array of additional Regulation Identifier Numbers beyond the docket's primary RIN. Often null."
      text_content: "Plain text extracted from the document's PDF attachment(s) by the PDF text-extraction step. Null until that step has run; see `text_extraction_status`."
      text_extraction_status: "Aggregate PDF outcome: `ok` means at least one PDF supplied text, even if another failed; otherwise `error`, `encrypted`, or `empty` (no extractable text) in that order. Null before an attempt. See `pdf_extraction_results_json` for each file."
      pdf_extraction_results_json: "Ordered JSON array from the latest PDF attempt: `{url, source_sha256, status, page_count, error}` per distinct selected URL. SHA-256 identifies observed bytes; no-bytes fetch failures have null digest/page count and a generic error. Null when no PDF attempt is recorded. Describes that attempt, not the provenance of older text retained after a failed overwrite."

  comments:
    label: "Public comments"
    coverage: >-
      True range, floored. Posted dates are stated from 1990-01-01 to
      2026-09-06 rather than from the raw minimum of year 0000, on the same
      publisher defect as `documents`. See the data-quality note.
    measured_on: "2026-09-06"
    data_quality: >-
      33,373 rows carry a `posted_date` before 1990, the same publisher
      defect as `documents`. Filter on the date when recency matters.
    summary: >-
      One row per public comment submitted to a docket — the largest table
      (tens of millions of rows). On R2 it is also published as Hive-partitioned
      files under `comments/agency/agency_code=.../part-0.parquet`, one file per
      agency, rebuilt daily — this is what `spicy-regs-ui` reads for scoped
      queries. (An older `comments/agency_code=.../docket_id=.../year=.../month=...`
      tree was abandoned when comments moved onto the Iceberg catalog and
      carried a reduced set of columns; prefer the per-agency tree.) Joins to
      `dockets` on `docket_id`.
    columns:
      comment_id: "Unique comment identifier. Primary key / dedup key."
      docket_id: "Docket the comment was submitted to. Foreign key to `dockets.docket_id`."
      agency_code: "Receiving agency's short code."
      first_name: "Commenter's first name, when provided. Often null."
      last_name: "Commenter's last name, when provided. Often null."
      organization: "Organization the commenter represents, when provided. Often null."
      category: "Submitter category as classified on regulations.gov. Often null."
      title: "Comment title / subject line."
      comment: "Full free-text body of the comment. The largest field in the dataset."
      document_type: "Document category for the comment record, typically `Public Submission`."
      posted_date: "Date the comment was posted publicly (ISO 8601 string)."
      modify_date: "Timestamp the comment was last modified (ISO 8601 string)."
      receive_date: "Date the agency received the comment (ISO 8601 string)."
      attachments_json: "JSON array of any files attached to the comment: `[{title, formats:[{url, format, size}]}]`. Null when there are no attachments."
      text_content: "Plain text of the comment's attachment(s). Filled inline during the ETL from Mirrulations' pre-extracted text (the bucket's `derived-data` prefix); attachments not yet extracted upstream are backfilled by the on-demand PDF text-extraction step. Null when neither has produced text; see `text_extraction_status`."
      text_extraction_status: "Aggregate attachment outcome: `ok` means text was filled from derived-data or at least one PDF, even if another PDF failed; otherwise PDF outcomes prefer `error`, `encrypted`, then `empty`. Null before an attempt or derived-text fill."
      pdf_extraction_results_json: "Ordered JSON array from the latest PDF attempt: `{url, source_sha256, status, page_count, error}` per distinct selected URL. SHA-256 identifies observed bytes; no-bytes fetch failures have null digest/page count and a generic error. Null when no PDF attempt is recorded. Derived-data fills preserve these diagnostics; they do not describe the provenance of independently supplied or retained older text."

  comments_index:
    label: "Public comment counts"
    coverage: >-
      Derived. Per-partition counts over `comments`; it covers exactly what
      that table covers and adds no rows of its own.
    measured_on: "2026-09-06"
    summary: >-
      A tiny per-partition row-count index for the partitioned comments. It maps
      each `comments/` partition to its row count so consumers can compute
      comment totals and discover partitions without scanning the full comments
      dataset. Maintained by `update_comments_index`.
    columns:
      agency_code: "Agency code of the partition (the `agency_code=` path segment)."
      docket_id: "Docket id of the partition (the `docket_id=` path segment)."
      year: "Year of the partition, from `posted_date` (the `year=` path segment)."
      month: "Month (1–12) of the partition (the `month=` path segment)."
      row_count: "Number of comment rows in that partition file."

  feed_summary:
    label: "Docket summaries"
    coverage: >-
      Derived. One row per docket over `dockets`, `documents` and
      `comments`; it covers exactly what those cover.
    measured_on: "2026-09-06"
    summary: >-
      A pre-computed rollup with one row per docket, joining docket metadata to
      comment counts and comment-period dates. Powers feed/timeline views
      without scanning the full comments dataset. Built by `build_feed_summary`,
      sorted by `modify_date` descending.
    columns:
      docket_id: "Docket identifier. One row per docket."
      agency_code: "Posting agency's short code."
      title: "Docket title (from `dockets`)."
      docket_type: "Docket category (from `dockets`)."
      modify_date: "Docket last-modified timestamp; the table is sorted by this descending."
      abstract: "Docket abstract (from `dockets`). Often null."
      comment_count: "Total comments on the docket, summed from `comments_index`. 0 when none."
      comment_end_date: "Latest comment-period end date across the docket's documents. Null when unknown."
      date_created: "Earliest document `posted_date` on the docket, used as a creation date. Null when unknown."

  agency_stats:
    label: "Agency totals"
    coverage: >-
      Derived. Totals over `dockets`, `documents` and `comments`; it covers
      exactly what those cover.
    measured_on: "2026-09-06"
    summary: >-
      A per-agency dimension table — one row per agency with docket, document,
      and comment counts. Powers agency directory and profile pages. Built by
      `build_agency_rollups`, sorted by comment then document count descending.
    columns:
      agency_code: "Agency short code. One row per agency."
      docket_count: "Number of dockets posted by the agency."
      document_count: "Number of documents posted by the agency."
      comment_count: "Total comments received by the agency, summed from `comments_index`."

  agency_monthly_volume:
    label: "Agency monthly volume"
    coverage: >-
      Derived. Monthly counts over `documents`; it covers exactly what that
      table covers, including its pre-1990 date defect.
    measured_on: "2026-09-06"
    summary: >-
      Per-agency monthly document volume, broken out by document type — one row
      per (agency, year, month, document_type). Feeds activity sparklines and
      profile activity panels. Built by `build_agency_rollups` from document
      `posted_date`.
    columns:
      agency_code: "Agency short code."
      year: "Year of the documents, extracted from `posted_date`."
      month: "Month (1–12) of the documents, extracted from `posted_date`."
      document_type: "Document category counted in this bucket (e.g. `Rule`, `Notice`)."
      document_count: "Number of documents the agency posted of that type in that month."

  rulemaking_lifecycles:
    label: "Rulemaking timelines"
    coverage: >-
      Derived. Proposed-to-final pairs over `documents`; it covers exactly
      what that table covers.
    measured_on: "2026-09-06"
    summary: >-
      Proposed→final rulemaking arcs, one row per docket, discriminated by
      `kind`: `pair` rows are completed rulemakings (earliest Proposed Rule
      matched to the earliest subsequent Rule in the same docket, with elapsed
      `days`); `stuck` rows are Proposed Rules with no matching Rule, where
      `final_date` and `days` are NULL. Bounded to `proposed_date >= 2010-01-01`.
      Built by `build_rulemaking_lifecycles` from `documents`. Note that pairing
      is per docket, so a docket carrying several RINs across successive
      rulemakings collapses to a single arc.
    columns:
      kind: "`pair` (completed: proposed and final both present) or `stuck` (proposed with no final rule in the docket)."
      docket_id: "Docket the arc belongs to."
      agency_code: "Agency short code, from the Proposed Rule."
      title: "Title of the Proposed Rule that opens the arc."
      proposed_date: "`posted_date` of the earliest Proposed Rule in the docket."
      final_date: "`posted_date` of the earliest Rule at or after `proposed_date`. NULL when `kind` is `stuck`."
      days: "Calendar days from `proposed_date` to `final_date`. NULL when `kind` is `stuck`."

  fr_docket_links:
    label: "Federal Register to docket links"
    coverage: >-
      Derived, and bounded by its inputs. Links between `federal_register`
      and `dockets`, so it inherits the Federal Register table's 2000 floor:
      a rule published before 2000 has no link here because the document is
      not in that table.
    measured_on: "2026-09-06"
    summary: >-
      The Federal Register ↔ docket bridge: each `federal_register` row's
      `docket_ids_json` array exploded to one row per (docket_id, FR document),
      carrying the FR display columns. Use this instead of an `ILIKE` scan over
      `federal_register.docket_ids_json` — it is sorted by `docket_id`, so
      `WHERE docket_id = ?` prunes row groups. This is the practical join from
      regulations.gov to the Federal Register, since `documents.fr_doc_num` is
      populated on only ~1% of rules. Built by `build_fr_docket_links`.
    columns:
      docket_id: "One docket ID extracted from the FR document's `docket_ids_json` array."
      document_number: "Federal Register document number (joins `federal_register.document_number`)."
      title: "FR document title."
      abstract: "FR document abstract."
      document_type: "FR type: `Rule`, `Proposed Rule`, `Notice`, or `Presidential Document`."
      subtype: "FR subtype where the Federal Register supplies one, e.g. `Final Rule`, `Interim Final Rule`."
      publication_date: "Date the document published in the Federal Register."
      effective_on: "Date the rule takes effect, when the document carries one."
      comments_close_on: "Comment period close date, when the document carries one."
      signing_date: "Signing date, for presidential documents."
      agency_slugs: "Federal Register agency slugs for the issuing agencies."
      docket_ids_json: "The full original docket-ID array, retained so consumers can see the other IDs this FR document links to."
      regulation_id_numbers_json: "RINs (JSON array) claimed by the FR document — the RIN-side join key for a rulemaking."
      html_url: "federalregister.gov HTML permalink."
      pdf_url: "Federal Register PDF URL."
      executive_order_number: "Executive order number, for presidential documents."

  discovery_signals:
    label: "Agency activity spikes"
    coverage: >-
      Not a range. A current-state signal recomputed relative to each run
      date, so every row turns over on every rebuild. It is not a time
      series and cannot be asked about the past.
    measured_on: "2026-09-06"
    summary: >-
      Per-agency document-output spike signal that powers the feed's discovery
      panel — agencies whose document count in the trailing 30 days is at least
      2× their prior-year monthly mean, requiring ≥24 documents in the prior year
      to suppress tiny-denominator noise. Recomputed relative to the run date, so
      rows turn over on every rebuild; it is a current-state signal, not a time
      series. Built by `build_discovery_signals` from `documents`.
    columns:
      agency_code: "Agency short code."
      recent_30d: "Documents the agency posted in the trailing 30 days."
      baseline: "Prior-year monthly mean document count (months 2–13 back)."
      ratio: "`recent_30d` divided by `baseline` — the spike multiple."

  cfr_sections:
    label: "Code of Federal Regulations sections"
    coverage: >-
      Window. The 2025 and 2026 annual editions only, out of the Code's full
      publication history. This is the Code roughly as it stands now, not a
      record of how a section changed.
    measured_on: "2026-09-06"
    summary: >-
      One row per Code of Federal Regulations *section* (a GovInfo CFR granule),
      ingested from the GovInfo API by `build_cfr_sections`. This is the codified,
      subject-organized body of federal regulations — `cfr_ref`/`title`/`part`/
      `section` are the join keys back to Federal Register `cfr_references_json`
      and, transitively, to regulations.gov activity. Scope is section METADATA +
      CITATIONS only — the full regulatory *text* of each section is deliberately
      out of scope for this pass (it is far heavier). Requires an api.data.gov key
      (`DATA_GOV_API_KEY`); a keyless ingest run is a no-op. All columns are stored
      as VARCHAR. NOTE: the GovInfo traversal + field mapping await live validation
      with a key.
    columns:
      granule_id: "GovInfo granule id for the section. Primary key / dedup key."
      package_id: "GovInfo package id (the enclosing CFR title-year edition) the granule belongs to."
      cfr_ref: "Compact CFR citation composed from title/part/section (e.g. `40-60.1`). The join key to Federal Register `cfr_references_json`."
      title: "CFR title number (e.g. `40`)."
      part: "CFR part number within the title (e.g. `60`)."
      section: "CFR section number within the part (e.g. `1`). Often null for non-section granules."
      heading: "Section heading / caption text as published by GovInfo."
      structure_level: "GovInfo granule class / structural level (e.g. `SECTION`, `PART`, `APPENDIX`)."
      edition_year: "Annual CFR edition the granule was issued in (from GovInfo `editionYear`/`dateIssued`). Drives incremental freshness."
      last_modified: "GovInfo last-modified timestamp for the granule. Drives incremental freshness alongside `edition_year`."
      url: "Canonical GovInfo details/link URL for the granule."
  congress_bills:
    label: "Congressional bills"
    coverage: >-
      True range on rows, mixed on columns. Every bill the Congress.gov ingest
      has walked is here, with latest actions from 1799-12-16 (the 6th
      Congress) to 2026-09-18 — re-derived from this run's own output (receipt
      `d1-measured-run-2026-09-19/`, `rederived-ranges.json`) rather than
      carried forward: the statement previously read 2026-09-04, which was the
      date of an earlier look and not of this table. 20 of the 419,621 rows
      state no latest action at all, so "every row" holds for identifier and
      type and not for date. The first ten columns are filled for all of them.
      The thirty-eight columns the bill family appends — the publisher facts
      the list endpoint discards, the stage, signing and money-bill findings,
      and their provenance — are filled only for the Congresses that rollup
      has covered, and are NULL on every other row until it reaches them; on
      the measured run that was 18,956 bills of the 119th. For the 82nd
      through the 107th it reaches them through the API detail route rather
      than a BILLSTATUS zip, and the count columns it cannot substantiate from
      that route stay NULL there. Once filled they stay filled: the two
      rollups that write this table merge column-wise, so the archive-wide
      walk updates the ten columns it owns without clearing the thirty-eight
      it does not — a claim the measured run exercised in one direction only,
      the family writing onto a ten-column prior.
    measured_on: "2026-09-19"
    summary: >-
      One row per bill or resolution. Two rollups write this table:
      `congress-bills` walks the Congress.gov list endpoint for the ten-column
      prefix across the whole archive, and `bill-family` fills the full contract
      for the Congresses it is scoped to — from a BILLSTATUS document for the
      108th onward, and from the API bill detail route for the 82nd through the
      107th, where no BILLSTATUS bulk exists. A consumer tells the two family
      routes apart by Congress and by the NULLs: a row for a Congress below the
      108th is the detail route's, its `schema_version` is NULL because the
      detail record states no BILLSTATUS schema, and its `action_count`,
      `committee_count`, `version_count`, `subject_count`, `subjects_json`,
      `related_bill_count` and `related_bills_json` are NULL because the detail
      record states those only as sub-route counts the backfill does not walk —
      a zero would contradict the count the publisher declared. `cosponsor_count`
      is the one count the record does state, as its `cosponsors` sub-route's
      count, and is published from there (NULL when the record states no such
      sub-route, as the 92nd's do not); it is never the sponsor-list arithmetic
      the BILLSTATUS shaper uses. `stage` and `signed_date_rule` are NULL on
      these rows too: the record carries no actions, so no stage rule ran and no
      became-law action was looked for, and the shaper's default rung
      ("introduced") or the rule name "public law without a became-law action"
      would each be a statement about the bill that nothing examined. The first
      ten columns keep the
      exact order and spelling they have always had, because other repositories
      pin that prefix by digest; every new column is appended after them. Because
      two rollups write it, this is the one table merged column-wise: neither
      writer's NULL can erase the other's value. All columns are stored as
      VARCHAR.
    data_quality: >-
      `statutes_at_large_cite` is filled at this table's merge by joining the
      published `laws` table on `bill_id`, as its column sentence says: whichever
      rollup writes this table (`congress-bills` or `bill-family`) reads `laws`
      best-effort after its own merge and takes the law's citation where one is
      published, keeping a citation already here where `laws` has none for the
      bill; with no `laws` table published the column stays as it was, NULL on a
      cold start. It is never guessed: `laws` publishes a citation only from a
      captured PLAW USLM file, and reads a NULL through its own `uslm_outcome`.
      `public_law_number` and `law_type` are not that case: they come from the
      bill's own publisher record — its `laws` entry, when the publisher states
      one — and are filled wherever the bill family has reached.
    columns_from: spicy_docs

  unified_agenda:
    label: "Planned agency actions"
    coverage: >-
      Window. The 202510 edition alone, a single semiannual snapshot rather
      than a history of editions, so an agenda item cannot be compared
      against how it read in an earlier edition.
    measured_on: "2026-09-06"
    summary: >-
      One row per Regulation Identifier Number (RIN) per agenda edition, ingested
      from the OIRA/OMB Unified Agenda published at reginfo.gov by
      `build_unified_agenda`. A Tier-1 rulemaking-lifecycle source: the upstream,
      forward-looking catalog of rulemakings agencies *plan* to pursue, keyed by
      the same `rin` that appears in `federal_register`
      (`regulation_id_numbers_json`). Primary / dedup key is (`rin`,
      `agenda_edition`). All columns are stored as VARCHAR; array-valued fields
      are JSON strings.
    columns:
      rin: "Regulation Identifier Number (e.g. `2060-AV12`). The RIN join key to `federal_register`. Half of the primary/dedup key."
      agency_code: "Short code of the agency that owns the RIN."
      agency_name: "Full name of the agency that owns the RIN."
      title: "Title of the planned rulemaking."
      abstract: "Agency-written abstract describing the planned action. Often null."
      rin_status: "Status of the RIN in this edition (e.g. `Active`, `Completed`, `Long-Term`)."
      rule_stage: "Stage of the rulemaking in this edition (e.g. `Prerule`, `Proposed Rule`, `Final Rule`)."
      priority_category: "OIRA priority classification (e.g. `Economically Significant`, `Other Significant`, `Substantive, Nonsignificant`)."
      agenda_edition: "Semiannual agenda edition the row was published in, as `YYYYMM` (MM 04=Spring, 10=Fall). Half of the primary/dedup key."
      major: "Whether the action is a major rule, as reported by the agenda (e.g. `Yes`/`No`). Often null."
      publication_id: "reginfo.gov publication identifier for this agenda entry, when present."
      timetable_json: "JSON array of timetable entries — the planned/actual milestone actions and their dates for the rulemaking."
      cfr_references_json: "JSON array of CFR citations affected by the rulemaking. The join key to the CFR."
      legal_authority_json: "JSON array of legal-authority citations the agency cites for the rulemaking."
      first_action_date: "Date of the earliest timetable action, when derivable. Often null."
      next_action_date: "Date of the next planned timetable action, when derivable. Often null."
      url: "URL of the entry's detail page on reginfo.gov."
  federal_register:
    label: "Federal Register documents"
    coverage: >-
      True range, with a boundary worth stating. Documents published from
      2000-01-03 to 2026-09-04. Federal Register documents published before
      2000 are not in this table at all.
    measured_on: "2026-09-06"
    summary: >-
      One row per Federal Register document, ingested from the federalregister.gov
      REST API by `build_federal_register`. The authoritative rule-publication
      record — proposed rules, final rules, and notices — complementary to the
      regulations.gov `dockets`/`documents` view. `regulation_id_numbers_json`
      (RIN) and `cfr_references_json` are the join keys to the Unified Agenda and
      the CFR. All columns are stored as VARCHAR; array-valued fields are JSON.
    columns:
      document_number: "FR document number (e.g. `2017-07442`). Primary key / dedup key."
      title: "Document title."
      abstract: "Agency-written abstract of the document. Often null."
      document_type: "FR category: `Rule`, `Proposed Rule`, `Notice`, or `Presidential Document`."
      publication_date: "Date the document was published in the Federal Register (ISO 8601 string). Sort key."
      effective_on: "Date the action takes effect, when stated. Often null."
      comments_close_on: "Public comment deadline, for documents that open a comment period. Often null."
      signing_date: "Date a presidential document was signed. Null for non-presidential documents."
      agencies_json: "JSON array of the issuing agencies as full FR agency objects (`raw_name`, `name`, `id`, `slug`, `parent_id`, …)."
      agency_slugs: "Comma-separated FR agency slugs derived from `agencies_json` (e.g. `transportation-department,federal-aviation-administration`)."
      docket_ids_json: "JSON array of docket identifier strings referenced by the document (e.g. regulations.gov docket numbers). Joins to `dockets`/`documents` via `fr_docket_links`."
      regulation_id_numbers_json: "JSON array of Regulation Identifier Numbers (RINs). The join key to the Unified Agenda. Often `[]`."
      cfr_references_json: "JSON array of CFR citations as `{title, part, chapter, citation_url}` objects. The join key to the CFR."
      html_url: "URL of the document's HTML page on federalregister.gov."
      pdf_url: "URL of the document's PDF rendition."
      body_html_url: >-
        URL of the document's full-text HTML body. This is the only body
        pointer this table carries, and it is the worse of the two the
        publisher offers: measured over 993 real documents, the HTML body
        carries publisher boilerplate on 993 of 993 and yields a median
        passage of 135 characters with 40.8% under 100, while the XML body
        carries it on 0 of 993 with a median of 610 and 6.8% fragments. The
        publisher's API returns `full_text_xml_url` and `raw_text_url` for
        the same document (verified 2026-09-07); this ingest does not
        request either. Anyone extracting bodies from this column takes the
        boilerplate-carrying route by construction — fetch the XML instead,
        or add the pointer here first.
      volume: "Federal Register volume number."
      start_page: "First FR page of the document."
      end_page: "Last FR page of the document."
      subtype: "FR document subtype, when set. Often null."
      executive_order_number: "Executive order number, for presidential EO documents. Null otherwise."
      modify_date: "Processing/modification date carried from the prior published table; null for rows freshly ingested via the REST API (which does not expose it)."
      rin: >-
        The first Regulation Identifier Number in `regulation_id_numbers_json`,
        derived in the merge for every row: the scalar join key to
        `house_communications.rin` (the regulatory bridge, gap A5). NULL where
        the array is `[]` or absent. Measured on the published table
        2026-09-19 (803,996 rows): 96,060 documents state one RIN, 1,499 state
        two or more (up to 41), 9,758 state none and 696,679 rows from before
        the in-repo ingest carry no array; a consumer wanting every RIN of a
        multi-RIN document unnests the array.
  sam_entities:
    label: "Federal entity registry"
    coverage: >-
      True range with a density caveat. Registration dates run 1949-12-14 to
      2026-07-04, and the ends are real, but a scheduled run walks one
      rotating registration-year window, so the interior is uneven and a
      given year may be thinner than its neighbours.
    measured_on: "2026-09-06"
    summary: >-
      One row per registered federal entity, ingested from the SAM.gov Entity
      Management API v4 (`/entities` list endpoint) by `build_sam_entities`. The
      authoritative federal entity registry — the directory of organizations
      registered to do business with or receive assistance from the U.S.
      government — keyed by the Unique Entity ID (`uei`). This anchors
      organization/entity resolution across the corpus: the same UEI ties a
      commenting organization to its registered identity. Filtered to public
      active registrations (`registrationStatus=A`). Scope is deliberately
      list-level only (no per-entity detail fetches). Coverage: the published
      table is the union of scheduled runs, each walking one rotating
      `registrationDate` year window (unbounded within the window unless
      `SAM_MAX_RECORDS` is set), deduped on `uei`; on 2026-09-05 it held
      885,266 rows with registration dates 1949-12-14 to 2026-07-04, against
      an active public registry of roughly the same size. The file is written
      in 50,000-row groups, so a reader that stops after the first row group
      sees exactly 50,000 rows, which is a reader limit, not the table's. All
      columns are stored as VARCHAR.
    columns:
      uei: "Unique Entity ID (SAM `ueiSAM`, 12-char alphanumeric, e.g. `Q93HWX24PGA4`). Primary key / dedup key; the entity-resolution join key."
      cage_code: "Commercial and Government Entity (CAGE) code assigned to the entity. Often null for newly registered entities."
      legal_business_name: "Legal business name as registered in SAM.gov."
      dba_name: "'Doing business as' name, when the entity registered one. Often null."
      entity_structure_desc: "Entity structure description (`coreData.generalInformation.entityStructureDesc`, e.g. `Corporate Entity (Not Tax Exempt)`)."
      entity_type_desc: "Entity type description (e.g. `Business or Organization`)."
      profit_structure_desc: "Profit-structure description (e.g. `For Profit Organization`, `Non-Profit Organization`)."
      state: "State or province code of the physical address (`coreData.physicalAddress.stateOrProvinceCode`). Null for many non-US registrants."
      city: "City of the physical address."
      zip_code: "ZIP / postal code of the physical address."
      congressional_district: "U.S. congressional district of the physical address (`coreData.congressionalDistrict`). Null for non-US registrants."
      primary_naics: "Primary NAICS industry code the entity asserted (`assertions.goodsAndServices.primaryNaics`). Often null."
      registration_status: "Registration status as returned by the API (e.g. `Active`). The ingest filters on the request-side `registrationStatus=A`."
      registration_date: "Date the entity's current registration was recorded (ISO 8601 string)."
      registration_expiration_date: "Date the current registration expires (ISO 8601 string)."
      exclusion_status_flag: "Whether the entity has an active exclusion/debarment record (`Y`/`N`)."
      purpose_of_registration_desc: "Purpose-of-registration description (e.g. `Federal Assistance Awards`, `All Awards`)."
      entity_url: "Entity's self-reported website URL (`coreData.entityInformation.entityURL`). Often null."
  lobbying_filings:
    label: "Lobbying disclosure filings"
    coverage: >-
      True range with a density caveat. Filing years span 2000 to 2026, but
      286,369 of 287,246 rows are 2023 or later; earlier years are a tail of
      a few hundred rows each and should not be read as coverage of that
      period.
    measured_on: "2026-09-06"
    summary: >-
      One row per federal lobbying-disclosure filing, ingested from the U.S.
      Senate Lobbying Disclosure Act (LDA) REST API (`lda.senate.gov`) by
      `build_lobbying_filings`. Registrants file quarterly reports naming the
      clients they lobby for, the money involved, the issues raised, and the
      government entities (agencies/chambers) lobbied — so this table links the
      comment campaigns in `comments`/`dockets` to the same organizations'
      *direct* agency lobbying. Primary / dedup key is `filing_uuid`. All columns
      are stored as VARCHAR; nested/array fields are JSON strings.
    columns:
      filing_uuid: "LDA filing UUID (e.g. `7866327b-c892-4430-b9f0-1f0f679c58c6`). Primary key / dedup key."
      filing_type: "Filing type code (e.g. `RR` registration, `Q1`–`Q4` quarterly reports, amendments/terminations)."
      filing_year: "Calendar year the filing reports on."
      filing_period: "Reporting period within the year (e.g. `first_quarter`, `year_end`)."
      dt_posted: "Timestamp the filing was posted to the LDA system (ISO 8601 string with timezone). Sort key."
      registrant_name: "Name of the registrant (the lobbying firm or self-filing organization)."
      registrant_id: "LDA registrant id. Stable join key across a registrant's filings."
      client_name: "Name of the client the lobbying was performed for. Joins by name to `organizations`/comment filers."
      client_id: "LDA client id."
      income: "Lobbying income reported by a lobbying firm for the period, in USD. Null for self-filers (who report `expenses`)."
      expenses: "Lobbying expenses reported by a self-filing organization for the period, in USD. Null for firms (who report `income`)."
      lobbying_activities_json: "JSON array of lobbying activities, each `{general_issue_code, general_issue_code_display, description}` — the issue areas lobbied and their free-text descriptions."
      government_entities_json: "JSON array of the distinct government entities lobbied (`{id, name}`) — the agencies and chambers (e.g. `HOUSE OF REPRESENTATIVES`, `SENATE`) named across the filing's activities."
      url: "URL of the filing's printable document page on lda.senate.gov (`filing_document_url`)."
  fec_committees:
    label: "Political committees"
    coverage: >-
      Not a range. The table carries no date column: it is the committee
      registry as of the most recent run, with no history and no way to ask
      what it held before.
    measured_on: "2026-09-06"
    summary: >-
      One row per Federal Election Commission committee/PAC, ingested from the
      OpenFEC `/committees` endpoint by `build_fec_committees`. A reference
      dimension of the political committees — PACs, party committees, and
      campaign committees — that money and endorsements flow through, used to
      resolve commenters and co-filers against the dashboard's ally/opposition
      (stance) map. Scope is deliberately committees-only: itemized
      contributions (hundreds of millions of rows) are out of scope for this
      pass and could follow as a future bounded-by-organization contributions
      table keyed on `committee_id`. All columns are stored as VARCHAR;
      array-valued fields are JSON strings.
    columns:
      committee_id: "OpenFEC committee identifier (e.g. `C00684373`). Primary key / dedup key."
      name: "Committee name as registered with the FEC."
      committee_type: "Single-letter committee type code (e.g. `P` presidential, `H` House, `S` Senate, `N`/`Q`/`O` PAC variants)."
      committee_type_full: "Human-readable committee type (e.g. `Presidential`, `PAC - Qualified`)."
      designation: "Single-letter committee designation code (e.g. `P` principal campaign committee, `A` authorized, `U` unauthorized, `J` joint fundraiser)."
      designation_full: "Human-readable committee designation (e.g. `Principal campaign committee`)."
      party: "Political party code, when set (e.g. `DEM`, `REP`, `W`). Often null for non-party committees."
      party_full: "Human-readable political party (e.g. `DEMOCRATIC PARTY`, `WRITE-IN`). Often null."
      state: "Two-letter state associated with the committee. Often null."
      treasurer_name: "Name of the committee's treasurer."
      organization_type_full: "Human-readable sponsoring organization type (e.g. `Corporation`, `Labor Organization`, `Trade Association`). Often null."
      filing_frequency: "Single-letter filing frequency code (e.g. `A` administratively terminated, `M` monthly, `Q` quarterly, `T` terminated)."
      first_file_date: "Date the committee first filed with the FEC (ISO 8601 string)."
      last_file_date: "Date of the committee's most recent filing (ISO 8601 string)."
      cycles_json: "JSON array of election-cycle years the committee was active in (e.g. `[2018, 2020, 2022]`)."
      candidate_ids_json: "JSON array of OpenFEC candidate IDs associated with the committee (e.g. `[\"P00008052\"]`). Often `[]`."
  org_committee_links:
    label: "Commenter organizations matched to committees"
    coverage: >-
      Derived, and bounded by a small input. Name matches between commenter
      organizations and FEC committees, reachable only for the small share
      of comments that carry an `organization` value at all, so absence of a
      link is not evidence that a commenter has none.
    measured_on: "2026-09-06"
    summary: >-
      One row per (commenter organization name, FEC committee) name match,
      derived by `build_org_committee_links`. Materializes the organization-name
      bridge between the regulations.gov corpus and `fec_committees` — the join
      the data model always described but left to each query author, so every
      consumer normalized names differently. `organization` is the raw string as
      filed, joining straight back to `comments.organization`; `committee_id`
      joins to `fec_committees`. Coverage is inherently small:
      `comments.organization` is populated on only ~0.08% of comments (~20.7K of
      ~25.8M), and most commenting organizations do not run a federal PAC, so a
      few hundred organizations resolving is the correct answer rather than a
      matcher to tune harder. Matching runs in three tiers (`exact`, `core`,
      `prefix`) and every row carries `match_method`, `confidence`, and
      `committee_match_count` so consumers pick their own precision bar instead
      of trusting an opaque score. A high `committee_match_count` is usually a
      real affiliate network (Planned Parenthood matches ~90 state committees),
      not an error — which is why such rows are labelled rather than dropped.
    columns:
      organization: "Commenter organization exactly as filed on the comment. Join key back to `comments.organization`."
      organization_norm: "`organization` uppercased with parenthetical asides, apostrophes and punctuation removed and `&` expanded to `AND`."
      organization_core: "`organization_norm` with trailing legal suffixes (`INC`, `LLC`, ...) and a leading `THE` removed. The form the `core`/`prefix` tiers compare."
      name_source: "Where the organization name came from. Always `organization_field` today; text-derived names (comment title, letterhead, signature block) would be added as extra rows under their own source."
      committee_id: "Matched OpenFEC committee identifier. Joins to `fec_committees.committee_id`."
      committee_name: "Matched committee name as registered with the FEC."
      committee_type_full: "Human-readable committee type of the matched committee (e.g. `PAC - Qualified`)."
      designation_full: "Human-readable committee designation of the matched committee."
      party_full: "Human-readable political party of the matched committee. Often null for non-party committees."
      organization_type_full: "Sponsoring organization type of the matched committee (e.g. `Trade Association`, `Labor Organization`). Often null."
      committee_state: "Two-letter state on the matched committee (`fec_committees.state`). Often null."
      match_method: "How the pair matched: `exact` (full normalized names equal), `core` (decoration-stripped cores equal), or `prefix` (committee core starts with the whole organization core on a token boundary)."
      confidence: "`high` for `exact`/`core`; for `prefix`, `medium` when `committee_match_count` <= 5 and `low` above that. Filter on this to pick a precision bar."
      committee_match_count: "How many committees this organization matched in total. High values are usually genuine affiliate networks (unions, Planned Parenthood); treat with `confidence`."
      comment_count: "Comments filed under this exact organization string (deduplicated on `comment_id`, newest `modify_date` wins — matching the MCP `comments` view)."
      docket_count: "Distinct dockets this organization string commented on."
      agency_codes_json: "JSON array of the distinct agency codes this organization commented to, sorted."
      first_comment_date: "Earliest `posted_date` across this organization's comments (ISO 8601 string)."
      last_comment_date: "Latest `posted_date` across this organization's comments (ISO 8601 string)."
  gao_reports:
    label: "Government Accountability Office reports"
    coverage: >-
      Window. 105 reports published 2026-07-13 to 2026-09-04, a
      fifty-three-day slice taken from the publisher's recent-items feed. It
      grows as the daily job runs and is not GAO's archive.
    measured_on: "2026-09-06"
    summary: >-
      One row per U.S. Government Accountability Office (GAO) product, ingested
      from the public GAO reports RSS feed by `build_gao_reports`. The federal
      oversight layer over the rulemakings this dataset tracks — GAO's audits,
      evaluations, and recommendations on how agencies implement laws and rules.
      GAO's bulk/search surfaces are bot-blocked, so the RSS feed (a ~25-item
      recent-products window) is the only anonymous machine-readable source;
      the table is therefore an **append-only accumulator** that grows into a
      rolling history over successive daily runs. Deduped on `report_id`. All
      columns are stored as VARCHAR.
    columns:
      report_id: "GAO product id parsed from the product URL (e.g. `gao-26-107974`), lowercased. Primary key / dedup key."
      title: "Product title as published in the feed."
      report_type: "GAO product type. The reports feed does not tag a finer type, so this defaults to `Report`."
      published_date: "Publication date parsed from the feed's `pubDate` to an ISO date string (e.g. `2026-07-17`). Sort key."
      abstract: "The product summary from the feed (GAO's `What GAO Found` / `Why GAO Did This Study` narrative)."
      agencies_json: "Reserved JSON array of agencies the product covers. The RSS feed carries no structured agency tags, so this is `[]` pending a future enrichment source."
      topics_json: "Reserved JSON array of topics/subjects. The RSS feed carries no structured topic tags, so this is `[]` pending a future enrichment source."
      url: "Canonical gao.gov URL for the product."
  crs_reports:
    label: "Congressional Research Service reports"
    coverage: >-
      True range. Reports published 1993-10-22 to 2026-09-04, running about
      1,100 to 1,300 a year in recent years.
    measured_on: "2026-09-06"
    summary: >-
      One row per Congressional Research Service (CRS) report, ingested from the
      Congress.gov v3 REST API (`/crsreport` list endpoint) by
      `build_crs_reports`. The nonpartisan policy-analysis layer over the same
      subjects agencies regulate — complementary to `congress_bills` (the
      legislative record) and `federal_register` (the rule-publication record).
      Scope is deliberately list-level only (no per-report detail fetches), so
      every column comes from the list payload. Incremental by `update_date`,
      deduped on `report_id`. All columns are stored as VARCHAR.
    columns:
      report_id: "CRS report id (e.g. `R48641`, `IN12713`). Primary key / dedup key."
      title: "Report title as returned by the list endpoint."
      report_type: "CRS product category from `contentType` (e.g. `Reports`, `Posts`)."
      status: "Report status as reported by Congress.gov (e.g. `Active`)."
      published_date: "Date the report was published (ISO 8601 string)."
      update_date: "Date the Congress.gov record was last updated (ISO 8601 string). Incremental window key."
      version: "Version number of the report as returned by the list endpoint."
      url: "Congress.gov API URL for the report's detail resource."
  court_dockets:
    label: "Federal court dockets"
    coverage: >-
      True range with a density caveat. Dockets filed 1992-08-26 to
      2026-09-04 across 95 courts, but 7,743 rows over that span is a
      bounded slice of federal court activity rather than the full docket
      record.
    measured_on: "2026-09-06"
    summary: >-
      One row per federal court docket challenging agency action under the
      Administrative Procedure Act, ingested from the CourtListener v4 search API
      (`courtlistener.com`, RECAP dockets with nature-of-suit 899) by
      `build_courtlistener`. When an agency finalizes a rule it is frequently
      sued; these are those suits — the litigation counterpart to the rulemakings
      in `dockets`/`documents`. There is no machine RIN/FR key on a court docket,
      so it links to the corpus by name and topic: the defendant agency appears in
      `case_name` and `parties_json` (joinable by name to `agency_stats` / the FR
      `agency_slugs`), and `cause` names the statute invoked. Primary / dedup key
      is `cl_docket_id`. All columns are stored as VARCHAR; array fields are JSON
      strings.
    columns:
      cl_docket_id: "CourtListener docket id (e.g. `73613631`). Primary key / dedup key. Distinct from the regulations.gov `docket_id`."
      case_name: "Short case name (e.g. `HENNEPIN COUNTY, MINNESOTA v. U.S. DEPARTMENT OF HEALTH AND HUMAN SERVICES`). Names the defendant agency."
      case_name_full: "Full case caption when available; often blank."
      court_id: "CourtListener court identifier (e.g. `dcd` D.D.C., `cadc` D.C. Circuit, `akd` D. Alaska)."
      court: "Human-readable court name (e.g. `District Court, District of Columbia`)."
      court_citation_string: "Court citation abbreviation (e.g. `D.D.C.`)."
      docket_number: "Court docket number (e.g. `1:26-cv-02460`)."
      date_filed: "Date the case was filed (ISO 8601 string). Sort key and incremental watermark."
      date_terminated: "Date the case was terminated, if closed (ISO 8601 string). Null for pending cases."
      date_argued: "Date of oral argument, if any (ISO 8601 string). Often null."
      nature_of_suit: "Nature-of-suit label; scoped to `899 Other Statutes: Administrative Procedures Act/Review or Appeal of Agency Decision`."
      cause: "Statutory cause of action as recorded in PACER (e.g. `05:551 Administrative Procedure Act`)."
      jurisdiction_type: "Basis of federal jurisdiction (e.g. `U.S. Government Defendant`)."
      jury_demand: "Jury demand recorded on the docket (e.g. `None`)."
      assigned_to: "Name of the judge assigned to the case."
      referred_to: "Name of the magistrate/referral judge, if any. Often null."
      parties_json: "JSON array of party names on the docket (plaintiffs and defendants, including the defendant agency)."
      attorneys_json: "JSON array of attorney names appearing on the docket."
      firms_json: "JSON array of law-firm / legal-organization names appearing on the docket."
      pacer_case_id: "PACER case id for the docket in its court's CM/ECF system."
      date_created: "Timestamp CourtListener first indexed the docket (ISO 8601 string, from the search-result `meta.date_created`)."
      absolute_url: "Absolute URL of the docket page on courtlistener.com."
  usaspending_recipients:
    label: "Federal award recipients"
    coverage: >-
      Not a range. No date column: the table is the top recipients by
      all-time award amount, so it cannot be asked about a period, and a
      recipient below that cut is absent rather than absent from the awards
      data.
    measured_on: "2026-09-06"
    summary: >-
      One row per federal-award recipient, ingested from the USASpending.gov
      `/api/v2/recipient/` endpoint by `build_usaspending_recipients`. A
      keyless (no API key) org-resolution reference dimension keyed by UEI and
      name — the organizations that receive federal money — complementary to the
      SAM entity registry and the `fec_committees` table for resolving and
      enriching the organizations that comment on rulemakings by their federal
      funding. Scope is deliberately bounded to the top-N recipients by all-time
      federal award amount (the endpoint reports ~18M recipients, too many for a
      daily full walk); the transform merges each run's top-N with the prior
      table so coverage stays monotonic. All columns are stored as VARCHAR.
    columns:
      recipient_id: "USASpending recipient hash + level suffix (e.g. `7fe0d08f-...-R`). Primary key / dedup key — unique per recipient_level."
      uei: "Unique Entity Identifier (SAM.gov UEI, e.g. `JE73CDQUAPA7`). The org-resolution join key to SAM and other UEI-keyed sources. May be null for older records."
      duns: "Legacy DUNS number, when present. Superseded by UEI; often null for newer records."
      name: "Recipient name as recorded by USASpending (e.g. `LOCKHEED MARTIN CORP`). The name-resolution key."
      recipient_level: "Recipient rollup level: `P` (parent), `C` (child), or `R` (standalone recipient with no parent). The same UEI can appear at multiple levels."
      total_award_amount: "All-time federal award dollars for the recipient at this level, as a numeric string (e.g. `63465270734.15`). The bounding sort key (top-N by amount)."
  fcc_proceedings:
    label: "FCC proceedings"
    coverage: >-
      True range. Proceedings created 1991-10-22 to 2026-09-02.
    measured_on: "2026-09-06"
    summary: >-
      One row per FCC proceeding (the FCC's docket equivalent, e.g. `17-108`),
      ingested from the FCC ECFS public API (`/proceedings`) by
      `build_fcc_proceedings`. The FCC does not participate in regulations.gov —
      its rulemaking dockets and public comments live in ECFS — so this table
      extends the dataset's docket universe to the FCC. Requires an api.data.gov
      key (`DATA_GOV_API_KEY`). Incremental by `date_created`, deduped on
      `name`. Proceedings with no created date are unreachable through the
      API's date-range queries and are not included (legacy shells with no
      filing activity). All columns are stored as VARCHAR.
    columns:
      name: "Proceeding (docket) number, e.g. `17-108` or `23-320`. Primary key / dedup key, and the join key to `fcc_filings.proceeding_names_json`."
      id_proceeding: "ECFS internal numeric id for the proceeding."
      description: "Proceeding title/subject (ECFS `description_display`, falling back to `description`), e.g. `Restoring Internet Freedom`."
      bureau_code: "Code of the FCC bureau that owns the proceeding (e.g. `WC`)."
      bureau_name: "Name of the FCC bureau that owns the proceeding (e.g. `Wireline Competition Bureau`)."
      rulemaking_or_docket: "ECFS `flag_rulemaking_or_docket`: `R` for rulemakings (RM- numbers), `D` for dockets."
      filing_status: "ECFS filing-window status for the proceeding (e.g. `OPENALL`)."
      date_created: "Timestamp the proceeding was created in ECFS (ISO 8601 string). Incremental cursor and sort key."
      date_closed: "Timestamp the proceeding was closed, if it has been (open proceedings carry null or a far-future sentinel like `2099-12-31`)."
      comment_start_date: "Start of the initial comment window, when ECFS records one. Often null."
      comment_end_date: "End of the initial comment window, when ECFS records one. Often null."
      reply_comment_start_date: "Start of the reply-comment window, when ECFS records one. Often null."
      reply_comment_end_date: "End of the reply-comment window, when ECFS records one. Often null."
      filed_by: "ECFS account that created the proceeding. An internal FCC username; occasionally useful for spotting bureau conventions."
  fcc_filings:
    label: "FCC filings"
    coverage: >-
      Window. Filings received 2026-06-30 to 2026-09-04, a sixty-seven-day
      slice. The rollup merges incrementally, so this is the history
      accumulated so far and not the ECFS archive.
    measured_on: "2026-09-06"
    summary: >-
      One row per FCC ECFS filing — the FCC's comment equivalent: comments,
      reply comments, ex-parte notices, letters, and other submissions —
      ingested from the FCC ECFS public API (`/filings`) by `build_fcc_filings`.
      Requires an api.data.gov key (`DATA_GOV_API_KEY`). Incremental by
      `date_received`, deduped on `id_submission`. Because ECFS holds tens of
      millions of filings, a first run with no prior table is bounded to the
      trailing 30 days; deeper history is backfilled in slices via `FCC_SINCE`
      and/or scoped to specific proceedings via `FCC_PROCEEDINGS`. All columns
      are stored as VARCHAR, array fields serialized as JSON strings.
    columns:
      id_submission: "ECFS submission id (e.g. `26109947027`). Primary key / dedup key."
      proceeding_names_json: "JSON array of proceeding (docket) numbers the filing was submitted to (e.g. `[\"17-108\"]`). Join key to `fcc_proceedings.name`."
      submission_type: "ECFS submission type description, e.g. `COMMENT`, `REPLY TO COMMENTS`, `NOTICE OF EXPARTE`."
      express_comment: "`1` if the filing is an express comment (text-only, entered in the web form), `0` for standard filings with uploaded documents."
      date_received: "Timestamp ECFS records the filing as received (ISO 8601 string). Incremental cursor and sort key."
      date_submission: "Timestamp the filer submitted the filing (ISO 8601 string)."
      date_disseminated: "Timestamp the filing was disseminated (made public) by ECFS (ISO 8601 string)."
      filing_status: "ECFS workflow status description (e.g. `DISSEMINATED`)."
      viewing_status: "ECFS viewing status description (e.g. `Unrestricted`, `Confidential`)."
      exparte_or_late_filed: "`Y` if the filing is ex-parte or late-filed, else `N`."
      filers_json: "JSON array of filer names (individuals or organizations) on the filing."
      authors_json: "JSON array of author names on the filing, when distinct from the filers. Often empty."
      lawfirms_json: "JSON array of law-firm names on the filing. Often empty."
      bureaus_json: "JSON array of FCC bureau names the filing was routed to. Often empty."
      text_data: "The filing's inline text — for express comments this is the full comment text. Null for document-only filings."
      total_page_count: "Total page count across the filing's attached documents, as a numeric string."
      documents_json: "JSON array of attached documents as `{filename, src}` objects, where `src` is the fcc.gov download URL."
      filing_url: "Canonical fcc.gov URL for the filing (`https://www.fcc.gov/ecfs/filing/<id_submission>`)."

  # ---------------------------------------------------------------------------
  # Tables hosted from spicy-docs' table contracts.
  #
  # `columns_from: spicy_docs` means the per-column prose is the contract's own
  # (spicy_docs.schemas.TABLE_CONTRACTS[<table>].descriptions), read at load
  # time by src/spicy_regs/data_dictionary.py. Four hundred and seven column
  # sentences live beside the code that fills each column; copying them here
  # would create a second copy with nothing keeping it in step. The label, the
  # coverage statement, measured_on and the summary stay hand-written, because
  # what this repository publishes and when it last measured it are its facts,
  # not the wheel's.
  #
  # Listing `columns:` inline on one of these entries is refused at load, so
  # the two sources cannot silently disagree.
  # ---------------------------------------------------------------------------

  bill_actions:
    label: "Bill actions"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt from the
      eight BILLSTATUS archives in 500 seconds, at 1,200 keyed and 616 keyless
      requests. It published 77,998 action rows over those bills, so at the
      119th's size one run costs no requests beyond the eight archive reads
      for this table — the actions come out of the BILLSTATUS document, not a
      per-bill fetch. Filled from the BILLSTATUS bulk archive for the
      Congresses the bill-family rollup is scoped to (the current one by
      default), so it holds every action of every bill in that scope and
      nothing outside it. Each run is meant to add to what is published rather
      than replace it, because a bill the publisher has not touched since the
      last run is skipped and its rows stand. **The skip is design, not
      measurement**: D1 was a cold start, so nothing was held and nothing was
      skipped, and the saving described here has not been observed yet — the
      second run is what measures it.
    measured_on: "2026-09-19"
    summary: >-
      One row per action entry in a bill's BILLSTATUS document, in publisher order.
      Each row also carries the stage the action text implies, with the rule and
      matcher that fired, which makes `congress_bills.stage` auditable action by
      action. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_committees:
    label: "Bill committee referrals"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt from the
      eight BILLSTATUS archives in 500 seconds, at 1,200 keyed and 616 keyless
      requests. It published 25,735 referral rows. Same scope as
      `bill_actions`: every committee and subcommittee named in the BILLSTATUS
      documents the bill-family rollup read. Each run is meant to add to what
      is published rather than replace it, because a bill the publisher has
      not touched since the last run is skipped and its rows stand. **The skip
      is design, not measurement**: D1 was a cold start, so nothing was held
      and nothing was skipped, and the saving described here has not been
      observed yet — the second run is what measures it.
    measured_on: "2026-09-19"
    summary: >-
      One row per committee or subcommittee a bill reached, as its BILLSTATUS
      document names it. `referral_signal` is set only for the six appropriations
      committees the money-bill classifier keys on; it is NULL elsewhere rather than
      absent. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_publisher_summaries:
    label: "CRS bill summaries (publisher)"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt from the
      eight BILLSTATUS archives in 500 seconds, at 1,200 keyed and 616 keyless
      requests. It published 5,820 CRS summary rows. Same scope as
      `bill_actions`. These are the Congressional Research Service summaries
      the publisher states on a bill, not the model-written ones in
      `bill_summaries`. Each run is meant to add to what is published rather
      than replace it, because a bill the publisher has not touched since the
      last run is skipped and its rows stand. **The skip is design, not
      measurement**: D1 was a cold start, so nothing was held and nothing was
      skipped, and the saving described here has not been observed yet — the
      second run is what measures it.
    measured_on: "2026-09-19"
    summary: >-
      One row per CRS summary the publisher states on a bill, at the version and
      action it describes. `summary_html` is kept exactly as the publisher escaped
      it. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_versions:
    label: "Bill printings"
    coverage: >-
      Sampled, and accumulating, and the per-run fetch cap is the bound that
      actually binds. Measured on one cold-start run of the 119th (receipt
      `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt from the eight
      BILLSTATUS archives in 500 seconds, at 1,200 keyed and 616 keyless
      requests. It produced 22,066 printing records and published 22,064 rows
      after 2 repeated identities were collapsed, of which only the 600 the
      cap allowed had their bodies fetched from GovInfo — 600 status fetches
      of 600 allowed, so a cold start of one Congress reaches a small fraction
      of its printings' bodies in one run. Two bounds, not one: the Congresses
      the rollup is scoped to, and that per-run cap. A printing beyond the cap
      still gets a row from the publisher's own facts, with the body columns
      (`sha256`, `byte_size`, `resolved_url`, `observed_at`) NULL. A printing
      already captured is not fetched again, so each run is meant to spend the
      cap on ground the last one did not reach. **The skip is design, not
      measurement**: D1 was a cold start, so nothing was held and nothing was
      skipped, and the saving described here has not been observed yet — the
      second run is what measures it. How many runs that convergence actually
      takes is therefore not stated here: it depends on how many printings the
      publisher adds between runs and how many held ones a changed bill forces
      to be re-read, and one run measures neither. Each printing is read in
      the first rendition the publisher offers of XML, HTML, text, then PDF,
      and `format_name` says which one; PDF is last but is no longer excluded,
      so a printing offered only as PDF has a row with real body columns.
      Bills before the 113th Congress offer no XML at all (measured
      2026-09-19), so for those the section tree is absent — they have no
      `bill_sections` rows and no `section_diffs` — and the `cleanup_*`
      columns, which record what the GPO normalizer did to a PDF's text, are
      filled only for the PDF printings.
    measured_on: "2026-09-19"
    summary: >-
      One row per printing of a bill, per source that supplied it. The full text is
      deliberately not a column here: `bill_sections.body` carries it at the grain
      people query, and the body is re-fetchable by package id and digest. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_sections:
    label: "Bill sections"
    data_quality: >-
      A printing with no parsed section tree is a counted refusal, never a row
      with invented values. On the measured cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`) the family reported **21,466**
      such refusals against 6,301 published rows — one per printing whose body
      the 600-per-run fetch cap did not reach, plus those offered only as PDF.
      The refusal count is therefore a measure of how far the cap is from the
      corpus, not of anything wrong with the printings; it falls as successive
      runs spend the cap on ground earlier ones did not reach. All columns are
      stored as VARCHAR.
    coverage: >-
      Sampled, and accumulating, and much smaller than `bill_versions` for a
      reason the measured run makes plain. Measured on one cold-start run of
      the 119th (receipt `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt
      from the eight BILLSTATUS archives in 500 seconds, at 1,200 keyed and
      616 keyless requests. It published 6,301 section rows, from the 600
      printings whose bodies the per-run cap allowed to be fetched and whose
      XML parsed — not from the 22,064 printings that have rows in
      `bill_versions`. One row per content-bearing node of the printings whose
      XML was fetched and parsed, which is a subset of `bill_versions`: a
      printing offered only as PDF, or not yet reached by the per-run fetch
      cap, has no rows here. That is most of the older corpus: bills before
      the 113th Congress offer only HTML and PDF, no XML (measured
      2026-09-19), so the section tree is absent for all of them however many
      times they are fetched.
    measured_on: "2026-09-19"
    summary: >-
      One row per content-bearing node of one bill version, in document order. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  section_diffs:
    label: "Bill version comparisons"
    data_quality: >-
      A consecutive pair that cannot be diffed — because one or both sides has
      no parsed tree — is a counted refusal named by table, never a row.
      Measured on the cold-start run of the 119th (receipt
      `d1-measured-run-2026-09-19/`): **3,185** refusals against 128 published
      comparisons, which is what a 600-printing cap over 22,064 printings
      implies, since a pair needs both of its sides fetched in the same run.
      All columns are stored as VARCHAR.
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt from the
      eight BILLSTATUS archives in 500 seconds, at 1,200 keyed and 616 keyless
      requests. It published 128 comparisons — a pair needs *both* of its
      consecutive printings fetched and parsed in the same run, which the
      per-run cap makes uncommon on a cold start. Consecutive printings only,
      and only where both sides were fetched and parsed. Comparing every pair
      would be quadratic in the number of printings; consecutive pairs is the
      deliberate bound, and a new printing's already-captured predecessor is
      re-fetched so the pair is not skipped. `engine_revision` is the
      DeltaTrack commit the host vendored its wheel from, recorded in
      `vendor/README.md` beside that wheel's SHA-256: a wheel install states
      no commit of its own, so the value is a fact of the vendoring rather
      than something read back from the installed package.
    measured_on: "2026-09-19"
    summary: >-
      One row per compared pair of consecutive printings of one bill. `engine_name`,
      `engine_version` and `engine_revision` record which diff engine produced the
      row. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  section_diff_items:
    label: "Bill comparison items"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt from the
      eight BILLSTATUS archives in 500 seconds, at 1,200 keyed and 616 keyless
      requests. It published 1,266 correspondence rows over the 128
      comparisons in `section_diffs`. One row per settled correspondence in
      those comparisons.
    measured_on: "2026-09-19"
    summary: >-
      One row per settled correspondence in one version-pair comparison.
      `text_diff_json` is byte-capped, and `text_diff_truncated` says when the cap
      was reached. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  financial_changes:
    label: "Dollar-figure changes"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`): 18,956 bills rebuilt from the
      eight BILLSTATUS archives in 500 seconds, at 1,200 keyed and 616 keyless
      requests. It published 0 rows: they exist only where a section's amounts
      actually changed between two compared printings, so this table is a
      small fraction of `section_diff_items` and an empty result for a bill
      means no compared section changed an amount.
    measured_on: "2026-09-19"
    summary: >-
      One row per aligned pair of dollar figures in a section whose amounts changed.
      `pairing_claim` names how the two figures were aligned; it is word alignment,
      not a semantic match. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  section_classifications:
    label: "Section classifications (model)"
    coverage: >-
      Sampled, and accumulating, and empty on every run measured so far.
      **`measured_on` does not carry its usual meaning here**: no run has
      exercised this table, so the date beside this statement is the day the
      statement was written, not the day a run checked it against the
      publisher (`descriptions.yaml`'s header lists the five entries in this
      position). Model-backed: rows exist only for runs with a model key set,
      and a keyless run publishes none, which is what continuous integration
      does and what the measured cold-start run of the 119th did — 18,956
      bills rebuilt with no Gemini key set, so this table came back empty by
      design. The model path's first live exercise is recorded in receipt
      `d1-measured-run-2026-09-19/` under row C1, and the answer the model
      returned did not satisfy the reader's contract, so no model-backed row
      has yet been published by any run.
    measured_on: "2026-09-19"
    summary: >-
      One row per label a model assigned to one section of one printing.
      `vocabulary_hash` is a digest over the sealed label list, so a vocabulary
      change is visible in the data rather than silently reinterpreting old rows.
      All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_summaries:
    label: "Bill summaries (model)"
    coverage: >-
      Sampled, and accumulating, and empty on every run measured so far.
      **`measured_on` does not carry its usual meaning here**: no run has
      exercised this table, so the date beside this statement is the day the
      statement was written, not the day a run checked it against the
      publisher (`descriptions.yaml`'s header lists the five entries in this
      position). Model-backed, same condition as `section_classifications`: no
      key, no rows, and the measured cold-start run of the 119th was
      deliberately keyless. The one live call made since (receipt
      `d1-measured-run-2026-09-19/`, row C1) was answered by the model and
      then refused by `_read_answer`, because the sealed prompt asks for its
      three items in prose and never names the JSON keys the reader requires:
      the model returned `affected_audience` and `notable_provisions` where
      the reader wants `audience` and `topThreeProvisions`. Until that is
      settled upstream, a keyed run should be expected to publish no rows here
      either.
    measured_on: "2026-09-19"
    summary: >-
      One row per plain-language summary of one printing of a bill. `frame` is
      stored because without it the summary is not reproducible from the row. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  diff_summaries:
    label: "Change summaries (model)"
    coverage: >-
      Sampled, and accumulating, and empty on every run measured so far.
      **`measured_on` does not carry its usual meaning here**: no run has
      exercised this table, so the date beside this statement is the day the
      statement was written, not the day a run checked it against the
      publisher (`descriptions.yaml`'s header lists the five entries in this
      position). Model-backed, and further limited to bills with at least two
      compared printings — of which the measured cold-start run produced 128.
      It shares the prompt-and-reader shape that row C1 of receipt
      `d1-measured-run-2026-09-19/` found refuses the model's own answer on
      `bill_summaries`, so the same caveat applies until that is settled
      upstream.
    measured_on: "2026-09-19"
    summary: >-
      One row per model-written summary of the change between two printings of a
      bill. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  public_activity_events:
    label: "Bill activity events"
    coverage: >-
      Derived. Computed by comparing one bill-family run against the
      previously published one, so the first run's events are all additions
      and the table cannot describe anything that happened before this rollup
      began. Measured on that first run (receipt
      `d1-measured-run-2026-09-19/`): 41,020 events, every one an addition,
      against an empty prior. A row leaving a table is not an event: the four
      event types are sealed.
    measured_on: "2026-09-19"
    summary: >-
      One row per change detected between two runs of the bill family. Two instants
      per row: `occurred_at` is the publisher's, `detected_at` is the run's. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  amendments:
    label: "Amendments"
    data_quality: >-
      The publisher's `updateDate desc` order repeats an amendment across a
      page boundary when stamps tie, the same shape measured on the bill and
      communication routes. On the cold-start walk of the 119th (2026-09-19)
      7,066 records were served and 7,016 distinct identities published: 50
      repeats were collapsed, the fresh row winning. The declared total counts
      entries, not amendments, so a walk whose declared and served counts
      agree has still not delivered 50 of the amendments it counted; the next
      whole walk delivers them. All columns are stored as VARCHAR.
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): with no prior table the window is open,
      so the run was a full walk of the 119th — 7,066 amendment records over
      29 pages in 101 seconds, published as 7,016 rows after 50 repeated
      identities were collapsed. The Congress.gov amendment route for the
      Congresses the rollup is scoped to, walked in an `updateDate` window
      that starts at the watermark this table already reached and runs forward
      at most ninety days. **The watermark window is design, not
      measurement**: the measured run had no prior table, so it took the open
      window and no narrowed one has been observed — the second run is what
      measures it.
    measured_on: "2026-09-19"
    summary: >-
      One row per amendment, as the Congress.gov amendment list route states it.
      Keyed on the amendment's own identity, not the bill it amends, because an
      amendment can amend another amendment; `amended_bill_id` and
      `amended_amendment_id` are foreign keys. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  press_releases:
    label: "Appropriations press releases"
    coverage: >-
      Window. Measured on one run (receipt `d1-measured-run-2026-09-19/`): the
      two feeds were live with 10 House and 15 Senate items, and 5 of the 25
      named one of the 18,906 published bills of the 119th. Each feed is a
      rotating window the publisher trims, so a single capture is only what
      was live that day; the table accumulates across runs and keeps every
      release ever captured. It does not reach back before the first capture.
    measured_on: "2026-09-19"
    summary: >-
      One row per item in one appropriations committee press-release feed capture.
      `bill_id` names the bill a release mentions, where one of the published bills
      in scope was named in the title or the description text. All columns are
      stored as VARCHAR.
    data_quality: >-
      The bill linkage is a pattern match over the release's own words, not a
      publisher statement, so `matched_field` and `matched_text` carry what was
      matched and where: a false positive is readable from the row rather than only
      by re-running the matcher. One pattern is compiled per published bill in the
      Congresses in scope, bounded on both sides and built from the bill's own type,
      so a bare number matches nothing. Three states are distinct and must not be
      read as one: a `bill_id` with `match_rule = bill_number_in_title` or
      `bill_number_in_excerpt` is a match; `match_rule = unmatched` with a NULL
      `bill_id` means the matcher ran and no published bill was named; an all-NULL
      `match_rule` means no matching pass ran at all, because no `congress_bills`
      table was published when the rollup ran, or none was published for that
      release's Congress, or the release states no readable `pub_date` to scope by.
      The Senate feed carries no item description, so a Senate release can only ever
      match on its title.
      One consequence worth knowing before relying on these four columns: a run that
      cannot read `congress_bills` republishes the whole live window with NULL match
      columns, because this table merges row-wise and a fresh row wins whole. The
      next run that can read it re-derives them for every release still in the feed,
      so the gap normally lasts one cycle — but a release that rotates off the feed
      during that cycle keeps the NULL permanently. The other publisher columns are
      unaffected; only these four degrade.
    columns_from: spicy_docs

  roll_call_votes:
    label: "House roll-call votes"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): the `house-vote` index listed 676 House
      votes for the 119th, 577 of which the linkage rule could index, and all
      577 were fetched from the Clerk under the 1,500-per-run cap with no
      refusal — 4 keyed and 577 keyless requests in 310 seconds, 577 rows
      published from an empty prior. House only, and bounded by that per-run
      cap on how many roll calls are fetched, newest first. A roll call
      already published with a tally is not fetched again, so a steady-state
      run is meant to read only new ones plus the newest few, which are
      re-read in case the publisher corrected them. **The skip is design, not
      measurement**: D1 was a cold start, so nothing was held and nothing was
      skipped, and the saving described here has not been observed yet — the
      second run is what measures it. The Senate's roll calls are not
      published at all rather than published with empty tallies — there is no
      Senate index route in the reader this rollup uses, and a set of Senate
      roll calls reached from bills is not an index of a session's roll calls.
      A House roll call that a bill's own action names can be published a cron
      before the Congress.gov vote index lists it, since the two linkage
      sources are read independently and the Clerk file is addressable from
      the roll-call key alone; such a row carries the same tally and member
      positions as any other, so this widens timeliness rather than the
      coverage claim. `vote_date` keeps the Clerk's own spelling
      (`9-Sep-2025`), which does not sort as a date, so no range over it is
      quoted here.
    measured_on: "2026-09-19"
    summary: >-
      One row per roll call: the publisher's own tally, and the bill it refers to.
      The four tally columns are the publisher's own counts or they are NULL; they
      are never zero-filled. All columns are stored as VARCHAR.
    data_quality: >-
      The bill linkage has two publisher sources and `match_rule` says which one
      answered. `bill_action_recorded_vote` is a `recordedVotes` entry on the bill's
      own action, read from `bill_vote_references`; `house_vote_legislation` is the
      `house-vote` listing's own `legislationType`/`legislationNumber`. The first
      wins a disagreement, because a recorded vote sits on the bill's own action
      while the listing states a fact about the roll call from outside it.
      `conflict_count` is per roll call, not per run: it counts the later references
      that named a different bill for *this* roll call, and they are kept rather
      than dropped. `match_action_index` is set only on a recorded-vote match, since
      a listing reference sits on no action. With no bill-family run published, the
      listing linkage alone fills these columns.
    columns_from: spicy_docs

  member_votes:
    label: "Member vote positions"
    coverage: >-
      Sampled, and accumulating. Measured on the same cold-start run as
      `roll_call_votes` (receipt `d1-measured-run-2026-09-19/`): 249,099
      member positions across its 577 roll calls, an average of 432 a roll
      call. One row per member per roll call in `roll_call_votes`, so it
      inherits that table's House-only scope, per-run cap and
      skip-what-is-already-held behavior exactly.
    measured_on: "2026-09-19"
    summary: >-
      One row per member's position on one roll call. `position` keeps the
      publisher's own word (the Clerk spells both Aye/No and Yea/Nay) and
      `position_normalized` carries the fold, so a count and a quotation are both
      answerable. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  members:
    label: "Legislators"
    coverage: >-
      Sampled. Measured on one run (receipt `d1-measured-run-2026-09-19/`):
      both roster files — current and historical — were captured whole in two
      keyless requests and 2.6 seconds, yielding 12,770 legislators. The run
      confirms the capture is whole rather than a slice; the statement stays
      "Sampled" because the claim this table makes is about the crosswalk's
      own completeness, which no run of ours can establish, and because the
      machine-readable kind is a published contract value that should not move
      without a change in what is fetched.
    measured_on: "2026-09-19"
    summary: >-
      One row per legislator in one capture of the community crosswalk. Split from
      `member_terms` because one row cannot hold a chamber switch. All columns are
      stored as VARCHAR.
    columns_from: spicy_docs

  member_terms:
    label: "Legislator terms"
    coverage: >-
      Sampled. Measured on the same run as `members` (receipt
      `d1-measured-run-2026-09-19/`): 45,535 terms over those 12,770
      legislators, an average of 3.6 terms each. Every term of every
      legislator in `members`, in the crosswalk's own order, from the same
      whole capture.
    measured_on: "2026-09-19"
    summary: >-
      One row per term a legislator served, in the crosswalk's own order. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  committee_reports:
    label: "Committee reports"
    coverage: >-
      Window, advancing. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): the thirty-day cold-start window held
      133 CRPT packages, of which 105 became rows — 17 were refused because
      the `collections/CRPT` route serves SERIALSET package ids the body
      grammar does not accept, 8 because the package's MODS states a different
      `accessId` than the one requested, 2 for HTML nesting depth and 1 for
      offering no supported rendition. The rollup spent 275 keyed requests
      (262 to GovInfo, and 13 to the Congress.gov hearing detail for
      `hearing_transcripts.event_id`) and 120 keyless, in 113 seconds, well
      inside the 200-package cap. GovInfo CRPT packages by last-modified date:
      the window starts at the watermark this table already reached, so each
      run asks for what changed since the last one and a revision of an older
      report is still picked up. Thirty days is the cold-start window only. A
      package already published is not fetched again, and a per-run package
      cap bounds a catch-up. **Both the watermark and the already-published
      skip are design, not measurement**: D1 was a cold start, so the window
      was the thirty-day default and nothing was skipped — the second run is
      what measures either. Each package is read in the first rendition it
      offers of XML, HTML, text, then PDF, and `format` says which one.
      Measured 2026-09-19, committee reports offer only HTML and PDF, and the
      HTML is the text rendition, so in practice every row is read from HTML
      with PDF as the fallback — all 118 bodies read in the measured run were
      HTML. No GovInfo body of any rendition states a page boundary, so
      `page_count` is NULL except on the PDF fallback, which an extractor
      paginates.
    measured_on: "2026-09-19"
    summary: >-
      One row per captured GovInfo committee report package. `bill_id` is the
      measure the report accompanies, read from the package's own MODS metadata. All
      columns are stored as VARCHAR.
    data_quality: >-
      `bill_id` is the publisher's own statement, not a guess from the title: a
      GovInfo MODS names each related bill with a `context` attribute, and only
      `PRIMARY` — the measure a report accompanies — fills this column. `OTHER`,
      `COVER` and `BODY` are mentions and are deliberately not published, so a
      report that merely discusses a bill is not linked to it; the column that would
      carry them does not exist in the contract. Measured 2026-09-19 over the twelve
      newest reports of the 119th Congress, the MODS `PRIMARY` bill agreed with
      Congress.gov's own `associatedBill[0]` on 12 of 12, with every request and raw
      response retained under
      `~/Work/corpora/supply-2026-09-02/receipts/report-bill-linkage-2026-09-19/`.
      A report whose MODS names no `PRIMARY` bill publishes a NULL.
    columns_from: spicy_docs

  report_sections:
    label: "Committee report agency blocks"
    coverage: >-
      Window, advancing. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): 1,246 agency blocks parsed out of the
      105 reports that run published, an average of 12 a report. The blocks
      come from the reports in `committee_reports`, so this inherits that
      table's watermark, cap and rendition. `page_start` and `page_end` are
      NULL wherever the rendition read stated no page boundary, which is every
      HTML body — and every body read in the measured run was HTML, so every
      row it published has both NULL.
    measured_on: "2026-09-19"
    summary: >-
      One row per agency block parsed out of one committee report's text. `pattern`
      records which header pattern fired, which is this table's provenance column.
      All columns are stored as VARCHAR.
    columns_from: spicy_docs

  hearing_transcripts:
    label: "Hearing transcripts"
    coverage: >-
      Window, advancing, and the narrowest table here in practice. Measured on
      one cold-start run (receipt `d1-measured-run-2026-09-19/`): the CHRG leg
      reached its 200-package cap and published 13 rows, because 187 of the
      200 packages the `collections/CHRG` route served in the window are
      SERIALSET package ids the body grammar does not accept. The cap is
      therefore spent almost entirely on packages that cannot become rows, and
      the window advances slowly for that reason rather than because few
      hearings are published. GovInfo CHRG packages on the same last-modified
      watermark and per-run cap as `committee_reports`, read in the same
      rendition order — XML, HTML, text, then PDF — and, like committee
      reports, offering only HTML and PDF in practice. `page_count` is NULL
      for the same reason: no GovInfo body states a page boundary, so only the
      PDF fallback has one.
    measured_on: "2026-09-19"
    summary: >-
      One row per captured GovInfo hearing transcript package. `bill_id` is read the
      same way as on `committee_reports` and is NULL in practice. All columns are
      stored as VARCHAR.
    data_quality: >-
      `bill_id` is filled from the package's MODS `PRIMARY` bill, exactly as on
      `committee_reports`, but a hearing does not accompany a measure the way a
      report does: measured 2026-09-19 over 50 distinct hearings of the 119th
      Congress, no CHRG MODS carried a `PRIMARY` bill at all. Ten carried `BODY` or
      `COVER` mentions — bills the transcript cites, 31 entries in all — and those are not
      promoted to a linkage, because publishing a cited bill as the hearing's
      subject would be a guess stated as a fact. Of the twelve hearings whose
      Congress.gov detail named a committee meeting, none of those meetings listed a
      related bill either. So expect this column to be NULL. The measurement is
      retained with every request and raw response under
      `~/Work/corpora/supply-2026-09-02/receipts/report-bill-linkage-2026-09-19/`.
      `event_id` is read from the Congress.gov hearing detail
      (`hearing/{congress}/{chamber}/{jacket}`, one keyed request per CHRG package
      fetched in the run) and joins `committee_meetings.event_id`. It is NULL in
      three cases the run log counts apart: the detail names no meeting (jacket
      63127, retained), the detail was refused (a jacket Congress.gov does not
      hold, or a transport failure), or the row was published before this
      column was read -- only a package fetched in the run is asked about, so a
      row from an earlier run keeps its NULL until the package is modified and
      re-fetched.
    columns_from: spicy_docs

  bill_family_archives:
    label: "Bill-family archive listings"
    coverage: >-
      Not a range. Processing state, not published data: one row per
      BILLSTATUS bulk folder the `bill-family` rollup is scoped to — eight per
      Congress — holding the GovInfo bulkdata listing entry for that folder's
      zip as the last run saw it. Measured on the cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`): 8 rows, one per folder, all
      downloaded because no prior entry existed to compare against — 52 MB of
      zips across the eight. The next run asks GovInfo for the folder listing
      and, when the entry still states the same file at the same size and
      stamp, skips downloading the zip entirely. **That skip is the whole
      point of this table and is the one thing the measured run could not
      show**, since a cold start has no retained entry to compare against; the
      second run is what measures it. It describes this pipeline's own runs,
      not the publisher's corpus, so no coverage range applies to it.
    measured_on: "2026-09-19"
    data_quality: >-
      Only the four fields the skip compares are retained — `name` and `link`,
      which must name the folder's own zip or the comparison is refused outright,
      and `modified_at` and `size`, which must match for the zip to be skipped.
      The other six the publisher's listing states are deliberately absent rather
      than filled with guesses. All columns are stored as VARCHAR.
    summary: >-
      One row per BILLSTATUS bulk folder, holding the listing entry the next
      `bill-family` run compares against before downloading that folder's zip. All
      columns are stored as VARCHAR.
    columns:
      name: "The zip's own file name in the folder listing, as the publisher spells it."
      link: "The publisher's path to that zip; it must rebuild this folder's own locator or the skip is refused."
      formatted_last_modified_time: "The publisher's own DD-Mon-YYYY HH:MM stamp string, kept as the evidence `modified_at` was read from."
      modified_at: "That stamp as a UTC instant, which is one of the two values the unchanged comparison tests."
      size: "The zip's byte size as the listing states it; the other value the comparison tests."
      congress: "The numbered Congress whose folder this entry describes."
      bill_type: "The publisher's lowercase bill-type folder name (hr, s, hjres, sjres, hconres, sconres, hres, sres)."
      observed_at: "When this run captured the listing the entry was read from."

  bill_vote_references:
    label: "Bill vote references"
    coverage: >-
      Not a range. A linkage index, not published data about roll calls: one
      row per `recordedVotes` entry on the actions of each bill the
      `bill-family` rollup rebuilt, so it covers exactly the bills that rollup
      is scoped to and reaches back only as far as its runs have. Measured on
      the cold-start run of the 119th (receipt `d1-measured-run-2026-09-19/`):
      1,341 references over 18,956 bills, published as 1,341 rows. The
      publisher attaches the same roll call to every floor action it settled,
      so the same roll call appears on several rows of one bill; measured over
      20 bills of the 119th Congress on 2026-09-19, 58 entries resolved to 34
      distinct roll calls. It describes what bills state about votes, not the
      population of votes, so no coverage range applies to it.
    measured_on: "2026-09-19"
    data_quality: >-
      Every row is a publisher statement copied without interpretation: the six
      fields a `recordedVotes` entry carries, plus the position of the action it sat
      on. An entry missing any of the six is refused and counted in the run log
      rather than published with a hole in it. `full_action_name` is a seventh field
      the BILLSTATUS user guide documents that the publisher was not sending on any
      of the 58 entries measured; it is carried because the publisher may resume
      sending it. Both chambers appear here — 6 of the 34 measured roll calls were
      Senate — even though `roll_call_votes` publishes House roll calls only, so a
      Senate row here is a linkage for a vote this pipeline does not yet host. All
      columns are stored as VARCHAR.
    summary: >-
      One row per recorded vote on one bill action: which roll call the bill's own
      actions say settled it. Read by the `roll-call-votes` rollup to fill
      `roll_call_votes.bill_id` and its match columns. All columns are stored as
      VARCHAR.
    columns:
      bill_id: "The bill whose action carried this entry, keyed as every bill table keys it."
      chamber: "The chamber that took the roll call, lowercased (house, senate)."
      congress: "The numbered Congress the roll call belongs to."
      session: "The session number within that Congress, from the entry's sessionNumber."
      roll_number: "The roll-call number within that session, from the entry's rollNumber."
      action_index: "Position of the action this entry sat on, in the publisher's own action order."
      url: "The publisher's URL for the roll call: a House Clerk EVS file or a Senate LIS vote page."
      date: "The instant the entry states for the vote."
      full_action_name: "The guide's seventh field, absent on every entry measured; NULL where the publisher sends none."
      observed_at: "When the bill-family run that read this entry captured the BILLSTATUS document."
  bill_family_backfills:
    label: "Bill-family backfill state"
    coverage: >-
      Not a range. Processing state, not published data: one row per bill the
      `bill-family` rollup has attempted from the API detail route for a
      Congress below the 108th. Still none. **`measured_on` does not carry its
      usual meaning here**: no run has exercised this table, so the date
      beside this statement is the day the statement was written, not the day
      a run checked it against the publisher (`descriptions.yaml`'s header
      lists the five entries in this position). The measured run (receipt
      `d1-measured-run-2026-09-19/`) named the 119th only, which BILLSTATUS
      bulk serves, so the backfill leg was never entered and this table was
      written empty; the first run that names a pre-108th Congress fills it
      and is what would give the date its stronger meaning. It describes this
      pipeline's own runs, not the publisher's corpus, so no coverage range
      applies to it.
    measured_on: "2026-09-19"
    data_quality: >-
      A row with `refusal` NULL is a success record — the bill's `congress_bills`
      row is published and the stamp is what the `bill/{congress}/{type}` list
      stated when it was — and a row with `refusal` set is a recorded failure,
      which the next named run retries first, directly and without a list walk,
      one request each; that is the resume rule (the CRS summaries pattern: skip
      only a success, retry every failure). A list record whose stamp differs
      from its success row means the bill moved and is fetched again. The stamp
      is the publisher's own `updateDateIncludingText` exactly as the list stated
      it, compared as a string: an old Congress's list records truncate the
      instant to a date while its detail records do not, so only list-to-list
      comparison is exact. `refusal` is the error's class name only, never its
      message. All columns are stored as VARCHAR.
    summary: >-
      One row per bill the pre-BILLSTATUS backfill has attempted, carrying the
      list stamp it was attempted under and whether it was filled or refused —
      the retained state that lets the next run retry every refusal and skip
      every filled bill for one comparison apiece. All columns are stored as
      VARCHAR.
    columns:
      congress: "The numbered Congress whose backfill walk attempted this bill."
      bill_type: "The publisher's lowercase bill type (hr, s, hjres, sjres, hconres, sconres, hres, sres)."
      number: "The bill's number as the list record states it."
      list_update_date_including_text: "The bill's `updateDateIncludingText` exactly as the list record stated it when this attempt was made; the value the next walk compares against."
      refusal: "NULL when the bill was filled; otherwise the class name of the error that refused the detail attempt (`_RetryableTransportError` after the reader's retries, `PagedJsonSourceError` for a refused response), which marks the row for retry."
      observed_at: "When the detail request that filled the bill was captured, or when the refusal was recorded."

  bill_family_backfill_walks:
    label: "Bill-family backfill walks"
    coverage: >-
      Not a range. Processing state, not published data: one row per
      (pre-108th Congress, bill type) a `bill-family` run actually walked on
      the `bill/{congress}/{type}` route, rewritten each walk. Still none, for
      the same reason as `bill_family_backfills`. **`measured_on` does not
      carry its usual meaning here**: no run has exercised this table, so the
      date beside this statement is the day the statement was written, not the
      day a run checked it against the publisher (`descriptions.yaml`'s header
      lists the five entries in this position). The measured run (receipt
      `d1-measured-run-2026-09-19/`) named the 119th only, so no walk happened
      and this table was written empty. A unit walked complete with every
      record filled, refused or unwalkable is settled and not walked again; it
      keeps its prior row. It describes this pipeline's own runs, not the
      publisher's corpus, so no coverage range applies to it.
    measured_on: "2026-09-19"
    data_quality: >-
      `list_completed` is true only when the walk reached the route's terminal
      page with declared and observed counts agreeing (the reader refuses
      otherwise); a run that hit the per-run cap mid-unit records how far it got
      and `list_completed` false, and the next run walks the unit again, pages
      charged to the cap, because only a walk can reach the records it did not.
      An empty success is not absence: `declared_count` is the route's own
      declared total for that query on that day, recorded beside
      `records_walked` even when the walk stopped early, so a capped walk can
      never read as an empty unit; a declared 0 is the publisher's statement
      that the Congress has no bills of that type. The declared total counts
      list entries, and the route can list one bill twice across a page
      boundary (`repeated_count`); whether that repeat also displaced another
      bill off the walk is not knowable from one walk, and a settled unit is
      not walked again to find out. A settled unit's bills are likewise not
      re-checked for a moved stamp; the archive-wide `congress-bills` rollup
      keeps the ten-column prefix current regardless. All columns are stored
      as VARCHAR.
    summary: >-
      One row per (Congress, bill type) the pre-BILLSTATUS backfill walked,
      recording the route's declared total against what the walk reached and
      filled. All columns are stored as VARCHAR.
    columns:
      congress: "The numbered Congress this walk record describes."
      bill_type: "The publisher's lowercase bill type the walk was addressed at; with `congress`, the unit's identity."
      declared_count: "The bill total the `bill/{congress}/{type}` route declared for this query, from the walk's first page."
      records_walked: "List records this run actually walked — the whole declared total when the walk completed, fewer when the per-run cap stopped it."
      pages_walked: "List pages fetched this run for this unit."
      list_completed: "Whether the walk reached the route's terminal page this run; false when the cap stopped it early."
      unwalkable_count: "List records that named no bill this walk could address (a type other than the one walked, or a number that is not a positive integer); counted so the unit can settle, since no identity exists to retry."
      repeated_count: "List entries repeating a bill already listed earlier in this walk. The route's `updateDate desc` order repeats a bill across a page boundary when its stamp ties (measured on the 92nd: hr 4634 twice, identical, in a walk whose declared and observed counts agreed at 767), so the declared total counts entries, not bills; a repeat is counted so the unit can settle and is never requested twice."
      backfilled_count: "Bills of this unit filled as of the end of this walk, from the retained state; never re-counted for a bill re-fetched because its stamp moved."
      observed_at: "When this walk's last captured list page was observed."


  # --- A8/A9 (laws and rosters): the laws and committee-rosters rollups ---
  laws:
    label: "Enacted laws"
    coverage: >-
      Sampled. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): `law/119` declared 108 and served 108 on
      one page for one keyed request, and all 108 became rows; the PLAW leg
      spent 108 keyless requests under its 300-per-run cap and established 102
      Statutes at Large citations. The Congress.gov law route for the scoped
      Congresses (the current one by default) is walked whole each run and
      every law it lists is a row; the PLAW USLM citation is added per law,
      newest first, under the per-run cap. A steady-state run is meant to ask
      only about laws whose list row moved or whose PLAW the bulk folder had
      not yet served. **The skip is design, not measurement**: D1 was a cold
      start, so nothing was held and nothing was skipped, and the saving
      described here has not been observed yet — the second run is what
      measures it.
    measured_on: "2026-09-19"
    data_quality: >-
      `statutes_at_large_cite` is NULL exactly when `uslm_outcome` is not
      `captured`. `unavailable` is the publisher's own lag, a `404` from the
      exact PLAW locator: on 2026-09-19 the route listed 108 laws and the PLAW
      bulk folder held 104, the four newest (119-103, 119-104, 119-109,
      119-110) absent, and both the capped proof run and the full measured run
      met exactly those four; each is retried every run until the folder
      serves it. `not_requested` marks a law the cap or a transport failure
      kept this run from establishing, retried too; a transport failure is
      never published as `unavailable`.

      The measured run also showed a third way into `not_requested` that the
      name does not suggest: the two private laws of the 119th
      (`PLAW-119pvtl1`, `PLAW-119pvtl2`) *were* requested and served, and the
      contract refused them because the USLM meta's `citableAs` names a
      private law number and no Statutes at Large citation. So the 108 rows
      divide 102 `captured`, 4 `unavailable` and 2 `not_requested`, and the
      last two are a contract refusal rather than a request not made. They are
      re-requested every run and will be refused again; the column says "no
      citation established", which is true, but it does not distinguish "not
      asked" from "asked and refused".

      A captured PLAW whose meta names no citation is refused, never published
      with a NULL citation beside a `captured` outcome. A law already captured
      is not re-read unless its list row's `update_date` moves. All columns
      are stored as VARCHAR.
    summary: >-
      One row per enacted law the Congress.gov law list route states, with the
      Statutes at Large citation from the law's own PLAW USLM file where
      captured. Keyed on the law's Congress, type and number, not on the bill;
      `bill_id` is the foreign key to `congress_bills`, whose
      `statutes_at_large_cite` the host fills from this table at that table's
      merge. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  law_code_sections:
    label: "Law classifications by Congress"
    coverage: >-
      Sampled. Measured on the same run (receipt
      `d1-measured-run-2026-09-19/`): the OLRC classification index linked
      both of the 119th's session tables, and reading each whole produced
      3,632 rows — 3,049 from the 1st session's table and 583 from the 2nd's.
      The index links the current Congress's session tables only; each linked
      public-law-order table for a scoped Congress is read whole every run and
      replaces that session's rows.
    measured_on: "2026-09-19"
    data_quality: >-
      A row is its position on the page (`seq`), because one line can repeat;
      a page read this run replaces every prior row for its Congress and
      session, so a line the publisher removed does not linger under a position
      it no longer holds. Only the public-law order is read: the code-order twin
      holds the same lines under positions that would collide with these. A
      Congress the index does not link — every Congress but the current one —
      gets no rows here; `table3_records` is the historical view. `action` is
      the page's column 3 verbatim, NULL where the page left it blank, which
      its legend reads as amended. All columns are stored as VARCHAR.
    summary: >-
      One row per line of an OLRC per-Congress classification table: a U.S.
      Code place one public law section touched, with the Statutes at Large
      page and the publisher's action word. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  table3_records:
    label: "Table III records"
    coverage: >-
      Sampled. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`), and the measurement is mostly a refusal:
      of the 106 public acts the law route listed (108 laws, less the 2
      private laws, which are not requested), 2 were read and produced 65
      rows, 5 were refused, and the walk then stopped for the Congress with 99
      acts unread — the per-run cap of 300 was never approached. One Table III
      page per public law the law route listed for the scoped Congresses,
      oldest first, under that cap. An act already published is not re-read.
      **The skip is design, not measurement**: D1 was a cold start, so nothing
      was held and nothing was skipped, and the saving described here has not
      been observed yet — the second run is what measures it.
    measured_on: "2026-09-19"
    data_quality: >-
      Two things keep rows out of this table, and the measured run met the
      second far harder than the first. Table III lags enactment by tens of
      laws (the 119th stood at 119-73 there while the law route reached
      119-110, measured 2026-09-14), and an act it does not yet hold answers a
      page cut off inside the site menu, which the reader refuses.

      The second is the publisher's transport. On 2026-09-19
      `uscode.house.gov` answered `GET /table3/{congress}_{n}.htm` with `200
      OK` and its headers, then closed the connection partway through the
      chunked body: `httpx` raises `RemoteProtocolError: peer closed
      connection without sending complete message body (incomplete chunked
      read)`, which the acquirer reports as a transport failure after its
      three retries. It is invisible to a status-code check, because the
      status line is a clean `200` — all 20 attempts on the five failing acts
      (15 of them retries) returned one.

      It is the publisher's and not the acquirer's, and it is a per-page
      truncation and not an outage. Both halves were re-derived outside the
      rollup with a plain `httpx.get`, no retries and no budget, against the
      same five acts plus one control act the same run had read whole: the
      five failed again and the control returned 63,493 bytes. The control is
      what carries the argument — five failures alone are equally consistent
      with the site being down. Retained as `table3-rederivation.json` in
      receipt `d1-measured-run-2026-09-19/`.

      The rollup's two guards did their job and bounded the damage: each
      refused act was stepped past and left to the next run, and three
      consecutive refusals ended that Congress's walk, so the run spent 25
      OLRC requests rather than 300 and stopped with 99 of the 106 public acts
      unread (108 laws listed, less the 2 private laws, which are never
      requested). Of the 2 acts that were read, 65 rows were published. A
      refused act holds nothing behind it and is retried next run, so the
      table fills as the publisher's body serving allows rather than failing
      the rollup.

      An act's page is read once: a later edit to it (a status moving to
      repealed) is not picked up, and `release_point` says how current the
      captured page was. Private laws and pre-1957 session-law chapters are
      not requested. All columns are stored as VARCHAR.
    summary: >-
      One row per classification record on one act's OLRC Table III page: which
      U.S. Code place each section of a public law went to, as the page states
      it. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  committees:
    label: "Committees"
    coverage: >-
      Sampled. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): `committee/119` declared 238 and served
      236, and all 236 rows had their detail folded on within the 300-per-run
      cap — 237 keyed requests in 264 seconds. The Congress.gov committee
      route for the scoped Congresses is walked whole each run, and the
      committee detail is folded onto each row under that cap, newest
      `update_date` first; a committee whose detail was captured is re-read
      only when its list row's `update_date` moves.
    measured_on: "2026-09-19"
    data_quality: >-
      The route over-declares: on 2026-09-19 `committee/119` declared 238 and
      served 236 on its one terminal page with no continuation. The reader's
      terminal-page count refusal is the one refusal this rollup reads past,
      publishing what the publisher served with both numbers in the run log;
      every other walk refusal fails the run. `detail_captured` says whether the
      detail's columns are the publisher's or NULL; where the detail was
      captured, its `subcommittees` are the row's, an empty list included. The
      detail's counts (`bill_count` and the rest) are that day's statement,
      dated by `detail_update_date`. All columns are stored as VARCHAR.
    summary: >-
      One row per committee or subcommittee the Congress.gov committee list
      route states, keyed on the publisher's `systemCode`, with the detail
      record's history, subcommittees, parent and currency folded on where
      captured. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  committee_assignments:
    label: "Committee assignments"
    coverage: >-
      Sampled. Measured on the same run (receipt
      `d1-measured-run-2026-09-19/`): 2,966 seats from two keyless file
      captures — the House Clerk's file stating Congress 119 session 2 with
      441 seats, 2 vacant, 2,516 assignments and 9 placeholders, and the
      Senate's with 100 senators over 450 seats. Today's seats: both chamber
      files are captured whole each run, for the current Congress only, and
      each capture replaces its chamber's rows for that Congress; an earlier
      Congress keeps its last capture.
    measured_on: "2026-09-19"
    data_quality: >-
      A row is a seat the file listed on its `file_date`: a seat the file no
      longer lists is gone on the next capture. The House file states its
      Congress and the reader proves it; the Senate file states none, so its
      rows carry the caller's Congress with `congress_basis` = `caller`. A House
      vacancy has no member and no row, and a seated member whose only
      assignment is the file's `<committee rank=""/>` placeholder has none
      either (nine placeholders on 2026-09-19). Only a file captured this run
      replaces its chamber's rows; a chamber whose file was not established
      keeps its prior rows. `system_code` joins `committees`; `bioguide_id`
      joins `members`. All columns are stored as VARCHAR.
    summary: >-
      One row per member per committee or subcommittee seat a chamber roster
      file lists today, from the House Clerk's MemberData.xml and the Senate's
      cvc_member_data.xml. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  # The Congress.gov index tables (gaps A5, A7, A10), each written by its own
  # rollup in pipelines/rollups/congress_index.py over one walk
  # (transforms/build_congress_index.py).
  house_communications:
    label: "House executive communications"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): the whole `house-communication/119` walk
      declared 4,975 and served 4,975 over 20 pages, 12 of them repeats across
      a page boundary, so 4,963 distinct rows were published; 1,000 details
      were read under the per-run cap and 3,963 rows were published list-only,
      at 1,020 keyed requests in 479 seconds. Each run walks the whole list
      for the Congresses in scope and reads the detail of every communication
      the table does not yet hold, newest `updateDate` first, at most 1,000 a
      run; the index is complete after the first run. How many runs the
      details take to converge is deliberately not stated: dividing the 3,963
      outstanding by the 1,000 cap would assume the publisher adds nothing and
      that no held row's stamp moves to force a re-read, and one cold-start
      run measures neither. **The skip is design, not measurement**: D1 was a
      cold start, so nothing was held and nothing was skipped, and the saving
      described here has not been observed yet — the second run is what
      measures it.
    measured_on: "2026-09-19"
    summary: >-
      One row per House executive communication, as the Congress.gov
      house-communication list and detail routes state it, keyed on the
      publisher's own address. The regulatory bridge: `is_rulemaking`, the cited
      `legal_authority`, the committee referral, the matching House requirement
      and the RIN read from `report_nature`, which joins `federal_register.rin`.
      All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `committees_json` is NULL is list-only: its detail has not been
      read yet (not reached under the cap, or refused), and every detail-only
      column is NULL with it, including the three RIN columns, because the rule
      was not run. A row whose detail was read states `[]` where the detail lists
      none. The RIN is an interpretation: `rin_rule` names the rule that fired
      (`report_nature_rin_label`) or `unmatched`, and `rin_matched_text` is the
      exact text, so a false positive is readable from the row. The publisher
      repeats a record across a page boundary (15 of 4,975 on the 119th); the
      table holds each identity once.
    columns_from: spicy_docs

  committee_meetings:
    label: "Committee meetings"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): the whole `committee-meeting/119` walk
      across all three chambers declared 2,754 and served 2,754 over 12 pages
      with no repeat, all published; 993 details were read, 7 were refused and
      1,754 rows were published list-only, at 1,005 keyed requests in 412
      seconds. Each run walks the whole list for the Congresses in scope and
      reads the detail of every meeting the table does not yet hold, newest
      `updateDate` first, at most 1,000 a run.
    measured_on: "2026-09-19"
    summary: >-
      One row per scheduled committee meeting, as the Congress.gov
      committee-meeting list and detail routes state it, keyed `(congress,
      chamber, event_id)`. The detail carries the hearing transcript jackets
      (`hearing_transcripts` joins on `event_id`), the related bills, the
      witnesses and every document URL. All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `committees_json` is NULL is list-only: its detail has not
      been read yet, and every detail-only column is NULL with it; a read
      detail states `[]` where it lists none. Event ids are keyed with their
      chamber because their uniqueness across chambers is unmeasured
      (spicy-docs' contract note); the 119th's House ids sit near 119,000 and
      its Senate ids near 338,000.

      One refusal class is the publisher's own vocabulary. Measured
      2026-09-19, 7 of the 2,754 listed meetings state a chamber the detail
      route will not spell — the list row carries no usable chamber, so
      `list_route_url` refuses it with "chamber must be 'house', 'senate' or
      'joint'" and the row is published list-only with its refusal counted.
      These 7 are permanent, not transient: the same list row will be refused
      every run, so they stay list-only until the publisher restates the
      chamber. They are visible as rows whose key names no chamber.
    columns_from: spicy_docs

  record_issues:
    label: "Daily Congressional Record issues"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): volumes 171 and 172 declared 219 and 144
      and served exactly that, one page each and no repeat, and every one of
      the 363 details was read inside the 1,000-per-run cap — 365 keyed
      requests in 130 seconds, so this table reaches a complete state in a
      single run at the 119th's size. Each run walks the whole
      `daily-congressional-record/{volume}` list for each session volume of
      the Congresses in scope and reads the detail of every issue the table
      does not yet hold, newest `updateDate` first.
    measured_on: "2026-09-19"
    summary: >-
      One row per daily Congressional Record issue, keyed `(volume, issue)`, the
      publisher's own identity. The detail's section names give `chambers`, the
      legislative-day calendar (which chambers sat), and the whole-issue link's
      stem gives the GovInfo CREC `package_id`. The volume is the year minus
      1854 (volume 172 is 2026). All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `sections_json` is NULL is list-only: its detail has not been
      read yet, so `chambers`, `package_id` and every other detail-only column
      are NULL with it. A read detail with no chamber section (a Daily Digest
      only) states an empty `chambers`, distinct from NULL.
    columns_from: spicy_docs

  treaties:
    label: "Treaty documents"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): `treaty/119` declared 2 and served 2 on
      one page, and both details were read — 3 keyed requests in 13 seconds, a
      complete table in one run. Each run walks the whole `treaty/{congress}`
      list for the Congresses in scope and reads the detail of every
      unpartitioned treaty the table does not yet hold, newest `updateDate`
      first, at most 1,000 a run.
    measured_on: "2026-09-19"
    summary: >-
      One row per treaty document, as the Congress.gov treaty list and detail
      routes state it, keyed `(congress_received, number, suffix)`. `package_id`
      is the GovInfo CDOC id by the `CDOC-{congress}tdoc{number}` rule on an
      unpartitioned treaty. All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `titles_json` is NULL is list-only. A partitioned treaty (a
      non-empty `suffix`) is always list-only: the publisher's suffixed detail
      address has no route in spicy-docs' `LIST_ROUTES`, so its detail is never
      asked for and its `package_id` is NULL by the contract's own rule.
    columns_from: spicy_docs

  nominations:
    label: "Nominations"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): the whole `nomination/119` walk declared
      2,208 and served 2,208 over 9 pages, 4 of them repeats across a page
      boundary, so 2,204 distinct rows were published — 9 keyed requests in
      2.7 seconds. Each run walks the whole list for the Congresses in scope;
      there is no detail route, so every row is complete from the list and is
      republished each run, the fresh row winning.
    measured_on: "2026-09-19"
    summary: >-
      One row per nomination or part, as the Congress.gov nomination list route
      states it, keyed `(congress, citation)`; the citation carries the part
      number. All columns are stored as VARCHAR.
    data_quality: >-
      The publisher repeats a record across a page boundary (4 of 2,208 on the
      119th); the table holds each citation once. The list carries the latest
      action only, not the action history.
    columns_from: spicy_docs

  house_activity_reports:
    label: "House committee activity reports"
    coverage: >-
      Sampled, and measured on one cold-start pair of runs 2026-09-20 (receipt
      `rollups-pdf-families-2026-09-20/`). The GovInfo `published` CRPT window
      from the 2023-01-01 issue floor served **2,256 packages, of which 41
      matched the activity-report title rule, and all 41 published** — 8 of the
      117th Congress, 27 of the 118th, 6 of the 119th. Zero refusals, 5,191
      pages read against 5,191 the publisher states, so **`pages_capped` is
      false on every row** and no count here is a window's. Two runs because
      the 40-package cap was reached inside CRPT on the first; the second
      skipped all 40 already-published packages at zero request cost and
      finished the window. 84 then 52 keyed requests. The floor is a scope,
      not a coverage claim: GovInfo's CRPT collection reaches 1817 and no walk
      of an earlier window has been made, here or in spicy-docs.
    measured_on: "2026-09-20"
    summary: >-
      One row per captured end-of-Congress House committee activity report
      package, with what its print adds to its own MODS index. Joins
      `document_citations` on `package_id` = `document_key` and
      `text_sha256`. All columns are stored as VARCHAR.
    data_quality: >-
      **The MODS is authoritative for bills, laws and Code sections, and this
      table's own columns say so.** Read at full page depth across the eight
      reports spicy-docs sampled, the print named 0 of 1,406 bills, 0 of 174
      public laws, 0 of 37 U.S. Code sections and 0 of 7 Statutes at Large
      pages that the package MODS does not already state — so
      `distinct_bills_beyond_index`, `distinct_laws_beyond_index` and
      `distinct_usc_sections_beyond_index` are near zero, and a nonzero one is
      worth reading the evidence span for rather than taking as new yield.
      Measured here 2026-09-20 over **41** reports rather than eight, "zero"
      is very nearly right and not exactly right: 7 print-only bills of 7,686
      distinct, 5 print-only laws of 990, and 6 print-only Code sections. The one apparent
      survivor, `188-11`, was the print's own misprint of `118-11`. What the
      print does add is committees beyond the submitting one (27 resolved
      codes), 87 RINs, 38 agency dockets and 5 GAO product ids.
      `committees_unresolved` is **a floor, not a defect count**: the Senate
      `cvc` roster states only the committees its listed senators sit on, so a
      name it does not reach stays unresolved rather than being guessed.
      `stated_page_count` is the publisher's own `pages` field and is never
      re-derived from the bytes; `pages_read` is what the extraction saw, and
      the two are reported separately on purpose (CRPT-118hrpt965 states 282
      and a 60-page read saw 60). `submitted_by_bioguide_id` is NULL where the
      publisher states the member without an id, which CRPT-118hrpt965 does.
    columns_from: spicy_docs

  budget_volumes:
    label: "President's budget volumes"
    coverage: >-
      Sampled, and measured on one cold-start run 2026-09-20 (receipt
      `rollups-pdf-families-2026-09-20/`). The GovInfo `published` BUDGET
      window from the 2023-01-01 issue floor served 40 packages; **23 published
      and 17 did not**, for the reason in the data-quality note below. The 23
      cover fiscal years 2023 to 2027 across all six parts the package-id
      grammar accepts — `APP` 4, `BALANCES` 4, `BUD` 4, `FCS` 4, `MSR` 4, `PER`
      3. Zero refusals, 7,154 pages read whole rather than capped, which is the
      difference that matters for this family: across those volumes the print
      names 2,237 distinct public laws and **2,081 of them are absent from the
      volumes' own MODS**. No earlier fiscal year has been walked here or in
      spicy-docs, so the earliest the collection serves is unmeasured rather
      than known.
    measured_on: "2026-09-20"
    summary: >-
      One row per published volume of the President's budget, with what its
      print adds to its own MODS index. Six parts — `APP` Appendix,
      `BALANCES`, `BUD`, `FCS` Federal Credit Supplement, `MSR` Mid-Session
      Review, `PER` Analytical Perspectives. All columns are stored as
      VARCHAR.
    data_quality: >-
      **The bill counts are congress-blind and are not join keys.** A BUDGET
      package states no Congress anywhere — not in its id, not in its summary
      — so the print can only spell `HR7806` where the MODS states
      `119-hr-7806`. `distinct_bills` and
      `distinct_bills_beyond_index_congress_blind` therefore reduce **both**
      sides to `{bill_type}-{number}` before comparing, which is why the
      column carries `congress_blind` in its name; neither can join
      `congress_bills.bill_id`, which needs the Congress this family never
      states. For the same reason the per-row `stated_by_index` on a
      `bill_number` citation of a budget volume is **NULL, not `false`**: the
      comparison was not possible, and answering `false` would report a
      comparison nobody made. Measured across the eight volumes spicy-docs
      sampled at full page depth, 6 of the 8 distinct printed bills are
      print-only. The family's real yield is laws: **504 of 518** distinct
      public laws the prints name are absent from their own MODS at full page
      depth, against 43 of 69 at a 60-page cap. `fiscal_year` is not the issue
      year — `BUDGET-2026-MSR` was issued 2025-09-05 — and is stated twice, by
      the package id and by the MODS, which spicy-docs asserts agree.
      `associated_bills_json` is published whole because it is the only
      statement of this edge that carries a Congress.


      **Seven budget parts are not carried, and the rollup refuses them by
      name rather than guessing.** The package-id grammar seals six parts —
      `APP`, `BALANCES`, `BUD`, `FCS`, `MSR`, `PER` — measured over a
      2025-01-01 window. Walking from 2023-01-01 on 2026-09-20 served **17
      further real budget packages whose part is outside that six**:
      `OBJCLASS` (FY2024-FY2027), `TAB` (FY2024-FY2027), `DB` (FY2024, 2025,
      2027), `CLIMATE` (FY2024, 2025), `LRB` (FY2024, 2025), `CROSSCUT`
      (FY2026) and `DOD` (FY2026). Each is logged and dropped before it costs
      a request, which is the designed behaviour — an address that was never
      measured is not an address — but it means this table covers six parts of
      thirteen. Widening the grammar is spicy-docs', because a package-id
      grammar is a published shape this repository does not restate; the
      packages are enumerated again every run and publish as soon as it moves.
    columns_from: spicy_docs

  bill_committee_actions:
    label: "Committee-print bill actions"
    coverage: >-
      Derived, and bounded by its input — measured on the same 2026-09-20 runs.
      **12,700 rows over 3,010 distinct bills and 25 print phrasings**, from
      the 41 activity reports `house_activity_reports` published. Built from
      the same bodies, so it inherits that table's window, floor and per-run
      package cap, and rows appear only for a package fetched in the run.
      10,848 rows are `single` and 1,852 are `multi` (85.4 percent single,
      against the 91.8 percent spicy-docs measured on its eight-report sample);
      `sealed_stage` is filled on 7,450 and NULL on 5,250.
    measured_on: "2026-09-20"
    summary: >-
      One row per action phrase a committee print states about one bill it
      names in the same sentence: the print's own phrasing, the sealed stage
      and BILLSTATUS action codes it maps to, and how reliable the pairing is.
      Joins `document_citations` through `document_key`, `text_sha256` and
      `mention_span_start` = `span_start`. All columns are stored as VARCHAR.
    data_quality: >-
      **The error rate is a column, not a footnote, and you must filter on
      it.** `attachment_confidence` is `single` where the sentence names one
      bill and `multi` where it names several. Hand-checked over 60 mentions
      by spicy-docs: a `single` row is both the right kind of action and the
      right bill **83.3 percent** of the time (30 of 36), a `multi` row **50
      percent** (2 of 4). `WHERE attachment_confidence = 'single'` is the
      trusted view; it cost 8 percent of the volume in that sample (4,089 of
      4,456 rows were `single`). `multi` rows are kept rather than dropped
      because `sentence_start`, `sentence_end` and `matched_text` make them
      readable, and `bills_in_sentence` is published raw so a consumer can set
      its own threshold. **Precision is not recall: recall is 59.6 percent**,
      re-weighted by stratum over 148 checked contexts. The print writes "the
      bill" after naming it once, sets an en-bloc disposition as a sentence
      about "the measures", and states a committee consideration date in a
      ruled table's column header — so a consumer counting hearings from these
      rows is counting a floor. `sealed_stage` is **NULL on 1,670 of 4,456
      rows** and that is a finding rather than a gap: a rung is never invented,
      so `passed the House` stays NULL rather than widening the sealed
      `passed house` matcher. `billstatus_action_code` is NULL on 280 rows
      whose phrasing has no known code at all (`vetoed`, `not_considered`,
      `declined_markup`, `favorably_forwarded`, `included_in`), and a further
      639 rows are coded through codes the publisher's own retained guide
      never lists — 13 of the 35 distinct codes in the retained responses
      appear nowhere in its action-code table, which the guide itself says is
      representational rather than authoritative. `stated_date` is extracted
      and published but **was never scored**: nothing establishes that the
      date the sentence states belongs to this action. On a 20-bill probe the
      publisher had no counterpart at all to 10 of the 15 subcommittee
      hearings these prints state, while all 8 markups were stated and coded —
      which is what this table is for.
    columns_from: spicy_docs

  document_citations:
    label: "Document citation link table"
    coverage: >-
      Derived, and bounded by its two source families' windows — measured on
      the same 2026-09-20 runs. **49,792 rows over 13 citation kinds** from 41
      activity reports and 23 budget volumes: 25,714 bill numbers, 9,497 public
      laws, 7,318 committee names, 6,028 U.S. Code sections, and the rest
      across Statutes pages, GAO product ids, RINs, CFR sections, agency
      dockets, Federal Register cites, U.S. Reports cites, case dockets and CRS
      report ids. **Every one of the 49,792 carries an `evidence_page`**,
      because both families are read from a paginated rendition. `document_kind`
      says which family a row came from — 35,327 `govinfo_package` and 14,465
      `budget_volume`.
    measured_on: "2026-09-20"
    summary: >-
      One row per occurrence of one cited key in one document's text: the key,
      the exact characters that named it, and the character span it was read
      at. Thirteen citation kinds, from bill numbers and public laws to RINs,
      agency dockets and GAO product ids. One shared link table over every
      document family, written by exactly one rollup. All columns are stored
      as VARCHAR.
    data_quality: >-
      **The span is in the identity because the span is the yield.** Keying on
      document, kind and target alone would collapse CRPT-118hrpt968's 267 bill
      mentions into 179 rows; the aggregate is derivable from this table with
      `GROUP BY document_key, cite_kind, target_key` and the reverse is not.
      **The table is append-only per text digest.** `text_sha256` is in the
      identity, so a re-extraction of the same document under a newer rule set
      adds rows beside the old ones rather than retiring them — filter to the
      digest the document row states (`house_activity_reports.text_sha256` or
      `budget_volumes.text_sha256`) to read one extraction. `stated_by_index`
      is three-valued and the third value matters: `true`/`false` where a
      keyed index record was read and could state a key of this shape, and
      **NULL where no comparison was possible** — either no index record was
      supplied or the MODS vocabulary has no element of that shape, which is
      the case for every bill citation of a budget volume. So the consumer
      predicate for "what the print adds" is `WHERE stated_by_index IS NOT
      TRUE`, never `= false`. `target_resolved` false means the cite was found
      and its key is unsettled, not that the cite is wrong. `target_rule` says
      **how** a key was reached and separates lookups from inferences:
      `exact` and `roster_prefix` are lookups against a supplied vocabulary,
      while `name_prefix` and `sibling_prefix` are inferences from the printed
      text that a consumer may decline. `evidence_page` is NULL where the
      rendition states no page boundary, and a match straddling a page break
      is attributed to the page it began on.
    columns_from: spicy_docs

  senate_expenditures:
    label: "Secretary of the Senate expenditure tables"
    coverage: >-
      Sampled — the sample is a page window inside each file, and it was
      measured on one cold-start run 2026-09-20 (receipt
      `rollups-pdf-families-2026-09-20/`). The GovInfo `published` CDOC window
      from the 2024-01-01 issue floor served **291 rows and matched 5**
      Secretary-of-the-Senate reprints; the 4-package cap read **4 of them**,
      eight granule files, 640 pages, 556 tables, **2,623 ruled rows**, zero
      refusals, 21 keyed requests. `GPO-CDOC-118sdoc11` was not reached and is
      read on the next run — the window is walked whole every run so that is
      true. **Every count over this table is a floor on the volume**: each
      report runs 1,259 to 1,542 pages a file and only the first 80 of each are
      read, so `pages_capped` is `true` on all 2,623 rows. Those 80 pages carry
      the `A-` summary-of-transactions section and the start of the `B-`
      detailed statement; the `C-` compensation-of-members and `D-`
      mail-allocation sections the contents page names sit past page 2,000 and
      are not reached.
    measured_on: "2026-09-20"
    summary: >-
      One row per ruled row of one ruled table on one page of a Report of the
      Secretary of the Senate, with the cells exactly as the print states them
      and the roles its own header band names. Keyed on package, file, page,
      table, row and the page text's digest — the package id alone is not a
      key, because the publisher publishes the same printed pages as both a
      Full Report and a Part. All columns are stored as VARCHAR.
    data_quality: >-
      **Most rows carry one cell, not a row of cells, and `cells_ruled` is how
      you tell.** Of 227 ruled body rows across the 160 pages spicy-docs
      measured, the 56 in an `appropriation_summary` grid carry all nine cells
      and every other one carries exactly **one** cell of ten or of seven: the
      print rules a whole payee block as a single cell. That is why the
      contract has no `payee_name`, `document_number`, `date_posted` or
      singular `amount` column — those would be a parse of one cell's
      newlines presented as separate facts. `WHERE cells_ruled` selects the
      rows whose cells are separate facts; everything else is in `cells_json`
      exactly as printed. **`cells_json` is the row**; every other content
      column is a promotion out of it. `office`, `funding_year`,
      `appropriation_title` and `section_heading` are read from the page text
      and are **NULL on a continuation page**, which is 56 of the 139 measured
      table pages — forward-fill them in `printed_page` order. `printed_page`,
      not `page`, is what the report's own contents index by. `grid_kind` is
      NULL where the first row states none of the three known labels, so an
      unrecognised grid is visible rather than mislabelled. An amount must
      carry a decimal point to be parsed into `amounts_json`: without that
      rule a bare integer read stacked fiscal years and account numbers as
      money, and of 1,316 amount-shaped lines measured every one carries a
      `.dd` tail while the 143 that do not are all account numbers or fiscal
      years. The check that makes the extraction falsifiable is the print's
      own `Totals` row, which agreed to the cent with the sum of 28 account
      rows over seven money columns on both measured sections.
    columns_from: spicy_docs
