      cap fixed at four and model calls disabled.
      Receipt: `rollups-0-24-0-adoption-2026-09-20/`. Local output only; not uploaded.
    measured_on: "2026-09-20"
    summary: >-
      One row per committee or subcommittee a bill reached, as its BILLSTATUS
      document names it. `referral_signal` is set only for the six appropriations
