      transaction_type: Literal source transaction-type code; direction and gross/net treatment require the applicable
        definitions.
      counterparty_type: Native entity-type classification of the reported counterparty; not proof of a matched person
        or organization.
      counterparty_name: The counterparty's name as reported, without a name-based identity merge.
      counterparty_city: The counterparty's reported city.
      counterparty_state: The counterparty's reported state value.
      counterparty_zip: The counterparty's reported postal code, preserving leading zeroes.
      employer: Employer name reported for the contributor or other named person; not an inferred organization identity.
      occupation: Occupation reported by the source for the named person.
      other_native_id: Literal other-entity reference from the source; transaction definitions determine its role
        and namespace.
      transaction_id: Literal transaction identifier within its source filing/layout scope; not a globally unique
        transaction or economic-event key.
      report_number: Literal source file/report number, retained separately from source row, image and transaction
        identifiers. A filing join requires a qualified number namespace.
      memo_indicator: Literal memo flag from this layout. Eligibility depends on source definitions and analytic purpose;
        no blanket memo exclusion is implied.
      memo_text: Source memo or explanation text associated with the reported record.
      source_record_identifier: Source-reported row identifier such as sub_id; it is not promoted to a global event
        key or file number.
      reported_direction: Source-supported money-flow direction, or explicit unresolved state. The reporting committee
        is not assumed to be sender or recipient.
      transaction_population: Source population represented by the transaction file or route; separate populations
        may overlap.
      amount_raw: Literal source value before conversion for amount. Preserves spelling, signs and empty values; the
        typed value and its status are separate.
      amount_status: Source-presence or conversion state for amount, distinguishing supported values from NULL, empty,
        missing or refused interpretation; it does not establish financial eligibility.
      transaction_date_raw: Literal source value before conversion for transaction_date. Preserves spelling, signs
        and empty values; the typed value and its status are separate.
      transaction_date_status: Source-presence or conversion state for transaction_date, distinguishing supported
        values from NULL, empty, missing or refused interpretation; it does not establish financial eligibility.
      source_cycle: Election cycle established by the selected source evidence. Distinct from transaction year, candidate
        election year and agency fiscal year.
      amount: Exact decimal for the source-reported amount for this record and its amount_kind. Signs are preserved;
        use the corresponding status and source-specific financial policy before adding observations.
      transaction_date: Date parsed from the transaction date reported by the source. NULL requires the source value
        and conversion status; capture time is not substituted.
      candidate_id: Literal FEC candidate identifier when the source reports one. Syntax checks do not prove identity
        resolution or a target match.
    data_quality: Exact decimals preserve signs. Memo, subtotal and attribution flags require source-specific interpretation;
      successful mapping does not qualify current, gross or net totals. Keep reported balances, allocation totals/components,
      overlapping summaries and two-sided transfers at their declared grains. Quality notices do not automatically
      exclude records.
