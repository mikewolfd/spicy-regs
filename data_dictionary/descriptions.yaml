  report_sections:
    label: "Committee report heading and text blocks"
    coverage: >-
      Sampled. The 2026-09-21 mikewolfd/spicy-regs fork delivery rebuilt and published all
      1,246 heading/text blocks from the 105 selected reports in one five-table generation.
      Every report body text digest and section span was independently checked; all 12,460
      prior non-agency section values remained unchanged. heading retains the source title
