  amendments:
    label: "Amendments"
    data_quality: >-
      The publisher's `updateDate desc` order repeats an amendment across a
      page boundary when stamps tie, the same shape measured on the bill and
      communication routes. On the cold-start walk of the 119th (2026-09-19)
      7,066 records were served and 7,016 distinct identities retained locally: 50
      repeats were collapsed, the fresh row winning. The declared total counts
      entries, not amendments, so a walk whose declared and served counts
      agree has still not delivered 50 of the amendments it counted; the next
      whole walk delivers them. All columns are stored as VARCHAR.
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): with no prior table the window is open,
      so the run was a full walk of the 119th — 7,066 amendment records over
      29 pages in 101 seconds, produced locally as 7,016 rows after 50 repeated
      identities were collapsed. The Congress.gov amendment route for the
      Congresses the rollup is scoped to, walked in an `updateDate` window
      that starts at the watermark this table already reached and runs forward
      at most ninety days. **The watermark window is design, not
      measurement**: the measured run had no prior table, so it took the open
      window and no narrowed one has been observed — the second run is what
      measures it. Local output only; not uploaded.
    measured_on: "2026-09-19"
    summary: >-
      One row per amendment, as the Congress.gov amendment list route states it.
      Keyed on the amendment's own identity, not the bill it amends, because an
      amendment can amend another amendment; `amended_bill_id` and
      `amended_amendment_id` are foreign keys. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  press_releases:
    label: "Appropriations press releases"
    coverage: >-
      Window. Measured on one run (receipt `d1-measured-run-2026-09-19/`): the
      two feeds were live with 10 House and 15 Senate items, and 5 of the 25
      named one of the 18,906 bills held locally for the 119th. Each feed is a
      rotating window the publisher trims, so a single capture is only what
      was live that day; the table accumulates across runs and keeps every
      release ever captured. It does not reach back before the first capture.
      Local output only; not uploaded.
    measured_on: "2026-09-19"
    summary: >-
      One row per item in one appropriations committee press-release feed capture.
      `bill_id` names the bill a release mentions, where one of the published bills
      in scope was named in the title or the description text. All columns are
      stored as VARCHAR.
    data_quality: >-
      The bill linkage is a pattern match over the release's own words, not a
      publisher statement, so `matched_field` and `matched_text` carry what was
      matched and where: a false positive is readable from the row rather than only
      by re-running the matcher. One pattern is compiled per published bill in the
      Congresses in scope, bounded on both sides and built from the bill's own type,
      so a bare number matches nothing. Three states are distinct and must not be
      read as one: a `bill_id` with `match_rule = bill_number_in_title` or
      `bill_number_in_excerpt` is a match; `match_rule = unmatched` with a NULL
      `bill_id` means the matcher ran and no published bill was named; an all-NULL
      `match_rule` means no matching pass ran at all, because no `congress_bills`
      table was published when the rollup ran, or none was published for that
      release's Congress, or the release states no readable `pub_date` to scope by.
      The Senate feed carries no item description, so a Senate release can only ever
      match on its title.
      One consequence worth knowing before relying on these four columns: a run that
      cannot read `congress_bills` republishes the whole live window with NULL match
      columns, because this table merges row-wise and a fresh row wins whole. The
      next run that can read it re-derives them for every release still in the feed,
      so the gap normally lasts one cycle — but a release that rotates off the feed
      during that cycle keeps the NULL permanently. The other publisher columns are
      unaffected; only these four degrade.
    columns_from: spicy_docs

  roll_call_votes:
    label: "House roll-call votes"
    coverage: >-
      Sampled, and accumulating. Measured on one cold-start run (receipt
      `d1-measured-run-2026-09-19/`): the `house-vote` index listed 676 House
      votes for the 119th, 577 of which the linkage rule could index, and all
      577 were fetched from the Clerk under the 1,500-per-run cap with no
      refusal — 4 keyed and 577 keyless requests in 310 seconds, 577 rows
      produced locally from an empty prior. Local output only; not uploaded.
      House only, and bounded by that per-run
      cap on how many roll calls are fetched, newest first. A roll call
      already published with a tally is not fetched again, so a steady-state
      run is meant to read only new ones plus the newest few, which are
      re-read in case the publisher corrected them. **The skip is design, not
      measurement**: D1 was a cold start, so nothing was held and nothing was
      skipped, and the saving described here has not been observed yet — the
      second run is what measures it. The Senate's roll calls are not
      published at all rather than published with empty tallies — there is no
      Senate index route in the reader this rollup uses, and a set of Senate
      roll calls reached from bills is not an index of a session's roll calls.
      A House roll call that a bill's own action names can be published a cron
      before the Congress.gov vote index lists it, since the two linkage
      sources are read independently and the Clerk file is addressable from
      the roll-call key alone; such a row carries the same tally and member
      positions as any other, so this widens timeliness rather than the
      coverage claim. `vote_date` keeps the Clerk's own spelling
      (`9-Sep-2025`), which does not sort as a date, so no range over it is
      quoted here.
    measured_on: "2026-09-19"
    summary: >-
      One row per roll call: the publisher's own tally, and the bill it refers to.
      The four tally columns are the publisher's own counts or they are NULL; they
      are never zero-filled. All columns are stored as VARCHAR.
    data_quality: >-
      The bill linkage has two publisher sources and `match_rule` says which one
      answered. `bill_action_recorded_vote` is a `recordedVotes` entry on the bill's
      own action, read from `bill_vote_references`; `house_vote_legislation` is the
      `house-vote` listing's own `legislationType`/`legislationNumber`. The first
      wins a disagreement, because a recorded vote sits on the bill's own action
      while the listing states a fact about the roll call from outside it.
      `conflict_count` is per roll call, not per run: it counts the later references
      that named a different bill for *this* roll call, and they are kept rather
      than dropped. `match_action_index` is set only on a recorded-vote match, since
      a listing reference sits on no action. With no bill-family run published, the
      listing linkage alone fills these columns.
    columns_from: spicy_docs

  member_votes:
    label: "Member vote positions"
    coverage: >-
      Sampled, and accumulating. Measured on the same cold-start run as
      `roll_call_votes` (receipt `d1-measured-run-2026-09-19/`): 249,099
      member positions across its 577 roll calls, an average of 432 a roll
      call. One row per member per roll call in `roll_call_votes`, so it
      inherits that table's House-only scope, per-run cap and
      skip-what-is-already-held behavior exactly.
    measured_on: "2026-09-19"
    summary: >-
      One row per member's position on one roll call. `position` keeps the
      publisher's own word (the Clerk spells both Aye/No and Yea/Nay) and
      `position_normalized` carries the fold, so a count and a quotation are both
      answerable. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  members:
    label: "Legislators"
    coverage: >-
      Sampled. Measured on one run (receipt `d1-measured-run-2026-09-19/`):
      both roster files — current and historical — were captured whole in two
      keyless requests and 2.6 seconds, yielding 12,770 legislators. The run
      confirms the capture is whole rather than a slice; the statement stays
      "Sampled" because the claim this table makes is about the crosswalk's
      own completeness, which no run of ours can establish, and because the
      machine-readable kind is a published contract value that should not move
      without a change in what is fetched.
    measured_on: "2026-09-19"
    summary: >-
      One row per legislator in one capture of the community crosswalk. Split from
      `member_terms` because one row cannot hold a chamber switch. All columns are
      stored as VARCHAR.
    columns_from: spicy_docs

  member_terms:
    label: "Legislator terms"
    coverage: >-
      Sampled. Measured on the same run as `members` (receipt
      `d1-measured-run-2026-09-19/`): 45,535 terms over those 12,770
      legislators, an average of 3.6 terms each. Every term of every
      legislator in `members`, in the crosswalk's own order, from the same
      whole capture.
    measured_on: "2026-09-19"
    summary: >-
      One row per term a legislator served, in the crosswalk's own order. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  committee_reports:
    label: "Committee reports"
    coverage: >-
      Sampled. The 2026-09-21 mikewolfd/spicy-regs fork delivery rebuilt and published all 105
      selected report packages with 13 selected hearings as one five-table generation. All 118
      package bodies and 13 hearing details were accepted; two exact retained package capture
      sets were reused and 116 acquired fresh. Every selected report was reprocessed under
      SpicyDocs 0.26.0; nine letter spans reproduced their retained text digests. This is a
      mixed-Congress selection, not complete historical or constituent-granule coverage. No
      upstream/default publication is asserted. Receipts:
      fork-execution-2026-09-21/report-family/rebuild-audit.json,
      publication-report-family.json and report-family-mcp-audit/.
    measured_on: "2026-09-21"
    summary: >-
      One row per captured GovInfo committee report package. `bill_id` is the
      measure the report accompanies, read from the package's own MODS metadata. All
      columns are stored as VARCHAR.
    data_quality: >-
      Only the MODS PRIMARY bill fills bill_id. The thirteen CBO columns come from spicy-docs
      read_cbo_estimate on the same body already acquired. The cover recital gates publication
      of a letter: a CBO heading alone is not an estimate. report_states_estimate=false
      records an absent recital; NULL means the rule has not run. A positive recital with no
      resolved letter span remains distinct from an extracted letter. recital_bill_id comes
      from the printed recital and is retained beside the MODS bill_id. Only root-package MODS
      fields supply the package join. CRPT-119hrpt494 has PRIMARY H.R. 3495 references in two
      constituent-granule records but none at the package root, so bill_id remains NULL; its
      separate recital_bill_id is a text interpretation. Constituent body coverage is not
      asserted.
