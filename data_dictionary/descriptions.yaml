    columns_from: spicy_docs

  committee_report_reads:
    identity_columns: [package_id]
    measured_on: "2026-09-28"
    label: "Committee-report acquisition checkpoints"
    coverage: >-
      Not a range. One checkpoint per selected report or hearing package read,
      with its outcome. Complete includes hearings with zero cover links; it
      does not assert a positive relationship or complete source history.
    summary: >-
      One row per package observed or inherited from this rollup's prior
      tables. Pending reads precede discovery under the declared body cap.
    columns:
      package_id: "GovInfo package ID and checkpoint identity."
      last_modified: "Publisher timestamp requested, replaced by the acquired summary timestamp on success."
      outcome: "pending, refused, refused_final, detail_refused or complete. complete permits an unchanged skip; so does refused_final, a refusal every run would repeat (a body past the byte bound, parts past the request budget, no rendition taken) until the package's last_modified or the rule moves. A body past the bound rests on the size its response stated (rule_version ends refused-under=size=<bytes>) and is read again only when the bound grows past that size; any other rests on the bounds rule_version names. refused and detail_refused are read again every run."
      rule_version: "The rules a package was read under: for a report, the installed SpicyDocs code digest (not its release string), the CBO and section readers and this repository's part and body rules; for a hearing, the hearing-link rule and the body rule. A changed token forces another read."
      observed_at: "UTC time this rollup recorded the checkpoint."

  native_legal_references:
    measured_on: "2026-09-27"
    label: "Native legal-reference observations"
    coverage: >-
      Sampled. Observations from the complete retained eCFR Title 1, requested
      as of 2026-08-10, and USC Title 1 release 119-103. Selected public target
      tables resolve some occurrences; missing, unsupported and unqueried
      targets remain explicit. Rows read before spicy-docs 0.52.0 name
      native-legal-reference/002, the reading this repository ran; the next
      build names /003, which re-spells target_candidates_json that held a
      non-ASCII character and re-versions the text candidates citation rules
      004 read, and moves no other value. Receipt:
      native-legal-full-2026-09-27/resolved-verification.json.
    summary: >-
      Selected eCFR AUTH/SOURCE notes and U.S. Code href/source-credit observations,
      retaining source XML paths and digests. spicy-docs shapes each row and reads the
      targets it names; this repository pins the inputs and looks each typed target up
      in the target tables its manifest selects. Complete reads replace the selected
      source/edition scope, including successful empty corrections. Candidate target
      matches concern held classification rows, not independently acquired legal text.
      Unparsed prose and unsupported forms remain visible; no universal extraction or
      historical completeness is implied.
    columns_from: spicy_docs

  court_opinion_pdf_extractions:
    measured_on: "2026-09-27"
    label: "Selected court opinion PDF text"
    identity_columns: [opinion_id, source_sha256]
    grain: "One retained PDF extraction per opinion and exact observed body."
    coverage: >-
      Sampled. Selected publisher PDFs acquired in one cohort. Each exact body
      matches its held CourtListener SHA-1 and has its own SHA-256 and
      extraction outcome. This is derived PDF text, separate from CourtListener
      native text fields and from the complete opinion index. Receipt:
      spicy-regs-court-cohort-20260927/bodies-receipt.json.
    summary: >-
      Text from literally offered PDF URLs, tied to the selected opinion generation,
      native body fingerprint, capture evidence and extractor version. A native digest
      mismatch records a refusal without supplying text. Join opinion_id to court_opinions
      and cluster_id to court_opinion_clusters; this table does not infer case-name identity.
    columns:
      opinion_id: "Native CourtListener opinion ID selected for acquisition."
      cluster_id: "Native opinion cluster ID from that same held opinion row."
      source_url: "Literal download_url offered by the selected opinion."
      resolved_url: "Final response URL observed by the provider."
      source_sha256: "SHA-256 of complete captured PDF bytes."
      native_sha1: "Body SHA-1 asserted by the selected native opinion row."
      actual_sha1: "SHA-1 independently computed over captured bytes."
      sha1_matches: "Whether the captured bytes match the native fingerprint, stored as text."
      text_content: "Derived PDF text when fingerprint and extraction checks succeed; null after a refusal."
      pdf_extraction_results_json: "URL, body SHA-256, status, page count and error for the selected attempt."
      observed_at: "Provider capture observation time."
      extractor: "Application extraction implementation identity."
      extractor_version: "Installed pypdf distribution version."
      parent_opinion_publication_json: "Exact selected opinion family and its member metadata."

  native_legal_reference_reads:
    measured_on: "2026-09-27"
    label: "Native legal-reference selected-input reads"
    coverage: "Sampled. Explicit retained-input manifests only; not a source-wide acquisition or completeness ledger."
    summary: >-
      Records successful bounded source reads even when they produce no observations.
      Failed or incomplete inputs cannot replace prior output. Existing generation and
      source-evidence artifacts retain earlier captures; the current row represents the
      latest complete selected-shape read for its scope. Unsupported XML forms and
      unknown editions remain explicit. spicy-docs shapes the row from the read this
      repository ran.
    columns_from: spicy_docs

  # Retained typed FEC observation tables. Schema support is separate from publication.
  fec_account_transfers:
    label: Reported transfers between accounts
    grain: One source-reported account-transfer or allocated-activity record version.
    identity_columns:
    - record_id
    coverage: Sampled. Supported observations from retained Schedule H3/H5 account-transfer and activity layouts.
      The retained selection is explicit in fec_collections and its source-generation evidence; this declaration does
      not establish complete FEC history or current publication.
    measured_on: '2026-10-01'
    summary: One source-reported account-transfer or allocated-activity record version. Keeps transferred amounts,
      activity amounts and totals separate. An account transfer is not automatically a receipt to the reporting committee
      or a payment to a third party. Resolve collection_id and source_record_id against fec_source_records in the
      captured source generation, using source_locator_json and source_sha256 to distinguish repeated witnesses. Stored
      or release-matched derived evidence routes preserve the same exact source coordinates. For original-filing rows,
      definition_set_id joins fec_filing_definitions.record_id and its fec_filing_definition_evidence context witnesses;
      filing_header_record_id and filing_header_locator_json identify the separate actual header witness. Other source
      layouts retain their own dictionary evidence.
    columns:
      record_id: Deterministic key for this mapped source observation within its table and generation; repeated captures
        remain distinct from a single economic event.
      identity_version: Version of the source-observation identity rule; it does not select a current or canonical
        record.
      mapping_version: Named, versioned source-to-field mapping used for this observation.
      value_mapping_version: Version of the exact monetary and date conversion rules used for supported values.
      mapping_status: Whether this source observation mapped fully, partially, or received an explicit nondata/refusal
        disposition; inspect the reason alongside NULL values.
      mapping_reason_json: JSON object naming unsupported, missing or otherwise limited field interpretations; native
        values remain reachable through evidence.
      collection_id: Exact retained collection label. Join fec_collections in the selected source generation; the
        label alone is not a globally unique source identity.
      source_record_id: Native source-observation key within collection_id. Resolve with the source generation, exact
        locator and source digest, not this value alone.
      source_sha256: SHA-256 of the original source witness bytes; distinct from the typed table's publication digest.
      source_locator_json: Exact source row or subrecord coordinates, including available member, ordinal, byte span
        and field-definition references. Resolve in the pinned source generation.
      source_authority: Authority assigned to the selected source, preserving official FEC, unofficial originals and
        third-party research distinctions.
      selection_evidence_sha256: Digest of the retained selection evidence used to authorize this mapper's source
        scope; not a financial inclusion decision.
      source_representation_role: Selected source role such as snapshot, insertion or deletion. Amount signs and ordinary
        amendment flags do not establish correction applicability.
      correction_operation: Source-supported correction operation, when applicable; a positive amount in a deletion
        stream is not a new receipt or an inferred refund.
      correction_applicability_status: Whether the captured correction can be applied to an evidenced base and target
        population; unresolved applicability prevents a qualified current total.
      current_record_status: Explicit current-selection limitation or decision. Capture order and a mapped value alone
        do not establish the current record.
      filing_key: Nullable authority- and namespace-qualified filing-version key. Several retained observations can
        share it; group proven filing identity before joining.
      filing_link_status: Status of the relationship to a submitted filing version; unresolved references preserve
        the financial observation.
      currency: Currency explicitly assigned by the source-specific mapping; agency measure units are stated separately.
      amount_kind: Source-specific meaning of amount, such as a reported receipt, payment, balance or aggregate. It
        is not an aggregation permission.
      source_namespace: Namespace identifying the native layout or identifier system. Similar numbers or field names
        across namespaces are not equivalent.
      form_type: Literal filing form or record-type code from the source layout; does not prove submission conformance.
      reporting_committee_id: Literal FEC ID of the reporting committee where that source field identifies a committee.
        It does not by itself identify the sender or recipient of money.
      back_reference_transaction_id: Source-stated transaction back-reference. Resolve only within the evidenced filing
        and schedule scope; no automatic parent match.
      account_name: Account name as reported for the source transfer or activity record.
      activity_event_name: Source-stated activity/event name associated with this account transfer.
      event_type: Source-defined event or activity type, interpreted within this table and source namespace.
      source_amendment_code: Literal native amendment code; it does not establish replacement scope from the retained
        filing layout.
      transaction_id: Literal transaction identifier within its source filing/layout scope; not a globally unique
        transaction or economic-event key.
      financial_grain: Explicit financial row meaning selected for this layout, separating reported activity, balances,
        allocations and other observations.
      aggregation_status: Declared limitation on adding this observation to other records; requires the relevant named
        financial policy before totals.
      transferred_amount_raw: Literal source value before conversion for transferred_amount. Preserves spelling, signs
        and empty values; the typed value and its status are separate.
      transferred_amount_status: Source-presence or conversion state for transferred_amount, distinguishing supported
        values from NULL, empty, missing or refused interpretation; it does not establish financial eligibility.
      total_amount_raw: Literal source value before conversion for total_amount. Preserves spelling, signs and empty
        values; the typed value and its status are separate.
      total_amount_status: Source-presence or conversion state for total_amount, distinguishing supported values from
        NULL, empty, missing or refused interpretation; it does not establish financial eligibility.
      transaction_date_raw: Literal source value before conversion for transaction_date. Preserves spelling, signs
        and empty values; the typed value and its status are separate.
      transaction_date_status: Source-presence or conversion state for transaction_date, distinguishing supported
        values from NULL, empty, missing or refused interpretation; it does not establish financial eligibility.
      source_cycle: Election cycle established by the selected source evidence. Distinct from transaction year, candidate
        election year and agency fiscal year.
      transferred_amount: Exact decimal for the reported transfer between accounts. Signs are preserved; use the corresponding
        status and source-specific financial policy before adding observations.
      total_amount: Exact decimal for the whole reported payment or allocation total. Signs are preserved; use the
        corresponding status and source-specific financial policy before adding observations.
      transaction_date: Date parsed from the transaction date reported by the source. NULL requires the source value
        and conversion status; capture time is not substituted.
      definition_set_id: Key of the pinned source layout in fec_filing_definitions. Join its definition evidence for
        exact workbook cells; the layout does not validate the submission.
      declared_format_version: Format version declared by the filing header, retained separately from the reviewed
        source layout version.
      filing_header_record_id: Source-record key of the actual file header. Resolve with collection_id and filing_header_locator_json
        in the source generation.
      filing_header_locator_json: Exact native coordinates of the file-header witness, separate from the financial
        row's own locator.
      submission_conformance_status: Explicit statement of whether submission conformance was established; successful
        field mapping alone does not establish it.
      source_internal_use: Literal source field designated for internal use; retained without assigning an undocumented
