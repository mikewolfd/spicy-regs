  public_activity_events:
    label: "Bill activity events"
    coverage: >-
      Sampled. The adoption run produced 35,900 rows in this output from the
      118th Congress's HR and S BILLSTATUS archives, processing 16,213 bills in
      one pass. The pass used 16 requests (8 keyed, 8 keyless), with the printing
      cap fixed at four and model calls disabled.
      These compare the cold-start snapshot with this run only, not the historical sequence of actions.
      Receipt: `rollups-0-24-0-adoption-2026-09-20/`. Local output only; not uploaded.
    measured_on: "2026-09-20"
    summary: >-
      One row per change detected between two runs of the bill family. Two instants
      per row: `occurred_at` is the publisher's, `detected_at` is the run's. All
