# Spicy Regs data dictionary — curated descriptions.
#
# This file is the human layer of the data dictionary. Column *names and types*
# are the source of truth in code (RECORD_TYPES in
# src/spicy_regs/schemas/regulations.py for the core tables, and DERIVED_SCHEMAS
# in src/spicy_regs/data_dictionary.py for the rollups). This file supplies the
# prose. The two are reconciled by `spicy-regs-dict check`, which fails if a
# column has no description here or a description references a column that no
# longer exists — so a schema change forces a docs update in the same PR.
#
# To regenerate the browsable site after editing:  uv run spicy-regs-dict generate
#
# `measured_on` is a manually maintained date attached to a coverage statement.
# Read the statement and its receipt: it can describe source measurements,
# a bounded local run, or a design statement. It does not establish publication
# or freshness. D1 exercised the newer rollups locally; the pre-existing public
# service has its own artifacts. See docs/publication-status.md.
#
# Five entries still carry the weaker meaning, and say so in their own prose
# rather than only here: `bill_family_backfills` and
# `bill_family_backfill_walks` (that run scoped the 119th, which BILLSTATUS bulk
# serves, so the backfill leg was never entered) and the three model-backed
# tables `section_classifications`, `bill_summaries` and `diff_summaries` (a
# keyless run cannot fill them). For those five the date is the statement date,
# as it was before.
#
# Coverage prose states the kind, the scope rule and the caveats, never a
# whole-table row count, snapshot id, generation pin or publication status:
# those change at every publish, and describe_table's publication field states
# them live. `spicy-regs-dict check` refuses them (COVERAGE_PROSE_REFUSALS in
# src/spicy_regs/data_dictionary.py). A dated measurement stays only where it
# justifies a caveat, with its date.
#
# A run that only *exercises* a path is not the same as a run that measures
# what the statement claims. Several statements below describe incremental
# behavior — skipping a bill the publisher has not touched, a watermark window,
# an unchanged-zip skip — and D1 was a cold start, so those clauses are marked
# as design rather than measurement where they appear.

tables:
  dockets:
    label: "Rulemaking dockets"
    coverage: >-
      Sampled repair with retained prior rows. On 2026-09-21 the fork merged
      every selected retained docket release into the prior table, keeping newer
      and unrelated rows; the daily regulations ETL adds to it. It is not a
      fresh regulations.gov census. modify_date records source modification, not
      docket opening or acquisition. Receipts:
      fork-execution-2026-09-21/publication-dockets.json and
      fork-base-repair-2026-09-21/repair-audit.json.
    measured_on: "2026-09-28"
    summary: >-
      One row per regulations.gov docket. A docket is the top-level folder a
      federal agency opens for a rulemaking or other action; it groups the
      documents the agency posts and the public comments it receives.
    columns:
      docket_id: "Unique docket identifier (e.g. `EPA-HQ-OAR-2021-0317`). Primary key / dedup key."
      agency_code: "Posting agency's short code (e.g. `EPA`, `FDA`, `ACF`)."
      title: "Human-readable docket title."
      docket_type: "Docket category, typically `Rulemaking` or `Nonrulemaking`."
      modify_date: "Timestamp the docket was last modified on regulations.gov (ISO 8601 string)."
      abstract: "Agency-written summary of the docket (regulations.gov `dkAbstract`). Often null."
      rin: "Regulation Identifier Number tying the docket to the Unified Agenda. Often null."

  documents:
    label: "Docket documents"
    coverage: >-
      Sampled repair with retained prior rows. On 2026-09-21 the fork merged
      every selected retained document release into the prior table, resolving
      each document to its most recent source record and keeping newer and
      unrelated rows; the daily regulations ETL adds to it. It is not a fresh
      regulations.gov census. The repair covered metadata and references;
      body-text, extraction-status and PDF-extraction-evidence values remain
      NULL. It does not include a full comments corpus. Receipts:
      fork-execution-2026-09-21/publication-documents.json and
      fork-base-repair-2026-09-21/repair-audit.json.
    measured_on: "2026-09-28"
    data_quality: >-
      The 2026-09-21 fork date check across all 2,001,531 rows found 52,699 posted_date
      values before 1990, including eight in year 0000; one value was in the future,
      2,020 were missing and no other values were uncastable. Source date values remain
      literal in this base table; downstream calendar filters are separate. Receipt:
      fork-execution-2026-09-21/document-derivatives/audit.json. In the 2026-09-21 fork
      consumer audit, 1,854,836 documents resolve to published dockets; 466 preserve unmatched
      literal links across 137 docket IDs, and 146,229 have NULL links. The 348
      selected-source unmatched links and 145,907 selected-source NULL links agree with native
      inputs; the remaining 118 unmatched and 322 NULL rows are outside that replay. Missing
      joins are not fabricated or treated as failed repairs. Receipt:
      fork-execution-2026-09-21/documents-mcp-audit/.
    summary: >-
      One row per document posted to a docket — proposed rules, final rules,
      notices, supporting analyses, and public-submission stubs. Joins to
      `dockets` on `docket_id`. Two payload fields are not carried: `comment`
      (the inline submission body) and `restrictReasonType` (why a document is
      withheld). Read those from the acquisition source, the raw Mirrulations
      payload or spicy-docs' source-native release, not from this table.
    columns:
      document_id: "Unique document identifier. Primary key / dedup key."
      docket_id: "Parent docket this document belongs to. Foreign key to `dockets.docket_id`."
      agency_code: "Posting agency's short code."
      title: "Document title."
      document_type: "Document category (e.g. `Rule`, `Proposed Rule`, `Notice`, `Supporting & Related Material`)."
      posted_date: "Date the document was posted publicly (ISO 8601 string)."
      modify_date: "Timestamp the document was last modified (ISO 8601 string)."
      comment_start_date: "Start of the public comment period this document opens, if any. Often null."
      comment_end_date: "End (deadline) of the public comment period, if any. Often null."
      file_url: "URL of the document's primary downloadable rendition. Retained for backward compatibility; see `attachments_json` for the full list. Often null."
      attachments_json: "JSON array of the main document's fileFormats renditions: `[{url, format, size}]`. This compatibility field does not contain separately listed attachment resources. Null when no main renditions were retained."
      attachment_records_json: "Literal records from an explicitly read document attachment relationship, preserving attachment IDs, restrictions and alternative file formats. Null means the relationship was not read; an empty array means a validated complete read returned no attachments. A main document response alone cannot establish attachment absence."
      fr_doc_num: "Federal Register document number, when the document was published in the FR. Often null."
      withdrawn: 'Whether the document was withdrawn, as the string `"true"`/`"false"`. Often null.'
      reason_withdrawn: "Agency-supplied reason for withdrawal, when withdrawn. Often null."
      additional_rins: "JSON array of additional Regulation Identifier Numbers beyond the docket's primary RIN. Often null."
      text_content: "Plain text extracted from the document's PDF attachment(s) by the PDF text-extraction step. Null until that step has run; see `text_extraction_status`."
      text_extraction_status: "Aggregate PDF outcome: `ok` means at least one PDF supplied text, even if another failed; otherwise `error`, `encrypted`, or `empty` (no extractable text) in that order. Null before an attempt. See `pdf_extraction_results_json` for each file."
      pdf_extraction_results_json: "Ordered JSON array from the latest PDF attempt: `{url, source_sha256, status, page_count, error}` per distinct selected URL. SHA-256 identifies observed bytes; no-bytes fetch failures have null digest/page count and a generic error. Null when no PDF attempt is recorded. Describes that attempt, not the provenance of older text retained after a failed overwrite."

  comments:
    label: "Public comments"
    coverage: >-
      True range, floored. Posted dates are stated from 1990-01-01 to
      2026-09-06 rather than from the raw minimum of year 0000, on the same
      publisher defect as `documents`. See the data-quality note.
    measured_on: "2026-09-06"
    data_quality: >-
      33,373 rows carry a `posted_date` before 1990, the same publisher
      defect as `documents`. Filter on the date when recency matters.
    summary: >-
      One row per public comment — the largest table
      (tens of millions of rows). On R2 it is also published as Hive-partitioned
      files under `comments/agency/agency_code=.../part-0.parquet`, one file per
      agency, rebuilt daily — this is what `spicy-regs-ui` reads for scoped
      queries. (An older `comments/agency_code=.../docket_id=.../year=.../month=...`
      tree was abandoned when comments moved onto the Iceberg catalog and
      carried a reduced set of columns; prefer the per-agency tree.) Joins to
      `dockets` on `docket_id` when the source supplies that relationship.
      Comments with a null docket remain in the table and agency totals.
    columns:
      comment_on_document_id: "Literal Regulations.gov commentOnDocumentId: the named parent document, independently nullable from docket_id. No identifier-prefix inference."
      comment_on_object_id: "Literal commentOn in the native object-ID namespace; not interchangeable with a public document key."
      original_document_id: "Literal originalDocumentId, retained as an unresolved legacy source reference."
      comment_reference_values_json: "JSON map containing only present source parent-reference fields, preserving null and empty values. {} means the source was read and fields were absent; SQL NULL means legacy or unread."
      comment_id: "Unique comment identifier. Primary key / dedup key."
      docket_id: "Source-supplied docket identifier for joining to `dockets.docket_id`. Null when the source does not identify a docket; mirror directory names and comment ID prefixes do not fill this field."
      agency_code: "Receiving agency's short code."
      first_name: "Commenter's first name, when provided. Often null."
      last_name: "Commenter's last name, when provided. Often null."
      organization: "Organization the commenter represents, when provided. Often null."
      category: "Submitter category as classified on regulations.gov. Often null."
      title: "Comment title / subject line."
      comment: "Full free-text body of the comment. The largest field in the dataset."
      document_type: "Document category for the comment record, typically `Public Submission`."
      posted_date: "Date the comment was posted publicly (ISO 8601 string)."
      modify_date: "Timestamp the comment was last modified (ISO 8601 string)."
      receive_date: "Date the agency received the comment (ISO 8601 string)."
      attachments_json: "JSON array of any files attached to the comment: `[{title, formats:[{url, format, size}]}]`. Null when there are no attachments."
      text_content: "Plain text of the comment's attachment(s). Filled inline during the ETL from Mirrulations' own extraction (the bucket's `derived-data` prefix): one extraction tool per comment, its attachments in number order, each stripped and separated by a blank line; when that tool's objects are all blank there is no derived text. Attachments Mirrulations has not extracted are backfilled by the on-demand PDF text-extraction step. Null when neither has produced text; see `text_extraction_status`."
      text_extraction_status: "Where `text_content` came from, or why there is none. `derived` means Mirrulations' own extraction supplied it (see `pdf_extraction_results_json`); `ok` means Spicy Regs extracted text from at least one PDF, even if another failed; otherwise PDF outcomes prefer `error`, `encrypted`, then `empty`. Derived-data fills written before `derived` existed read `ok` until repaired. Null before an attempt or derived-text fill."
      pdf_extraction_results_json: "Provenance of `text_content`. For `derived` rows, a JSON object `{comment_id, tool, available_tools, attachments:[{attachment, tool, key, size, etag, sha256}], only_in_other_tools}`: the primary tool (the first of `pypdf`, `pdfminer` with an object for the comment), every tool with an object for it, each attachment's tool, S3 key, listed size and ETag and the SHA-256 of the bytes read (null when the text was kept without re-reading them), and the attachment numbers taken from a tool other than the primary because the primary has no object for them (decision 41); those are in the text. A primary object that exists is kept even when blank. About 125 bytes plus 330 per attachment (31 KB at 92 attachments, the published maximum). Otherwise an ordered JSON array from the latest PDF attempt: `{url, source_sha256, status, page_count, error}` per distinct selected URL; SHA-256 identifies observed bytes, and no-bytes fetch failures have null digest/page count and a generic error. Null when neither is recorded."

  comments_index:
    identity_columns: [agency_code, docket_id, year, month]
    label: "Public comment counts"
    coverage: >-
      Derived. Counts over `comments` by agency, docket and posting month; it
      covers exactly what that table covers and adds no rows of its own.
    measured_on: "2026-09-06"
    summary: >-
      A small row-count index over `comments`. Each row counts the comments of
      one agency, docket and posting month, so consumers can compute comment
      totals without scanning the full table. It is rebuilt from the same
      catalog snapshot as each comments publication. Its rows are groups, not
      files: no Parquet file exists per row.
    columns:
      agency_code: "Agency code of the counted comments."
      docket_id: "Source docket identifier, or NULL when the source gives none."
      year: "Year from `posted_date`. NULL when the source posted date is unknown."
      month: "Month (1–12) from `posted_date`. NULL together with year when the source posted date is unknown."
      row_count: "Number of comments in the group."

  feed_summary:
    identity_columns: [docket_id]
    label: "Docket summaries"
    coverage: >-
      Derived. One row per docket over `dockets`, `documents` and
      `comments`; it covers exactly what those cover.
    measured_on: "2026-09-06"
    summary: >-
      A pre-computed rollup with one row per docket, joining docket metadata to
      comment counts and comment-period dates. Powers feed/timeline views
      without scanning the full comments dataset. Built by `build_feed_summary`,
      sorted by `modify_date` descending.
    columns:
      docket_id: "Docket identifier. One row per docket."
      agency_code: "Posting agency's short code."
      title: "Docket title (from `dockets`)."
      docket_type: "Docket category (from `dockets`)."
      modify_date: "Docket last-modified timestamp; the table is sorted by this descending."
      abstract: "Docket abstract (from `dockets`). Often null."
      comment_count: "Total comments on the docket, summed from `comments_index`. 0 when none."
      comment_end_date: "Latest comment-period end date across the docket's documents. Null when unknown."
      date_created: "Earliest document `posted_date` on the docket, used as a creation date. Null when unknown."

  agency_stats:
    identity_columns: [agency_code]
    label: "Agency totals"
    coverage: >-
      Derived. Totals over `dockets`, `documents` and `comments`; it covers
      exactly what those cover.
    measured_on: "2026-09-06"
    summary: >-
      A per-agency dimension table — one row per agency with docket, document,
      and comment counts. Powers agency directory and profile pages. Built by
      `build_agency_rollups`, sorted by comment then document count descending.
    columns:
      agency_code: "Agency short code. One row per agency."
      docket_count: "Number of dockets posted by the agency."
      document_count: "Number of documents posted by the agency."
      comment_count: "Total comments received by the agency, summed from `comments_index`."

  agency_monthly_volume:
    identity_columns: [agency_code, year, month, document_type]
    label: "Agency monthly volume"
    coverage: >-
      Derived from `documents`: document counts by agency, month and document
      type. A document whose posted date is NULL or the publisher's year zero is
      left out, and the file records each omitted date; other literal dates stay
      as the publisher wrote them, including documents dated before 1990 or in
      the future. Source values are unchanged. Receipts:
      fork-execution-2026-09-21/document-derivatives/MANUAL-AUDIT.md and
      publication-agency-monthly-volume.json.
    measured_on: "2026-09-21"
    summary: >-
      Per-agency monthly document volume, broken out by document type — one row
      per (agency, year, month, document_type). Feeds activity sparklines and
      profile activity panels. Built by `build_agency_monthly_volume` from document
      `posted_date`; missing, uncastable and year-zero dates are omitted.
    columns:
      agency_code: "Agency short code."
      year: "Year of the documents, extracted from `posted_date`."
      month: "Month (1–12) of the documents, extracted from `posted_date`."
      document_type: "Document category counted in this bucket (e.g. `Rule`, `Notice`)."
      document_count: "Number of documents the agency posted of that type in that month."

  fr_docket_links:
    grain: "One source docket-array occurrence per dated Federal Register record; docket_source_ordinal retains the original zero-based array position in rebuilt outputs. Older publications lack that column."
    label: "Federal Register to docket links"
    coverage: >-
      Derived, and bounded by its inputs: one link per docket id that a dated
      Federal Register record names, over the `federal_register` table's own
      date range. On 2026-09-23 the table equalled a separate re-derivation from
      that parent row for row; that measurement predates the ordinal and
      normalization columns, which require rebuilding.
    measured_on: "2026-09-23"
    summary: >-
      The Federal Register ↔ docket bridge: each `federal_register` row's
      `docket_ids_json` array exploded to one row per (docket_id, document_number,
      publication_date),
      carrying the FR display columns. Use this instead of an `ILIKE` scan over
      `federal_register.docket_ids_json` — it is sorted by `docket_id`, so
      `WHERE docket_id = ?` prunes row groups. This is the practical join from
      regulations.gov to the Federal Register using the Federal Register's own
      stated docket links. Built by `build_fr_docket_links`.
    columns:
      docket_id: "One literal docket ID extracted from the FR document's `docket_ids_json` array."
      docket_source_ordinal: "Zero-based position in the original docket array, before null/blank elements are filtered. Present only after rebuilding. Required with document_number and publication_date to identify an occurrence."
      normalized_docket_candidates_json: "Owner-normalizer candidate interpretations of the literal docket value; an empty array means no supported interpretation, not absence of a docket."
      docket_normalization_rule: "Digest-pinned owner identifier-normalization rule used to produce candidates."
      document_number: "Literal Federal Register document number. Join to `federal_register` on both this value and `publication_date`; a number can name distinct dated records."
      title: "FR document title."
      abstract: "FR document abstract."
      document_type: "FR type: `Rule`, `Proposed Rule`, `Notice`, or `Presidential Document`."
      subtype: "FR subtype where the Federal Register supplies one, e.g. `Final Rule`, `Interim Final Rule`."
      publication_date: "Date the document published in the Federal Register; required with `document_number` for the FR record join."
      effective_on: "Date the rule takes effect, when the document carries one."
      comments_close_on: "Comment period close date, when the document carries one."
      signing_date: "Signing date, for presidential documents."
      agency_slugs: "Federal Register agency slugs for the issuing agencies."
      docket_ids_json: "The full original docket-ID array, retained so consumers can see the other IDs this FR document links to."
      regulation_id_numbers_json: "RINs (JSON array) claimed by the FR document — the RIN-side join key for a rulemaking."
      html_url: "federalregister.gov HTML permalink."
      pdf_url: "Federal Register PDF URL."
      executive_order_number: "Executive order number, for presidential documents."

  discovery_signals:
    identity_columns: [agency_code]
    label: "Agency activity spikes"
    coverage: >-
      Not a range. A dated snapshot recomputed from `documents` at each build;
      the Parquet metadata records its calculation time in UTC, its date policy
      and its parent digest. Future dates are excluded from recent activity.
      This is not a historical series or a complete measure of agency activity.
      Receipt: fork-execution-2026-09-21/discovery-utc/MANUAL-AUDIT.md.
    measured_on: "2026-09-21"
    data_quality: >-
      Activity windows use UTC instants and preserve explicit source offsets. Dates and
      timestamps without offsets use UTC; source values remain unchanged. Corpus backfills
      and source date anomalies can affect these document-count signals.
    summary: >-
      Per-agency document-output spike signal that powers the feed's discovery
      panel — agencies whose document count in the trailing 30 days is at least
      2× their prior-year monthly mean, requiring ≥24 documents in the prior year
      to suppress tiny-denominator noise. Recomputed relative to the run date, so
      rows turn over on every rebuild; it is a current-state signal, not a time
      series. Built by `build_discovery_signals` from `documents`.
    columns:
      agency_code: "Agency short code."
      recent_30d: "Documents the agency posted in the trailing 30 days."
      baseline: "Prior-year monthly mean document count (months 2–13 back)."
      ratio: "`recent_30d` divided by `baseline` — the spike multiple."

  cfr_sections:
    identity_columns: [package_id, granule_id]
    label: "Code of Federal Regulations sections"
    coverage: >-
      Window. Annual-edition section metadata from the 2025 and 2026 editions,
      not full publication history or body text. Each section's part comes from
      its volume's PART heading; on 2026-09-23 every compared Title 41, 43 and
      14 section agreed with eCFR's 2025-01-01 structure. Receipts:
      fork-execution-2026-09-21/cfr-ancestry-fix-2026-09-23/ (candidate.json,
      validation.json).
    measured_on: "2026-09-28"
    summary: >-
      One row per GovInfo annual CFR granule, including sections, appendices,
      tables of contents and other structural units; metadata only, no
      regulatory body text. Neither a granule id nor a printed section number
      establishes the enclosing part, so each section granule is placed under
      the PART heading of its package's annual volume XML: Title 43 numbers
      sections by subpart (§ 1601.0-1 is in Part 1600), Title 41's parts contain
      a hyphen (`50-201`) and Title 14 Part 241 prints `19-8.1`. `part` is that
      structure; `cfr_ref` is the printed citation that joins the Federal
      Register side. Other granules keep the part their identifier spells, so
      Title 41's TOC and NODE rows keep parts cut at the hyphen (`50`). The
      Parquet footer key `spicy_regs.cfr_sections.placement` records that every
      row was placed by this rule; generations without it keep
      identifier-derived parts. A package is re-placed only when it is new or
      its GovInfo lastModified changed; an unchanged package, or one whose
      volume cannot be read, keeps its prior rows. Missing credentials and
      incomplete source traversals refuse before output replacement. GovInfo's
      annual index package (`GPO-CFR-INDEX-2025`) is not a title volume and is
      not in the table. All columns are stored as VARCHAR.
    columns:
      granule_id: "GovInfo granule identifier. Primary key / dedup key, including non-section structural units."
      package_id: "GovInfo package identifier for the enclosing annual CFR title and volume."
      cfr_ref: "Join key to Federal Register `cfr_references_json`. For a section, the title and its printed citation (e.g. `43-1601.0-1`, `41-50-201.1`); Title 43 keeps its subpart-numbered spelling while `part` names the enclosing part. Title 41's compound-part citations do not join yet: the Federal Register side reads `41 CFR 50-201.1` as `41-50` (plan A7). NULL for ranges, publisher typos, unprefixed numbers (`Sec. 1-1`), parenthesized citations (`1.401(k)-1`), sections outside a numbered PART and section tokens the volume does not hold; 12 single sections printed with `§§` (`§§ 2.188`) are read as ranges until spicy-docs 0.31.0. For other granules, composed from the identifier's tokens (e.g. `48-700`, `15-746.10-app1`); NULL without a part."
      title: "CFR title number from the package or granule identifier (e.g. `40`)."
      part: "For a section, the number in the enclosing PART heading of the package's annual volume XML (e.g. `1600`, `50-201`, `241`); NULL outside a numbered PART or when the volume does not hold the section. For a section's appendix or TOC (`sec746-10-app1`), its host section's part when the volume holds the host, else its token's leading number. For other granules, the identifier's part token including letter suffixes (e.g. `1203a`), which cuts Title 41's compound parts at the hyphen."
      section: "For a section, the printed number less its `{part}.` prefix (e.g. `1` for § 50-201.1, `19-8.1` in Part 241, `1601.0-1` in Part 1600, `401(k)-1`). For a section's appendix or TOC, the rest of its token after the leading number (`10-app1`); for a section token the volume does not hold, the whole token. NULL for other granules."
      heading: "Granule heading / caption text from GovInfo's list-level `title` field."
      structure_level: "GovInfo granule class / structural level (e.g. `CONTENT`, `NODE`, `TOC`, `APPENDIX`)."
      edition_year: "Annual edition year from the package or granule identifier, falling back to the year in `dateIssued`. This is not necessarily the printed body revision year or proof of a substantive edition."
      last_modified: "Granule `lastModified` when supplied, otherwise the enclosing package's `lastModified`. GovInfo's granule listing supplies none, so in practice every row carries its package's stamp."
      url: "Canonical GovInfo details URL composed from the package and granule identifiers."
  congress_bills:
    label: "Congressional bills"
    coverage: >-
      True range on the archive index, mixed on enrichment. The archive index
      lists bills back to the earliest Congresses (latest actions from
      1799-12-16); the bill family fills every column from GovInfo BILLSTATUS
      for the Congresses it has read, which begin at the 108th. On 2026-09-26
      the 108th-117th rows, then written by a retired list walk, lacked 1,299
      bills against the BILLSTATUS listings (199 in the 117th; receipt
      `join-gaps-2026-09-26/d/`); bill-family runs scoped to those Congresses
      fill them. An absent CBO element does not mean CBO never scored a bill.
      The bill family re-reads its own prior once where the CBO outcome is
      missing, or where a reader other than the running one read it, even when
      the publisher stamp is unchanged.
    measured_on: "2026-09-28"
    summary: >-
      One row per bill or resolution. `bill-family` writes this table, filling
      the full contract for the Congresses it is scoped to (the current Congress
      on its daily schedule) — from a BILLSTATUS document for the
      108th onward, and from the API bill detail route for the 82nd through the
      107th, where no BILLSTATUS bulk exists. A consumer tells the two family
      routes apart by Congress and by the NULLs: a row for a Congress below the
      108th is the detail route's, its `schema_version` is NULL because the
      detail record states no BILLSTATUS schema, and its `action_count`,
      `committee_count`, `version_count`, `subject_count`, `subjects_json`,
      `related_bill_count` and `related_bills_json` are NULL because the detail
      record states those only as sub-route counts the backfill does not walk —
      a zero would contradict the count the publisher declared. `cosponsor_count`
      is the one count the record does state, as its `cosponsors` sub-route's
      count, and is published from there (NULL when the record states no such
      sub-route, as the 92nd's do not). The BILLSTATUS route's separate count
      defect is described below. `stage` and `signed_date_rule` are NULL on
      these rows too: the record carries no actions, so no stage rule ran and no
      became-law action was looked for, and the shaper's default rung
      ("introduced") or the rule name "public law without a became-law action"
      would each be a statement about the bill that nothing examined. The first
      ten columns keep the
      exact order and spelling they have always had, because other repositories
      pin that prefix by digest; every new column is appended after them. Until
      plan A1 retired it (decision 31), a second rollup, `congress-bills`, walked
      the Congress.gov list route for that prefix across the whole archive, and
      a row of a Congress the family has not been scoped to keeps the prefix
      that walk last stated. Because rows from the two routes state different
      columns, this is the one table merged column-wise: a family row's NULL
      cannot erase a list-era value. All columns are stored as VARCHAR.
    data_quality: >-
      **Known BILLSTATUS count defect in vendored SpicyDocs 0.24.2:**
      the `cosponsor_count` description below incorrectly treats cosponsors
      as sponsors after the first. The publisher lists them separately.
      A direct native-XML audit found 13,154 wrong zero counts in the retained
      118th Congress HR/S output. The corrected local SpicyDocs checkout and
      offline candidate count every listed cosponsor, including withdrawn
      entries, but the normal vendored package and prior outputs have not
      adopted that fix. Receipt: `legislative-release-candidate-2026-09-21/`.
      `statutes_at_large_cite` is filled at this table's merge by joining the
      published `laws` table on `bill_id`, as its column sentence says:
      `bill-family` reads `laws` best-effort after its merge and takes the law's citation where one is
      published, keeping a citation already here where `laws` has none for the
      bill; with no `laws` table published the column stays as it was, NULL on a
      cold start. It is never guessed: `laws` publishes a citation only from a
      captured PLAW USLM file, and reads a NULL through its own `uslm_outcome`.
      `public_law_number` and `law_type` are not that case: they come from the
      bill's own publisher record — its `laws` entry, when the publisher states
      one — and are filled wherever the bill family has reached.
      `url_source` `congress_api_list` marks a row the retired list writer last
      wrote. Its run of 2026-09-23 replaced 3,044 BILLSTATUS `update_date`
      instants with the list route's same-day dates and 3,095 congress.gov page
      URLs with API resource URLs (receipt `drift-audit-2026-09-23/`). The bill
      family re-reads every such bill in its scope instead of skipping it as
      unchanged, so the current Congress's rows heal on its next run; the 47
      rows it relabelled in the 114th–118th (five of the replaced URLs among
      them) are re-read only by a run scoped to their Congress.
      `update_date` merges by the larger value, so a re-read never moves it
      backwards; the 46 rows of the 119th (and 42 older) whose list date is
      later than BILLSTATUS's therefore keep that date-only value after the
      re-read, and until BILLSTATUS catches up they read `url_source`
      `billstatus` beside an `update_date` no BILLSTATUS document stated.
    columns_from: spicy_docs

  bill_subjects:
    label: "Bill policy areas and legislative subjects"
    grain: "One observed subject assignment per bill_id, with the latest retained answer replacing its predecessor."
    identity_columns: [bill_id]
    coverage: >-
      Sampled; it grows each run and is not a complete subject census. From
      the 108th Congress every bill the bill family filled from GovInfo
      BILLSTATUS is copied from its congress_bills row; other bills from the
      108th come from their folder's BILLSTATUS bulk zip, 32 folders a run,
      newest Congress first. Bills from the 93rd to the 107th, and bills whose
      BILLSTATUS file the reader refuses, come from the Congress.gov API with a
      key, up to 2,000 a run. No folder read and no API request, page or retry
      starts 20 minutes or more after the run began. A list-level bill in a
      folder the family reads waits for the family while its Congress is the
      current or previous one, and then goes to the API.
    measured_on: "2026-09-23"
    summary: >-
      Subject assignments returned by Congress.gov or GovInfo BILLSTATUS,
      keyed by bill_id for a left join to congress_bills.bill_id. policy_area
      is one publisher category; subjects_json is a JSON array of legislative
      subject names, not separate bill records. The consumer trims and
      deduplicates names. All columns are VARCHAR, including subject_count.
      carrier and enriched_at record how and when the answer was obtained.
    data_quality: >-
      A missing row can mean pending, failed or outside the configured scope.
      An empty assignment can mean no assignments or that the source did not
      hold the requested bill; those outcomes are not separately represented
      in this table. Rows copied from the bill family are rewritten when the
      family's BILLSTATUS read changes; other answers are not asked again. The
      table does not retain the original response or its digest.
    columns:
      bill_id: "Stable bill key shared with congress_bills.bill_id, such as 119-hr-1. Primary/dedup key; join by this identifier rather than title."
      policy_area: "Publisher policy-area name after trimming, or NULL when the returned answer has no policy area."
      subjects_json: "JSON array of trimmed, deduplicated legislative subject names. An empty array alone does not distinguish unassigned from not held."
      subject_count: "Length of subjects_json, stored as a decimal string; not a count of bills or independent source responses."
      carrier: "Source reader that answered: govinfo-billstatus from the 108th Congress on, congress-api below it or where the BILLSTATUS file was refused."
      enriched_at: "UTC timestamp when this retained answer was shaped, not the publisher's modification date."
  unified_agenda:
    identity_columns: [rin, agenda_edition]
    label: "Planned agency actions"
    coverage: >-
      True range: every semiannual Unified Agenda edition reginfo.gov serves as
      readable XML, from 199510 through the latest; agenda_edition names each.
      No edition is held for 2004 or for spring 2012. A rule has one row per
      edition that lists it, so count distinct rin, not rows, for a number of
      rules.
    measured_on: "2026-09-28"
    summary: >-
      One row per Regulation Identifier Number (RIN) per agenda edition, ingested
      from the OIRA/OMB Unified Agenda published at reginfo.gov by
      `build_unified_agenda`. A Tier-1 rulemaking-lifecycle source: the upstream,
      forward-looking catalog of rulemakings agencies *plan* to pursue, keyed by
      the same `rin` that appears in `federal_register`
      (`regulation_id_numbers_json`). Primary / dedup key is (`rin`,
      `agenda_edition`). All columns are stored as VARCHAR; array-valued fields
      are JSON strings.
    columns:
      rin: "Regulation Identifier Number (e.g. `2060-AV12`). The RIN join key to `federal_register`. Half of the primary/dedup key."
      agency_code: "Short code of the agency that owns the RIN."
      agency_name: "Full name of the agency that owns the RIN."
      title: "Title of the planned rulemaking."
      abstract: "Agency-written abstract describing the planned action. Often null."
      rin_status: "Status of the RIN in this edition (e.g. `Active`, `Completed`, `Long-Term`)."
      rule_stage: "Stage of the rulemaking in this edition (e.g. `Prerule`, `Proposed Rule`, `Final Rule`)."
      priority_category: "OIRA priority classification (e.g. `Economically Significant`, `Other Significant`, `Substantive, Nonsignificant`)."
      agenda_edition: "Semiannual agenda edition the row was published in, as `YYYYMM` (MM 04=Spring, 10=Fall). Half of the primary/dedup key. Every readable edition since 199510 is held, so filter to one edition, or count distinct `rin`, before counting rules."
      major: "Whether the action is a major rule, as reported by the agenda (e.g. `Yes`/`No`). Often null."
      publication_id: "reginfo.gov publication identifier for this agenda entry, when present."
      timetable_json: "JSON array of planned and actual milestone actions with literal source dates and Federal Register citations. A date with day 00 has month precision; labels such as To Be Determined remain unchanged."
      cfr_references_json: "JSON array of CFR citations affected by the rulemaking. The join key to the CFR."
      legal_authority_json: "JSON array of legal-authority citations the agency cites for the rulemaking."
      first_action_date: "Earliest distinct calendar date derived from the timetable, or NULL when none is derivable. Source month-only dates (MM/00/YYYY) use day 01 here; timetable_json retains their original precision."
      next_action_date: "Second distinct calendar date derived from the timetable, or NULL when fewer than two dates are derivable. May be historical; it is not selected relative to today. Source month-only dates use day 01 here; timetable_json retains the literal dates."
      url: "URL of the entry's detail page on reginfo.gov."
  # The materialized rulemaking dataset (`materialize-rulemaking`): eight tables that publish as one
  # snapshot under `materialized/rulemaking/latest.json`, not the publication index. Meanings follow
  # docs/ontology.md and each builder's docstring.
  rule_targets:
    label: "Rule identity edges (docket, CFR, RIN)"
    coverage: >-
      Derived, and bounded by its inputs: `dockets`, `documents`,
      `federal_register` and `fr_docket_links` as the live snapshot's manifest
      pins them.
    measured_on: "2026-09-28"
    summary: >-
      The rule-identity spine: one row per observed edge between a
      Regulations.gov docket, a CFR part and a RIN, with the `source` class of
      evidence that states it (docs/ontology.md, "The rule_targets carrier").
      A missing or ambiguous reference leaves its target NULL rather than
      inventing one, and a `docket_document_cites_action_notice` row is a
      citation, with both targets NULL. Keyed (`docket_id`, `cfr_ref`, `rin`,
      `source`), NULLs included; joins `dockets` on `docket_id` and
      `unified_agenda` on `rin`. Built by `build_rule_targets`; all columns are
      VARCHAR.
    grain: "One observed docket, CFR and RIN edge per evidence source class."
    identity_columns: [docket_id, cfr_ref, rin, source]
    columns:
      docket_id: "Regulations.gov docket the edge belongs to, normalized; joins `dockets.docket_id`."
      cfr_ref: "CFR reference the rule targets, `title-part` or `title-part.section` (e.g. `40-60`); NULL on a RIN-only or citation edge."
      cfr_title: "The CFR title of `cfr_ref` (e.g. `40`)."
      cfr_part: "The CFR part of `cfr_ref` (e.g. `60`)."
      cfr_section: "The CFR section of `cfr_ref` when it names one; NULL for a part-level reference."
      rin: "Regulation Identifier Number the edge carries (e.g. `2060-AV16`); NULL on a CFR-only or citation edge."
      source: "The evidence class: `fr_cfr_ref`, `docket_rin`, `document_rin`, `document_fr_doc` or `docket_document_cites_action_notice`."
      evidence_id: "The least id of the records stating the edge: the docket for `docket_rin`, a dated Register record id (`number@YYYY-MM-DD`) for `fr_cfr_ref`, else a Regulations.gov document id."
      first_seen: "Earliest Eastern day any evidence for the edge is dated, `YYYY-MM-DD`."
      last_seen: "Latest Eastern day any evidence for the edge is dated, `YYYY-MM-DD`."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:rule-targets:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "Id of a prior row this one continues; always NULL here, since an edge has no id of its own."
      fr_references_json: "JSON array of the literal Federal Register number references behind the edge, each with the `status` saying how it resolved (`dated`, `single_candidate_in_input`, `ambiguous`, `missing`, or a folded or unpadded match)."
  proceedings:
    label: "Rulemaking proceedings"
    coverage: >-
      Derived, and bounded by its inputs (`dockets`, `documents`,
      `federal_register`, `fr_docket_links` and `rule_targets`) and the prior
      snapshot it continues ids from. A proceeding is docketed, or docket-less
      when it is a single Register document.
    measured_on: "2026-09-28"
    summary: >-
      One row per rulemaking proceeding: the dockets that are one action, the
      Register documents that joined it, their stage events, RINs and CFR
      targets. A RIN names a Unified Agenda item, never a proceeding: it is
      carried as evidence and never groups dockets. A docket-less proceeding
      is one Register document. Keyed `proceeding_id`, which continues across
      generations when its dockets or Register documents overlap a prior one.
      Joined by `agenda_item_proceedings`, `comment_periods` and
      `rulemaking_lifecycles` on `proceeding_id`. Built by
      `build_proceedings`; all columns are VARCHAR, lists as JSON strings.
    grain: "One rulemaking proceeding: the dockets and Register documents that are one action."
    identity_columns: [proceeding_id]
    columns:
      proceeding_id: "Stable opaque id of the proceeding (`proceeding_<24 hex>`), continued from the prior generation where it overlaps one."
      rin: "The proceeding's RIN when it holds exactly one, else NULL; a query aid, never its identity (`rins_json` lists every RIN)."
      docket_ids_json: "JSON array of the Regulations.gov dockets the proceeding comprises; `[]` for a docket-less proceeding."
      title: "Title of its most recently dated titled document."
      agency_code: "The agency code most of its documents carry. A docket-less proceeding takes its Register document's agency code. Each Register agency maps to one Regulations.gov code through RefSpec's agency projection and agency registry, whose identity bridges and successions give a defunct agency its current successor's code whatever the document's date: a 1998 Health Care Finance Administration notice is CMS. A split agency maps only when every successor gives the same one code. A department named with one of its own agencies yields to it (Transportation Department with FAA is FAA), and a department signing with one of its own unmapped bureaus keeps the department's code. NULL when no agency maps or the agencies are unrelated."
      current_stage: "The one stage (`proposed`, `supplemental`, `final` or `withdrawn`) of its latest dated events; NULL when none, or when that day's events disagree."
      stage_events_json: "JSON array of its stage events, one per staged document: `{effective_date, event_kind, evidence_id, joined_by, source, stage}`."
      fr_document_numbers_json: "JSON array of the Federal Register document numbers it holds."
      cfr_refs_json: "JSON array of the CFR references (`title-part`) that the `rule_targets` edges of its dockets name."
      cfr_target_iris_json: "The same CFR references as Rulespec identifiers (e.g. `urn:rkaf:us:cfr:40:60`)."
      authority_refs_json: "Always `[]`: legal authority belongs to the editioned Unified Agenda entry, never to an action."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:proceedings:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "The prior generation's `proceeding_id` this proceeding continues, so equal to `proceeding_id` on a continuing row (the id carries over); NULL for a proceeding new in this generation."
      fr_document_ids_json: "JSON array of the dated Federal Register record ids (`number@YYYY-MM-DD`) it holds."
      fr_document_joins_json: "How each `fr_document_ids_json` document joined, in the same order: `{fr_document_id, joined_by}`, `joined_by` being `fr_docket_link`, `fr_copy`, `specific_rin` or `fr_document`."
      unresolved_fr_references_json: "JSON array of Register number references it holds that resolve to no single record, each with its candidates and status."
      rins_json: "JSON array of every RIN it holds, from its dockets, documents and Register documents."
  regulatory_agenda_items:
    label: "Regulatory Agenda items"
    coverage: >-
      Derived, and bounded by its inputs: every RIN that `unified_agenda`,
      `dockets`, `documents` or `federal_register` states.
    measured_on: "2026-09-28"
    summary: >-
      One row per Regulation Identifier Number: the durable Regulatory Agenda
      item a RIN identifies, with how many proceedings evidence links it to
      and whether its scope is resolved. Keyed `agenda_item_id`
      (`urn:rkaf:us:rin:<rin>`), one per `rin`; joined by
      `agenda_item_proceedings` on `agenda_item_id`, and to `unified_agenda`
      on `rin`. Built by `build_regulatory_agenda`; all columns are VARCHAR.
    grain: "One durable Regulatory Agenda item per RIN."
    identity_columns: [agenda_item_id]
    columns:
      agenda_item_id: "The item's id, `urn:rkaf:us:rin:<rin>`."
      rin: "The Regulation Identifier Number the item is (e.g. `2060-AV16`)."
      scope_status: "`recurring` (its latest Agenda priority is Routine and Frequent), `single_observed` (evidence links one proceeding) or `unresolved` (none or several)."
      scope_basis: "Why `scope_status` holds: `latest_agenda_priority_routine_and_frequent`, `one_evidence_linked_proceeding`, `zero_evidence_linked_proceedings` or `multiple_evidence_linked_proceedings`."
      linked_proceeding_count: "How many proceedings `agenda_item_proceedings` links the item to, as a decimal string."
      observation_count: "How many distinct Unified Agenda entries (edition and URL) list the RIN, as a decimal string; `0` when no edition does."
      latest_agenda_edition: "The latest Unified Agenda edition listing the RIN, `YYYYMM`; NULL when no edition does."
      first_seen: "Earliest Eastern day any source dates the RIN: an Agenda edition or action date, a docket or document date, or a Register publication."
      last_seen: "Latest Eastern day any source dates the RIN."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:regulatory-agenda-items:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "Id of a prior row this one continues; always NULL here, since an item's id is its RIN."
      unresolved_fr_references_json: "JSON array of unresolved Register number references from the Register documents that state this RIN."
  agenda_item_proceedings:
    label: "Agenda item to proceeding links"
    coverage: >-
      Derived, and bounded by its inputs: `dockets`, `documents` and
      `federal_register` records that state a RIN the proceeding holds.
    measured_on: "2026-09-28"
    summary: >-
      One row per piece of evidence that an agenda item tracks a proceeding: a
      docket, Regulations.gov document or Register document that directly
      reports the RIN for that proceeding. Unified Agenda equality alone never
      links an action. Keyed `relationship_id`; joins
      `regulatory_agenda_items` on `agenda_item_id`, `proceedings` on
      `proceeding_id` and `unified_agenda` on `rin`. Built by
      `build_regulatory_agenda`; all columns are VARCHAR.
    grain: "One evidence record linking one agenda item (RIN) to one proceeding."
    identity_columns: [relationship_id]
    columns:
      relationship_id: "Stable id of the link (`agenda_proceeding_relationship_<24 hex>`), from its RIN, proceeding, source and evidence."
      agenda_item_id: "The agenda item; joins `regulatory_agenda_items.agenda_item_id`."
      rin: "The item's Regulation Identifier Number."
      proceeding_id: "The proceeding the item tracks; joins `proceedings.proceeding_id`."
      relationship_role: "The link's role; `agenda_tracks_proceeding` throughout."
      source: "What reported the RIN: `docket_rin` (the docket), `document_rin` (a document's `additional_rins`) or `federal_register_rin` (a Register document)."
      evidence_id: "The reporting record, by `source`: a docket id, a Regulations.gov document id, or a dated Register record id (`number@YYYY-MM-DD`)."
      evidence_uri: "Public URL of that record on regulations.gov or federalregister.gov."
      evidence_date: "Eastern day of the evidence: the docket's or document's latest date, or the Register publication date."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:agenda-item-proceedings:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "Id of a prior row this one continues; always NULL here."
  comment_periods:
    label: "Public comment periods"
    coverage: >-
      Derived, and bounded by its inputs: every `federal_register` record with
      a `comments_close_on` and every `documents` row with a comment end date
      lands in exactly one period, anchored or not. Left out are windows that
      close before they open and placeholder closes (see data quality). Live
      row counts come from `describe_table`.
    measured_on: "2026-09-28"
    summary: >-
      One row per notice's public-comment period. A notice is a Register record
      with the Regulations.gov documents whose `fr_doc_num` names it, or a
      Regulations.gov document the Register does not hold. Periods merge only
      on an explicit link: a notice whose title extends or reopens a comment
      period, and that names an earlier notice still open when it opens (by the
      page that notice starts on, or as the one open notice sharing its RIN),
      lengthens that notice's period; one that opens after the period closed
      starts its own. A docket or proceeding anchors a period (`anchor_kind`)
      and never merges two, and a Federal Register feed docket
      (`AGENCY_FRDOC_0001` and the like) anchors nothing. Keyed
      `comment_period_id`. Its proceedings, dockets and RINs are JSON lists, so
      it joins through them rather than by a column. Built by
      `build_comment_periods`; all columns are VARCHAR.
    grain: "One notice's comment period: a Register record with its Regulations.gov copies, or a Regulations.gov document the Register does not hold, lengthened by the extensions that name it."
    data_quality: >-
      `close_date` is the latest close the period's own records state;
      `register_close_date` and `regulations_gov_close_date` keep each
      source's, and where they differ (Regulations.gov often holds a window
      open past the Register's date) the later one closes the period. A close
      on or after 2050-01-01 is a placeholder and states nothing: the inputs
      hold no close from 2033 to 2049, and every later one is a stand-in
      (Regulations.gov's 2099 and 2100 dates, FDA's 2050-02-21 open dockets,
      Register year typos such as 3008 for 2008). A record whose only close is
      a placeholder, or whose window closes before it opens, is in no period.
      The formal rulespec export is the anchored rows (`anchor_kind <>
      'none'`), since rulespec's CommentPeriod needs a proceeding or docket
      anchor; no export exists yet. A Regulations.gov document is a notice's
      copy only when its `fr_doc_num` says so, so a copy that omits it stands
      as its own notice: on the 2026-09-28 inputs about 2,950 such documents
      share a docket, close day and opening (within three days) with a Register
      notice. An extension that names its notice by neither page nor RIN, or
      whose title says "extension of time for comments", stays its own period.
      A legacy Regulations.gov document whose posting date is decades early
      (see `documents`) opens its period that early.
    identity_columns: [comment_period_id]
    columns:
      comment_period_id: "Stable id of the period (`comment_period_<24 hex>`), from the records that open it."
      proceeding_ids_json: "JSON array of the proceedings its notices belong to; `[]` when none resolves."
      rins_json: "JSON array of the RINs its records state and its proceedings hold."
      docket_ids_json: "JSON array of the Regulations.gov dockets anchoring it: those its Register record names, else those of its copies, else a Regulations.gov notice's own; never a feed docket, and `[]` when none."
      open_date: "Eastern day the period opens: the earliest opening among its records (a document's comment start, else its posting; a Register record's publication), `YYYY-MM-DD`."
      close_date: "Eastern day the period closes: the latest non-placeholder close its records state, `YYYY-MM-DD`."
      source: "The sources of its records, `+`-joined: `documents.comment_end_date` and `federal_register.comments_close_on`."
      opened_by_artifact_ids_json: "JSON array of public URLs of the records whose window opens the period on `open_date`."
      evidence_ids_json: "JSON array of every record in the period, each in exactly one period: dated Register record ids (`number@date`) and Regulations.gov document ids."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:comment-periods:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "Id of a prior row this one continues; always NULL here."
      unresolved_fr_references_json: "JSON array of unresolved Register number references attached to its evidence."
      anchor_kind: "What anchors the period: `docket` when a docket does, `proceeding` when only a proceeding does, `none` when neither; the rulespec export takes the anchored rows."
      register_close_date: "Latest `comments_close_on` of its Register records, `YYYY-MM-DD`; NULL when the Register states none."
      regulations_gov_close_date: "Latest comment end (Eastern day) of its Regulations.gov documents, `YYYY-MM-DD`; NULL when none states one."
  rulemaking_lifecycles:
    label: "Rulemaking lifecycles"
    coverage: >-
      Derived, and bounded by its inputs: every docketed proceeding, paired from
      its cleaned `lifecycle_events` and censored at the day its inputs end.
    measured_on: "2026-09-28"
    data_quality: >-
      A Regulations.gov document whose stated Register number resolves to no
      Register row is dated by its upload, which for a legacy document can be
      years after the rule: on snapshot_9b2c770e's inputs 262 lifecycles
      anchor on such a document, 74 of them upload pairs outside survival (docs/ontology.md).
    summary: >-
      One row per docketed proceeding (owner decisions 54-56c): its earliest
      proposal, the earliest final strictly after it, or what else its events
      make (`kind`), with survival columns (`outcome`, `duration_days`,
      `censor_date`) for time-to-final estimates, Unified Agenda status and
      routine-family strata. A docket-less proceeding is one Register
      document that cannot pair and is left out. Keyed `proceeding_id`; joins
      `proceedings` on it and is joined by `lifecycle_events`. Built by
      `build_lifecycles`; dates are DATE, counts INTEGER and flags BOOLEAN.
      Replaces the documents-based rollup withdrawn on 2026-09-23.
    grain: "One lifecycle per docketed proceeding."
    identity_columns: [proceeding_id]
    columns:
      proceeding_id: "The docketed proceeding the lifecycle reads; joins `proceedings.proceeding_id`."
      agency_code: "The proceeding's agency code."
      kind: "What its events make: `finalized`, `companion`, `upload_pair`, `withdrawn`, `open`, `final_without_observed_proposal` or `no_anchor`."
      proposal_date: "Day of the earliest proposed event; NULL without a proposal."
      proposal_document_id: "The proposal's document: a dated Register record id (`number@YYYY-MM-DD`) when the Register dates it, else a Regulations.gov document id."
      proposal_form: "The proposal's form from its title: `proposed`, `advance_proposed`, `comment_period` or `correction`."
      final_date: "Day of the final the lifecycle pairs or anchors on; NULL without one."
      final_document_id: "The final's document, spelled as `proposal_document_id` is."
      final_form: "The final's form from its title: `final`, `interim_final`, `direct_final` or `correction`."
      finals_before_proposal: "Finals dated before the proposal, counted and never paired; NULL without a proposal."
      withdrawal_date: "Day of the withdrawal that makes it `withdrawn`; NULL otherwise."
      withdrawal_document_id: "The withdrawal: a dated Register record id, or the agenda item id (`urn:rkaf:us:rin:<rin>`) of an Agenda withdrawal."
      withdrawal_source: "Who withdrew it: `federal_register` or `unified_agenda`."
      outcome: "Its survival outcome: `final`, `withdrawn` (a competing outcome) or `censored`; NULL for a kind outside survival."
      duration_days: "Days from the proposal to the final, the withdrawal or `censor_date`; NULL without an outcome."
      censor_date: "The generation's last event day, capped at the run's day, where open lifecycles are censored; one date in every row."
      open_signal: "What the latest Unified Agenda entry of its specific RINs says (`agenda_completed_final`, `agenda_completed_withdrawn`, `agenda_completed_other`, `agenda_long_term`, `agenda_active`, `agenda_dropped_off`), else `not_on_agenda` or `no_specific_rin`."
      routine_family: "The routine family its agency and titles name (`airworthiness_directive`, `airspace`, `state_air_plan`, `pesticide_tolerance`, `coast_guard_local`); NULL otherwise."
      agenda_priority: "That Agenda entry's `priority_category` (e.g. `Economically Significant`); NULL without one."
      agenda_major: "That Agenda entry's `major` (`Yes`, `No` or `Undetermined`); NULL without one."
      specific_rins_json: "JSON array of the RINs the proceeding's docket-side evidence alone holds."
      anchored_by_specific_rin: "Whether its proposal or final anchor joined the proceeding by specific RIN (decision 56c)."
      pre_2008_coverage: "Whether it is anchored before 2008, when Regulations.gov coverage is thin; NULL without an anchor, or for an upload pair from 2008 on."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:rulemaking-lifecycles:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "Id of a prior row this one continues; always NULL here."
  lifecycle_events:
    label: "Rulemaking lifecycle events"
    coverage: >-
      Derived, and bounded by its inputs: the stage events of every docketed
      proceeding, one per document, less those undated or dated after the run's
      day.
    measured_on: "2026-09-28"
    summary: >-
      One row per staged document of a docketed proceeding: the events each
      `rulemaking_lifecycles` row is paired from. A Regulations.gov copy of a
      Register document is that document, dated by the Register, and an
      Agenda entry completed as withdrawn adds its dated withdrawal. Keyed
      (`proceeding_id`, `document_id`); `dated_by` says which kind of id
      `document_id` is. Joins `rulemaking_lifecycles` on `proceeding_id`.
      Built by `build_lifecycles`; `event_date` is DATE.
    grain: "One stage event per document of one docketed proceeding."
    identity_columns: [proceeding_id, document_id]
    columns:
      proceeding_id: "The proceeding; joins `rulemaking_lifecycles.proceeding_id`."
      document_id: "The document, by `dated_by`: a dated Register record id (`number@YYYY-MM-DD`), a Regulations.gov document id, or an agenda item id (`urn:rkaf:us:rin:<rin>`)."
      stage: "The stage the event records: `proposed`, `supplemental`, `final` or `withdrawn`."
      event_date: "The event's day, from the source `dated_by` names."
      source: "Who typed the stage: `federal_register` (for its copies too, wherever it states a type), `regulations_gov` or `unified_agenda`."
      dated_by: "Whose day `event_date` is, and so which kind of id `document_id` is: `federal_register`, `regulations_gov` (its upload) or `unified_agenda`."
      evidence_id: "The proceedings stage event it came from: that record's own id, or `<agenda item id>@<edition>` for an Agenda withdrawal."
      joined_by: "How the document joined the proceeding: `docket`, `fr_docket_link`, `fr_copy`, `specific_rin` or `agenda_rin`."
      document_form: "Its stage refined by its title: `proposed`, `advance_proposed`, `comment_period`, `final`, `interim_final`, `direct_final`, `correction`, `supplemental` or `withdrawn`."
      anchor_role: "`proposal`, `final` or `withdrawal` when the lifecycle anchors on this document; NULL otherwise."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:lifecycle-events:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "Id of a prior row this one continues; always NULL here."
  agency_lifecycle_stats:
    label: "Time to final rule by agency"
    coverage: >-
      Derived from `rulemaking_lifecycles` with a survival outcome. A cell
      covering fewer than 30 rules is suppressed. On 2026-09-27 every
      unsuppressed estimate equalled R's multi-state `survfit`.
    measured_on: "2026-09-27"
    summary: >-
      The Aalen-Johansen cumulative incidence of a final rule, withdrawal
      competing (decision 54a), per agency and for all agencies
      (`agency_code` NULL), overall, routine, non-routine and per routine
      family: the first day it reaches each quartile, NULL where it never
      does, with a 95% interval from the log-log band. A cell under 30 rules
      keeps its row, `suppressed`, with no estimates; the Parquet metadata
      states the estimator exactly. Keyed (`agency_code`, `stratum`). Built
      by `build_agency_lifecycle_stats`; counts and days are INTEGER.
    grain: "One agency (or all agencies) and one stratum of rules."
    identity_columns: [agency_code, stratum]
    columns:
      agency_code: "The agency the cell covers; NULL for all agencies together."
      stratum: "The rules counted: `all`, `routine`, `non_routine`, or one routine family."
      rules: "Lifecycles in the cell with a survival outcome."
      finals: "How many of them became final."
      withdrawals: "How many of them were withdrawn."
      censored: "How many of them were still open at `censor_date`."
      suppressed: "Whether the cell has fewer than 30 rules and so carries no estimates."
      q1_days: "First day the cumulative incidence of a final reaches 25%; NULL where it never does or the cell is suppressed."
      q1_lower_days: "Lower end of the 95% interval of `q1_days`: the first day the band's upper edge reaches 25%; NULL where it never does or the cell is suppressed."
      q1_upper_days: "Upper end of the 95% interval of `q1_days`: the first day the band's lower edge reaches 25%; NULL where it never does."
      median_days: "First day the cumulative incidence of a final reaches 50%: the median time to final; NULL where it never does or the cell is suppressed."
      median_lower_days: "Lower end of the 95% interval of `median_days`: the first day the band's upper edge reaches 50%; NULL where it never does or the cell is suppressed."
      median_upper_days: "Upper end of the 95% interval of `median_days`; NULL where the band's lower edge never reaches 50%."
      q3_days: "First day the cumulative incidence of a final reaches 75%; NULL where it never does or the cell is suppressed."
      q3_lower_days: "Lower end of the 95% interval of `q3_days`: the first day the band's upper edge reaches 75%; NULL where it never does or the cell is suppressed."
      q3_upper_days: "Upper end of the 95% interval of `q3_days`; NULL where the band's lower edge never reaches 75%."
      censor_date: "The lifecycles' censor date, where the estimates' open rules are censored."
      method: "How the row was asserted; `deterministic` (computed by rule) throughout."
      actor_id: "The builder that asserted the row, with its version (`spicy-regs:agency-lifecycle-stats:v<n>`), bumped when its published rows change."
      run_id: "The materialization run that built the snapshot (e.g. `rulemaking-20260927T062656Z`)."
      asserted_at: "When that run asserted the row, as a UTC ISO 8601 instant."
      supersedes_id: "Id of a prior row this one continues; always NULL here."
  federal_register:
    label: "Federal Register documents"
    coverage: >-
      True range: dated records published from 1994-01-03 on, the whole span the
      API serves. On 2026-09-23 every month's row count equalled the publisher's
      monthly facet, and 74 whole days (8,683 documents) matched the API in
      identity and every cell.
    measured_on: "2026-09-23"
    summary: >-
      One row per dated Federal Register record, keyed by (`document_number`,
      `publication_date`), ingested from the federalregister.gov
      REST API by `build_federal_register`. The authoritative rule-publication
      record — proposed rules, final rules, and notices — complementary to the
      regulations.gov `dockets`/`documents` view. `regulation_id_numbers_json`
      (RIN) and `cfr_references_json` are the join keys to the Unified Agenda and
      the CFR. All columns are stored as VARCHAR; array-valued fields are JSON.
    data_quality: >-
      Document numbers are not globally unique: `00-111` names different
      records on 2000-01-14 and 2000-01-18. Current merging preserves both dates
      and replaces only the same dated record on a later successful fetch.
      This code correction does not restore historical records already lost
      from published files; those require a pinned historical replay and
      publication. A number-only source reference remains ambiguous when its
      input generation supplies multiple dated candidates.
    columns_from: spicy_docs
  sam_entities:
    identity_columns: [uei, entity_eft_indicator]
    label: "Federal entity registry"
    coverage: >-
      Window, complete for the years read. Every public active registration
      SAM.gov dated 1996 through 2026 and the two older ones (1949, 1968), one
      bulk extract per registrationDate year: 792,846 registrations of 787,293
      UEIs on 2026-09-26, against the entity API's 792,892 active that day.
      Each year matched its active count when read, less its credited renewals
      (see data_quality). Scheduled runs re-read the current year every other
      day and cycle through the older years between, and each year read
      replaces that year's rows.
    measured_on: "2026-09-26"
    data_quality: >-
      A row is a registration, keyed by `uei` and `entity_eft_indicator`: one
      entity registers once per EFT indicator (187 of the 147,038 UEIs in the
      2026 extract carry more than one), so `uei` alone is not unique. SAM
      keeps a renewed registration's prior record Active until its expiry is
      processed, and counts both; the table keeps the newer, and the reader
      credits the other toward the file's declared count (one each in 2007,
      2008, 2011, 2013, 2019 and 2020 and two in 2026, each journaled). A file with fewer
      registrations than it declares, less those credits, is refused. A year
      read retires the registrations it no longer holds (80 expired from 2002
      and 2003 and 11 from 2026 on 2026-09-26), journaled as `rows-retired` so
      qualification reconciles every removal. A stalled extract is abandoned
      and triggered afresh, each abandonment journaled.
    summary: >-
      One row per active SAM.gov registration, ingested from the Entity
      Management API v4 bulk extract (`/entities?format=json`) by
      `build_sam_entities`. The authoritative federal entity registry, the
      directory of organizations registered to do business with or receive
      assistance from the U.S. government, and the anchor for
      organization/entity resolution across the corpus: the same UEI ties a
      commenting organization to its registered identity. Filtered to public
      active registrations (`registrationStatus=A`); list-level fields only.
      All columns are stored as VARCHAR.
    columns:
      uei: "Unique Entity ID (SAM `ueiSAM`, 12-char alphanumeric, e.g. `Q93HWX24PGA4`). With `entity_eft_indicator`, the registration key; alone, the entity-resolution join key."
      entity_eft_indicator: "SAM `entityEFTIndicator`: which of an entity's registrations this is, one per EFT (bank-account) indicator. NULL for an entity's sole registration."
      cage_code: "Commercial and Government Entity (CAGE) code assigned to the entity. Often null for newly registered entities."
      legal_business_name: "Legal business name as registered in SAM.gov."
      dba_name: "'Doing business as' name, when the entity registered one. Often null."
      entity_structure_desc: "Entity structure description (`coreData.generalInformation.entityStructureDesc`, e.g. `Corporate Entity (Not Tax Exempt)`)."
      entity_type_desc: "Entity type description (e.g. `Business or Organization`)."
      profit_structure_desc: "Profit-structure description (e.g. `For Profit Organization`, `Non-Profit Organization`)."
      state: "State or province code of the physical address (`coreData.physicalAddress.stateOrProvinceCode`). Null for many non-US registrants."
      city: "City of the physical address."
      zip_code: "ZIP / postal code of the physical address."
      congressional_district: "U.S. congressional district of the physical address (`coreData.congressionalDistrict`). Null for non-US registrants."
      primary_naics: "Primary NAICS industry code the entity asserted (`assertions.goodsAndServices.primaryNaics`). Often null."
      registration_status: "Registration status as returned by the API (e.g. `Active`). The ingest filters on the request-side `registrationStatus=A`."
      registration_date: "Date the entity's current registration was recorded (ISO 8601 string)."
      registration_expiration_date: "Date the current registration expires (ISO 8601 string)."
      exclusion_status_flag: "Whether the entity has an active exclusion/debarment record (`Y`/`N`)."
      purpose_of_registration_desc: "Purpose-of-registration description (e.g. `Federal Assistance Awards`, `All Awards`)."
      entity_url: "Entity's self-reported website URL (`coreData.entityInformation.entityURL`). Often null."
  lobbying_filings:
    identity_columns: [filing_uuid]
    label: "Lobbying disclosure filings"
    coverage: >-
      True range: every filing of each filing year held, read whole from the LDA
      API, from 2010 to date; earlier years are added one year per dispatched
      run (owner decision 47).
    measured_on: "2026-09-28"
    summary: >-
      One row per federal lobbying-disclosure filing, ingested from the U.S.
      Senate Lobbying Disclosure Act (LDA) REST API (`lda.senate.gov`) by
      `build_lobbying_filings`. Registrants file quarterly reports naming the
      clients they lobby for, the money involved, the issues raised, and the
      government entities (agencies/chambers) lobbied — so this table links the
      comment campaigns in `comments`/`dockets` to the same organizations'
      *direct* agency lobbying. Primary / dedup key is `filing_uuid`. All columns
      are stored as VARCHAR; nested/array fields are JSON strings.
    columns:
      filing_uuid: "LDA filing UUID (e.g. `7866327b-c892-4430-b9f0-1f0f679c58c6`). Primary key / dedup key."
      filing_type: "Filing type code (e.g. `RR` registration, `Q1`–`Q4` quarterly reports, `1A`–`4A` amendments, terminations). An amendment is a separate filing that restates its quarter's report."
      filing_year: "Calendar year the filing reports on."
      filing_period: "Reporting period within the year (e.g. `first_quarter`, `year_end`)."
      dt_posted: "Timestamp the filing was posted to the LDA system (ISO 8601 string with timezone). Sort key."
      registrant_name: "Name of the registrant (the lobbying firm or self-filing organization)."
      registrant_id: "LDA registrant id. Stable join key across a registrant's filings."
      client_name: "Name of the client the lobbying was performed for. Joins by name to `organizations`/comment filers."
      client_id: "LDA client id."
      income: "Lobbying income reported by a lobbying firm for the period, in USD. Null for self-filers (who report `expenses`). An amended report (`filing_type` `1A`–`4A`) restates its quarter's amount, often unchanged, so summing over every filing counts that quarter twice; keep the latest filing per registrant, client and quarter."
      expenses: "Lobbying expenses reported by a self-filing organization for the period, in USD. Null for firms (who report `income`). An amended report (`filing_type` `1A`–`4A`) restates its quarter's amount, often unchanged, so summing over every filing counts that quarter twice; keep the latest filing per registrant, client and quarter."
      lobbying_activities_json: "JSON array of lobbying activities, each `{general_issue_code, general_issue_code_display, description}` — the issue areas lobbied and their free-text descriptions."
      government_entities_json: "JSON array of the distinct government entities lobbied (`{id, name}`) — the agencies and chambers (e.g. `HOUSE OF REPRESENTATIVES`, `SENATE`) named across the filing's activities."
      url: "URL of the filing's printable document page on lda.senate.gov (`filing_document_url`)."
  lobbying_activities:
    identity_columns: [filing_uuid, activity_index]
    label: "Lobbying activities"
    coverage: >-
      True range, the same filings as `lobbying_filings`: one row per lobbying
      activity a filing reports. A filing that lists no activity has no rows
      here.
    measured_on: "2026-09-28"
    summary: >-
      One row per lobbying activity an LDA filing reports: the issue area, the
      registrant's description of what was lobbied, foreign-entity interests,
      and the government entities contacted for that activity. Keyed
      `(filing_uuid, activity_index)`, the position in the filing's own list,
      which is stable because LDA never edits a filing (an amendment is a new
      filing). Joins to `lobbying_filings` on `filing_uuid`. All columns are
      stored as VARCHAR.
    columns:
      filing_uuid: "The filing this activity belongs to; joins to `lobbying_filings.filing_uuid`."
      activity_index: "The activity's position in the filing's list, from `0`. With `filing_uuid`, the key."
      general_issue_code: "LDA general issue area code (e.g. `SCI`, `HCR`)."
      general_issue_code_display: "The issue area's name (e.g. `Science/Technology`)."
      description: "The registrant's description of the specific lobbying, often naming bills (e.g. `S. 3597`)."
      foreign_entity_issues: "The registrant's statement of any foreign entity's interest in the issue; often null."
      government_entities_json: "JSON array of the government entities contacted for this activity, `{id, name}` objects (e.g. `SENATE`)."
  lobbying_activity_lobbyists:
    identity_columns: [filing_uuid, activity_index, lobbyist_index]
    label: "Lobbyists named on lobbying activities"
    coverage: >-
      True range, the same filings as `lobbying_filings`: one row per lobbyist
      named on each activity. An activity that names no lobbyist has no rows
      here.
    measured_on: "2026-09-28"
    summary: >-
      One row per lobbyist an LDA filing names on one of its activities, with
      the lobbyist's LDA id and name parts, any covered official position they
      held, and whether the filing lists them as new. Keyed `(filing_uuid,
      activity_index, lobbyist_index)`, positions in the filing's own lists.
      Joins to `lobbying_activities` on `(filing_uuid, activity_index)`. All
      columns are stored as VARCHAR.
    columns:
      filing_uuid: "The filing; joins to `lobbying_filings.filing_uuid`."
      activity_index: "The activity's position in the filing; with `filing_uuid`, joins to `lobbying_activities`."
      lobbyist_index: "The lobbyist's position in the activity's list, from `0`. Completes the key."
      lobbyist_id: "LDA lobbyist id: the stable identity of the person across filings."
      prefix: "Name prefix as filed; often null."
      first_name: "First name as filed (LDA prints names upper-case)."
      nickname: "Nickname as filed; often null."
      middle_name: "Middle name as filed; often null."
      last_name: "Last name as filed."
      suffix: "Name suffix as filed; often null."
      covered_position: "The covered executive- or legislative-branch position the lobbyist held, as filed; null when none."
      new: "`True` when the filing lists the lobbyist as new for this activity, `False` otherwise."
  fec_committees:
    label: "Political committees"
    grain: "One row per observed FEC committee identifier."
    identity_columns: [committee_id]
    coverage: >-
      Not a range. The OpenFEC committee registry: the whole registry is walked
      every Sunday (decision 53) and committees that filed in the last week are
      read daily; rows only an earlier walk saw are kept. first_file_date and
      last_file_date describe filing activity, not acquisition.
    measured_on: "2026-09-28"
    summary: >-
      One row per observed Federal Election Commission committee. The current
      reader acquires from the unfiltered OpenFEC `/v1/committees/` endpoint
      through SpicyDocs; the delivered seed's selected scope is stated above.
      SpicyRegs preserves the existing 16 fields and JSON arrays, merges complete
      fresh traversals with prior observations by committee_id, and lets a fresh
      whole row replace its prior row. Raw page captures and acquisition
      manifests remain in FEC_CAPTURE_DIR. This identity/reference table can
      join other records carrying an FEC committee identifier. All columns are
      VARCHAR; array-valued fields are JSON strings.
    columns:
      committee_id: "OpenFEC committee identifier (e.g. `C00684373`). Primary key / dedup key."
      name: "Committee name as registered with the FEC."
      committee_type: "Single-letter committee type code (e.g. `P` presidential, `H` House, `S` Senate, `N`/`Q`/`O` PAC variants)."
      committee_type_full: "Human-readable committee type (e.g. `Presidential`, `PAC - Qualified`)."
      designation: "Single-letter committee designation code (e.g. `P` principal campaign committee, `A` authorized, `U` unauthorized, `J` joint fundraiser)."
      designation_full: "Human-readable committee designation (e.g. `Principal campaign committee`)."
      party: "Political party code, when set (e.g. `DEM`, `REP`, `W`). Often null for non-party committees."
      party_full: "Human-readable political party (e.g. `DEMOCRATIC PARTY`, `WRITE-IN`). Often null."
      state: "Two-letter state associated with the committee. Often null."
      treasurer_name: "Name of the committee's treasurer."
      organization_type_full: "Human-readable sponsoring organization type (e.g. `Corporation`, `Labor Organization`, `Trade Association`). Often null."
      filing_frequency: "Single-letter filing frequency code (e.g. `A` administratively terminated, `M` monthly, `Q` quarterly, `T` terminated)."
      first_file_date: "Date the committee first filed with the FEC (ISO 8601 string)."
      last_file_date: "Date of the committee's most recent filing (ISO 8601 string)."
      cycles_json: "JSON array of election-cycle years the committee was active in (e.g. `[2018, 2020, 2022]`)."
      candidate_ids_json: "JSON array of OpenFEC candidate IDs associated with the committee (e.g. `[\"P00008052\"]`). Often `[]`."
  fec_source_catalog:
    label: "Official FEC source families and access routes"
    grain: "One row per official source family in the SpicyDocs FEC registry."
    identity_columns: [source_family]
    coverage: >-
      Not a range. Every source family in the packaged SpicyDocs official FEC
      registry, with its official access routes. A listed route does not mean
      its records were acquired: fec_collections says what was.
    measured_on: "2026-09-28"
    summary: >-
      Source discovery metadata from SpicyDocs' official FEC inventory. Join
      source_family to fec_collections and fec_source_records to inspect which
      selected collections have been retained. The catalogue covers API, bulk,
      legal, agency and other official access paths; each has its own scope.
    columns:
      source_family: "Official source-family identifier. Join to fec_collections.source_family or fec_source_records.source_family."
      title: "Source-family title from the packaged official inventory."
      api_routes_json: "JSON array of official API routes with the provider's route and pagination metadata. Route presence does not prove successful acquisition."
      indexes_json: "JSON array of official indexes or discovery entry points listed for this family."
      bulk_families_json: "JSON array of bulk file families associated with this source family."
      references_json: "JSON array of reference pages from the packaged source inventory."
      source_metadata_json: "Complete source-family object from the packaged official inventory, including fields not lifted into separate columns."
      catalog_sha256: "SHA-256 digest of the exact packaged official_sources.json bytes used to build this row."
      provider_version: "Installed SpicyDocs version supplying the source inventory."
      catalogued_at: "Time this catalogue output was built; not the time source data was acquired or last changed."
      coverage_note: "Explicit scope limitation: catalogue entries describe routes and do not certify underlying data acquisition or publication."
  fec_collections:
    label: "Retained FEC collection scopes and outcomes"
    grain: "One row per selected verified input collection."
    identity_columns: [collection_id]
    coverage: >-
      Sampled. One row per selected FEC file or API query, including empty
      results, with its requested scope and outcome: a selected seed, not every
      official family or complete FEC history. A collection with profile `bulk`
      lists a zip's files, not their rows. The fec_collection_cycles view gives
      each collection's election cycle.
    measured_on: "2026-09-28"
    summary: >-
      Collection-level scope, counts and evidence for fec_source_records.
      Join collection_id to that table to distinguish observed records from
      empty results and uncollected populations. Join source_family to
      fec_source_catalog for the official access routes. Counts are stored as
      strings; cast explicitly for arithmetic.
    columns:
      collection_id: "Caller-supplied label unique within the selected manifest. Join to fec_source_records.collection_id."
      source_family: "Caller-selected official FEC source-family identifier, checked against the inventory. Join to fec_source_catalog.source_family; this classification is not independently inferred from source content."
      profile: "Provider reader profile used for this collection: committee, candidate, filing, legal, audit, bulk or positional records."
      source_system_id: "Provider identifier for the source system represented by this collection."
      source_state_scope: "Provider observation scope, such as observed-crawl; this does not imply a frozen publisher snapshot."
      record_count: "Number of verified source records emitted for this selected collection, stored as a decimal integer string."
      relationship_count: "Number of relationship observations emitted from this collection, including explicit absence states rather than only positive edges."
      record_outcome: "Provider's record outcome, such as no-record-rejections or an empty result, retained without promoting it to population completeness."
      requested_scope_json: "JSON object preserving the query, source selection or bounds requested for this collection."
      coverage_limits_json: "JSON value preserving provider-stated coverage limits for the selected input."
      collection_outcome_json: "Complete provider outcome including requested scope, rejections and warnings when supplied. tableFieldMapping records an explicit bulk-field mapping; tableFieldDefinitions retains verified HTML dictionary cells and source coordinates when selected."
      artifact_sha256: "Digest of the verified provider source-release artifact; null for direct retained-query input that has no release artifact."
  fec_source_records:
    label: "FEC source records with native metadata and evidence"
    grain: "One row per provider source record within a selected collection."
    identity_columns: [collection_id, source_record_id]
    coverage: >-
      Sampled. The records of the selected collections in fec_collections, not
      complete FEC history. Contributions from individuals are mostly missing:
      only the 2025-2026 insertion and deletion files are loaded, not the main
      individual-contributions file of any cycle (gap FG04 in docs/fec-gaps.md).
      For a candidate's individual donors, use FEC.gov. Overlapping collections
      can repeat an observation.
    measured_on: "2026-09-28"
    data_quality: >-
      Memo lines (MEMO_CD 'X' in metadata_json) repeat money already reported on
      another line; leave them out before summing. Most rows of the 2025-2026
      committee-to-committee file (collection bulk-2026-oth-base-file) are such
      memos: contributions from individuals received through joint fundraising
      committees (TRANSACTION_TP 15J). The bulk files carry no link from a memo
      to its transfer. Native fields retain their source meaning. Monetary
      values, amendment chains and record inclusion rules differ by family;
      generic record ingestion does not select a latest amendment or establish
      a safe sum. Unknown fields stay in native JSON. Original pinned bytes
      preserve numeric spelling where the provider exposes exact decimal values
      as strings.
    summary: >-
      Joinable metadata and retained source evidence across FEC families.
      collection_id joins fec_collections; source_family joins fec_source_catalog.
      Rows from different files and election cycles share this table, which has
      no cycle column: join collection_id to the fec_collection_cycles view for
      the cycle (2026 means 2025-2026) before comparing with a cycle's totals. A
      transaction's type, direction, other party, amount and memo flag are fields
      inside metadata_json (TRANSACTION_TP, OTHER_ID, CAND_ID, TRANSACTION_AMT,
      MEMO_CD). Native identifiers are lifted only when the provider reports
      them, and committee_id can join fec_committees. metadata_json and
      source_record_json preserve the complete provider record. Missing IDs
      remain missing.
    columns:
      collection_id: "Selected collection label: the file or query the record came from. Together with source_record_id identifies this record; joins fec_collections.collection_id and, for the election cycle, fec_collection_cycles.collection_id."
      source_family: "Caller-selected official FEC source-family identifier, checked against the inventory. Joins fec_source_catalog.source_family; this classification is not independently inferred from source content. fec_receipts holds only the 2025-2026 insertion and deletion files of individual contributions, not the main file of any cycle."
      profile: "Provider reader profile used to interpret the verified input."
      source_record_id: "Provider source-record identity, native API identity, bulk file key or byte-evidenced positional observation ID, scoped to collection_id."
      committee_id: "Committee ID as the source reports it (bulk CMTE_ID or the API's committee_id). In transaction files this is the committee that filed the report, not necessarily the one that received the money: a PAC's contribution to a candidate is filed under the PAC's ID, with the recipient in metadata_json OTHER_ID and CAND_ID, and TRANSACTION_TP says which way the money moved. To find money a committee received from other committees, also search OTHER_ID. May join fec_committees.committee_id. Blanks remain blank; no identifier is inferred from a name or another entity's ID."
      candidate_id: "Literal candidate identifier reported by API metadata or a verified named bulk field such as CAND_ID. Blanks and aggregate codes remain literal; an ID-shaped aggregate value does not establish a person. Names are not converted to identifiers."
      filing_id: "Source-reported sub_id of a filing metadata row when present; not an inferred original-file number. Amendment/current-record meaning remains in native metadata."
      legal_doc_id: "Source-reported legal document identifier when present, retained in its original source scope."
      audit_case_id: "Source-reported audit case identifier when present."
      source_sha256: "Digest pinning the source bytes from which the provider observed this record."
      source_url: "Recorded source URL associated with the observation; this is evidence provenance, not a live availability check."
      observed_at: "Provider observation time when available, distinct from dates reported inside the source record."
      source_locator_json: "JSON source coordinates identifying the original response field, record, file or ZIP member and byte span when supplied. Optional field_mapping pins the selected source header or HTML field dictionary; complete dictionary cells appear in the parent collection's tableFieldDefinitions."
      metadata_json: "Complete provider-native metadata, or literal positional values named by an explicitly selected verified source header or ordered HTML field dictionary. In transaction files, leave out memo lines (MEMO_CD 'X') before summing TRANSACTION_AMT: they repeat money reported on another line. Header and blank rows retain positional metadata; source_record_json always retains the full native wrapper."
      assets_json: "JSON representation of provider asset references and evidence; an asset reference alone does not establish that its body was downloaded."
      embedded_bodies_json: "JSON representation of provider-embedded body values, retaining their supplied scope."
      source_record_json: "Complete provider source-record serialization, preserving identity, native metadata, assets, bodies and evidence."
  fec_relationships:
    identity_columns: [source_sha256, source_locator_json, relationship_type]
    label: "Source-reported FEC relationship observations"
    grain: "One reported relationship or explicit absence state at one source location."
    coverage: >-
      Sampled. Relationships mapped from the selected committee, candidate, bulk
      and original filing inputs. Missing, null, empty and reported-none states
      remain rows, so this is not a count of positive relationships, and it is
      not complete family coverage or full FEC history.
    measured_on: "2026-09-21"
    data_quality: >-
      Names never become IDs. Identifier shape checks do not verify the named
      entity or prove the reference resolves. Independent source fields remain
      independent; conflicting assertions across observations and amendments
      remain visible. This table does not infer organization affiliations or
      replace org_committee_links name matches.
    summary: >-
      Source-stated roles and associations with their exact evidence. Select
      value_status before treating rows as positive edges, then use the subject
      and object types with their ID statuses before joining identifiers.
      source_locator_json retains collection_id and source_record_id when
      emitted by the retained-input rollup; extract both to join exactly to
      fec_source_records. Standalone mapper outputs may lack those parent keys.
      source_family identifies the mapper's native source family and need not
      equal the official catalogue ID; use the parent record for that join.
    columns:
      subject_id: "Source-reported identifier of the relationship subject. Interpret with subject_type and subject_id_status."
      subject_type: "Source entity type of the subject, such as committee or candidate."
      subject_id_status: "Identifier observation status: source_id_shape, invalid_source_id_shape or not_reported. Shape checks do not establish reference resolution."
      relationship_type: "Source role or association represented by this observation, preserving distinct reported meanings."
      object_id: "Source-reported identifier of the related entity when present. No identifier is inferred from object_name."
      object_type: "Type of related entity expected by the reported relationship."
      object_id_status: "Identifier observation status for object_id; a valid shape is not proof of a resolved reference."
      object_name: "Related name exactly as observed where supplied, including names with no reported identifier."
      value_status: "Whether the source reported a value or an explicit absence such as missing_field, null, empty_string, empty_list or reported_none. Inspect before treating a row as an edge."
      source_family: "Mapper's native source family, such as a bulk layout or API record family. For an official catalogue join, use the parent fec_source_records.source_family."
      cycle: "Election cycle supplied for a bulk observation; current API observations may have no cycle."
      candidate_election_year: "Candidate election year reported by the source when available."
      source_sha256: "Digest of the exact source bytes supporting this observation."
      source_url: "Source URL associated with the retained evidence."
      observed_at: "Evidence observation time when supplied; not an inferred effective date of the relationship."
      source_locator_json: "JSON source coordinates and field names; retained-input rollups also include collection_id and source_record_id for exact parent joins."
      source_fields_json: "JSON object preserving the exact source fields used for this relationship observation."
  org_committee_links:
    label: "Commenter organizations matched to committees"
    grain: "One row per commenter organization name and FEC committee name match."
    identity_columns: [organization, committee_id]
    coverage: >-
      Derived, and bounded by a small input. Name matches between commenter
      organizations and FEC committees, reachable only for the small share
      of comments that carry an `organization` value at all, so absence of a
      link is not evidence that a commenter has none.
    measured_on: "2026-09-06"
    data_quality: >-
      These are heuristic name matches, not source-reported affiliations.
      confidence describes the matching rule, not a measured probability of
      accuracy. Matching names and resolvable committee IDs do not establish
      that the commenter and committee share an organization.
    summary: >-
      One row per (commenter organization name, FEC committee) name match,
      derived by `build_org_committee_links`. Materializes the organization-name
      bridge between the regulations.gov corpus and `fec_committees` — the join
      the data model always described but left to each query author, so every
      consumer normalized names differently. `organization` is the raw string as
      filed, joining straight back to `comments.organization`; `committee_id`
      joins to `fec_committees`. Coverage is inherently small:
      `comments.organization` is populated on only ~0.08% of comments (~20.7K of
      ~25.8M), and most commenting organizations do not run a federal PAC, so a
      few hundred organizations resolving is the correct answer rather than a
      matcher to tune harder. Matching runs in three tiers (`exact`, `core`,
      `prefix`) and every row carries `match_method`, `confidence`, and
      `committee_match_count` so consumers pick their own precision bar instead
      of trusting an opaque score. A high `committee_match_count` can reflect
      multiple committees sharing a name prefix; inspect the source evidence
      before treating those matches as an affiliation network.
    columns:
      organization: "Commenter organization exactly as filed on the comment. Join key back to `comments.organization`."
      organization_norm: "`organization` uppercased with parenthetical asides, apostrophes and punctuation removed and `&` expanded to `AND`."
      organization_core: "`organization_norm` with trailing legal suffixes (`INC`, `LLC`, ...) and a leading `THE` removed. The form the `core`/`prefix` tiers compare."
      name_source: "Where the organization name came from. Always `organization_field` today; text-derived names (comment title, letterhead, signature block) would be added as extra rows under their own source."
      committee_id: "Matched OpenFEC committee identifier. Joins to `fec_committees.committee_id`."
      committee_name: "Matched committee name as registered with the FEC."
      committee_type_full: "Human-readable committee type of the matched committee (e.g. `PAC - Qualified`)."
      designation_full: "Human-readable committee designation of the matched committee."
      party_full: "Human-readable political party of the matched committee. Often null for non-party committees."
      organization_type_full: "Sponsoring organization type of the matched committee (e.g. `Trade Association`, `Labor Organization`). Often null."
      committee_state: "Two-letter state on the matched committee (`fec_committees.state`). Often null."
      match_method: "How the pair matched: `exact` (full normalized names equal), `core` (decoration-stripped cores equal), or `prefix` (committee core starts with the whole organization core on a token boundary)."
      confidence: "`high` for `exact`/`core`; for `prefix`, `medium` when `committee_match_count` <= 5 and `low` above that. Filter on this to pick a precision bar."
      committee_match_count: "How many committees this organization name matched in total. A high count does not establish an affiliate network; inspect source evidence alongside the matching rule."
      comment_count: "Comments filed under this exact organization string (deduplicated on `comment_id`, newest `modify_date` wins — matching the MCP `comments` view)."
      docket_count: "Distinct dockets this organization string commented on."
      agency_codes_json: "JSON array of the distinct agency codes this organization commented to, sorted."
      first_comment_date: "Earliest `posted_date` across this organization's comments (ISO 8601 string)."
      last_comment_date: "Latest `posted_date` across this organization's comments (ISO 8601 string)."
  gao_reports:
    identity_columns: [report_id]
    label: "Government Accountability Office reports"
    coverage: >-
      True range on GovInfo's archive and a window on recent products, with a
      gap between. The `govinfo` rows are every report and testimony in
      GovInfo's closed GAOREPORTS collection, issued from 1989-11-15 to
      2008-09-18, less its Comptroller General decisions; GovInfo adds nothing
      later, and one history run adds them. The `gao_rss` rows are what the
      daily job has read from GAO's recent-items feed since 2026-09-22 (its
      first read reached back to 2026-09-15); the feed lists only about 25
      items, so a product published while the job was not reading is lost to
      it. The `upstream_copy` rows are the reports published from 2026-07-13 to
      2026-09-14, copied once from upstream spicy-regs' own feed accumulator.
      The `gao_repair` rows were added one at a time by an explicit repair.
      Products issued from late 2008 to mid-2026 are absent unless a repair
      added them.
    measured_on: "2026-09-28"
    summary: >-
      One row per U.S. Government Accountability Office (GAO) report or
      testimony, keyed by GAO's own product id. The federal oversight layer
      over the rulemakings this dataset tracks — GAO's audits, evaluations, and
      recommendations on how agencies implement laws and rules. `source` names
      the route of each row: the public GAO reports RSS feed, read daily by
      `build_gao_reports` (a ~25-item recent-products window, the only
      anonymous machine-readable listing of new products, so the table is an
      **append-only accumulator**); a one-time copy of upstream's rows for the
      weeks before the fork read the feed; explicit single-report repairs; and
      GovInfo's GAOREPORTS listing, a closed collection read once, whose rows
      carry no abstract or tags. Deduped on `report_id`; a GovInfo row never
      replaces a row from another route. All columns are stored as VARCHAR.
    columns:
      report_id: "GAO product id as gao.gov's product URL spells it (e.g. `gao-26-107974`, `t-rced-94-121`), lowercased. Primary key / dedup key. A GovInfo package id maps to that spelling (`GAOREPORTS-GAO-HEHS-00-73` is `hehs-00-73`, `GAOREPORTS-RCED-AIMD-94-221FS` is `rcedaimd-94-221fs`); a few keep GovInfo's spelling where the package id cannot recover gao.gov's."
      title: "Product title as the route states it. A few GovInfo titles are GovInfo's placeholder `GAO Report from` and the number."
      report_type: "GAO product type. The feed tags no finer type, so a feed or upstream-copied row is `Report`; a GovInfo row is `Testimony` for a `T-` number or a number ending in `T`, else `Report`; NULL on a report added by explicit repair."
      published_date: "Publication date as an ISO date string (e.g. `2026-07-17`): the feed's `pubDate` (upstream's feed for a copied row), GovInfo's `dateIssued`, or the day a repaired product's page states. Sort key."
      abstract: "The product summary from the feed (GAO's `What GAO Found` / `Why GAO Did This Study` narrative); NULL on repair and GovInfo rows."
      agencies_json: "Reserved JSON array of agencies the product covers. The RSS feed carries no structured agency tags, so this is `[]` pending a future enrichment source; NULL on repair and GovInfo rows."
      topics_json: "Reserved JSON array of topics/subjects. The RSS feed carries no structured topic tags, so this is `[]` pending a future enrichment source; NULL on repair and GovInfo rows."
      url: "The product's page on the route that supplied the row: the gao.gov product page for feed, upstream-copied and repair rows, GovInfo's details page (composed from the package id) for GovInfo rows."
      source: "The route that supplied the row: `gao_rss` (the daily feed), `upstream_copy` (copied once from upstream spicy-regs' published table), `gao_repair` (an explicit single-report repair) or `govinfo` (GovInfo's GAOREPORTS listing)."
  crs_reports:
    identity_columns: [report_id]
    label: "Congressional Research Service reports"
    coverage: >-
      True range: reports published from 1993-10-22 on, running about 1,100 to
      1,350 a year in recent years. On 2026-09-23 every id and cell matched the
      raw list pages but 15 `update_date` values the publisher re-stamped
      between two reads.
    measured_on: "2026-09-23"
    summary: >-
      One row per Congressional Research Service (CRS) report, ingested from the
      Congress.gov v3 REST API (`/crsreport` list endpoint) by
      `build_crs_reports`. The nonpartisan policy-analysis layer over the same
      subjects agencies regulate — complementary to `congress_bills` (the
      legislative record) and `federal_register` (the rule-publication record).
      Scope is deliberately list-level only (no per-report detail fetches), so
      every column comes from the list payload. Incremental by `update_date`,
      deduped on `report_id`; each query is pooled over whole walks, varying
      the page size, until one walk is clean or the pool holds exactly the
      declared count, because the list shifts while it is read. All columns
      are stored as VARCHAR.
    columns:
      report_id: "CRS report id (e.g. `R48641`, `IN12713`). Primary key / dedup key."
      title: "Report title as returned by the list endpoint."
      report_type: "CRS product category from `contentType` (e.g. `Reports`, `Posts`)."
      status: "Report status as reported by Congress.gov (e.g. `Active`)."
      published_date: "Date the report was published (ISO 8601 string)."
      update_date: "Date the Congress.gov record was last updated (ISO 8601 string). Incremental window key."
      version: "Version number of the report as returned by the list endpoint."
      url: "Congress.gov API URL for the report's detail resource."
  court_dockets:
    identity_columns: [cl_docket_id]
    label: "Court dockets of APA suits against agencies"
    coverage: >-
      True range with a density caveat: dockets filed from 1992 on, but only the
      nature-of-suit 899 (Administrative Procedure Act) selection, not the full
      docket record. Party names of dockets from the bulk edition are read a
      bounded slice per run; until read, parties_json is NULL.
    measured_on: "2026-09-28"
    summary: >-
      One row per court docket of a suit challenging federal agency action under
      the Administrative Procedure Act (nature of suit 899), mostly in district
      courts, from CourtListener (`courtlistener.com`: its v4 search API and its
      bulk docket edition) by `build_courtlistener`. It is the litigation
      counterpart to the rulemakings in `dockets`/`documents`, not all federal
      litigation: petitions straight to a court of appeals, such as challenges
      to FCC orders under the Hobbs Act, are largely absent. For court
      decisions, including appeals and Supreme Court cases, search
      `court_opinion_clusters` by `case_name`. There is no RIN, Federal Register
      or agency identifier on a court docket: the defendant agency appears only
      as text in `case_name` and `parties_json`, so a name search finds
      candidates, not confirmed links, and `cause` names the statute invoked.
      Primary / dedup key is `cl_docket_id`. All columns are stored as VARCHAR;
      array fields are JSON strings.
    columns:
      cl_docket_id: "CourtListener docket id (e.g. `73613631`). Primary key / dedup key. Distinct from the regulations.gov `docket_id`."
      case_name: "Short case name (e.g. `HENNEPIN COUNTY, MINNESOTA v. U.S. DEPARTMENT OF HEALTH AND HUMAN SERVICES`). Names the defendant agency as text, not as an identifier. For decisions in cases missing here, including appeals of agency orders, search `court_opinion_clusters.case_name`."
      case_name_full: "Full case caption when available; often blank."
      court_id: "CourtListener court identifier (e.g. `dcd` D.D.C., `cadc` D.C. Circuit, `akd` D. Alaska)."
      court: "Human-readable court name (e.g. `District Court, District of Columbia`)."
      court_citation_string: "Court citation abbreviation (e.g. `D.D.C.`)."
      docket_number: "Court docket number (e.g. `1:26-cv-02460`)."
      case_type: "Case-type code parsed from a district-court `docket_number` (`1:26-cv-02460` is `cv`, civil; also `cr` criminal, `mj` magistrate, `po` petty offense, `mc` miscellaneous). NULL when the number carries none, as appellate numbers do. The publisher codes non-civil dockets 899 too; they are kept, so filter on this for civil litigation."
      date_filed: "Date the case was filed (ISO 8601 string). Sort key and incremental watermark."
      date_terminated: "Date the case was terminated, if closed (ISO 8601 string). Null for pending cases."
      date_argued: "Date of oral argument, if any (ISO 8601 string). Often null."
      nature_of_suit: "Nature-of-suit label as CourtListener spells it. Every row came from the 899 (Administrative Procedure Act) selection, but the label varies: with or without the number (appellate dockets write 2899 or 3899), abbreviated as APA or Admin Proc Act, blank or NULL, and on a few rows another code. Filtering on one exact string misses most rows; you do not need this column to find APA suits."
      cause: "Statutory cause of action as recorded in PACER (e.g. `05:551 Administrative Procedure Act`)."
      jurisdiction_type: "Basis of federal jurisdiction (e.g. `U.S. Government Defendant`)."
      jury_demand: "Jury demand recorded on the docket (e.g. `None`)."
      assigned_to: "Name of the judge assigned to the case."
      referred_to: "Name of the magistrate/referral judge, if any. Often null."
      parties_json: "JSON array of party names on the docket (plaintiffs and defendants, including the defendant agency). `[]` when the publisher names none; NULL when the docket came from the bulk edition and its names have not been read yet."
      attorneys_json: "JSON array of attorney names appearing on the docket."
      firms_json: "JSON array of law-firm / legal-organization names appearing on the docket."
      pacer_case_id: "PACER case id for the docket in its court's CM/ECF system."
      date_created: "Timestamp CourtListener first indexed the docket (ISO 8601 string, from the search-result `meta.date_created`)."
      absolute_url: "Absolute URL of the docket page on courtlistener.com."
  court_docket_groups:
    label: "Court docket same-case groups"
    grain: "One row per grouped court_dockets row; absent rows have no group."
    identity_columns: [cl_docket_id]
    coverage: >-
      Not a range. A derived mapping over the published `court_dockets`
      selection, computed from the 2026-06-30 bulk edition. The edition leaves
      its own parent_docket_id blank in every row, so the parent is inferred
      from the publisher's PACER mechanics (one main case created first, plus
      per-defendant sub-dockets: the documented doppeldocket problem, FLP wiki /
      GitHub issue #2185): group by (court_id, docket_number) with a single
      caption among published members, parent = lowest pacer_case_id in the
      group. confidence_tier separates tight-pacer doppeldockets from
      wide-spread refilings of one case. Groups with multiple captions
      (docket-number reuse) or no pacer ids stay ungrouped and have no row.
    measured_on: "2026-09-22"
    summary: >-
      Same-case record groups for the APA litigation dockets: which published
      docket rows are alternative records of one case, and which row is the
      group's parent. Join on cl_docket_id; the parent row carries
      parent_cl_docket_id equal to cl_docket_id. This is an inferred mapping,
      not publisher data; it is edition-scoped (2026-06-30) and does not cover
      dockets published after the edition until recomputed.
    columns:
      cl_docket_id: "CourtListener docket id of a grouped row in `court_dockets`. Primary key."
      parent_cl_docket_id: "The group's parent docket id (lowest pacer_case_id among published group members). Equal to cl_docket_id on the parent's own row."
      confidence_tier: "`doppeldocket` when the group's pacer ids are contiguous (spread <= 5), `refiled` when the same case was refiled across a wider pacer spread."
      group_size: "Number of published court_dockets rows in the same-case group."
      edition: "The CourtListener bulk edition the grouping was computed from (`2026-06-30`)."
      rule_version: "Version of the grouping rule (1: single-caption group, parent = lowest pacer_case_id)."
  court_opinion_clusters:
    label: "Court decisions and their opinion groups"
    grain: "One CourtListener decision cluster per cluster_id; multiple opinion bodies can belong to it."
    identity_columns: [cluster_id]
    coverage: >-
      Not a range. The complete 2026-06-30 CourtListener opinion-clusters
      export, every mapped source field checked against the original export; the
      court fields agree with the same-edition docket map and court reference
      data. A search catch-up adds every cluster whose id is above the export's
      highest, whatever its filing date; a correction to an exported cluster
      arrives with the next export. Opinion bodies and broader historical
      coverage are separate. See docs/research/fork-output-ledger-2026-09-21.md
      and receipt join-gaps-2026-09-26/i/.
    measured_on: "2026-09-22"
    summary: >-
      Decision metadata from CourtListener opinion-clusters bulk data and
      opinion-search catch-up. cluster_id joins court_opinions.cluster_id (and through it the citation map and parentheticals);
      cl_docket_id joins court_dockets.cl_docket_id where that separately scoped
      docket table contains the case. Court identity comes from a bulk docket
      map or a search result; jurisdiction classification uses CourtListener's
      court reference data. This table does not hold individual opinion bodies.
      All columns are VARCHAR; native numeric and boolean spellings are strings.
    data_quality: >-
      Bulk and search records expose different fields. ingest_source identifies
      the selected row's route; unavailable fields are NULL and metadata empty
      strings are normalized to NULL. A search row never replaces a bulk row of
      the same export, whose ids it lies above, and a later export's bulk row
      replaces it. Opinion search does not index RECAP trial-court clusters, so
      one created after the export arrives only with the next export. Missing
      court scope is unknown, not proof of a non-federal court.
      court_dockets is a narrower selection, so unmatched docket IDs are expected.
      Names, judge strings and citations do not establish cross-source identity.
    columns:
      cluster_id: "CourtListener opinion-cluster ID, the decision-level primary/dedup key. Join to court_opinions.cluster_id and court_citations.cluster_id; not an opinion_id."
      cl_docket_id: "CourtListener docket ID, renamed from docket_id. Join to court_dockets.cl_docket_id where present; unrelated to regulations.gov docket_id."
      court_id: "CourtListener court identifier from the docket map or search record; NULL when unresolved."
      court_jurisdiction: "CourtListener jurisdiction code from the court reference lookup; NULL when unavailable."
      court_is_federal: "Derived federal classification from court jurisdiction: t or f as a string; NULL when the classification is unavailable."
      case_name: "Source case caption; not a stable identity or affiliation link."
      case_name_short: "Source short case caption, when supplied by bulk data."
      case_name_full: "Source full case caption when supplied."
      date_filed: "Source decision filing date; used by search catch-up, not an observation or correction date."
      date_filed_is_approximate: "Source flag stating whether date_filed is approximate, stored as a string."
      judges: "Source judge text; names are not normalized person identifiers."
      nature_of_suit: "Source nature-of-suit text when supplied; this cluster table is not limited to the docket rollup's 899 query."
      precedential_status: "CourtListener's source precedential-status value; this table does not independently assess legal authority."
      citation_count: "Source citation-count value at observation time, stored as a string."
      scdb_id: "Supreme Court Database identifier as supplied by CourtListener, when available."
      scdb_decision_direction: "Source Supreme Court Database decision-direction code; retained without interpretation."
      scdb_votes_majority: "Source Supreme Court Database majority-vote count, stored as a string."
      scdb_votes_minority: "Source Supreme Court Database minority-vote count, stored as a string."
      source: "CourtListener's source value for the cluster; distinct from the ingest_source route."
      procedural_history: "Source procedural-history text when supplied."
      attorneys: "Source attorney text; does not retain structured person identity."
      posture: "Source procedural-posture text when supplied."
      syllabus: "Source syllabus text when supplied."
      headnotes: "Source headnotes text when supplied."
      summary: "Source summary text when supplied; not a generated SpicyRegs summary."
      disposition: "Source disposition text when supplied."
      history: "Source history text when supplied."
      other_dates: "Source other-dates text, without date normalization."
      cross_reference: "Source cross-reference text, without inferred identifier resolution."
      correction: "Source correction text when supplied; not proof that later corrections have been acquired."
      arguments: "Source arguments text when supplied."
      headmatter: "Source headmatter text when supplied."
      blocked: "Source blocked flag as a string; not a current access check."
      date_blocked: "Source date of blocking when supplied."
      slug: "Source URL slug; not a stable identity."
      absolute_url: "CourtListener decision page URL, constructed from cluster ID/slug for bulk rows or supplied by search."
      date_created: "Source record-creation timestamp when supplied by bulk data."
      date_modified: "Source record-modification timestamp when supplied by bulk data."
      ingest_source: "Route for the retained row: bulk or search. The table does not itself pin the original capture bytes."
  court_citations:
    label: "Court reporter citations"
    grain: "One reporter citation of one CourtListener decision (cluster); a decision can have several."
    identity_columns: [citation_id]
    coverage: >-
      Not a range. The complete 2026-06-30 CourtListener citations export,
      copied field for field: every (cluster_id, volume, reporter, page) unique
      as the publisher's schema requires. The publisher cut this export hours
      after the cluster export, so a few citations name a cluster
      court_opinion_clusters lacks (63 on 2026-09-26, 43 of them added by the
      clusters' catch-up; receipt join-gaps-2026-09-26/i/).
    measured_on: "2026-09-22"
    summary: >-
      Every reporter citation CourtListener records for a decision, such as
      "410 U.S. 113", "93 S. Ct. 705" or a WestLaw or neutral cite. Join
      cluster_id to court_opinion_clusters.cluster_id to reach the decision; a
      U.S. Reports citation found in a document (SpicyDocs' us_reports_cite rule)
      resolves through the row with reporter 'U.S.'. Rebuilt whole from each
      quarterly export. All columns are VARCHAR, copied as the publisher wrote them.
    data_quality: >-
      Citations are the publisher's, not re-derived from opinion text; a decision
      missing a citation here may still carry one in print. Reporter strings are
      the publisher's abbreviations and are not normalized. page is text because
      some reporters page with letters or asterisks. A new export is refused
      until the published court_opinion_clusters reaches every cluster id it
      names; a cluster the publisher merged away after the export still dangles.
    columns:
      citation_id: "CourtListener citation ID. Primary key within one export."
      cluster_id: "CourtListener decision-cluster ID the citation names; joins court_opinion_clusters.cluster_id."
      volume: "Reporter volume as the publisher records it (a string; some volumes are years)."
      reporter: "Reporter abbreviation, such as `U.S.`, `F.3d` or `WL`, as the publisher records it."
      page: "Starting page or equivalent locator in the reporter, as text."
      citation_type: "Publisher citation type code: 1 federal reporter, 2 state, 3 state regional, 4 specialty, 5 early U.S. Supreme Court, 6 Lexis, 7 WestLaw, 8 vendor-neutral, 9 law journal."
      date_created: "Timestamp the publisher created the citation record."
      date_modified: "Timestamp the publisher last modified the citation record."
      dump_date: "The CourtListener bulk export the row was copied from (ISO date)."
  court_citation_map:
    label: "Court opinion citation map"
    grain: "One citing opinion's citation of one cited opinion, with how many times it cites it."
    identity_columns: [citing_opinion_id, cited_opinion_id]
    coverage: >-
      Not a range. The complete 2026-06-30 CourtListener citation-map export:
      citing/cited opinion pairs, each unique as the publisher's schema
      requires, with no NULL depth. Only the publisher's surrogate row id is
      dropped. Through court_opinions of the same edition, all but 3,758 citing
      ids and one cited id resolved on 2026-09-22.
    measured_on: "2026-09-22"
    summary: >-
      Which court opinion cites which, and how often, as CourtListener's citator
      resolved it. Both ids are opinion ids, not decision ids: join each to
      court_opinions.opinion_id, then court_opinions.cluster_id to
      court_opinion_clusters, to ask what cites a decision or which decisions are
      cited most. Rebuilt whole from each quarterly export. All columns are VARCHAR.
    data_quality: >-
      The edges are the publisher's automated citation resolution, not a
      reviewed citator: citations it could not resolve are absent, and depth
      counts mentions, not treatment (followed, distinguished or overruled are
      not recorded). Several opinions of one decision each carry their own edges,
      so count distinct clusters, not rows, when ranking decisions.
    columns:
      citing_opinion_id: "CourtListener opinion ID of the opinion that cites. Joins court_opinions.opinion_id."
      cited_opinion_id: "CourtListener opinion ID of the opinion cited. Joins court_opinions.opinion_id."
      depth: "Number of times the citing opinion cites the cited one, as text."
      dump_date: "The CourtListener bulk export the row was copied from (ISO date)."
  court_parentheticals:
    label: "Court opinion parentheticals"
    grain: "One parenthetical summary one opinion wrote about another."
    identity_columns: [parenthetical_id]
    coverage: >-
      Not a range. The complete 2026-06-30 CourtListener parentheticals export,
      none with empty text; some have no group. Through court_opinions of the
      same edition every described opinion id and all but 618 describing ids
      resolved on 2026-09-22.
    measured_on: "2026-09-22"
    summary: >-
      Short summaries of a decision written by the courts that later cite it, the
      text in parentheses after a citation, such as "(holding that an agency must
      explain a change in position)". described_opinion_id is the opinion
      summarized and describing_opinion_id the one that wrote it; join either to
      court_opinions.opinion_id to reach its decision. score is the publisher's
      estimate of how descriptive the text is. Rebuilt whole from each quarterly
      export. All columns are VARCHAR.
    data_quality: >-
      The text is the citing court's own words, extracted automatically by the
      publisher, so it can describe a holding, a fact or a procedural point, and
      score is a model estimate, not a review. Several parentheticals can
      summarize the same point; group_id links those the publisher grouped.
    columns:
      parenthetical_id: "CourtListener parenthetical ID. Primary key within one export."
      described_opinion_id: "CourtListener opinion ID of the opinion the parenthetical summarizes. Joins court_opinions.opinion_id."
      describing_opinion_id: "CourtListener opinion ID of the opinion that wrote the parenthetical. Joins court_opinions.opinion_id."
      text: "The parenthetical as the describing opinion wrote it."
      score: "Publisher's 0-to-1 estimate of how descriptive the text is, as text."
      group_id: "Publisher's group of parentheticals making the same point; NULL when ungrouped."
      dump_date: "The CourtListener bulk export the row was copied from (ISO date)."
  court_opinions:
    label: "Court opinions (index, no text)"
    grain: "One CourtListener opinion (a majority, concurrence or dissent) of one decision."
    identity_columns: [opinion_id]
    coverage: >-
      Not a range. The complete 2026-06-30 CourtListener opinions export without
      its eight text fields: every opinion_id unique and every cluster_id set.
      All but 21 name a decision in court_opinion_clusters; those 21 are RECAP
      trial-court opinions created between the two exports, which opinion search
      does not index, and resolve with the next export (receipt
      join-gaps-2026-09-26/i/). Opinion text is not included: the fork links out
      to CourtListener instead.
    measured_on: "2026-09-22"
    summary: >-
      Every CourtListener opinion's decision, type and author, without its text.
      It is what connects court_citation_map and court_parentheticals, which name
      opinions, to court_opinion_clusters, which holds decisions: join opinion_id
      from either, then cluster_id to court_opinion_clusters.cluster_id. local_path
      and download_url locate the original document. Rebuilt whole from each
      quarterly export, locally rather than on a schedule, because the source
      export is 54.6 GB. All columns are VARCHAR.
    data_quality: >-
      Author strings are the publisher's text and are not resolved to people;
      author_id is set only where the publisher linked a judge. opinion_type is
      the publisher's code, such as 010combined or 040dissent.
    columns:
      opinion_id: "CourtListener opinion ID. Primary key; joins court_citation_map and court_parentheticals opinion ids."
      cluster_id: "CourtListener decision-cluster ID the opinion belongs to; joins court_opinion_clusters.cluster_id."
      opinion_type: "Publisher opinion type code, such as `010combined`, `020lead`, `030concurrence` or `040dissent`."
      author_id: "CourtListener judge ID of the author, when the publisher linked one."
      author_str: "Author as the publisher's source text names them; not resolved to a person."
      per_curiam: "Publisher per-curiam flag (`t` or `f`)."
      joined_by_str: "Judges joining the opinion, as the publisher's source text names them."
      page_count: "Page count of the original document when known, as text."
      sha1: "Publisher's SHA-1 of the original document; not a SpicyRegs capture digest."
      download_url: "Where the publisher obtained the original document, when recorded; no current accessibility claim."
      local_path: "Path of the original document in CourtListener's storage, not a SpicyRegs file."
      extracted_by_ocr: "Publisher flag for text extracted by OCR (`t` or `f`)."
      date_created: "Timestamp the publisher created the opinion record."
      date_modified: "Timestamp the publisher last modified the opinion record."
      dump_date: "The CourtListener bulk export the row was copied from (ISO date)."
  usaspending_recipients:
    identity_columns: [recipient_id]
    label: "Federal award recipients"
    coverage: >-
      Not a range. Accumulated recipients from bounded top-N walks ranked by trailing-12-month
      award amount. Each run refreshes its selected recipients and retains earlier
      rows outside that selection with their previous amounts, so the amounts can
      describe different trailing-12-month periods. A row read since per-row
      capture evidence was added states its `observed_at` and the digest of its
      source page; a row carried from earlier runs keeps NULL there, because its
      read time was not retained. An absent recipient may still exist in the
      publisher's awards data.
    measured_on: "2026-09-24"
    summary: >-
      One row per federal-award recipient, ingested from the USASpending.gov
      `/api/v2/recipient/` endpoint by `build_usaspending_recipients`. A
      keyless (no API key) org-resolution reference dimension keyed by UEI and
      name — the organizations that receive federal money — complementary to the
      SAM entity registry and the `fec_committees` table for resolving and
      enriching the organizations that comment on rulemakings by their federal
      funding. Scope is deliberately bounded to the top-N recipients by trailing-12-month
      federal award amount (the endpoint reports ~18M recipients, too many for a
      daily full walk); the transform merges each run's top-N with the prior
      table so coverage stays monotonic. Retained recipients outside a run's
      selection keep their earlier amounts and their original observation
      columns.
      All columns are stored as VARCHAR.
    columns:
      recipient_id: "USASpending recipient hash + level suffix (e.g. `7fe0d08f-...-R`). Primary key / dedup key — unique per recipient_level."
      uei: "Unique Entity Identifier (SAM.gov UEI, e.g. `JE73CDQUAPA7`). The org-resolution join key to SAM and other UEI-keyed sources. May be null for older records."
      duns: "Legacy DUNS number, when present. Superseded by UEI; often null for newer records."
      name: "Recipient name as recorded by USASpending (e.g. `LOCKHEED MARTIN CORP`). The name-resolution key."
      recipient_level: "Recipient rollup level: `P` (parent), `C` (child), or `R` (standalone recipient with no parent). The same UEI can appear at multiple levels."
      total_award_amount: "Trailing-12-month federal award dollars reported by the recipient list endpoint at the recipient's last read, as a numeric string (e.g. `63465270734.15`). The top-N sort key. Retained rows outside the latest selection can carry older amounts; `observed_at` says when this amount was read."
      observed_at: "When the ranking response page this row was read from was captured (UTC, ISO 8601). NULL on a row carried from before per-row capture evidence, whose read time was not retained; a carried row never takes a later run's time."
      source_capture_sha256: "SHA-256 of the retained ranking response page this row was read from, so its values trace to one captured response. NULL exactly when `observed_at` is NULL."
  fcc_proceedings:
    identity_columns: [name]
    label: "FCC proceedings"
    coverage: >-
      True range: every proceeding ECFS dates, created from 1991 on, re-read
      whole each run so later closings and status changes are current. A
      proceeding with no created date is left out, because the API's date-range
      queries cannot reach it.
    measured_on: "2026-09-28"
    summary: >-
      One row per FCC proceeding (the FCC's docket equivalent, e.g. `17-108`),
      ingested from the FCC ECFS public API (`/proceedings`) by
      `build_fcc_proceedings`. The FCC does not participate in regulations.gov —
      its rulemaking dockets and public comments live in ECFS — so this table
      extends the dataset's docket universe to the FCC. Requires an api.data.gov
      key (`DATA_GOV_API_KEY`). Walked whole every run, so later closings and
      status changes are current. Each creation-date window is pooled over
      whole walks by document, less its filing-activity counters, until one
      walk is clean or the pool holds exactly the count ECFS aggregates for
      it. One row per docket `name`: ECFS holds more
      than one document for a few dockets (seven on 2026-09-23, three of them
      re-created 2026-09-21), and the row is the original docket, then the one
      ECFS edited last. A document with no docket name is left out (one, a
      2017 stub). Proceedings with no created date are unreachable through the
      API's date-range queries and are not included (legacy shells with no
      filing activity). There is no program or topic field, so a title search
      misses proceedings (see `description`), and open proceedings carry
      placeholder close dates (see `date_closed`). All columns are stored as
      VARCHAR.
    columns:
      name: "Proceeding (docket) number, e.g. `17-108` or `23-320`. Primary key / dedup key, and the join key to `fcc_filings.proceeding_names_json`."
      id_proceeding: "ECFS internal numeric id for the proceeding."
      description: "Proceeding title/subject (ECFS `description_display`, falling back to `description`), e.g. `Restoring Internet Freedom`. There is no program or topic field, and titles often leave the program out: Universal Service dockets include 13-184 (`Modernizing the E-rate Program for Schools and Libraries.`) and 02-60 (`In the Matter of Rural Health Care Support Mechanism`), neither of which says universal service. Search titles together with bureau_code (WC, or CC for older dockets) and known docket numbers."
      bureau_code: "Code of the FCC bureau that owns the proceeding (e.g. `WC`)."
      bureau_name: "Name of the FCC bureau that owns the proceeding (e.g. `Wireline Competition Bureau`)."
      rulemaking_or_docket: "ECFS `flag_rulemaking_or_docket`: `R` for rulemakings (RM- numbers), `D` for dockets."
      filing_status: "ECFS filing-window status for the proceeding (e.g. `OPENALL`): how filings are accepted, not whether the proceeding is open. Many closed proceedings still read `OPENALL`; use date_closed for open or closed."
      date_created: "Timestamp the proceeding was created in ECFS (ISO 8601 string). Sort key."
      date_closed: "When ECFS closed the proceeding. An open proceeding has no real close date: ECFS leaves it null or puts a placeholder far in the future, and both `2099-12-31T23:59:59.999Z` and `2100-01-31T05:00:00.000Z` occur. Treat a proceeding as open when date_closed is null or later than today."
      comment_start_date: "Start of the initial comment window, when ECFS records one. Often null."
      comment_end_date: "End of the initial comment window, when ECFS records one. Often null."
      reply_comment_start_date: "Start of the reply-comment window, when ECFS records one. Often null."
      reply_comment_end_date: "End of the reply-comment window, when ECFS records one. Often null."
      filed_by: "ECFS account that created the proceeding. An internal FCC username; occasionally useful for spotting bureau conventions."
  fcc_filings:
    identity_columns: [id_submission]
    label: "FCC filings"
    coverage: >-
      Window, not the ECFS archive: filings ECFS received on or after
      2026-08-24, when this table started, extended by a daily run. Earlier
      filings are held only for proceedings backfilled on purpose, so a
      proceeding's count here is not its ECFS total. Attachment text is
      extracted for a few selected PDFs only.
    measured_on: "2026-09-28"
    summary: >-
      One row per FCC ECFS filing — the FCC's comment equivalent: comments,
      reply comments, ex-parte notices, letters, and other submissions —
      ingested from the FCC ECFS public API (`/filings`) by `build_fcc_filings`.
      Requires an api.data.gov key (`DATA_GOV_API_KEY`). Incremental by
      `date_received`, deduped on `id_submission`; each window is pooled over
      whole walks until one is clean or the pool holds exactly the count ECFS
      aggregates for it. Because ECFS holds tens of
      millions of filings, a first run with no prior table is bounded to the
      trailing 30 days; deeper history is backfilled in slices via `FCC_SINCE`
      and/or scoped to specific proceedings via `FCC_PROCEEDINGS`. All columns
      are stored as VARCHAR, array fields serialized as JSON strings.
    columns:
      id_submission: "ECFS submission id (e.g. `26109947027`). Primary key / dedup key."
      proceeding_names_json: "JSON array of proceeding (docket) numbers the filing was submitted to (e.g. `[\"17-108\"]`). Join key to `fcc_proceedings.name`."
      submission_type: "ECFS submission type description, e.g. `COMMENT`, `REPLY TO COMMENTS`, `NOTICE OF EXPARTE`."
      express_comment: "`1` if the filing is an express comment (text-only, entered in the web form), `0` for standard filings with uploaded documents."
      date_received: "Timestamp ECFS records the filing as received (ISO 8601 string). Incremental cursor and sort key."
      date_submission: "Timestamp the filer submitted the filing (ISO 8601 string)."
      date_disseminated: "Timestamp the filing was disseminated (made public) by ECFS (ISO 8601 string)."
      filing_status: "ECFS workflow status description (e.g. `DISSEMINATED`)."
      viewing_status: "ECFS viewing status description (e.g. `Unrestricted`, `Confidential`)."
      exparte_or_late_filed: "`Y` if the filing is ex-parte or late-filed, else `N`."
      filers_json: "JSON array of filer names (individuals or organizations) on the filing."
      authors_json: "JSON array of author names on the filing, when distinct from the filers. Often empty."
      lawfirms_json: "JSON array of law-firm names on the filing. Often empty."
      bureaus_json: "JSON array of FCC bureau names the filing was routed to. Often empty."
      text_data: "The filing's inline text — for express comments this is the full comment text. Null for document-only filings."
      total_page_count: "Total page count across the filing's attached documents, as a numeric string."
      documents_json: "JSON array of attached documents as `{filename, src}` objects, where `src` is the fcc.gov download URL."
      filing_url: "Canonical fcc.gov URL for the filing (`https://www.fcc.gov/ecfs/filing/<id_submission>`)."
      native_fields_json: "Selected named native ECFS fields retained as JSON, preserving absent keys, nulls, empty arrays, objects and roles. SQL null in older output means unread legacy data; rebuilding is required. Not the complete API response."
      native_fields_sha256: "SHA-256 of the exact native_fields_json string; identifies retained field bytes, not the complete API response."
      pdf_extraction_results_json: "Outcomes for selected offered attachment URLs, retaining source SHA-256, page count and extraction status. Null when no attempt is retained. These selected attempts do not establish complete filing text coverage."

  # ---------------------------------------------------------------------------
  # Tables hosted from spicy-docs' table contracts.
  #
  # `columns_from: spicy_docs` means the per-column prose is the contract's own
  # (spicy_docs.schemas.TABLE_CONTRACTS[<table>].descriptions), read at load
  # time by src/spicy_regs/data_dictionary.py. Four hundred and seven column
  # sentences live beside the code that fills each column; copying them here
  # would create a second copy with nothing keeping it in step. The label, the
  # coverage statement, measured_on and the summary stay hand-written, because
  # what this repository publishes and when it last measured it are its facts,
  # not the wheel's.
  #
  # Listing `columns:` inline on one of these entries is refused at load, so
  # the two sources cannot silently disagree.
  # ---------------------------------------------------------------------------

  fec_committee_history:
    label: "FEC committees by cycle"
    coverage: >-
      True range. Every cycle from 1980 through the current one: each run reads
      every cycle's bulk committee master whole and publishes every row. The
      current cycle's file is republished daily, so its rows change.
    measured_on: "2026-09-27"
    summary: >-
      One row per FEC committee per two-year cycle, as that cycle's bulk
      committee master states it: name, treasurer, address, designation, type,
      party, filing frequency, interest-group category, connected organization
      and linked candidate. Read by the `fec-committee-history` rollup through
      SpicyDocs' committee-master reader, which verifies each file by digest
      and checks the publisher's header. Codes stay literal. `fec_committees`
      is the current registry from the API; this is the history, keyed on
      (`committee_id`, `cycle`). All columns are stored as VARCHAR.
    columns_from: spicy_docs

  document_attributes:
    label: "Regulations.gov document attributes"
    coverage: >-
      True range. Every document record in the Mirrulations mirror, read whole
      by `run-attributes-sweep` and kept current by the daily regulations ETL.
      DocSpec's API capture of 2026-09-02 held 1,943,106 of them (receipt
      `regulations-attributes-20260926/`); the published count is measured at
      the first sweep.
    measured_on: "2026-09-27"
    summary: >-
      One row per Regulations.gov document, keyed by `document_id`, with the
      attributes the thin `documents` table does not carry: abstract, authors,
      topics, dates, page count, comment-window flags, the submitter's stated
      contact details (decision 66) and the agency's display properties. Typed
      where the value is (decision 67): flags BOOLEAN, `page_count` INTEGER,
      dates TIMESTAMPTZ, authors and topics string lists. Projected from each
      record's API attributes by SpicyDocs' contract.
    columns_from: spicy_docs

  docket_attributes:
    label: "Regulations.gov docket attributes"
    coverage: >-
      True range. Every docket record in the Mirrulations mirror, read whole by
      `run-attributes-sweep` and kept current by the daily regulations ETL.
      DocSpec's API capture of 2026-09-02 held 278,607 of them (receipt
      `regulations-attributes-20260926/`); the published count is measured at
      the first sweep.
    measured_on: "2026-09-27"
    summary: >-
      One row per Regulations.gov docket, keyed by `docket_id`, with the
      attributes the thin `dockets` table does not carry: keywords, short
      title, program, organization, subtypes, status, effective date and the
      agency's display properties. `effective_date` is TIMESTAMPTZ and
      `keywords` a string list (decision 67). Projected from each record's API
      attributes by SpicyDocs' contract.
    columns_from: spicy_docs

  bill_actions:
    label: "Bill actions"
    coverage: >-
      Sampled: bills the bill family has read from GovInfo BILLSTATUS, Congress
      by Congress from the 108th on; group by the Congress in bill_id to see
      which Congresses are filled.
    measured_on: "2026-09-28"
    summary: >-
      One row per action entry in a bill's BILLSTATUS document, in publisher order.
      Each row also carries the stage the action text implies, with the rule and
      matcher that fired, which makes `congress_bills.stage` auditable action by
      action. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_committees:
    label: "Bill committee referrals"
    coverage: >-
      Sampled: bills the bill family has read from GovInfo BILLSTATUS, Congress
      by Congress from the 108th on; group by the Congress in bill_id to see
      which Congresses are filled.
    measured_on: "2026-09-28"
    summary: >-
      One row per committee or subcommittee a bill reached, as its BILLSTATUS
      document names it. `referral_signal` is set only for the six appropriations
      committees the money-bill classifier keys on; it is NULL elsewhere rather than
      absent. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_publisher_summaries:
    label: "CRS bill summaries (publisher)"
    coverage: >-
      Sampled: bills the bill family has read from GovInfo BILLSTATUS, Congress
      by Congress from the 108th on; group by the Congress in bill_id to see
      which Congresses are filled. A bill has rows only for the summaries the
      publisher has written.
    measured_on: "2026-09-28"
    summary: >-
      One row per CRS summary the publisher states on a bill, at the version and
      action it describes. `summary_html` is kept exactly as the publisher escaped
      it. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_versions:
    label: "Bill printings"
    coverage: >-
      Sampled: bills the bill family has read from GovInfo BILLSTATUS, Congress
      by Congress from the 108th on; group by the Congress in bill_id to see
      which Congresses are filled. source is govinfo for a printing whose body
      was acquired; other rows are printings the publisher lists without an
      acquired body.
    measured_on: "2026-09-28"
    summary: >-
      One row per printing of a bill, per source that supplied it. The full text is
      deliberately not a column here: `bill_sections.body` carries it at the grain
      people query, and the body is re-fetchable by package id and digest. All
      columns are stored as VARCHAR.
    data_quality: >-
      A numbered reprint is its own printing since spicy-docs 0.37.0: the
      publisher types it exactly like the printing it follows, so its
      `version_code` is its own package suffix (`eas2`, `rfs2`) rather than the
      stage's slug. Generation `d380cdc0…` still keys two such printings under
      the stage's slug: 119-hr-6644's second Senate engrossed amendment (a
      congress row with `BILLS-119hr6644eas2`, beside a printing whose sections
      mix both documents) and 118-hr-7643's second House report. A rebuild of
      the bill retires the row and publishes each printing under its own code
      (receipt `repeated-printings-2026-09-26/`).
    columns_from: spicy_docs

  bill_sections:
    label: "Bill sections"
    data_quality: >-
      A printing with no parsed section tree is a counted refusal, never a row
      with invented values. On the measured cold-start run of the 119th
      (receipt `d1-measured-run-2026-09-19/`) the family reported **21,466**
      such refusals against 6,301 published rows — one per printing whose body
      the 600-per-run fetch cap did not reach, plus those offered only as PDF.
      The refusal count is therefore a measure of how far the cap is from the
      corpus, not of anything wrong with the printings; it falls as successive
      runs spend the cap on ground earlier ones did not reach. A section is
      keyed on its `seq` within the printing since spicy-docs 0.35.0: the old
      key (`match_path`, `body_index`) repeats inside a printing, and the merge
      had kept one row per repeat, so generation `55671b43…` holds 83 of
      119-hr-5334 enrolled's 84 sections, 150 of 119-hr-9022 reported's 151 and
      4 of 119-hr-4060 introduced's 5. Each such printing's `section_count`
      exceeds its rows, so the next run re-reads it and republishes it whole
      (receipt `bill-family-repair-scope-2026-09-26/`). All columns are stored
      as VARCHAR.
    coverage: >-
      Sampled: the sections parsed from printings whose bodies the bill family
      acquired (source govinfo in bill_versions).
    measured_on: "2026-09-28"
    summary: >-
      One row per content-bearing node of one bill version, in document order. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  section_diffs:
    label: "Bill version comparisons"
    data_quality: >-
      A consecutive pair that cannot be diffed — because one or both sides has
      no parsed tree — is a counted refusal named by table, never a row.
      Measured on the cold-start run of the 119th (receipt
      `d1-measured-run-2026-09-19/`): **3,185** refusals against 128 published
      comparisons, which is what a 600-printing cap over 22,064 printings
      implies, since a pair needs both of its sides fetched in the same run.
      A pair runs from a printing to its neighbour in spicy-docs'
      `printing_order`: publisher date, then a dateless enrolled printing by its
      stage (`pair_rule` `consecutive_by_date_then_stage`). Before spicy-docs
      0.35.0 the empty enrolled date sorted first, and generation `55671b43…`
      holds 18 enrolled-to-introduced comparisons and 14 that skip the enrolled
      printing to reach the law. The next run over each such bill retires them
      with their items and makes the neighbour pairs (receipt
      `bill-family-repair-scope-2026-09-26/`). All columns are stored as
      VARCHAR.
    coverage: >-
      Sampled: consecutive printings of a bill are compared only when both
      bodies were acquired and parsed, from the Congresses the bill family has
      read.
    measured_on: "2026-09-28"
    summary: >-
      One row per compared pair of consecutive printings of one bill. `engine_name`,
      `engine_version` and `engine_revision` record which diff engine produced the
      row. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  section_diff_items:
    label: "Bill comparison items"
    coverage: >-
      Sampled: the settled correspondences within each comparison in
      section_diffs, so it covers exactly what that table covers.
    measured_on: "2026-09-28"
    summary: >-
      One row per settled correspondence in one version-pair comparison.
      `text_diff_json` is byte-capped, and `text_diff_truncated` says when the cap
      was reached. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  financial_changes:
    label: "Dollar-figure changes"
    coverage: >-
      Sampled: dollar figures that change between consecutive printings compared
      in section_diffs; a pair is compared only when both bodies were acquired
      and parsed.
    measured_on: "2026-09-28"
    summary: >-
      One row per aligned pair of dollar figures in a section whose amounts changed.
      `pairing_claim` names how the two figures were aligned; it is word alignment,
      not a semantic match. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  section_classifications:
    label: "Section classifications (model)"
    coverage: >-
      Sampled: written by a language model during bill-family runs; a run
      without model calls enabled cannot fill it.
    measured_on: "2026-09-28"
    summary: >-
      One row per label a model assigned to one section of one printing.
      `vocabulary_hash` is a digest over the sealed label list, so a vocabulary
      change is visible in the data rather than silently reinterpreting old rows.
      All columns are stored as VARCHAR.
    columns_from: spicy_docs

  bill_summaries:
    label: "Bill summaries (model)"
    coverage: >-
      Sampled: written by a language model during bill-family runs; a run
      without model calls enabled cannot fill it.
    measured_on: "2026-09-28"
    summary: >-
      One row per plain-language summary of one printing of a bill. `frame` is
      stored because without it the summary is not reproducible from the row. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  diff_summaries:
    label: "Change summaries (model)"
    coverage: >-
      Sampled: written by a language model during bill-family runs; a run
      without model calls enabled cannot fill it.
    measured_on: "2026-09-28"
    summary: >-
      One row per model-written summary of the change between two printings of a
      bill. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  public_activity_events:
    label: "Bill activity events"
    coverage: >-
      Sampled: bills the bill family has read from GovInfo BILLSTATUS, Congress
      by Congress from the 108th on; group by the Congress in bill_id to see
      which Congresses are filled. Each event compares a bill between two runs
      of the bill family, not the historical sequence of its actions.
    measured_on: "2026-09-28"
    summary: >-
      One row per change detected between two runs of the bill family. Two instants
      per row: `occurred_at` is the publisher's, `detected_at` is the run's. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  amendments:
    label: "Amendments"
    data_quality: >-
      The publisher's `updateDate desc` order repeats and skips amendments
      across page boundaries when stamps tie, so one walk can serve the
      declared count while missing some amendments. The builder repeats whole
      walks, alternating order and page size, and settles on the first of two
      things: a clean walk (no amendment repeated, its distinct count the
      declared count), which stands alone, or the walks since the count last
      changed pooled to exactly the declared count. A pool larger than the
      count is never published, but a later clean walk can still settle; a
      query unsettled after its walks refuses the run, as does a record
      without an `updateDate`. Sponsor, chamber, submitted date and the
      amended bill or amendment come from each amendment's detail record; the
      list route carries none of them. 89 House amendments name the Rules
      Committee as sponsor and have no member sponsor to record. All columns
      are stored as VARCHAR.
    coverage: >-
      Window: the 119th Congress, each amendment with its detail record. On
      2026-09-23 the table held every amendment the publisher declared, and
      every cell matched the retained list and detail responses (receipt
      `amendment-details-2026-09-23/` in the fork execution receipts). Scheduled
      runs walk an `updateDate` window from the table's watermark, at most
      ninety days, and fetch detail for each amendment in it.
    measured_on: "2026-09-23"
    summary: >-
      One row per amendment, from the Congress.gov amendment list and detail
      routes. Keyed on the amendment's own identity, not the bill it amends,
      because an amendment can amend another amendment; `amended_bill_id` and
      `amended_amendment_id` are foreign keys. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  press_releases:
    label: "Appropriations press releases"
    coverage: >-
      Window. Releases from the House and Senate Appropriations committees'
      feeds as captured since September 19, 2026, including items that later
      rotated out of a feed; bill links are inferred from release text. Not all
      committees, earlier history or release-page bodies. See
      `press-release-qualification/` and `press-link-repair/` in the fork
      execution receipts.
    measured_on: "2026-09-28"
    summary: >-
      One row per item in one appropriations committee press-release feed capture.
      `bill_id` is an inferred candidate when a pattern matches a published bill
      identifier in the title or description. All columns are stored as VARCHAR.
    data_quality: >-
      The bill linkage is a pattern match over the release's own words, not a
      publisher statement. An earlier local run falsely matched `s 2027` inside
      a reference to the President's 2027 budget to Senate bill 2027. The
      corrected matcher rejects possessive suffixes while preserving quoted
      bill citations; wider matching quality remains unmeasured.
      `matched_field` and `matched_text`
      carry what was matched and where: a false positive is readable from the row rather than only
      by re-running the matcher. One pattern is compiled per published bill in the
      Congresses in scope, bounded on both sides and built from the bill's own type,
      so a bare number matches nothing. Three states are distinct and must not be
      read as one: a `bill_id` with `match_rule = bill_number_in_title` or
      `bill_number_in_excerpt` is a match; `match_rule = unmatched` with a NULL
      `bill_id` means the matcher ran and found no pattern match; an all-NULL
      `match_rule` means no matching pass ran at all, because no `congress_bills`
      table was published when the rollup ran, or none was published for that
      release's Congress, or the release states no readable `pub_date` to scope by.
      The Senate feed carries no item description, so a Senate release can only ever
      match on its title.
      One consequence worth knowing before relying on these four columns: a run that
      cannot read `congress_bills` republishes the whole live window with NULL match
      columns, because this table merges row-wise and a fresh row wins whole. The
      next run that can read it re-derives them for every release still in the feed,
      so the gap normally lasts one cycle — but a release that rotates off the feed
      during that cycle keeps the NULL permanently. The other publisher columns are
      unaffected; only these four degrade.
    columns_from: spicy_docs

  roll_call_votes:
    label: "House and Senate roll-call votes"
    coverage: >-
      Sampled, and accumulating: both chambers' roll calls from each chamber's
      own session index (the Senate LIS menu and the House Clerk's EVS index
      pages, both keyless), newest first under a per-run cap. The scheduled
      scope is the sitting Congress; an earlier Congress is backfilled by
      dispatching its number under the same cap and, once held, is never
      re-read. A roll call already published with a tally is not fetched again,
      except the newest few of a sitting Congress, re-read in case the publisher
      corrected them. The Clerk and LIS files reach the 101st Congress; the bill
      family's references reach the 108th. A set of roll calls reached from
      bills alone is not an index of a session's roll calls. A House roll call
      that a bill's own action names can be published a cron before the Clerk's
      index lists it, with the same tally and member positions. `vote_date`
      keeps the Clerk's own spelling (`9-Sep-2025`), which does not sort as a
      date, so no range over it is quoted here.
    measured_on: "2026-09-28"
    summary: >-
      One row per roll call: the publisher's own tally, and the bill it refers to.
      The four tally columns are the publisher's own counts or they are NULL; they
      are never zero-filled. All columns are stored as VARCHAR.
    data_quality: >-
      Two statements link a roll call to a bill, and `match_rule` names the one
      that did. `bill_action_recorded_vote`: a `recordedVotes` entry on the
      bill's own action, read from `bill_vote_references`. `vote_file_legislation`:
      the vote file's own statement of its measure, the Clerk's `legis_num` or the
      Senate's document (or, on an amendment vote, the document it amends), with
      the file's own URL as `match_url`. The bill's action wins; where two bills'
      actions record one roll call, the one the file names wins (the Senate
      passing a House bill after its Senate twin); with no recorded reference the
      file links alone. A procedural question, a nomination, a treaty or two
      different bills link nothing. Measured on the 108th and 119th (receipt
      `votes-backfill-2026-09-26/file-links/`), the files add 881 links and agree
      with the recorded reference on 1,803 of the 1,809 roll calls both link; the
      six others are those Senate passages. `conflict_count` is per roll call,
      not per run: it counts the later references, the file's included, that
      named a different bill for *this* roll call, and they are kept rather than
      dropped. A held row is relinked from its own columns without a fetch; a
      House row published before `legis_num` existed is read again once to gain
      it. The contract's `house_vote_legislation` rule (Congress.gov's
      `house-vote` listing) is no longer produced and no published row carries
      it: it was retired with the api.data.gov key it needed (2026-09-26). Each run fills a NULL `vote_day` on
      every held (completely captured) roll call from its own `vote_date` before
      merging, so a row published before the column existed gains it without a
      re-fetch. An incomplete capture is not held: it is re-fetched first each run
      and takes its day from the file. A linkage-only row keeps NULL.
    columns_from: spicy_docs

  member_votes:
    label: "Member vote positions"
    coverage: >-
      Sampled, and accumulating. One row per member per roll call in
      `roll_call_votes`, so it inherits that table's both-chambers scope,
      per-run cap and skip-what-is-already-held behavior exactly.
    measured_on: "2026-09-28"
    summary: >-
      One row per member's position on one roll call. `position` keeps the
      publisher's own word (the Clerk spells both Aye/No and Yea/Nay) and
      `position_normalized` carries the fold, so a count and a quotation are both
      answerable. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  members:
    label: "Legislators"
    coverage: >-
      Sampled. The fork selection covers both complete community crosswalk files
      captured September 22, 2026 UTC: current and historical legislators. Every
      declared field was checked against the retained originals, and all earlier
      retained identities and native values survive. The source supplies 1,738
      distinct FEC candidate IDs and 328 LIS IDs across both files; absent IDs
      remain absent. This qualifies the captured community files, not an
      independently complete official roster. Receipts:
      fork-execution-2026-09-21/members-qualification/.
    measured_on: "2026-09-22"
    summary: >-
      One row per legislator in one capture of the community crosswalk. Split from
      `member_terms` because one row cannot hold a chamber switch. All columns are
      stored as VARCHAR.
    columns_from: spicy_docs

  member_terms:
    label: "Legislator terms"
    coverage: >-
      Sampled. The fork selection retains every term from the same complete
      September 22, 2026 UTC captures as `members`. All mapped values, parent
      joins and per-member term counts agree with the originals; earlier
      retained term identities survive. Source order defines term_index. The
      single party value per term does not reproduce the finer
      party_affiliations histories present in 29 native terms. Receipts:
      fork-execution-2026-09-21/members-qualification/.
    measured_on: "2026-09-22"
    summary: >-
      One row per term a legislator served, in the crosswalk's own order. All
      columns are stored as VARCHAR.
    columns_from: spicy_docs

  member_vote_terms:
    identity_columns: [vote_id, member_key]
    label: "Member vote terms"
    coverage: >-
      Derived, and bounded by its inputs: one row for every `member_votes` row,
      matched to the member's term on the vote date. On 2026-09-23 all but 18
      votes matched a half-open term: 15 matched only an inclusive end date and
      3 matched no term, exactly as an independent replay found
      (fork-execution-2026-09-21/votes-qualification/complete-member-join-replay.json).
    measured_on: "2026-09-23"
    summary: >-
      The term each member vote counts toward (delivery decision 2). A vote on
      `vote_day` counts toward the term with `term_start <= vote_day <
      term_end`, so the day one Congress ends and the next begins belongs to
      the new term. Only where that finds none is an inclusive end accepted,
      and only if exactly one term qualifies. The term type follows the
      chamber (`rep`, `sen`); a term with no end date never matches. Built by
      `build_member_vote_terms` from `member_votes`, `members` (a Senate row's
      LIS id resolves to its Bioguide id there) and `member_terms`. Join to
      `member_votes` on (`vote_id`, `member_key`) and to `member_terms` on
      (`bioguide_id`, `term_index`). All columns are stored as VARCHAR.
    columns:
      vote_id: "The roll call, as in `member_votes`."
      member_key: "The member's key within the roll call, as in `member_votes`."
      chamber: "`house` or `senate`."
      bioguide_id: "The member's Bioguide id: native for the House, resolved from the LIS id through `members` for the Senate. NULL when the LIS id resolves to no member."
      vote_day: "The vote's day (YYYY-MM-DD) as the chamber printed it in Eastern time, read from `member_votes.vote_date` by the same rule as `roll_call_votes.vote_day`; NULL when the file prints no date."
      term_match: "`half_open` (one term with start <= day < end), `inclusive_end` (none half-open, exactly one with the end day included), `ambiguous` (more than one term either way), `unmatched` (none), `unresolved_member`, or `undated` (the file prints no date, so no term is chosen). `undated` wins over `unresolved_member`; such a row still carries `bioguide_id` wherever the member resolves."
      term_index: "The matched term's `term_index` in `member_terms`; NULL unless matched."
      term_start: "The matched term's start date; NULL unless matched."
      term_end: "The matched term's end date; NULL unless matched."

  committee_reports:
    label: "Committee reports"
    coverage: >-
      Sampled. Selected committee report packages from GovInfo, a mixed-Congress
      selection that grows as packages are added; not complete historical or
      constituent-granule coverage. committee_report_reads records each package
      read and its outcome.
    measured_on: "2026-09-28"
    summary: >-
      One row per published part of a captured GovInfo committee report package,
      keyed `(package_id, part_id)`. `bill_id` is the measure the report accompanies,
      read from the package's own MODS metadata. All columns are stored as VARCHAR.
    data_quality: >-
      Only the MODS PRIMARY bill fills bill_id. The thirteen CBO columns come from spicy-docs
      read_cbo_estimate on the same body already acquired. The cover recital gates publication
      of a letter: a CBO heading alone is not an estimate. report_states_estimate=false records
      an absent recital; NULL means the rule has not run. A positive recital with no resolved
      letter span remains distinct from an extracted letter. recital_bill_id comes from the
      printed recital and is retained beside the MODS bill_id. bill_id is the part's own PRIMARY
      bill: a multi-part package's root states none, so each part of CRPT-119hrpt494 carries the
      H.R. 3495 its constituent record names, where its row read before parts were keyed has
      NULL; its separate recital_bill_id is a text interpretation. Every part a record states is
      read, all or none: a package whose parts cannot all be read is refused in
      committee_report_reads and keeps its prior rows. Parts, by decision 29
      (`docs/research/fork-delivery-decisions-2026-09-22.md`): a report published in one part is
      one row whose part_id is its package id and whose part_number is NULL; a report published
      as parts is one row per part, part_id the part's granule id (CRPT-119hrpt455-pt2) and
      part_number 1 to N, except that a Part 1 the publisher left unsuffixed (CRPT-119hrpt494)
      has part_id equal to the package id and part_number 1. A package whose one part is spelled
      -pt1 (CRPT-119hrpt811; spicy-docs `docs/tables.md` names the others it measured) is
      (package-pt1, 1), the same shape as Part 1 of two, so a reader counts a package's rows to
      tell a lone part from Part 1 of several. title, date_issued and last_modified are the
      package's and repeat on every part row. A row published before part_id existed is kept as
      its package's one part (part_id the package id, part_number NULL) until the package is
      read again, which replaces its rows as a set; the committee_report_reads rule version
      re-reads every report once for this, which is what re-keys the CRPT-119hrpt811 row
      published 2026-09-24 as (CRPT-119hrpt811-pt1, 1).
    columns_from: spicy_docs

  report_sections:
    label: "Committee report heading and text blocks"
    coverage: >-
      Sampled. Heading/text blocks of the reports in committee_reports. heading
      retains the source title while agency_label and agency_key remain
      unresolved NULLs. HTML bodies carry no page boundaries, so none are
      inferred.
    measured_on: "2026-09-28"
    summary: >-
      One row per heading or unheaded text block in one part of a committee report,
      keyed `(package_id, part_id, seq)`. `heading` preserves the source title; agency
      identity fields remain unresolved. `pattern` records which header pattern fired,
      which is this table's provenance column. All columns are stored as VARCHAR.
    data_quality: >-
      part_id names the committee_reports row a block was parsed from, so (package_id, part_id)
      is its parent, and seq counts from zero within that part. By decision 29
      (`docs/research/fork-delivery-decisions-2026-09-22.md`) part_id is the package id for a
      report published in one part and the part's granule id for a report published as parts,
      CRPT-119hrpt494's unsuffixed Part 1 aside; a package whose one part is spelled -pt1
      (CRPT-119hrpt811; spicy-docs `docs/tables.md` names the others it measured) carries that
      spelling, so the parent's row count tells a lone part from Part 1 of several. A block
      published before part_id existed carries its package id there until its report is read
      again, which replaces every block of the package.
    columns_from: spicy_docs

  hearing_transcripts:
    label: "Hearing transcripts"
    coverage: >-
      Sampled. Selected hearing packages from GovInfo, each with its native
      event identifiers checked: package and body metadata, not speaker turns or
      complete hearing history.
    measured_on: "2026-09-28"
    summary: >-
      One row per captured GovInfo hearing transcript. bill_id is always NULL:
      a hearing can concern several bills, represented in hearing_bill_links.
      All columns are stored as VARCHAR.
    data_quality: >-
      Cover bills come from the package's MODS and cost no extra requests.
      BODY mentions do not become hearing links. event_id comes from a verified
      Congress.gov hearing detail; NULL can mean no meeting or a refused detail.
      committee_report_reads distinguishes a completed read from a refused one.
      body_completeness says what the read text states about itself: a
      publisher_placeholder body is the publisher's notice that the document is
      only in the PDF. When the package offers that PDF it is read instead
      (pdf_extracted, with text_derivation naming the extraction); when it
      offers none, the notice is published as it stands. NULL on rows not
      re-read since the column was added.
    columns_from: spicy_docs

  bill_family_archives:
    identity_columns: [congress, bill_type]
    label: "Bill-family archive listings"
    coverage: >-
      Not a range. The bill family's processing state: one row per GovInfo
      BILLSTATUS folder (Congress and bill type) it has listed, which the next
      run compares with the live listing to decide whether a zip needs
      downloading.
    measured_on: "2026-09-28"
    data_quality: >-
      Only the four fields the skip compares are retained — `name` and `link`,
      which must name the folder's own zip or the comparison is refused outright,
      and `modified_at` and `size`, which must match for the zip to be skipped.
      The other six the publisher's listing states are deliberately absent rather
      than filled with guesses. All columns are stored as VARCHAR.
    summary: >-
      One row per BILLSTATUS bulk folder a `bill-family` run read, holding the
      listing entry it read; the next run compares against it before downloading
      that folder's zip only when the generation's metadata lists the folder as
      complete (every member parsed and every rebuilt bill shaped), so a row
      records what was read, never that the folder may be skipped. Printing
      bodies are read apart from status, by each printing's own state; the same
      metadata names the BILLS bulk printings a zip refused, with the zip entry
      they were read at, so an unchanged zip is not read again for them. It
      also records, per bill, the reader that last read its status (this
      rollup's status rule and the SpicyDocs code): an unchanged bill is
      skipped only while that reader is the running one. All
      columns are stored as VARCHAR.
    columns:
      name: "The zip's own file name in the folder listing, as the publisher spells it."
      link: "The publisher's path to that zip; it must rebuild this folder's own locator or the skip is refused."
      formatted_last_modified_time: "The publisher's own DD-Mon-YYYY HH:MM stamp string, kept as the evidence `modified_at` was read from."
      modified_at: "That stamp as a UTC instant, which is one of the two values the unchanged comparison tests."
      size: "The zip's byte size as the listing states it; the other value the comparison tests."
      congress: "The numbered Congress whose folder this entry describes."
      bill_type: "The publisher's lowercase bill-type folder name (hr, s, hjres, sjres, hconres, sconres, hres, sres)."
      observed_at: "When this run captured the listing the entry was read from."

  bill_vote_references:
    identity_columns: [bill_id, chamber, congress, session, roll_number, action_index]
    label: "Bill vote references"
    coverage: >-
      Sampled: the roll calls named in the actions of the bills the bill family
      has read, from the 108th Congress on.
    measured_on: "2026-09-28"
    data_quality: >-
      Every row is a publisher statement copied without interpretation: the six
      fields a `recordedVotes` entry carries, plus the position of the action it sat
      on. An entry missing any of the six is refused and counted in the run log
      rather than published with a hole in it. `full_action_name` is a seventh field
      the BILLSTATUS user guide documents that the publisher was not sending on any
      of the 58 entries measured; it is carried because the publisher may resume
      sending it. Both chambers appear here — 6 of the 34 measured roll calls were
      Senate. `roll_call_votes` acquired House rows only when this was
      measured; it hosts Senate roll calls too since the LIS menu route
      landed (2026-09-21), so a Senate row here links a vote this pipeline
      hosts. All columns are stored as VARCHAR.
    summary: >-
      One row per recorded vote on one bill action: which roll call the bill's own
      actions say settled it. Read by the `roll-call-votes` rollup to fill
      `roll_call_votes.bill_id` and its match columns. All columns are stored as
      VARCHAR.
    columns:
      bill_id: "The bill whose action carried this entry, keyed as every bill table keys it."
      chamber: "The chamber that took the roll call, lowercased (house, senate)."
      congress: "The numbered Congress the roll call belongs to."
      session: "The session number within that Congress, from the entry's sessionNumber."
      roll_number: "The roll-call number within that session, from the entry's rollNumber."
      action_index: "Position of the action this entry sat on, in the publisher's own action order."
      url: "The publisher's URL for the roll call: a House Clerk EVS file or a Senate LIS vote page."
      date: "The instant the entry states for the vote."
      full_action_name: "The guide's seventh field, absent on every entry measured; NULL where the publisher sends none."
      observed_at: "When the bill-family run that read this entry captured the BILLSTATUS document."
  bill_family_backfills:
    identity_columns: [congress, bill_type, number]
    label: "Bill-family backfill state"
    coverage: >-
      Not a range. The bill family's processing state for its pre-108th API
      backfill, one row per attempted bill; rows appear only after a run that
      reaches that backfill.
    measured_on: "2026-09-28"
    data_quality: >-
      A row with `refusal` NULL is a success record — the bill's `congress_bills`
      row is published and the stamp is what the `bill/{congress}/{type}` list
      stated when it was — and a row with `refusal` set is a recorded failure,
      which the next named run retries first, directly and without a list walk,
      one request each; that is the resume rule (the CRS summaries pattern: skip
      only a success, retry every failure). A list record whose stamp differs
      from its success row means the bill moved and is fetched again. The stamp
      is the publisher's own `updateDateIncludingText` exactly as the list stated
      it, compared as a string: an old Congress's list records truncate the
      instant to a date while its detail records do not, so only list-to-list
      comparison is exact. `refusal` is the error's class name only, never its
      message. All columns are stored as VARCHAR.
    summary: >-
      One row per bill the pre-BILLSTATUS backfill has attempted, carrying the
      list stamp it was attempted under and whether it was filled or refused —
      the retained state that lets the next run retry every refusal and skip
      every filled bill for one comparison apiece. All columns are stored as
      VARCHAR.
    columns:
      congress: "The numbered Congress whose backfill walk attempted this bill."
      bill_type: "The publisher's lowercase bill type (hr, s, hjres, sjres, hconres, sconres, hres, sres)."
      number: "The bill's number as the list record states it."
      list_update_date_including_text: "The bill's `updateDateIncludingText` exactly as the list record stated it when this attempt was made; the value the next walk compares against."
      refusal: "NULL when the bill was filled; otherwise the class name of the error that refused the detail attempt (`_RetryableTransportError` after the reader's retries, `PagedJsonSourceError` for a refused response), which marks the row for retry."
      observed_at: "When the detail request that filled the bill was captured, or when the refusal was recorded."

  bill_family_backfill_walks:
    identity_columns: [congress, bill_type]
    label: "Bill-family backfill walks"
    coverage: >-
      Not a range. The bill family's processing state for its pre-108th API
      backfill, one row per Congress and bill type walked, with the route's
      declared total against what was reached; rows appear only after a run that
      reaches that backfill.
    measured_on: "2026-09-28"
    data_quality: >-
      `list_completed` is true only when the walk reached the route's terminal
      page with declared and observed counts agreeing (the reader refuses
      otherwise); a run that hit the per-run cap mid-unit records how far it got
      and `list_completed` false, and the next run walks the unit again, pages
      charged to the cap, because only a walk can reach the records it did not.
      An empty success is not absence: `declared_count` is the route's own
      declared total for that query on that day, recorded beside
      `records_walked` even when the walk stopped early, so a capped walk can
      never read as an empty unit; a declared 0 is the publisher's statement
      that the Congress has no bills of that type. The declared total counts
      list entries, and the route can list one bill twice across a page
      boundary (`repeated_count`); whether that repeat also displaced another
      bill off the walk is not knowable from one walk, and a settled unit is
      not walked again to find out. A settled unit's bills are likewise not
      re-checked for a moved stamp, and since plan A1 retired the archive-wide
      `congress-bills` list writer (decision 31) nothing else refreshes their
      ten-column prefix. All columns are stored as VARCHAR.
    summary: >-
      One row per (Congress, bill type) the pre-BILLSTATUS backfill walked,
      recording the route's declared total against what the walk reached and
      filled. All columns are stored as VARCHAR.
    columns:
      congress: "The numbered Congress this walk record describes."
      bill_type: "The publisher's lowercase bill type the walk was addressed at; with `congress`, the unit's identity."
      declared_count: "The bill total the `bill/{congress}/{type}` route declared for this query, from the walk's first page."
      records_walked: "List records this run actually walked — the whole declared total when the walk completed, fewer when the per-run cap stopped it."
      pages_walked: "List pages fetched this run for this unit."
      list_completed: "Whether the walk reached the route's terminal page this run; false when the cap stopped it early."
      unwalkable_count: "List records that named no bill this walk could address (a type other than the one walked, or a number that is not a positive integer); counted so the unit can settle, since no identity exists to retry."
      repeated_count: "List entries repeating a bill already listed earlier in this walk. The route's `updateDate desc` order repeats a bill across a page boundary when its stamp ties (measured on the 92nd: hr 4634 twice, identical, in a walk whose declared and observed counts agreed at 767), so the declared total counts entries, not bills; a repeat is counted so the unit can settle and is never requested twice."
      backfilled_count: "Bills of this unit filled as of the end of this walk, from the retained state; never re-counted for a bill re-fetched because its stamp moved."
      observed_at: "When this walk's last captured list page was observed."


  # --- A8/A9 (laws and rosters): the laws and committee-rosters rollups ---
  laws:
    label: "Enacted laws"
    coverage: >-
      Sampled. Every law the Congress.gov law route lists for the scoped
      Congresses (the current one by default), walked whole each run; the PLAW
      USLM citation is added per law, newest first, under a per-run cap. A
      steady-state run is meant to ask only about laws whose list row moved or
      whose PLAW the bulk folder had not yet served.
    measured_on: "2026-09-28"
    data_quality: >-
      `statutes_at_large_cite` is set when `uslm_outcome` is `captured`; read
      every NULL through `uslm_outcome` and `uslm_reason`. `unavailable`
      (reason `source_unavailable`) is the publisher's own lag, a `404` from
      the exact PLAW locator: on 2026-09-19 the route listed 108 laws and the
      PLAW bulk folder held 104, the four newest (119-103, 119-104, 119-109,
      119-110) absent; each is retried every run until the folder serves it.

      `captured_partial` is a validated USLM file that states no Statutes at
      Large citation (reason `statutes_citation_not_stated`): the two private
      laws of the 119th (`PLAW-119pvtl1`, `PLAW-119pvtl2`), whose own
      `citableAs` values are kept in `uslm_citable_as_json`. Until reader rule
      `laws-uslm-v2` (2026-09-25) the contract refused those two files and
      their rows said `not_requested`, although both were requested and
      served. `captured_refused` keeps the digest of a `200` body the reader
      refused, either another law's file (`native_identity_refused`) or not
      native USLM at all, such as an HTML page (`native_shape_refused`), and
      none of its unvalidated fields. `request_failed` is an attempted read
      that established nothing, a transport failure included; it is never
      published as `unavailable`. `not_requested` means only that no request
      was made, which the per-run cap decides.

      A validated row (`captured` or `captured_partial`) is not re-read unless
      its list row's `update_date` moves or `uslm_reader_version` changes, and
      a failed later attempt never replaces it. All columns are stored as
      VARCHAR.
    summary: >-
      One row per enacted law the Congress.gov law list route states, with the
      Statutes at Large citation from the law's own PLAW USLM file where
      captured. Keyed on the law's Congress, type and number, not on the bill;
      `bill_id` is the foreign key to `congress_bills`, whose
      `statutes_at_large_cite` the host fills from this table at that table's
      merge. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  law_code_sections:
    label: "Law classifications by Congress"
    coverage: >-
      Sampled. Every row of each public-law-order table the OLRC classification
      index links for a scoped Congress, read whole every run and replacing that
      session's rows. The index links the current Congress's session tables
      only.
    measured_on: "2026-09-19"
    data_quality: >-
      A row is its position on the page (`seq`), because one line can repeat;
      a page read this run replaces every prior row for its Congress and
      session, so a line the publisher removed does not linger under a position
      it no longer holds. Only the public-law order is read: the code-order twin
      holds the same lines under positions that would collide with these. A
      Congress the index does not link — every Congress but the current one —
      gets no rows here; `table3_records` is the historical view. `action` is
      the page's column 3 verbatim, NULL where the page left it blank, which
      its legend reads as amended. `usc_section_key` is `usc_section` folded
      for joins (trimmed, lower-cased, every dash spelling an ASCII hyphen),
      because case carries no identity in the Code and a join on the printed
      letter misses the upper-case spellings (decision 30,
      `docs/research/fork-delivery-decisions-2026-09-22.md`); a session's
      next read replaces its rows, which fills the key for rows published
      before the column existed. All columns are stored as VARCHAR.
    summary: >-
      One row per line of an OLRC per-Congress classification table: a U.S.
      Code place one public law section touched, with the Statutes at Large
      page and the publisher's action word. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  table3_records:
    label: "Table III records"
    coverage: >-
      Window, complete for the Congresses read: every public law Table III holds
      for each Congress the laws table holds, plus the scoped ones, derived from
      OLRC's Table III bulk file on each run, so a Congress keeps its rows
      current after it leaves the laws scope while Table III catches up. The
      file holds the whole table back to 1789; other Congresses, private laws
      and pre-1957 session-law chapters are not derived.
    measured_on: "2026-09-26"
    data_quality: >-
      Table III holds an act only once OLRC has classified it, and lags
      enactment: on 2026-09-26 it was current through 119-73, a law of
      2026-01-23, while the law route reached 119-111. `release_point` says
      how current the file was.

      Since 2026-09-26 the rows come from the bulk file
      (`fulldump@<release point>.xml`) instead of one page per act. The file
      splits an act's records about ten to an `<act>` fragment. An act's rows are
      its fragments' records in the file's order, and `seq` is a record's
      position in its act, as on the page; the file's own `sequence`
      attribute repeats within 70 acts, so it is not used. Each fragment
      states its own Congress, date and Statutes volume, and a record carries
      its fragment's volume where it states a page. Replayed against the
      2,981 rows the pages had published, every row keeps its position, act
      section, Statutes page and volume, Code title and section, status and
      release point. The file also holds 119-30 and 119-53, whose pages the
      page walk never reached. Four act-level columns now carry the file's
      spelling instead of the page's: `stated_key` `119-37` (page `119–37`),
      `congress` `119` (`119th Cong.`), `act_date` `2025-11-12`
      (`Nov. 12, 2025`) and `statutes_at_large_volume` `139` (`139 Stat.`).

      OLRC states no Last-Modified, ETag or Content-Length for the zip, so
      each run fetches it; it was byte-identical on 2026-09-14 and 2026-09-26
      at the same release point. Each Congress keeps a checkpoint in the
      file's metadata: the derivation rule with a digest of SpicyDocs' code
      (not its release string, so a version-only release derives nothing),
      the member's digest and release point, and each act's shaped-row
      digest. While all match, nothing is derived. Otherwise every scoped act
      is derived again, and only an act whose rows changed is published, its
      whole row set replaced.

      Table III only grows: across the eight consecutive releases from
      116-150 (2020-07) to 119-73, archived by the Wayback Machine, no act was
      ever dropped (receipt `table3-bulk-2026-09-26/wayback/`). So a held act
      the file no longer lists loses its rows only when the release point
      advances, at most one act a release, and the removal is journaled as
      `rows-retired` for qualification to reconcile. A file whose release
      point is older than the one published, that drops an act without
      advancing, or that drops more than one is refused, and so is a file the
      reader refuses outright: the member has been renamed twice since 2020.
      A refused read publishes nothing for this table and keeps every
      checkpoint, while `laws` and `law_code_sections` publish as usual. The
      build journals it as `table3-bulk-refused`, and the nightly
      `scripts/check_source_refusals.py` fails while the current laws
      generation holds one, so the table cannot stop updating in silence. A
      transport failure is only retried on the next run.
      `usc_section_key` is `usc_section` folded for joins (trimmed,
      lower-cased, every dash spelling an ASCII hyphen), because case carries
      no identity in the Code and Table III itself prints some sections both
      ways (decision 30, `docs/research/fork-delivery-decisions-2026-09-22.md`).
      All columns are stored as VARCHAR.
    summary: >-
      One row per classification record of one public law in OLRC's Table III:
      which U.S. Code place each section of the law went to, as Table III's
      bulk file states it. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  committees:
    label: "Committees"
    coverage: >-
      Sampled. Since 2026-09-26 the Congress.gov committee route is walked whole
      with no Congress: every committee of every Congress the publisher records,
      because `committee_meetings` keeps the previous Congress and
      `bill_committees` reaches the 108th. The committee detail is folded onto
      each row under a per-run cap, newest `update_date` first; a committee
      whose detail was captured is re-read only when its list row's
      `update_date` moves. Receipt `committee-fixes-2026-09-26/3-rosters-118/`.
    measured_on: "2026-09-26"
    data_quality: >-
      The route over-declares: on 2026-09-19 `committee/119` declared 238 and
      served 236 on its one terminal page with no continuation. The reader's
      terminal-page count refusal is the one refusal this rollup reads past,
      publishing what the publisher served with both numbers in the run log;
      every other walk refusal fails the run. `detail_captured` says whether the
      detail's columns are the publisher's or NULL; where the detail was
      captured, its `subcommittees` are the row's, an empty list included. The
      detail's counts (`bill_count` and the rest) are that day's statement,
      dated by `detail_update_date`. Rows are committees of every Congress:
      filter `is_current` for today's. 95 historical committees are keyed on
      their Library of Congress name-authority id (`n79043125`, the Senate's
      Indian Affairs, 1820-1946), which their history states as
      `locLinkedDataId`; none is current. A code the detail route cannot
      address is a list row with `detail_captured` false.
      All columns are stored as VARCHAR.
    summary: >-
      One row per committee or subcommittee of any Congress the Congress.gov
      committee list route states, keyed on the publisher's `systemCode`, with
      the detail record's history, subcommittees, parent and currency folded on
      where captured. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  committee_assignments:
    label: "Committee assignments"
    coverage: >-
      Sampled. Today's seats: the House Clerk's and the Senate's committee files
      are captured whole each run, for the current Congress only, and each
      capture replaces its chamber's rows for that Congress; an earlier Congress
      keeps its last capture. Vacant and placeholder seats appear as the Clerk's
      file states them.
    measured_on: "2026-09-19"
    data_quality: >-
      A row is a seat the file listed on its `file_date`: a seat the file no
      longer lists is gone on the next capture. The House file states its
      Congress and the reader proves it; the Senate file states none, so its
      rows carry the caller's Congress with `congress_basis` = `caller`. A House
      vacancy has no member and no row, and a seated member whose only
      assignment is the file's `<committee rank=""/>` placeholder has none
      either (nine placeholders on 2026-09-19). Only a file captured this run
      replaces its chamber's rows; a chamber whose file was not established
      keeps its prior rows. House `system_code` derives its prefix from the
      native committee type and parent context; `committee_code` preserves the
      literal source identifier. Join matching `system_code` values to
      `committees` and `bioguide_id` to `members`. Rows whose `system_code`
      matches no committee stay listed and are never matched by name (the
      Joint Economic Committee has three Congress.gov codes). On 2026-09-23
      that is 28 rows: 25 House seats on the Clerk's four joint committees
      (`EC00`, `IT00`, `JL00`, `JP00`, typed `joint` in the Clerk file with no
      Congress.gov code), and three Senate seats on `JSIK00`, the 2024
      inaugural committee, which Congress.gov does not list in any Congress.
      All columns are stored as VARCHAR.
    summary: >-
      One row per member per committee or subcommittee seat a chamber roster
      file lists today, from the House Clerk's MemberData.xml and the Senate's
      cvc_member_data.xml. All columns are stored as VARCHAR.
    columns_from: spicy_docs

  # The Congress.gov index tables (gaps A5, A7, A10), each written by its own
  # rollup in pipelines/rollups/congress_index.py over one walk
  # (transforms/build_congress_index.py).
  house_communications:
    label: "House executive communications"
    coverage: >-
      Sampled. A pinned selection of House communications, republished on
      2026-09-27 with every retained detail read by the shared RIN reader.
      Source qualification is inherited from the earlier generation; no new
      source requests were made. Receipt: spicy-regs-t18-refresh-20260927/.
    measured_on: "2026-09-27"
    summary: >-
      One row per House executive communication, as the Congress.gov
      house-communication list and detail routes state it, keyed on the
      publisher's own address. The regulatory bridge: `is_rulemaking`, the cited
      `legal_authority`, the committee referral, the matching House requirement
      and the RIN read from `report_nature`. Complete Federal Register joins
      unnest `regulation_id_numbers_json` and retain number plus publication
      date; the first-value scalar `federal_register.rin` omits other RINs.
      All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `committees_json` is NULL is list-only: its detail has not been
      read yet (not reached under the cap, or refused), and every detail-only
      column is NULL with it, including the scalar and occurrence RIN columns, because the rule
      was not run. A row whose detail was read states `[]` where the detail lists
      none. The RIN is an interpretation: `rin_rule` names the rule that fired
      (`report_nature_rin_label/2`) or `unmatched`, and `rin_matched_text` is the
      exact text, so a false positive is readable from the row. Every run derives
      the four RIN columns of each read row again from its retained
      `report_nature`, re-read or not, so no row keeps an earlier SpicyDocs'
      scalar or rule name. The rows the `rin_rule` column note says name
      `report_nature_rin_label` last only until this table's first run under
      SpicyDocs 0.50.1: after it, no row names the old rule. The publisher
      repeats a record across a page boundary (15 of 4,975 on the 119th); the
      table holds each identity once. The shared pooled list reader must
      settle each query by distinct identity before any output is replaced.
      Every existing publisher row receives source_route=congress-gov-detail.
      The four Record evidence columns remain NULL until the separate Record
      backfill, about 11,000 GovInfo requests, is acquired in the next rollup.
      In that future reconstruction submitting_official and submitting_agency
      must both remain NULL: held-out precision was 85.3% and 88.4%, below the
      declared 90% gate. The original sentence stays in record_entry_text.
    columns_from: spicy_docs

  committee_meetings:
    label: "Committee meetings"
    coverage: >-
      Sampled, and accumulating. Each run walks the current Congress's whole
      `committee-meeting` list, and the previous Congress's from the day before
      its newest held `updateDate` (or its oldest unread row), and reads the
      detail of every meeting the table does not yet hold, newest `updateDate`
      first, at most 1,000 a run; a meeting whose detail is unread or refused
      has its list fields only. The previous Congress stays in scope because its
      meetings change when GovInfo prints their transcripts: 204 of the 118th's
      3,326 in 2026 to September 26, and all seven hearing transcripts that
      named a meeting the table lacked (receipt `join-gaps-2026-09-26/f/`).
    measured_on: "2026-09-28"
    summary: >-
      One row per scheduled committee meeting, as the Congress.gov
      committee-meeting list and detail routes state it, keyed `(congress,
      chamber, event_id)`. The detail carries the hearing transcript jackets
      (`hearing_transcripts` joins on `event_id`), the related bills, the
      witnesses and every document URL. All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `committees_json` is NULL is list-only: its detail has not
      been read yet, and every detail-only column is NULL with it; a read
      detail states `[]` where it lists none. Event ids are keyed with their
      chamber because their uniqueness across chambers is unmeasured
      (spicy-docs' contract note); the 119th's House ids sit near 119,000 and
      its Senate ids near 338,000.

      The publisher's `NoChamber` value is stored as `nochamber`, matching
      its detail address and preserving the existing row identity. It is
      neither NULL nor an inferred `joint` chamber. The source reader accepts
      that address, so previously list-only rows can fill at an unchanged
      timestamp. Retained meeting `119/nochamber/338692` names the Helsinki
      Commission; the September 24 committee-meetings audit retains its
      list row and served detail.
    columns_from: spicy_docs

  record_issues:
    label: "Daily Congressional Record issues"
    coverage: >-
      Sampled, and accumulating. Each run walks the whole
      `daily-congressional-record/{volume}` list for each session volume of the
      Congresses in scope and reads the detail of every issue the table does not
      yet hold, newest `updateDate` first, up to 1,000 a run, so at the 119th's
      size one run completes it.
    measured_on: "2026-09-19"
    summary: >-
      One row per daily Congressional Record issue, keyed `(volume, issue)`, the
      publisher's own identity. The detail's section names give `chambers`, the
      legislative-day calendar (which chambers sat), and the whole-issue link's
      stem gives the GovInfo CREC `package_id`. The volume is the year minus
      1854 (volume 172 is 2026). All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `sections_json` is NULL is list-only: its detail has not been
      read yet, so `chambers`, `package_id` and every other detail-only column
      are NULL with it. A read detail with no chamber section (a Daily Digest
      only) states an empty `chambers`, distinct from NULL.
    columns_from: spicy_docs

  treaties:
    label: "Treaty documents"
    coverage: >-
      Sampled. The 119th Congress's treaty documents from the retained list and
      their details; on 2026-09-21 the list's stated total agreed with the
      capture. Not treaty bodies, action histories, older Congresses, suffixed
      parts or interpreted legal/in-force effects. Receipts:
      fork-execution-2026-09-21/legislative-publication-summary.json,
      legislative-seeds/sealed-candidates.json and legislative-mcp-audit/.
    measured_on: "2026-09-21"
    summary: >-
      One row per treaty document, as the Congress.gov treaty list and detail
      routes state it, keyed `(congress_received, number, suffix)`. `package_id`
      is the GovInfo CDOC id by the `CDOC-{congress}tdoc{number}` rule on an
      unpartitioned treaty. All columns are stored as VARCHAR.
    data_quality: >-
      A row whose `titles_json` is NULL is list-only. A partitioned treaty (a
      non-empty `suffix`) is always list-only: the publisher's suffixed detail
      address has no route in spicy-docs' `LIST_ROUTES`, so its detail is never
      asked for and its `package_id` is NULL by the contract's own rule.
    columns_from: spicy_docs

  nominations:
    label: "Nominations"
    coverage: >-
      Sampled. Distinct 119th-Congress nomination-list identities from retained
      list pages. The pages repeat some identical records, so a pagination total
      does not prove a stable or complete population. Latest-action fields only:
      not nominee details, action histories, person entities or inferred
      confirmation outcomes. Receipts:
      fork-execution-2026-09-21/legislative-publication-summary.json,
      legislative-seeds/sealed-candidates.json and legislative-mcp-audit/.
    measured_on: "2026-09-21"
    summary: >-
      One row per nomination or part, as the Congress.gov nomination list route
      states it, keyed `(congress, citation)`; the citation carries the part
      number. All columns are stored as VARCHAR.
    data_quality: >-
      The shared Congress index reader pools complete walks with varied
      page sizes, keyed by `(congress, citation)`, keeping each identity's
      newest `updateDate`. A clean walk or a pool matching the declared total
      settles the query. A population change restarts pooling; incomplete
      or inconsistent walks exhaust the source reader's bounded attempts
      and fail before output is replaced. The list carries the latest
      action only, not the action history.
    columns_from: spicy_docs

  house_activity_reports:
    label: "Committee activity reports (House and Senate)"
    coverage: >-
      Sampled. House committee activity reports: CRPT packages from the
      2023-01-01 issue floor whose titles name activity under the shared title
      rule. Not an earlier-archive census.
    measured_on: "2026-09-28"
    summary: >-
      One row per captured end-of-Congress committee activity report package,
      House or Senate (the table's name predates its Senate rows; the package
      id's `hrpt`/`srpt` says which), with what its print adds to its own MODS
      index. Joins
      `document_citations` on `package_id` = `document_key` and
      `text_sha256`. All columns are stored as VARCHAR.
    data_quality: >-
      **The MODS is authoritative for bills, laws and Code sections, and this
      table's own columns say so.** Read at full page depth across the eight
      reports spicy-docs sampled, the print named 0 of 1,406 bills, 0 of 174
      public laws, 0 of 37 U.S. Code sections and 0 of 7 Statutes at Large
      pages that the package MODS does not already state — so
      `distinct_bills_beyond_index`, `distinct_laws_beyond_index` and
      `distinct_usc_sections_beyond_index` are near zero, and a nonzero one is
      worth reading the evidence span for rather than taking as new yield.
      Measured here 2026-09-20 over **41** reports rather than eight, "zero"
      is very nearly right and not exactly right: 7 print-only bills of 7,686
      distinct, 5 print-only laws of 990, and 6 print-only Code sections. The one apparent
      survivor, `188-11`, was the print's own misprint of `118-11`. What the
      print does add is committees beyond the submitting one (27 resolved
      codes), 87 RINs, 38 agency dockets and 5 GAO product ids.
      **Except for the Congress of a Senate report's bills.** A Senate
      committee files its report early in the following Congress, and GovInfo
      stamps the MODS's bills with that filing Congress; printed bills are keyed
      in `covered_congress`, the Congress the report itself states, so on a
      Senate report `bills_congress_mismatch` and `distinct_bills_beyond_index`
      count the MODS's wrong Congress, not new yield (2026-09-26 drift audit:
      the eight Senate reports on the 117th had published 1,915 citations under
      118th-Congress bills before the fix). **And for a House report's bills
      printed under a Congress subheading.** CRPT-117hrpt705 and -118hrpt974
      print a predecessor bill's history under `116th Congress` or `117th
      Congress` inside the current bill's entry, and -118hrpt967 heads each
      Congress of its committee history, 107th to 118th, the same way; since
      spicy-docs `bill_number` 004 those bills are keyed in the subheading's
      Congress until the next entry, while the MODS stamps them with the filing
      one, so `bills_congress_mismatch` and `distinct_bills_beyond_index` count
      them (45 on -117hrpt705, 225 on -118hrpt967; replay receipt
      `print-subheading-2026-09-26/`). Since `bill_number` 005 a bill the
      print sets its own Congress beside (`H.R. 6752, 115th Cong.`, `S. Res.
      116, 112th Congress`) takes that one ahead of any subheading, and those
      count the same way (38 citations over the 40 reports; receipt
      `print-inline-congress-2026-09-26/`). A committee
      name both chambers hold
      (`Committee on the Judiciary`, `on the Budget`, `on Veterans' Affairs`,
      `on Armed Services`, `on Appropriations`) resolves to the chamber of the
      report's own committee, read off the package id; before 2026-09-26 the
      House won every such name, and the Senate reports published 1,746
      House codes for their own committees, 1,718 of them `hsju00`. A chamber
      the print names before a committee (`Senate Committee on Armed
      Services`) selects that chamber's committees instead (76 rows moved,
      24 of them `hshm00` to `ssga00`). **Limit:** 7 bare committee names in
      Senate reports reach a name only the House roster holds and keep the
      House's code, because the print names no chamber: 5 `hshm00` (a wrapped
      `Committee on Homeland Security and Governmental Affairs`, or its
      `Committee on Home-` fragment) and 2 `hsso00` (`Select Committee on
      Ethics`). Read them as ambiguous, not as House committees. Receipt:
      `fix-print-citations-2026-09-26/replay-qualified.json`.
      `committees_unresolved` is **a floor, not a defect count**: the Senate
      `cvc` roster states only the committees its listed senators sit on, so a
      name it does not reach stays unresolved rather than being guessed.
      `stated_page_count` is the publisher's own `pages` field and is never
      re-derived from the bytes; `pages_read` is what the extraction saw, and
      the two are reported separately on purpose (CRPT-118hrpt965 states 282
      and a 60-page read saw 60). `submitted_by_bioguide_id` is NULL where the
      publisher states the member without an id, which CRPT-118hrpt965 does.
    columns_from: spicy_docs

  budget_volumes:
    label: "President's budget volumes"
    coverage: >-
      Sampled. BUDGET packages from the 2023-01-01 issue floor whose root PDF
      follows the provider's thirteen-part grammar, read under a per-run package
      cap. TAB, DB, CLIMATE and LRB have no root PDF; no granule route is
      attempted.
    measured_on: "2026-09-28"
    summary: >-
      One row per published volume of the President's budget, with what its
      print adds to its own MODS index. Thirteen measured package parts are
      accepted; only volumes offering a supported package-root body yield rows. All columns are stored as
      VARCHAR.
    data_quality: >-
      **The bill counts are congress-blind and are not join keys.** A BUDGET
      package states no Congress anywhere — not in its id, not in its summary
      — so the print can only spell `HR7806` where the MODS states
      `119-hr-7806`. `distinct_bills` and
      `distinct_bills_beyond_index_congress_blind` therefore reduce **both**
      sides to `{bill_type}-{number}` before comparing, which is why the
      column carries `congress_blind` in its name; neither can join
      `congress_bills.bill_id`, which needs the Congress this family never
      states. For the same reason the per-row `stated_by_index` on a
      `bill_number` citation of a budget volume is **NULL, not `false`**: the
      comparison was not possible, and answering `false` would report a
      comparison nobody made. Measured across the eight volumes spicy-docs
      sampled at full page depth, 6 of the 8 distinct printed bills are
      print-only. The family's real yield is laws: **504 of 518** distinct
      public laws the prints name are absent from their own MODS at full page
      depth, against 43 of 69 at a 60-page cap. `fiscal_year` is not the issue
      year — `BUDGET-2026-MSR` was issued 2025-09-05 — and is stated twice, by
      the package id and by the MODS, which spicy-docs asserts agree.
      `associated_bills_json` is published whole because it is the only
      statement of this edge that carries a Congress.


      **Thirteen measured parts are accepted by spicy-docs 0.24.0.** The
      seven additions are `OBJCLASS`, `TAB`, `DB`, `CLIMATE`, `LRB`, `CROSSCUT`
      and `DOD`. On one measured volume per part, `TAB`, `DB` and `CLIMATE`
      offer PDF only at granule stems; `LRB` offers an XLS and no supported
      body. A `GovInfoFormatNotOfferedError` at the package root is counted
      and logged as the publisher's answer, not as a failed or missing volume.
      No granule route is attempted: `shape_budget_volume` takes package
      summary/MODS and does not support a granule identity. These observations
      remain eligible on the next run and produce no invented document row.
    columns_from: spicy_docs


  bill_committee_actions:
    label: "Committee-print bill actions"
    coverage: >-
      Derived: the committee actions printed in the accepted House activity
      reports (`house_activity_reports`), not all committee actions.
    measured_on: "2026-09-28"
    summary: >-
      One row per action phrase a committee print states about one bill it
      names in the same sentence: the print's own phrasing, the sealed stage
      and BILLSTATUS action codes it maps to, and how reliable the pairing is.
      Joins `document_citations` through `document_key`, `text_sha256` and
      `mention_span_start` = `span_start`. All columns are stored as VARCHAR.
    data_quality: >-
      **These are rule-derived interpretations with measured errors.**
      `attachment_confidence` is `single` where the sentence names one
      bill and `multi` where it names several. Hand-checked over 60 mentions
      by spicy-docs: a `single` row is both the right kind of action and the
      right bill **83.3 percent** of the time (30 of 36), a `multi` row **50
      percent** (2 of 4). `WHERE attachment_confidence = 'single'` selects the
      class with higher measured precision, at an 8 percent volume cost in
      that sample (4,089 of 4,456 rows were `single`). It does not qualify an
      individual row as correct. The vendored column description below still
      says "hosted-quality"; that wording is superseded by these limits and
      awaits adoption of the corrected source package. `multi` rows are kept
      rather than dropped
      because `sentence_start`, `sentence_end` and `matched_text` make them
      readable, and `bills_in_sentence` is published raw so a consumer can set
      its own threshold. **Precision is not recall: recall is 59.6 percent**,
      re-weighted by stratum over 148 checked contexts. The print writes "the
      bill" after naming it once, sets an en-bloc disposition as a sentence
      about "the measures", and states a committee consideration date in a
      ruled table's column header — so a consumer counting hearings from these
      rows is counting a floor. `sealed_stage` is **NULL on 1,670 of 4,456
      rows** and that is a finding rather than a gap: a rung is never invented,
      so `passed the House` stays NULL rather than widening the sealed
      `passed house` matcher. `billstatus_action_code` is NULL on 280 rows
      whose phrasing has no known code at all (`vetoed`, `not_considered`,
      `declined_markup`, `favorably_forwarded`, `included_in`), and a further
      639 rows are coded through codes the publisher's own retained guide
      never lists — 13 of the 35 distinct codes in the retained responses
      appear nowhere in its action-code table, which the guide itself says is
      representational rather than authoritative. `stated_date` is extracted
      and published but **was never scored**: nothing establishes that the
      date the sentence states belongs to this action. On a 20-bill probe the
      publisher had no counterpart at all to 10 of the 15 subcommittee
      hearings these prints state, while all 8 markups were stated and coded —
      which is what this table is for.
    columns_from: spicy_docs

  document_citations:
    label: "Document citation link table"
    coverage: >-
      Derived: citations read from the bodies of the accepted House activity
      reports and budget volumes; a budget root the reader refuses yields no
      citations. Both source families have one writer, the print-citations
      rollup.
    measured_on: "2026-09-28"
    summary: >-
      One row per occurrence of one cited key in one document's text: the key,
      the exact characters that named it, and the character span it was read
      at. Thirteen citation kinds, from bill numbers and public laws to RINs,
      agency dockets and GAO product ids. One shared link table over every
      document family, written by exactly one rollup. All columns are stored
      as VARCHAR.
    data_quality: >-
      **The span is in the identity because the span is the yield.** Keying on
      document, kind and target alone would collapse CRPT-118hrpt968's 267 bill
      mentions into 179 rows; the aggregate is derivable from this table with
      `GROUP BY document_key, cite_kind, target_key` and the reverse is not.
      **Different text digests retain their histories.** A source revision
      producing a new `text_sha256` adds findings beside earlier text versions.
      A successful rule correction for the same document and text digest
      replaces that digest's findings, including an empty result; it can
      retire obsolete rows. A failed read preserves previous findings. Size
      grows with retained text revisions and their citations. Filter to the
      digest the document row states (`house_activity_reports.text_sha256` or
      `budget_volumes.text_sha256`) to read exactly one extraction. Prints are
      revised rarely, so this is a property to know before building on the
      table; pruning earlier text digests would require a separate retention
      decision. `stated_by_index`
      is three-valued and the third value matters: `true`/`false` where a
      keyed index record was read and could state a key of this shape, and
      **NULL where no comparison was possible** — either no index record was
      supplied or the MODS vocabulary has no element of that shape, which is
      the case for every bill citation of a budget volume. So the consumer
      predicate for "what the print adds" is `WHERE stated_by_index IS NOT
      TRUE`, never `= false`. `target_resolved` false means the cite was found
      and its key is unsettled, not that the cite is wrong. `target_rule` says
      **how** a key was reached and separates lookups from inferences:
      `exact` and `roster_prefix` are lookups against a supplied vocabulary,
      while `name_prefix` and `sibling_prefix` are inferences from the printed
      text that a consumer may decline. `evidence_page` is NULL where the
      rendition states no page boundary, and a match straddling a page break
      is attributed to the page it began on.
    columns_from: spicy_docs

  senate_expenditures:
    label: "Secretary of the Senate expenditure tables"
    coverage: >-
      Sampled: a page window inside each file. Secretary-of-the-Senate
      expenditure reports reprinted as GovInfo CDOC packages from the 2024-01-01
      issue floor, read under a per-run package cap. **Every count over this
      table is a floor on the volume**: each report runs more than 1,200 pages
      and only the first 80 of each are read, so `pages_capped` is true on every
      row. Those pages carry the `A-` summary-of-transactions section and the
      start of the `B-` detailed statement; the `C-` compensation-of-members and
      `D-` mail-allocation sections sit past page 2,000 and are not reached
      (measured 2026-09-20, receipt `rollups-pdf-families-2026-09-20/`).
    measured_on: "2026-09-28"
    summary: >-
      One row per ruled row of one ruled table on one page of a Report of the
      Secretary of the Senate, with the cells exactly as the print states them
      and the roles its own header band names. Keyed on package, file, page,
      table, row and the page text's digest — the package id alone is not a
      key, because the publisher publishes the same printed pages as both a
      Full Report and a Part. All columns are stored as VARCHAR.
    data_quality: >-
      **Most rows carry one cell, not a row of cells, and `cells_ruled` is how
      you tell.** Of 227 ruled body rows across the 160 pages spicy-docs
      measured, the 56 in an `appropriation_summary` grid carry all nine cells
      and every other one carries exactly **one** cell of ten or of seven: the
      print rules a whole payee block as a single cell. That is why the
      contract has no `payee_name`, `document_number`, `date_posted` or
      singular `amount` column — those would be a parse of one cell's
      newlines presented as separate facts. `WHERE cells_ruled` selects the
      rows whose cells are separate facts; everything else is in `cells_json`
      exactly as printed. **`cells_json` is the row**; every other content
      column is a promotion out of it. `office`, `funding_year`,
      `appropriation_title` and `section_heading` are read from the page text
      and are **NULL on a continuation page**, which is 56 of the 139 measured
      table pages — forward-fill them in `printed_page` order. `printed_page`,
      not `page`, is what the report's own contents index by. `grid_kind` is
      NULL where the first row states none of the three known labels, so an
      unrecognised grid is visible rather than mislabelled. An amount must
      carry a decimal point to be parsed into `amounts_json`: without that
      rule a bare integer read stacked fiscal years and account numbers as
      money, and of 1,316 amount-shaped lines measured every one carries a
      `.dd` tail while the 143 that do not are all account numbers or fiscal
      years. The check that makes the extraction falsifiable is the print's
      own `Totals` row, which agreed to the cent with the sum of 28 account
      rows over seven money columns on both measured sections.
    columns_from: spicy_docs

  hearing_bill_links:
    measured_on: "2026-09-28"
    label: "Hearing-to-bill links"
    coverage: >-
      Sampled. Bill references that the selected hearing packages' MODS records
      state on their cover. It does not show bills named only in constituent
      records, agendas, bill actions or transcript text, and does not measure
      recall; agenda acquisition remains deferred.
    summary: >-
      One row per package, bill and link source, shaped by spicy-docs.
    data_quality: >-
      mods_cover means held_on. The package measured confirmation on 19 of 20
      cover pairs and 18 of 18 pairs where cover and agenda agreed. Agenda
      links mean noticed, not held_on: agenda-only pairs were confirmed 1 of
      18, contradicted 1 and unverifiable 16. Recall is unmeasured. Only 2 of
      20 sampled House hearings and 0 of 3 Senate hearings stated COVER bills;
      a missing row does not establish that a hearing concerned no bills.
      A successfully re-read cover replaces that hearing's prior links, including
      an empty result. Unread or refused bodies retain their prior links.
      held_date is the one date the hearing's MODS states. A compiled volume
      that states several dates has held_date NULL and every native date, in
      source order, in held_dates_json; the list does not establish that each
      bill was considered on each date. Before link rule d06e0bd80ca1
      (2026-09-25) such a volume's links carried its first date
      (CHRG-117shrg56721 states eleven), and rows not re-read since keep
      held_dates_json NULL.
    columns_from: spicy_docs

  cbo_cost_estimates:
    measured_on: "2026-09-28"
    label: "CBO cost-estimate publication index"
    coverage: >-
      Sampled: CBO estimates the publisher lists on the bills the bill family
      has read, from the 108th Congress on; some Congresses are not yet read. An
      absent estimate does not mean CBO never scored a bill. No CBO.gov body is
      requested.
    summary: >-
      One row per bill and CBO publication, using build_bill_family's own
      cbo_cost_estimates output. All columns are stored as VARCHAR.
    data_quality: >-
      The bill's cbo_cost_estimates_outcome distinguishes an absent or empty
      element, an unexpected shape, and populated estimates. An empty index
      does not establish that CBO never scored the bill. Report citations are
      the bill's list, not proof that each publication is reprinted in each
      report; the report's recital gate is evaluated separately.
      A successfully evaluated bill replaces its prior estimate rows, including
      when the list is absent or empty. An unexpected list shape retains prior
      rows until a successful read can establish the current relationships.
    columns_from: spicy_docs

  bill_cosponsors:
    measured_on: "2026-09-28"
    label: "Bill cosponsor source occurrences"
    coverage: >-
      Sampled: cosponsors from the BILLSTATUS archives replayed for the held
      bill edition; some Congresses are not yet replayed, and a bill outside a
      replay has no rows here. Every native field reconciles, including positive
      withdrawal dates.
    summary: >-
      One cosponsor occurrence in one retained BILLSTATUS observation, keyed by the bill, the
      input digest and the list ordinal. A member listed twice keeps two rows; a successfully
      read absent or empty list replaces the bill's prior rows.
    columns_from: spicy_docs

  member_party_affiliations:
    measured_on: "2026-09-27"
    label: "Member party affiliation source intervals"
    coverage: >-
      Sampled. The complete retained September 25 community crosswalk captures,
      replayed and published on September 27; every source affiliation
      occurrence was reconciled. This is the selected community crosswalk, not
      an official or newly acquired roster. Receipt:
      spicy-regs-t19-members-20260927/public-readback.json.
    summary: >-
      One member, input digest, term index and affiliation index. Literal dates and their
      parsing states remain separate from any dated membership decision.
    columns_from: spicy_docs

  committee_report_reads:
    identity_columns: [package_id]
    measured_on: "2026-09-28"
    label: "Committee-report acquisition checkpoints"
    coverage: >-
      Not a range. One checkpoint per selected report or hearing package read,
      with its outcome. Complete includes hearings with zero cover links; it
      does not assert a positive relationship or complete source history.
    summary: >-
      One row per package observed or inherited from this rollup's prior
      tables. Pending reads precede discovery under the declared body cap.
    columns:
      package_id: "GovInfo package ID and checkpoint identity."
      last_modified: "Publisher timestamp requested, replaced by the acquired summary timestamp on success."
      outcome: "pending, refused, refused_final, detail_refused or complete. complete permits an unchanged skip; so does refused_final, a refusal every run would repeat (a body past the byte bound, parts past the request budget, no rendition taken) until the package's last_modified or the rule moves. A body past the bound rests on the size its response stated (rule_version ends refused-under=size=<bytes>) and is read again only when the bound grows past that size; any other rests on the bounds rule_version names. refused and detail_refused are read again every run."
      rule_version: "The rules a package was read under: for a report, the installed SpicyDocs code digest (not its release string), the CBO and section readers and this repository's part and body rules; for a hearing, the hearing-link rule and the body rule. A changed token forces another read."
      observed_at: "UTC time this rollup recorded the checkpoint."

  native_legal_references:
    measured_on: "2026-09-27"
    label: "Native legal-reference observations"
    identity_columns: [scope_id, input_sha256, occurrence_index]
    grain: "One source scanner observation per pinned XML input; multiple interpreted targets remain nested candidates."
    coverage: >-
      Sampled. Observations from the complete retained eCFR Title 1, requested
      as of 2026-08-10, and USC Title 1 release 119-103. Selected public target
      tables resolve some occurrences; missing, unsupported and unqueried
      targets remain explicit. Receipt:
      native-legal-full-2026-09-27/resolved-verification.json.
    summary: >-
      Selected eCFR AUTH/SOURCE notes and U.S. Code href/source-credit observations,
      retaining source XML paths and digests. Complete reads replace the selected
      source/edition scope, including successful empty corrections. Candidate target
      matches concern held classification rows, not independently acquired legal text.
      Unparsed prose and unsupported forms remain visible; no universal extraction or
      historical completeness is implied.
    columns:
      scope_id: "Stable hash of source family, source record key and explicit edition; correction replacement scope."
      source_family: "Source scanner family: ecfr or uscode."
      source_record_key: "Caller-selected source record identity, retained literally."
      edition: "Explicit selected edition, or null when the evidence does not establish one."
      input_sha256: "SHA-256 digest of the exact retained source XML bytes."
      source_locator: "Manifest source locator retained literally; not proof of acquisition time or edition."
      occurrence_index: "Scanner observation index within this source input, stored as text."
      source_path: "Source scanner XML path locating this observation."
      element_tag: "Literal XML element tag, including namespace where present."
      attributes_json: "Source element attributes serialized as JSON."
      ancestors_json: "Scanner-retained XML ancestor context serialized as JSON."
      observation_kind: "Native reference shape reported by the owner scanner."
      href: "Literal native href, when the observation supplies one."
      text: "Complete scanner-retained text for this observation; interpretation may cover only part."
      text_runs_json: "Source text runs and context retained by the scanner."
      cfr_title: "Source-derived CFR title context, when present; not an inferred target title."
      cfr_part: "Source-derived CFR part context, when present; part-only targets remain part-only."
      interpretation_status: "Whether the selected native shape is supported or only partially interpreted; does not assert exhaustive extraction."
      target_candidates_json: "Interpreted typed targets and optional pinned held-table resolution outcomes; preserves multiple candidates without multiplying observations."
      rule_version: "Application scanner and interpretation rule version."

  court_opinion_pdf_extractions:
    measured_on: "2026-09-27"
    label: "Selected court opinion PDF text"
    identity_columns: [opinion_id, source_sha256]
    grain: "One retained PDF extraction per opinion and exact observed body."
    coverage: >-
      Sampled. Selected publisher PDFs acquired on 2026-09-27. Each exact body
      matches its held CourtListener SHA-1 and has its own SHA-256 and
      extraction outcome. This is derived PDF text, separate from CourtListener
      native text fields and from the complete opinion index. Receipt:
      spicy-regs-court-cohort-20260927/bodies-receipt.json.
    summary: >-
      Text from literally offered PDF URLs, tied to the selected opinion generation,
      native body fingerprint, capture evidence and extractor version. A native digest
      mismatch records a refusal without supplying text. Join opinion_id to court_opinions
      and cluster_id to court_opinion_clusters; this table does not infer case-name identity.
    columns:
      opinion_id: "Native CourtListener opinion ID selected for acquisition."
      cluster_id: "Native opinion cluster ID from that same held opinion row."
      source_url: "Literal download_url offered by the selected opinion."
      resolved_url: "Final response URL observed by the provider."
      source_sha256: "SHA-256 of complete captured PDF bytes."
      native_sha1: "Body SHA-1 asserted by the selected native opinion row."
      actual_sha1: "SHA-1 independently computed over captured bytes."
      sha1_matches: "Whether the captured bytes match the native fingerprint, stored as text."
      text_content: "Derived PDF text when fingerprint and extraction checks succeed; null after a refusal."
      pdf_extraction_results_json: "URL, body SHA-256, status, page count and error for the selected attempt."
      observed_at: "Provider capture observation time."
      extractor: "Application extraction implementation identity."
      extractor_version: "Installed pypdf distribution version."
      parent_opinion_publication_json: "Exact selected opinion family and its member metadata."

  native_legal_reference_reads:
    measured_on: "2026-09-27"
    label: "Native legal-reference selected-input reads"
    identity_columns: [scope_id]
    grain: "One current complete selected-shape read per source/edition scope."
    coverage: "Sampled. Explicit retained-input manifests only; not a source-wide acquisition or completeness ledger."
    summary: >-
      Records successful bounded source reads even when they produce no observations.
      Failed or incomplete inputs cannot replace prior output. Existing generation and
      source-evidence artifacts retain earlier captures; the current row represents the
      latest complete selected-shape read for its scope. Unsupported XML forms and
      unknown editions remain explicit.
    columns:
      scope_id: "Stable source family/record/edition correction scope shared with native_legal_references."
      source_family: "Source scanner family: ecfr or uscode."
      source_record_key: "Caller-selected source record identity, retained literally."
      edition: "Explicit selected edition, or null when unknown."
      input_sha256: "SHA-256 digest of exact retained XML bytes."
      source_locator: "Literal manifest source locator, without implied acquisition date."
      source_bytes: "Observed retained input byte length, stored as text."
      occurrence_count: "Number of native scanner observations produced by this read, including zero."
      read_status: "complete_selected_shapes means the selected scanner finished; it does not mean every legal-reference form is supported."
      selected_shapes_json: "Explicit native XML forms selected for this read."
      unsupported_shapes_json: "Known excluded forms; not a claim to enumerate every possible source shape."
      manifest_sha256: "SHA-256 digest of the retained manifest binding the input selection and optional target pins."
      rule_version: "Application scanner and interpretation rule version."
