    columns_from: spicy_docs

  committee_reports:
    label: "Committee reports"
    coverage: >-
      Sampled, with retained pending work. The one adoption run used 144 requests
      (101 keyed, 43 keyless) across CRPT and CHRG under a cap of 30 bodies per
      collection. It re-read 30 of 105 prior reports, retaining all 105 rows and
      leaving 75 queued for enrichment. Four reports state a recital, three yield
      a letter span, and 26 state no recital; 75 remain unevaluated (NULL).
      All 43 report and hearing bodies were HTML; no PDF page count was inferred.
      Own checkpoints retain capped and failed reads beyond the discovery window.
      Receipt: `rollups-0-24-0-adoption-2026-09-20/`. Local output only; not uploaded.
    measured_on: "2026-09-20"
    summary: >-
      One row per captured GovInfo committee report package. `bill_id` is the
      measure the report accompanies, read from the package's own MODS metadata. All
      columns are stored as VARCHAR.
    data_quality: >-
      Only the MODS PRIMARY bill fills bill_id. The thirteen CBO columns come
      from spicy-docs read_cbo_estimate on the same body already acquired. The
      cover recital gates publication of a letter: a CBO heading alone is not
      an estimate. report_states_estimate=false records an absent recital;
      NULL means the rule has not run. A positive recital with no resolved
      letter span remains distinct from an extracted letter. recital_bill_id
      comes from the printed recital and is retained beside the MODS bill_id.
    columns_from: spicy_docs

  report_sections:
    label: "Committee report agency blocks"
    coverage: >-
      Sampled. The adoption run re-read 30 reports and shaped 290 agency blocks;
