  hearing_transcripts:
    label: "Hearing transcripts"
    coverage: >-
      Sampled. The 2026-09-21 mikewolfd/spicy-regs fork delivery rebuilt and published all 13
      selected hearing packages within the five-table report family. All 13 exact
      hearing-detail requests were accepted and their native event identifiers checked. One
