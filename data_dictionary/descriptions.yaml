  fec_filing_definition_evidence:
    label: Retained filing layout evidence
    grain: One exact association from a normalized filing definition to a source context witness.
    identity_columns:
    - target_table
    - target_record_id
    - target_generation_scope
    - witness_generation_scope
    - witness_generation_pin
    - role
    - endpoint_kind
    - collection_id
    - source_record_id
    - context_column
    - context_pointer
    - witness_sha256
    - witness_locator_json
    coverage: Sampled. Supported observations from verified retained filing specification workbook cells in collection
      context. The retained selection is explicit in fec_collections and its source-generation evidence; this declaration
      does not establish complete FEC history or current publication.
    measured_on: '2026-10-01'
    summary: One exact association from a normalized filing definition to a source context witness. Resolves fec_filing_definitions.record_id
      to the actual workbook labels/rules at the captured context pointer. Source-record IDs are NULL for these context
      endpoints; no workbook cells are invented as source records.
    columns:
      target_table: Typed table containing the evidence or association target; target_record_id is scoped to that
        table and resolved generation.
      target_record_id: Exact typed observation key supported by this witness or filing association; not a native
        source ID.
      target_generation_scope: Whether the target is in this containing generation or an external generation. A self
        reference resolves through publication metadata, avoiding a self-hash cycle.
      witness_generation_scope: Whether witness coordinates resolve within the containing or an explicitly pinned
        external source generation.
      witness_generation_pin: Exact already-sealed generation pin for an external witness; not inferred from the latest
        publication pointer.
      role: Role of this witness in supporting the target, such as primary source, header, source definition or context.
      endpoint_kind: 'Evidence endpoint kind: source_record resolves a row, while collection_context resolves an exact
        column and pointer in fec_collections.'
      collection_id: Exact retained collection label. Join fec_collections in the selected source generation; the
        label alone is not a globally unique source identity.
      source_record_id: Native source-observation key within collection_id. Resolve with the source generation, exact
        locator and source digest, not this value alone.
      context_column: Column of fec_collections holding this context witness; NULL for a source-record endpoint.
      context_pointer: Exact JSON pointer inside context_column to the retained source fact or definition; does not
        create a fictional source record.
      witness_sha256: Digest of the original bytes supporting this witness, which may differ from the primary financial
        row's digest.
      witness_locator_json: Native source coordinates of the witness, including worksheet cells, source row address
        or definition location.
