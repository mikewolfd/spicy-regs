[project]
name = "spicy-regs"
version = "0.1.6"
description = "Regulations Data Analysis Tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "python-dotenv",
    "polars",
    "pyarrow",
    "tqdm",
    "httpx",
    "duckdb>=1.5.3", # Iceberg ALTER TABLE support for the nullable PDF diagnostics field
    "pandas",
    "cyclopts",
    "loguru",
    "mcp>=1.10.0,<2", # FastMCP imports use the 1.x API
    "pyyaml",  # data dictionary descriptions (src/spicy_regs/data_dictionary.py)
]

[project.optional-dependencies]
source-readers = [
    "smart-open[s3]==8.0.1", # Conditional seekable S3 streams for remote generation staging
    "spicy-docs[acquisition,pdf,pdf-pypdf,bill-diff,courtlistener-local]==0.33.0",
    "pypdf==6.14.2", # Qualified PDF text and failure behavior
    "rulespec-artifacts==1.1.1",
    "deltatrack==0.1.0", # spicy-docs' bill-diff extra; git-sourced upstream, so declared here to bind the vendored wheel
]
embed = [
    "sentence-transformers",
    "torch",
]

[dependency-groups]
# Checkout pipelines use the pinned source wheels; base CLI/MCP installs do not.
source-readers = [
    "smart-open[s3]==8.0.1", # Conditional seekable S3 streams for remote generation staging
    "spicy-docs[acquisition,pdf,pdf-pypdf,bill-diff,courtlistener-local]==0.33.0",
    "pypdf==6.14.2", # Qualified PDF text and failure behavior
    "rulespec-artifacts==1.1.1",
    "deltatrack==0.1.0", # spicy-docs' bill-diff extra; git-sourced upstream, so declared here to bind the vendored wheel
]
dev = [
    "ipykernel",
    "matplotlib",
    "pre-commit",
    "pyrefly",
    "pytest",
    "ruff",
    "scikit-learn",
    "seaborn",
    "textblob",
    "ty",
]
docs = [
    "mkdocs-material",
]

[project.scripts]
materialize-rulemaking = "spicy_regs.pipelines.rulemaking_dataset:app"
run-rollup-court-opinion-clusters = "spicy_regs.pipelines.rollups.court_opinion_clusters:app"
run-rollup-court-citations = "spicy_regs.pipelines.rollups.court_citations:app"
run-rollup-court-opinions = "spicy_regs.pipelines.rollups.court_opinions:app"
run-rollup-bill-subjects = "spicy_regs.pipelines.rollups.bill_subjects:app"
run-pipeline = "spicy_regs.pipelines.regulations:app"
run-rollup-feed-summary = "spicy_regs.pipelines.rollups.feed_summary:app"
run-rollup-agency-stats = "spicy_regs.pipelines.rollups.agency_stats:app"
run-rollup-agency-monthly-volume = "spicy_regs.pipelines.rollups.agency_monthly_volume:app"
run-rollup-docket-search = "spicy_regs.pipelines.rollups.docket_search:app"
run-rollup-lifecycles = "spicy_regs.pipelines.rollups.rulemaking_lifecycles:app"
run-rollup-discovery-signals = "spicy_regs.pipelines.rollups.discovery_signals:app"
run-rollup-fr-docket-links = "spicy_regs.pipelines.rollups.fr_docket_links:app"
run-rollup-cfr-sections = "spicy_regs.pipelines.rollups.cfr_sections:app"
run-rollup-unified-agenda = "spicy_regs.pipelines.rollups.unified_agenda:app"
run-rollup-federal-register = "spicy_regs.pipelines.rollups.federal_register:app"
run-rollup-fcc-proceedings = "spicy_regs.pipelines.rollups.fcc_proceedings:app"
run-rollup-fcc-filings = "spicy_regs.pipelines.rollups.fcc_filings:app"
run-rollup-sam-entities = "spicy_regs.pipelines.rollups.sam_entities:app"
run-rollup-lobbying-filings = "spicy_regs.pipelines.rollups.lobbying_filings:app"
run-rollup-fec-committees = "spicy_regs.pipelines.rollups.fec_committees:app"
run-rollup-fec-source-catalog = "spicy_regs.pipelines.rollups.fec_source_catalog:app"
build-fec-observations = "spicy_regs.pipelines.rollups.fec_observations:app"
run-rollup-org-committee-links = "spicy_regs.pipelines.rollups.org_committee_links:app"
run-rollup-gao-reports = "spicy_regs.pipelines.rollups.gao_reports:app"
run-rollup-crs-reports = "spicy_regs.pipelines.rollups.crs_reports:app"
run-rollup-courtlistener = "spicy_regs.pipelines.rollups.courtlistener:app"
run-rollup-usaspending-recipients = "spicy_regs.pipelines.rollups.usaspending_recipients:app"
run-rollup-bill-family = "spicy_regs.pipelines.rollups.bill_family:app"
run-rollup-press-releases = "spicy_regs.pipelines.rollups.press_releases:app"
run-rollup-amendments = "spicy_regs.pipelines.rollups.amendments:app"
run-rollup-roll-call-votes = "spicy_regs.pipelines.rollups.roll_call_votes:app"
run-rollup-members = "spicy_regs.pipelines.rollups.members:app"
run-rollup-member-vote-terms = "spicy_regs.pipelines.rollups.member_vote_terms:app"
run-rollup-committee-reports = "spicy_regs.pipelines.rollups.committee_reports:app"
# The two PDF-only families: one rollup per acquisition pass.
run-rollup-print-citations = "spicy_regs.pipelines.rollups.print_citations:app"
run-rollup-senate-expenditures = "spicy_regs.pipelines.rollups.senate_expenditures:app"
# A8/A9 (laws and rosters)
run-rollup-laws = "spicy_regs.pipelines.rollups.laws:app"
run-rollup-committee-rosters = "spicy_regs.pipelines.rollups.committee_rosters:app"
# The Congress.gov index tables (gaps A5, A7, A10): five rollups, one module.
run-rollup-house-communications = "spicy_regs.pipelines.rollups.congress_index:house_communications_app"
run-rollup-committee-meetings = "spicy_regs.pipelines.rollups.congress_index:committee_meetings_app"
run-rollup-record-issues = "spicy_regs.pipelines.rollups.congress_index:record_issues_app"
run-rollup-treaties = "spicy_regs.pipelines.rollups.congress_index:treaties_app"
run-rollup-nominations = "spicy_regs.pipelines.rollups.congress_index:nominations_app"
enrich-pdf-text = "spicy_regs.enrich_pdf:main"
backfill-comment-text = "spicy_regs.backfill_derived_text:main"
embed = "spicy_regs.vectordb.embed:main"
spicy-regs = "spicy_regs.cli:main"
spicy-regs-mcp = "spicy_regs.mcp_server:main"
spicy-regs-dict = "spicy_regs.data_dictionary:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
spicy-docs = { path = "vendor/spicy_docs-0.33.0-py3-none-any.whl" }
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.1.1-py3-none-any.whl" }
deltatrack = { path = "vendor/deltatrack-0.1.0-py3-none-any.whl" }

[tool.uv]
default-groups = ["dev", "source-readers"]

[tool.pytest.ini_options]
# Integration tests hit external services (the public Mirrulations S3 mirror)
# and are excluded from the default run so the unit suite stays hermetic. The
# dedicated "Integration (live data)" workflow runs them via `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: live test against external data (anonymous Mirrulations S3); run in the Integration CI workflow, not the default suite",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "notebooks"
]

[tool.pyrefly]
project-includes = [
    "**/*.py*"
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    "notebooks",
    ".venv",
]
